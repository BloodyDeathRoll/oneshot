<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneShot Agents</title>
<meta name="description" content="OneShot Agents, direction A (Line): the sixteen agents drawn as the line they work on, with every send-back as an arc, and each agent readable and editable in a side sheet.">
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:block;src:url("__FONT__") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#1B1530;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;--rule2:#EEF0F5;
  /* LOCKED 2026-09-27 (Shahar): purple lead, blue for links only. */
  --acc:#6A2FE0;--acc-h:#5A22CC;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;
  /* status only (concepts.md §1.3) */
  --red:#C0182B;--red-bg:#FDECEE;--amber:#9A5B00;--amber-bg:#FFF4E0;--green:#1A7F37;--green-bg:#EDF7F0;--quiet:#8A93A3;--quiet-ink:#4B5563;
  --line:#D5D9E2;
  --shadow:0 1px 2px rgba(27,21,48,.04),0 8px 24px rgba(27,21,48,.05);
  --shadow-pop:0 32px 80px rgba(27,21,48,.18),0 2px 8px rgba(27,21,48,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--ground);font-size:16px;line-height:1.5}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-weight:700}
.skip:focus{top:12px}

/* ---------- shell (as the Overview) ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidecol{background:var(--card);border-right:1px solid var(--rule)}
.side{position:sticky;top:0;height:100vh;padding:28px 16px 20px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;padding:0 12px 36px;text-decoration:none;color:var(--ink)}
.mark{width:26px;height:26px;border-radius:8px;background:var(--acc);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:15px;text-decoration:none}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav svg{width:22px;height:22px}
.nav .badge{margin-left:auto;min-width:24px;height:24px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:18px 8px 0;border-top:1px solid var(--rule)}
.side-foot b{display:block;font-size:15px;font-weight:700}
.side-foot div span{display:block;font-size:14px;color:var(--ink3)}
.disc{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex:none;background:var(--acc);color:#fff}
.mtop{display:none}
main{min-width:0;padding:0 40px 72px;width:100%}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:24px 0 20px}
.top h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top p{font-size:17px;color:var(--ink2);margin-top:8px;max-width:64ch;line-height:1.5}
.top p b{color:var(--ink);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;margin-top:2px}
.mode i{width:8px;height:8px;border-radius:50%;background:#9CA3AF}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- the map ---------- */
.mapcard{padding:24px 24px 20px}
.map{position:relative}
.map svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lane-l{position:absolute;font-size:15px;font-weight:700;color:var(--ink3);display:flex;align-items:center;letter-spacing:.005em}
.lane-l span{display:block}
.node{position:absolute;display:flex;align-items:center;gap:10px;padding:0 14px 0 14px;border-radius:999px;border:1.5px solid var(--quiet);background:#fff;color:var(--quiet-ink);text-align:left;font-size:16px;font-weight:700;line-height:1.2;transition:box-shadow .15s,transform .15s}
.node .nm{display:block}
.node .sub{display:block;font-size:14px;font-weight:600;color:var(--ink3);margin-top:1px}
.node .ic{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800;line-height:1}
.node .ic svg{width:12px;height:12px}
.node.none .ic,.node.early .ic{background:#EEF0F4;color:var(--quiet-ink)}
.node.red{background:var(--red);border-color:var(--red);color:#fff}
.node.red .ic{background:#fff;color:var(--red)}
.node.red .sub{color:#FBE3E6}
.node.amber{background:var(--amber-bg);border:2px solid var(--amber);color:var(--ink)}
.node.amber .ic{background:var(--amber);color:#fff}
.node.green{background:var(--green);border-color:var(--green);color:#fff}
.node.green .ic{background:#fff;color:var(--green)}
.node:hover{box-shadow:0 6px 18px rgba(27,21,48,.14)}
.node.none:hover,.node.early:hover{border-color:var(--ink3);color:var(--ink)}
.node.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc)}
.node .ck{display:inline-flex;width:16px;height:16px;margin-left:4px;vertical-align:-2px;color:inherit;opacity:.85}
.node .ck svg{width:16px;height:16px}
.tbadge{position:absolute;right:-6px;top:-9px;min-width:24px;height:24px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;border:2px solid #fff}
.dia{position:absolute;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-size:15px;font-weight:700;color:var(--ink);text-align:left;line-height:1.2;cursor:default}
.dia span{position:relative;top:-7px}
.dia i{width:30px;height:30px;transform:rotate(45deg);border:2px solid var(--acc);background:#fff;border-radius:5px;flex:none;margin:0 5px}
.orch{position:absolute;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;border-radius:999px;border:1.5px solid var(--quiet);background:#fff;color:var(--quiet-ink);font-size:15px;font-weight:600;text-align:left}
.orch b{color:var(--ink);font-weight:700}
.orch .st{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--quiet-ink);padding:0 6px}
.orch:hover{border-color:var(--ink3)}
.chip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 14px 8px;border-radius:14px;background:#fff;border:1.5px solid var(--red);color:var(--red);font-size:14px;font-weight:700;text-align:left;line-height:1.3;max-width:280px;box-shadow:0 2px 10px rgba(27,21,48,.08)}
.chip .c1{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .c2{font-weight:600;color:var(--ink2)}
.map.wide .chip{max-width:none;padding:6px 14px 7px}
.map:not(.wide) .chip{max-width:360px}
.map.wide .chip .c2{white-space:nowrap}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.calm{border-color:var(--quiet);color:var(--ink)}
.chip svg{width:14px;height:14px}
.chip:hover{background:var(--red-bg)}
.chip.amber:hover{background:var(--amber-bg)}
.chip.calm:hover{background:var(--ground)}
.blabel{position:absolute;transform:translateX(-50%);font-size:14px;font-weight:600;color:var(--ink3);white-space:nowrap;background:#fff;padding:0 6px}
.blabel.red{color:var(--red)}
.blabel.left{transform:none}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 28px;margin-top:20px;padding-top:18px;border-top:1px solid var(--rule2);font-size:15px;color:var(--ink2);line-height:1.45}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend b{color:var(--ink);font-weight:700}
.lg{width:30px;height:20px;border-radius:999px;flex:none;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.lg.red{background:var(--red);color:#fff}.lg.amber{background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber)}.lg.green{background:var(--green);color:#fff}
.lg.early,.lg.none{border:1.5px solid var(--quiet);background:#fff;color:var(--quiet-ink)}
.lg.tw{width:22px;height:22px;background:var(--acc);color:#fff;font-size:12px}
.lg.arc{background:none;width:30px}
.legend .why{grid-column:1/-1;font-size:14px;color:var(--ink3)}
.tip{position:fixed;z-index:30;width:320px;background:#fff;border-radius:16px;box-shadow:var(--shadow-pop),0 0 0 1px var(--rule);padding:16px 18px;font-size:15px;line-height:1.5;color:var(--ink2);pointer-events:none}
.tip b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.tip .st{font-weight:700}
.tip .st.red{color:var(--red)}.tip .st.amber{color:var(--amber)}.tip .st.none,.tip .st.early{color:var(--quiet-ink)}
.tip small{display:block;margin-top:8px;font-size:14px;color:var(--ink3)}

/* phone map */
.pmap{display:none}
.pl{margin-top:20px}
.pl:first-child{margin-top:4px}
.pl h3{font-size:15px;font-weight:700;color:var(--ink3);margin:0 0 10px 28px}
.prows{position:relative;padding-left:28px;display:flex;flex-direction:column;gap:8px}
.prows.orchrow::before{display:none}
.prows::before{content:"";position:absolute;left:46px;top:20px;bottom:20px;width:2px;background:var(--rule)}
.prow{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:999px;border:1.5px solid var(--quiet);background:#fff;color:var(--quiet-ink);font-size:16px;font-weight:700;text-align:left;width:100%}
.prow .ic{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800;background:#EEF0F4}
.prow .ic svg{width:12px;height:12px}
.prow .w{margin-left:auto;font-size:14px;font-weight:700}
.prow.red{background:var(--red);border-color:var(--red);color:#fff}
.prow.red .ic{background:#fff;color:var(--red)}
.prow.amber{background:var(--amber-bg);border:2px solid var(--amber);color:var(--ink)}
.prow.dia{border:0;background:none;color:var(--ink);min-height:40px;padding-left:12px;font-size:15px;cursor:default}
.prow.dia i{width:20px;height:20px;transform:rotate(45deg);border:2px solid var(--acc);background:#fff;border-radius:4px;flex:none;margin-right:4px}
.prow .tbadge{position:static;margin-left:8px;border:0}
.pbk{position:absolute;left:4px;width:14px;border:3px solid var(--red);border-right:0;border-radius:8px 0 0 8px}
.pbk.amber{border-color:var(--amber)}
.parc{display:flex;gap:8px;align-items:flex-start;margin:2px 0 4px 28px;padding:0 4px;background:none;border:0;text-align:left;font-size:15px;font-weight:700;color:var(--red);line-height:1.4}
.parc.amber{color:var(--amber)}
.parc.calm{color:var(--ink2)}
.parc small{display:block;font-size:14px;font-weight:600;color:var(--ink2)}

/* ---------- below the map ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.board>.mapcard{grid-column:1/-1}
#waiting{position:sticky;top:24px}
.grps{display:block}
@media (min-width:1680px){
  .board{grid-template-columns:minmax(0,1fr) 440px}
  .board>.mapcard{grid-column:1;grid-row:1}
  #waiting{grid-column:2;grid-row:1;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
  #sentback{grid-column:1/-1;grid-row:2}
  .grps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px}
  .grps .grp:nth-child(2){border-top:0}
}
dialog.sheet .tw{background:var(--ground);border-radius:16px;padding:18px 20px;border:0;margin-top:12px}
dialog.sheet .tw.done{padding:14px 20px}
dialog.sheet .pill.new{background:#fff}
.panel{padding:24px 24px 16px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ph h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph .count{min-width:28px;height:26px;border-radius:999px;background:var(--t5);color:var(--acc);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
.ph .count.zero{background:var(--ground);color:var(--ink2)}
.panel>.lead{font-size:15px;color:var(--ink2);margin-bottom:8px}
.tw{padding:18px 0;border-top:1px solid var(--rule2)}
.tw:first-of-type{border-top:0}
.tw .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--ink3);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.rules{background:var(--t5);color:var(--acc)}
.pill.new{background:var(--ground);color:var(--ink2)}
.tw h3{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.tw dl{margin-top:10px;display:grid;gap:8px}
.tw dt{font-size:14px;font-weight:700;color:var(--ink3)}
.tw dd{font-size:16px;color:var(--ink2);line-height:1.55}
.tw .acts{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-top:14px}
.tw.done{padding:14px 0;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
.tw.done b{color:var(--ink);font-weight:700}
.tw.done i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tw.done i svg{width:14px;height:14px}
.tw.done i.ok{background:var(--green-bg);color:var(--green)}
.tw.done i.no{background:#EEF0F4;color:var(--ink2)}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.btn-p:hover{background:var(--acc-h)}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--rule);background:#fff;font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn-o:hover{border-color:var(--t3);background:var(--t5)}
.btn-o.danger{color:var(--red)}
.btn-o.danger:hover{border-color:#F2C9CE;background:var(--red-bg)}
.btn-g{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:700;white-space:nowrap}
.btn-g:hover{background:var(--ground)}
.btn-g svg{width:18px;height:18px}
.lnk{border:0;background:none;padding:0;color:var(--acc);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.lnk:hover{color:var(--acc-h)}
.grp{border-top:1px solid var(--rule2);padding:16px 0 6px;border-radius:12px;transition:background .3s}
.grp:first-of-type{border-top:0}
.grp.flash{background:var(--t5);box-shadow:0 0 0 12px var(--t5)}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp-h .d{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.grp-h .d.amber{background:var(--amber)}
.grp-h .d.calm{background:var(--quiet)}
.grp-h span.calm{color:var(--ink2)}
details.yours{margin:4px 0 8px 20px}
details.yours summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--ink2);min-height:40px;display:flex;align-items:center}
.grp-h h3{font-size:17px;font-weight:700}
.grp-h span{font-size:15px;font-weight:700;color:var(--red)}
.grp-h span.amber{color:var(--amber)}
.grp>p.sub{font-size:15px;color:var(--ink2);margin:4px 0 6px 20px}
.brow{padding:12px 0 12px 20px;border-top:1px solid var(--rule2);margin-left:0}
.brow:first-of-type{border-top:0}
.brow .l1{display:flex;align-items:baseline;gap:2px 10px;justify-content:space-between;flex-wrap:wrap}
.brow .nm{font-size:16px;font-weight:700}
.brow .rn{font-size:15px;color:var(--ink3);font-weight:500;margin-left:6px}
.brow .fr{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.brow .note{font-size:15px;color:var(--ink2);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brow .l3{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:14px;color:var(--ink3)}
.brow .l3 a,.brow .l3 button{font-size:15px;font-weight:700;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;min-height:32px;display:inline-flex;align-items:center;gap:2px}
.brow .l3 a:hover,.brow .l3 button:hover{color:var(--acc)}
.brow .l3 svg{width:16px;height:16px}
.showall{margin:4px 0 8px 20px;height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.showall:hover{border-color:var(--t3);background:var(--t5)}
.marks{display:inline-flex;gap:4px;align-items:center;vertical-align:middle;margin-right:6px}
.mk{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mk svg{width:11px;height:11px}
.mk.k{border-radius:50%;background:var(--green);color:#fff}
.mk.s{border-radius:4px;background:var(--red);color:#fff}
.mk.c{border-radius:4px;background:#fff;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.kept{font-size:15px;color:var(--ink2);margin:2px 0 8px 20px}
.kept b{color:var(--ink);font-weight:700}

/* ---------- side sheet ---------- */
dialog.sheet{margin:0 0 0 auto;width:min(720px,100vw);height:100vh;max-height:none;max-width:none;padding:0;border:0;border-radius:20px 0 0 20px;background:#fff;color:var(--ink);box-shadow:var(--shadow-pop);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(255,255,255,.8)}
.sh-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:64px;padding:0 16px 0 40px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px)}
.sh-bar .crumb{font-size:15px;font-weight:700;color:var(--ink3);flex:1;opacity:0;transition:opacity .15s}
.sh-bar.scrolled{box-shadow:0 1px 0 var(--rule)}
.sh-bar.scrolled .crumb{opacity:1}
.x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.x:hover{background:var(--ground);color:var(--ink)}
.x svg{width:22px;height:22px}
.sh-in{padding:0 40px 40px}
.sh-head h2{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sh-head .role{font-size:17px;color:var(--ink2);margin-top:6px}
.sh-head .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.stp{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.stp .ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.stp .ic svg{width:11px;height:11px}

function wires(pos, G, arcs) {
  const C = { line: '#D5D9E2', red: '#C0182B', amber: '#B26B00' };
  let s = `<svg class="wires" width="${G.W}" height="${G.H}" aria-hidden="true">`;
  // lane arrows
  LANES.forEach((lane, li) => {
    const cy = G.cy(li);
    for (let i = 0; i < lane.items.length - 1; i++) {
      const a = pos[lane.items[i]], b = pos[lane.items[i + 1]];
      const x1 = a.kind === 'dia' ? a.x + 40 + (a.lw || 110) : a.x + a.w;
      const x2 = b.kind === 'dia' ? b.x - 4 : b.x - 3;
      if (x2 - x1 < 8) continue;
      s += `<path d="M${x1 + 3},${cy} L${x2},${cy}" stroke="${C.line}" stroke-width="2"/>` + arrowHead(x2, cy, 'r', C.line, 5);
    }
    if (false) { // lane-to-lane wraps removed in round 4: grey that carried no meaning
      const last = pos[lane.items[lane.items.length - 1]]; const first = pos[LANES[li + 1].items[0]];
      const xs = last.kind === 'dia' ? last.x + 40 + (last.lw || 110) : last.x + last.w;
      const xr = G.W - 6, r = 12, yb = cy + G.nodeH / 2 + 26;
      s += `<path d="M${xs + 3},${cy} H${xr - r} Q${xr},${cy} ${xr},${cy + r} V${yb}" fill="none" stroke="${C.line}" stroke-width="2"/>` + arrowHead(xr, yb, 'd', C.line, 5);
      void first;
    }
  });
  // "builds your pick": a short grey arrow back from your pick to the designer, under the lane

  // brackets
  for (const b of bracketDefs(pos, G)) {
    const c = b.red ? C.red : '#D5D9E2';
    s += `<path d="M${b.x1},${b.y - 6} V${b.y} H${b.x2} V${b.y - 6}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="${b.red ? .55 : 1}"/>`;
  }
  // arcs
  for (const a of arcs) {
    const col = a.cp.state === 'red' ? C.red : a.cp.state === 'amber' ? C.amber : '#9AA1AE'; const w = a.cp.width;
    s += `<path class="arc" d="${a.d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity=".92"/>`;
    const [x2, y2] = a.to;
    if (a.fork) {
      const f = a.fork, yb = y2, ye = f.top - 3;
      s += `<path d="M${f.x1},${ye} V${yb} H${f.x2} V${ye}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
      s += arrowHead(f.x1, ye, 'd', col, 6) + arrowHead(f.x2, ye, 'd', col, 6);
    } else if (a.kind === 'cross') {
      s += `<path d="M${x2 - 7},${y2 + 10} L${x2},${y2 + 2} L${x2 + 7},${y2 + 10}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    } else {
      s += `<path d="M${x2 - 7},${y2 - 10} L${x2},${y2 - 2} L${x2 + 7},${y2 - 10}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }
  return s + '</svg>';
}

// phone: each lane is a section; arcs become left brackets with a line of text
function renderPhoneMap() {
  const box = $('#pmap'); let h = '';
  const o = A.orchestrator;
  h += `<div class="prows orchrow" style="margin-bottom:4px"><button type="button" class="prow none" data-agent="orchestrator" aria-label="${esc(nodeAria(o))}"><span class="ic" aria-hidden="true">–</span><span>Orchestrator</span><span class="w">runs the line</span></button></div>`;
  const ARC = { find: { checker: 'harvester', to: ['@shortlist'] }, words: { checker: 'copyeditor', to: ['copywriter', 'humanizer'] }, look: { checker: '@pick', to: ['creative-director', 'designer'] } };
  for (const lane of LANES) {
    const arc = ARC[lane.id]; const c = arc && CP[lane.id];
    h += `<section class="pl" aria-label="${lane.label}"><h3>${lane.label}</h3><div class="prows" data-lane="${lane.id}">`;
    for (const id of lane.items) {
      if (id[0] === '@') h += `<div class="prow dia" data-row="${id}"><i aria-hidden="true"></i>${DIA[id.slice(1)]}</div>`;
      else {
        const a = A[id]; const n = pendingFor(id).length;
        h += `<button type="button" class="prow ${a.state}" data-agent="${id}" data-row="${id}" aria-label="${esc(nodeAria(a))}"><span class="ic" aria-hidden="true">${ST[a.state].ic}</span><span>${esc(a.label)}</span>${n ? `<span class="tbadge" aria-hidden="true">${n}</span>` : ''}<span class="w">${a.state === 'none' ? '' : ST[a.state].word}</span></button>`;
      }
      if (arc && id === arc.checker) {
        const names = arc.to.map((t) => (t[0] === '@' ? DIA[t.slice(1)].toLowerCase() : A[t].label)).join(' and ');
        const txt = lane.id === 'find' ? `↑ The harvester dropped ${c.n} of the scout’s ${c.of} picks` : lane.id === 'look' ? `↑ ${c.chip} for ${names}` : `↑ ${c.chip} to ${names}`;
        h += `<button type="button" class="parc ${arcClass(c)}" data-arc="${lane.id}"><span>${esc(txt)}<small>${esc(c.reason)}</small></span></button>`;
      }
      if (id === 'critic') h += `<button type="button" class="parc ${arcClass(CP.check)}" data-arc="check"><span>↑ ${esc(CP.check.chip)} to the Designer, in Look<small>${esc(CP.check.reason)}</small></span></button>`;
    }
    if (arc) h += `<span class="pbk ${c.state === 'amber' ? 'amber' : ''}" data-bk="${lane.id}" aria-hidden="true"></span>`;
    h += `</div></section>`;
  }
  box.innerHTML = h;
  requestAnimationFrame(() => {
    for (const [lane, arc] of Object.entries(ARC)) {
      const rows = $(`.prows[data-lane="${lane}"]`, box); if (!rows) continue;
      const ids = [arc.checker, ...arc.to]; const els = ids.map((i) => $(`[data-row="${i}"]`, rows));
      const tops = els.map((e) => e.offsetTop + e.offsetHeight / 2);
      const bk = $(`[data-bk="${lane}"]`, rows); const t = Math.min(...tops), b = Math.max(...tops);
      bk.style.top = t + 'px'; bk.style.height = (b - t) + 'px';
    }
  });
}

let tipFor = null;
function showTip(el) {
  const tip = $('#tip'); let h = '';
  if (el.dataset.agent) {
    const a = A[el.dataset.agent];
    const n = pendingFor(a.name).length;
    h = `<b>${esc(a.label)} · <span class="st ${a.state}">${ST[a.state].word}</span></b>${esc(a.tip)}${n ? ` <span style="color:var(--acc);font-weight:700">${n} tweak${n > 1 ? 's' : ''} waiting.</span>` : ''}<small>${a.state === 'none' ? '' : esc(a.role) + '. '}Click to read and edit it.</small>`;
  } else if (el.dataset.arc) {
    const c = CP[el.dataset.arc];
    h = `<b>${esc(c.title)} · <span class="st ${c.state}">${esc(c.chip)}</span></b>${esc(c.tip)}<small>Click to see each business below.</small>`;
  } else return;
  tip.innerHTML = h; tip.hidden = false; tipFor = el;
  const r = el.getBoundingClientRect(); const tw = 320, th = tip.offsetHeight;
  let x = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), innerWidth - tw - 12);
  let y = r.bottom + 10; if (y + th > innerHeight - 12) y = r.top - th - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { $('#tip').hidden = true; tipFor = null; };

function tweakCard(t, ctx) {
  const ans = S.answers[t.id];
  const who = t.agents.map((n) => A[n].label).join(', ');
  if (ans) {
    const txt = ans.kind === 'approved' ? 'Approved just now · Claude applies it in its next session' : ans.kind === 'ruled' ? 'Put in your rules just now' : 'Rejected';
    return `<div class="tw done" data-tw="${t.id}"><i class="${ans.kind === 'rejected' ? 'no' : 'ok'}" aria-hidden="true">${ans.kind === 'rejected' ? I.x : I.checkS}</i><span><b>${esc(t.title)}</b> · ${txt}</span></div>`;
  }
  const actions = t.custom
    ? `<button type="button" class="btn-p" data-act="rules" data-tw="${t.id}">Put it in my rules</button><button type="button" class="btn-o" data-act="reject" data-tw="${t.id}">Reject</button>`
    : `<button type="button" class="btn-p" data-act="approve" data-tw="${t.id}">Approve</button><button type="button" class="btn-o" data-act="reject" data-tw="${t.id}">Reject</button>`;
  return `<article class="tw" data-tw="${t.id}">
    <div class="who">${ctx === 'page' ? `<span>${esc(who)}</span>` : ''}${t.custom ? '<span class="pill rules">For your rules</span>' : ''}${t.mine ? '<span class="pill new">Suggested by you just now</span>' : ''}</div>
    <h3>${esc(t.title)}</h3>
    <dl><div><dt>What changes</dt><dd>${esc(t.what)}</dd></div>${t.why ? `<div><dt>Why</dt><dd>${esc(t.why)}</dd></div>` : ''}</dl>
    <div class="acts">${actions}</div>
  </article>`;
}

const TABS = [['base', 'What it does'], ['custom', 'Your rules'], ['history', 'History'], ['more', 'More']];
const MORE = [['references', 'References'], ['tools', 'Tools'], ['evals', 'How it’s judged']];
const TABLINE = {
  base: 'Written by Claude. A change you make here is sent to you as a suggested tweak first.',
  custom: 'Written by you. Saved straight away. Claude never edits this file.',
  history: 'One entry per approved change, newest first.',
  more: 'Read-only here. Changes to these go through Claude.',
};
let returnFocus = null;
function openSheet(name, opts = {}) {
  if (!A[name]) return;
  const dlg = $('#sheet');
  if (!dlg.open) returnFocus = opts.from || document.activeElement;
  S.sheet = { agent: name, tab: opts.tab || 'base', more: 'references', edit: null };
  renderSheet();
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  history.replaceState(null, '', `#agents/${name}`);
  $$('.node.on').forEach((n) => n.classList.remove('on'));
  $$(`.node[data-agent="${name}"]`).forEach((n) => n.classList.add('on'));
  if (opts.edit) startEdit(opts.edit, opts.text);
  else setTimeout(() => $('#sh-x')?.focus(), 0);
  hideTip();
}
function closeSheet(force) {
  const e = S.sheet?.edit;
  if (!force && e && e.text !== e.orig) { askDiscard(() => closeSheet(true)); return; }
  const dlg = $('#sheet'); if (dlg.open) dlg.close();
}
function onSheetClosed() {
  const name = S.sheet?.agent; S.sheet = null;
  history.replaceState(null, '', location.pathname + location.search);
  $$('.node.on').forEach((n) => n.classList.remove('on'));
  const back = (returnFocus && document.contains(returnFocus)) ? returnFocus : (name && ($(`.node[data-agent="${name}"]`) || $(`.prow[data-agent="${name}"]`)));

}

function renderDoc() {
  const s = S.sheet; const a = A[s.agent]; const box = $('#sh-doc');

  syncEd();
}
function syncEd() {
  const e = S.sheet.edit; const ta = $('#ed-ta'); if (!ta) return;
  ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
  const ch = changedSet(e.orig, e.text);
  $('#ed-m').innerHTML = e.text.split('\n').map((l, i) => (ch.has(i) && l.trim() ? `<span class="c">${esc(l)}</span>` : esc(l))).join('\n') + '\n';
  updChg(ch);
}
function updChg(ch) {
  const e = S.sheet.edit; const el = $('#ed-chg'); if (!el) return;
  const d = diffLines(e.orig, e.text).filter((x) => x[0] !== 'ctx' && x[1].trim()).length;
  el.textContent = d ? `${d} line${d > 1 ? 's' : ''} changed, highlighted` : '';
}
function finishEdit() { S.sheet.edit = null; renderTabs(); renderDoc(); }
function cancelEdit() {
  const e = S.sheet.edit;
  if (e.text !== e.orig) askDiscard(finishEdit); else finishEdit();
}
function saveRules() {
  const s = S.sheet; const name = s.agent; const e = s.edit;
  const prev = name in S.custom ? S.custom[name] : undefined;
  S.custom[name] = e.text;
  const tw = e.fromTweak;
  if (tw) S.answers[tw] = { kind: 'ruled', at: Date.now(), fresh: true };
  finishEdit(); refreshAll();
  toast('Saved to your rules.', () => { if (prev === undefined) delete S.custom[name]; else S.custom[name] = prev; if (tw) delete S.answers[tw]; refreshAll(); if (S.sheet?.agent === name && !S.sheet.edit) renderDoc(); toast('Your rules are back as they were.'); });
}
// ---------- popups ----------
let popClose = null;
function openPop(title, html, opts = {}) {
  const dlg = $('#dlg');
  $('#dlg-t').textContent = title;
  const sub = $('#dlg-s'); sub.hidden = !opts.sub; sub.textContent = opts.sub || '';
  $('#dlg-b').innerHTML = html;
  dlg.classList.toggle('sm', !!opts.small);
  popClose = opts.onClose || null;
  if (!dlg.open) dlg.showModal();
  $('#dlg-b').scrollTop = 0;
  (opts.focus ? $(opts.focus, dlg) : $('#dlg-x'))?.focus();
}
function closePop() { const d = $('#dlg'); if (d.open) d.close(); }
function askDiscard(onDiscard) {
  const a = A[S.sheet.agent]; const e = S.sheet.edit;
  openPop('Discard your changes?', `<p>${e.kind === 'custom' ? `Your edits to the ${esc(lc(a))}’s rules are not saved.` : `Your suggested change to the ${esc(lc(a))} is not saved.`}</p>
    <div class="pfoot"><button type="button" class="btn-o danger" id="p-discard">Discard</button><button type="button" class="btn-p" id="p-keep">Keep editing</button></div>`, { small: true, focus: '#p-keep' });
  $('#p-keep').onclick = () => { closePop(); setTimeout(() => $('#ed-ta')?.focus(), 0); };
  $('#p-discard').onclick = () => { closePop(); onDiscard(); };
}
function reviewSuggestion() {
  const a = A[S.sheet.agent]; const e = S.sheet.edit;
  const d = diffLines(e.orig, e.text);
  if (!d.some((x) => x[0] !== 'ctx')) { toast('Nothing has changed yet.'); return; }
  // show changes with two lines of context, gaps folded
  const keep = new Set(); d.forEach((x, i) => { if (x[0] !== 'ctx') for (let k = i - 2; k <= i + 2; k++) keep.add(k); });
  let html = ''; let gap = false;
  d.forEach((x, i) => { if (keep.has(i)) { gap = false; html += `<div class="${x[0]}">${esc(x[1]) || ' '}</div>`; } else if (!gap) { gap = true; html += `<div class="gap">· · ·</div>`; } });
  openPop(`Suggest a change to the ${lc(a)}`, `
    <span class="lbl" id="wc-l">What changes</span><div class="diff" role="group" aria-labelledby="wc-l">${html}</div>
    <label class="lbl" for="why">Why <small>(optional)</small></label>
    <textarea class="field" id="why" placeholder="What went wrong? For example, which site and what it missed."></textarea>
    <div class="pfoot"><button type="button" class="btn-g" id="p-back">Back to editing</button><button type="button" class="btn-p" id="p-add">Add to suggested tweaks</button></div>`, { focus: '#p-add' });
  $('#p-back').onclick = () => { closePop(); setTimeout(() => $('#ed-ta')?.focus(), 0); };
  $('#p-add').onclick = () => {
    const why = $('#why').value.trim();
    const changed = d.filter((x) => x[0] === 'add' && x[1].trim()).map((x) => x[1].trim());
    const id = `m${S.mine.length + 1}`;
    const what = changed.length ? `Changes ${d.filter((x) => x[0] !== 'ctx' && x[1].trim()).length} line${d.filter((x) => x[0] !== 'ctx' && x[1].trim()).length > 1 ? 's' : ''} of what the ${lc(a)} is told. New: “${changed[0].replace(/^[-*#>\s]+/, '').slice(0, 160)}${changed[0].length > 160 ? '…' : ''}”` : `Removes lines from what the ${lc(a)} is told.`;
    S.mine.push({ id, mine: true, agents: [a.name], title: `Your change to the ${lc(a)}’s instructions`, what, why, custom: false });
    closePop(); finishEdit(); refreshAll();
    $('#sheet').scrollTo({ top: $('#sh-wait').offsetTop - 80, behavior: reduce.matches ? 'auto' : 'smooth' });
    toast('Added to suggested tweaks. Approve it here or on Decisions.');
  };
}
function readDoc(title, mdText) {
  openPop(title, `<div class="md">${md(mdText, { reading: true })}</div>`);
}
// ---------- toast ----------
let toastT;
const TOAST = $('#toast'), TOAST_T = $('#toast-t'), TOAST_B = $('#toast-b'); // kept by reference: the toast moves between dialogs
function toast(text, undo) {
  const el = TOAST; TOAST_T.textContent = text;
  // a modal dialog makes the page behind it inert, so the toast lives in the top-most open dialog
  const host = $('#dlg').open ? $('#dlg') : $('#sheet').open ? $('#sheet') : document.body;
  if (el.parentNode !== host) host.appendChild(el);
  if (host.id === 'sheet') { const r = host.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.bottom = S.sheet?.edit ? 'auto' : ''; el.style.top = S.sheet?.edit ? '80px' : ''; } else { el.style.left = ''; el.style.bottom = ''; el.style.top = ''; }
  const b = TOAST_B; b.hidden = !undo; el.classList.toggle('has-b', !!undo);
  b.onclick = () => { el.classList.remove('on'); undo && undo(); };
  el.classList.add('on'); live(text);
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), undo ? 10000 : 4000);
}
// ---------- answering tweaks ----------
function answer(id, kind) {
  S.answers[id] = { kind, at: Date.now(), fresh: true };
  refreshAll();
  live(kind === 'approved' ? 'Approved. Claude applies it in its next session.' : 'Rejected.');
  if (kind === 'approved') toast('Approved. Claude applies it in its next session.');
}
function refreshAll() {
  renderNav(); renderWaiting(); renderSentBack();
  if (!mqPhone.matches) {
    $$('.node[data-agent]').forEach((n) => { const a = A[n.dataset.agent]; n.innerHTML = nodeInner(a); n.setAttribute('aria-label', nodeAria(a)); });
  } else renderPhoneMap();
  if (S.sheet) { const st = $('#sheet').scrollTop; $('#sh-top').innerHTML = sheetTop(A[S.sheet.agent]); $('#sheet').scrollTop = st; }
}

// =====================================================================================
// Events
// =====================================================================================
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button,a'); if (!t) return;
  const sheetOpen = $('#sheet').open;
  if (t.dataset.agent && (t.classList.contains('node') || t.classList.contains('prow') || t.classList.contains('orch'))) { openSheet(t.dataset.agent, { from: t }); return; }
  if (t.dataset.switch) { const e = S.sheet?.edit; const go = () => { returnFocus = $(`.node[data-agent="${t.dataset.agent}"]`) || returnFocus; openSheet(t.dataset.agent); }; if (e && e.text !== e.orig) askDiscard(go); else go(); return; }
  if (t.dataset.arc) {
    const g = $(`#grp-${t.dataset.arc}`); if (!g) return;
    g.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
    g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 2000); g.focus({ preventScroll: true }); return;
  }
  if ('moreRows' in t.dataset) { const box = t.previousElementSibling; const open = box.hidden; box.hidden = !open; t.setAttribute('aria-expanded', open); t.textContent = open ? 'Show fewer' : `Show the other ${box.children.length}`; if (open) box.querySelector('a,button')?.focus(); return; }

  const act = t.dataset.act;
  if (act === 'approve') { answer(t.dataset.tw, 'approved'); return; }
  if (act === 'reject') { answer(t.dataset.tw, 'rejected'); return; }

  if (act === 'rules') {
    const tw = tweakList().find((x) => x.id === t.dataset.tw); const name = tw.agents[0];
    const go = () => { if (!S.sheet || S.sheet.agent !== name) openSheet(name, { from: t }); S.sheet.tab = 'custom'; startEdit('custom', tw.rules); S.sheet.edit.fromTweak = tw.id; toast('The suggested text is in your rules editor, changed lines highlighted. Press Save to keep it.'); };
    const e = S.sheet?.edit; if (e && e.text !== e.orig) askDiscard(go); else go();
    return;
  }
  if (!sheetOpen) return;
  if (t.id === 'sh-x') { closeSheet(); return; }
  if (t.dataset.tab) {
    const k = t.dataset.tab;
    const go = () => { if (k === 'more') { moreMenu(t); return; } S.sheet.tab = k; S.sheet.edit = null; renderTabs(); renderDoc(); $(`#tab-${k}`).focus(); };
    const e = S.sheet.edit; if (e && e.text !== e.orig && k !== S.sheet.tab) askDiscard(() => { S.sheet.edit = null; go(); }); else { if (k !== S.sheet.tab) S.sheet.edit = null; go(); }
    return;
  }
  if (act === 'history') { const go = () => { S.sheet.tab = 'history'; S.sheet.edit = null; renderTabs(); renderDoc(); $('#sheet').scrollTo({ top: $('#sh-tabs').offsetTop - 64, behavior: reduce.matches ? 'auto' : 'smooth' }); $('#tab-history').focus({ preventScroll: true }); }; const e = S.sheet.edit; if (e && e.text !== e.orig) askDiscard(go); else go(); return; }
  if (act === 'edit-custom') { startEdit('custom'); return; }
  if (act === 'edit-base') { startEdit('base'); return; }
  if (act === 'ed-cancel') { cancelEdit(); return; }
  if (act === 'ed-save') { saveRules(); return; }
  if (act === 'ed-review') { reviewSuggestion(); return; }
  if (t.dataset.view) { S.sheet.edit.view = t.dataset.view; $$('.seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === t.dataset.view)); renderEdBody(); if (t.dataset.view === 'write') $('#ed-ta')?.focus(); }
});
function moreMenu(anchor) {
  $('.menu-pop')?.remove();
  const m = document.createElement('div'); m.className = 'menu-pop'; m.setAttribute('role', 'menu');
  m.innerHTML = MORE.map(([k, l]) => `<button type="button" role="menuitem" data-more="${k}">${l}</button>`).join('');
  const sheet = $('#sheet'); sheet.appendChild(m);
  const r = anchor.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
  m.style.left = Math.min(r.left - sr.left, sr.width - 236) + 'px'; m.style.top = (r.bottom - sr.top + sheet.scrollTop + 4) + 'px';
  anchor.setAttribute('aria-expanded', 'true');
  const items = $$('button', m); items[0].focus();
  const close = (focusBack = true) => { m.remove(); anchor.setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', outside, true); if (focusBack) $('#tab-more')?.focus(); };
  const outside = (e) => { if (!m.contains(e.target)) close(false); };
  document.addEventListener('pointerdown', outside, true);
  m.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    if (e.key === 'Tab') close(false);
  });
  m.addEventListener('click', (e) => { const b = e.target.closest('[data-more]'); if (!b) return; S.sheet.tab = 'more'; S.sheet.more = b.dataset.more; S.sheet.edit = null; close(false); renderTabs(); renderDoc(); $('#tab-more').focus(); });
}
// tabs: arrow keys
document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (t.getAttribute && t.getAttribute('role') === 'tab' && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    const tabs = $$('[role="tab"]', $('#sh-tabs')); const i = tabs.indexOf(t);
    const n = tabs[(i + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); ev.preventDefault();
  }
  if (ev.key === 'Escape' && tipFor) hideTip();
});
// sheet: Esc and veil click (with the unsaved-changes check); popup: × / Esc / veil
const sheet = $('#sheet');
sheet.addEventListener('cancel', (e) => { e.preventDefault(); if (!$('#dlg').open) closeSheet(); });
sheet.addEventListener('close', onSheetClosed);
sheet.addEventListener('click', (e) => { if (e.target !== sheet) return; const r = sheet.getBoundingClientRect(); if (e.clientX < r.left) closeSheet(); });
const dlg = $('#dlg');
$('#dlg-x').addEventListener('click', closePop);
dlg.addEventListener('click', (e) => { if (e.target !== dlg) return; const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closePop(); });
dlg.addEventListener('close', () => { const f = popClose; popClose = null; f && f(); });
// tooltips
document.addEventListener('pointerover', (e) => { const t = e.target.closest('.node,.chip,.orch'); if (t && t !== tipFor && !$('#sheet').open) showTip(t); else if (!t && tipFor) hideTip(); });
document.addEventListener('focusin', (e) => { const t = e.target.closest?.('.node,.chip,.orch'); if (t && !$('#sheet').open) showTip(t); else if (tipFor && !t) hideTip(); });
addEventListener('scroll', () => tipFor && hideTip(), { passive: true });
// menu (phone)
$('#menu-b').addEventListener('click', () => $('#menu').showModal());
$('#menu-x').addEventListener('click', () => $('#menu').close());
$('#menu').addEventListener('click', (e) => { if (e.target === $('#menu')) $('#menu').close(); });

function layout() { if (mqPhone.matches) renderPhoneMap(); else { $('#pmap').innerHTML = ''; renderMap(); } }
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
renderChrome(); renderWaiting(); renderSentBack();
document.fonts.ready.then(() => { layout(); window.__ready = true; const m = location.hash.match(/^#agents\/([\w-]+)/); if (m && A[m[1]]) openSheet(m[1]); });
})();
</script>
