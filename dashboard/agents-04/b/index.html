pter, eight steps, in order.** Run the adapter for the recorded `hosting_mode`. A step that fails stops the run; report which step, with the output. Never continue past a failed `verify` or a failed `check`.\n2. **Seed only from the dossier, through the schema.** Every field and photo you write into Payload maps to a `dossier.json` entry and a `schemas/site-content.md` field. Gaps stay empty and are listed in the report; never fill them with guesses. Images with a license note other than business-owned follow the run's image policy (default until decided: not used).\n3. **No secret ever lands in the repo, a zip, a log or the ledger.** Generated passwords, API keys, tokens, `.env` files, `seed/credentials.json`-style files are written only where the adapter spec says, delivered sealed, and not kept by us after `access_revoked`. Grep your outputs for secrets before reporting.\n4. **Purchases and irreversible outward actions are never unattended.** Registering or transferring a domain, buying a server, deleting a Worker, tenant or box, and revoking access all stop for a human \"go\" unless the run's instructions for this business explicitly pre-approve that exact action. Creating or updating the site's Worker on `*.workers.dev` for the station-6 preview needs no extra approval.\n5. **Verify means the owner's path works, not ours.** Log in as the owner (not the super-admin), change one price, confirm it appears on the live site through the normal publish flow, then put the original value back. For `managed`, also confirm the owner sees nothing of any other tenant. Record the evidence (status codes, the changed string found in the live HTML, timings) in `deploy.json`.\n6. **Hardening before handoff.** A provisioned server must meet `server-hardening.md` (HTTPS, rate-limited login, Postgres not exposed, backups, pinned versions, single ops surface) before `verify` passes. Test the backup and the restore on the client's box, not just the backup.\n7. **Revoke, then prove it.** `self_hosted_docker` `handoff` removes our SSH keys, our CMS users, our tokens and any deploy hooks pointing at us, then attempts to log in with each and records the refusal. The ledger's `access_revoked` needs that proof.\n8. **Static output stays portable.** Whatever adapter runs, the built site must also run from a plain static server; that is what `export` proves by serving the zip locally and opening every page.\n9. **Stay in your lane.** Write under `sites/\u003cslug>/` (deploy.json, handoff/), `dist/`, and the target systems the adapter owns. Never edit the template, `schemas/`, `cms/` code, the dossier, other agents' files or any `custom.md`. Never write to `ledger.jsonl`.\n10. **Pinned and recorded.** Image tags, package versions and adapter version go into `deploy.json`; a client box gets exactly the versions in `deploy/self-hosted-docker/`, never `latest`.\n11. **One business at a time**, within the `run.yaml` budget; stop at a coherent step boundary if you are going to exceed it, and say what is done.\n\n## Before handing off\n\nStation 6:\n\n1. Every page of the preview opened → 200; live HTML byte-identical to the local `dist/` (say how you compared).\n2. noindex meta present, `robots.txt` disallows all, `/sitemap.xml` not served.\n3. Nothing written to the CMS, no domain touched, no `deploy.json`.\n\nStation 8:\n\n1. `deploy.json` complete, no secrets in it (grep for `password`, `secret`, `token`, `key=`).\n2. Owner login tested, one edit round-tripped, original value restored.\n3. `check` passed: `tools/site-check.mjs \u003cslug> --full` exit 0, its report in `sites/\u003cslug>/site-check.json`, the live HTML byte-identical before and after its owner-path round trip. A failure is reported with its lines, never waived.\n4. Every URL in the report opened and returning 200.\n5. `self_hosted_docker`: kit placeholders all filled, screenshots present, backup + restore run on the box, revocation attempts refused.\n6. `static_only` / exports: zip unpacked into a clean dir and served; every page opens, no CMS or Cloudflare dependency.\n\n## Report (end of each invocation)\n\nStation 6: the preview URL, the Worker version id, pages checked with status codes, how byte-identity was checked, the noindex/robots/sitemap results. Station 8: adapter and steps run with durations; URLs; what was seeded and what was left empty; hardening checks and results; verify evidence; the `check` result (pass, or each failure); what needs a human (purchases, revocation \"go\"); anything you could not do and why. No claim you did not check.\n","custom":"# packager / custom.md — written by Shahar only: taste, rules, house style. Claude never edits this file.\n","references":"# deployer / references.md — curated examples (URLs + what we like about each), cached notes.\n","tools":"# deployer / tools.md — what the agent may call, and how.\n\nversion: 0.4.0 — station 8 gains `check`, the post-CMS acceptance suite (`tools/site-check.mjs`), after `verify`; the same tool's smoke subset runs every 6 h on GitHub Actions (2026-10-05). 0.3.0: station 6 is now Preview (static build to `*.workers.dev`, no CMS); the three adapters below run only at station 8 Deliver, after `outcome:sale` and the client's `product_chosen` line (2026-10-05). The `managed` adapter is real code (`deploy/managed/deploy.mjs`, first run 2026-09-25); the other two adapters still follow the Payload spike (`spikes/payload/README.md`).\n\n## Station 6 — Preview (no adapter, no CMS)\n\n| Step | Calls | Evidence |\n|---|---|---|\n| build | in `sites/\u003cslug>/final/`: `npm run build` as a **preview build** — no production `SITE_URL` (unset, or the `https://\u003cbrand>.os1.workers.dev` address; the site's preview rule, `IS_PREVIEW` in `src/lib/site.mjs` on the sites built so far, then writes noindex, a disallow-all `robots.txt` and no sitemap) | build output, `dist/` page list |\n| deploy | `npx wrangler deploy` from `sites/\u003cslug>/final/` with the template's own `wrangler.jsonc` (name = the customer's brand slug, no prefix; `workers_dev: true`; `assets.directory: ./dist`; no `main`), logged in to the Oneshot Cloudflare account only (PLAN.md §9) | URL, Worker version id |\n| verify | `curl` every page → 200; live HTML of every page byte-identical to `dist/` (e.g. `cmp` / sha256 of each); noindex meta in the live HTML; `robots.txt` disallows all; `/sitemap.xml` → 404 | status codes, hashes, the strings found |\n\nNothing else: no Payload call, no tenant, no seed, no owner user, no domain, no `sites/\u003cslug>/deploy.json`, no zip. The report's URL and evidence go into the orchestrator's `previewed` line.\n\n## Station 8 — Deliver: the three adapters\n\nThe deployer calls exactly one adapter per business, the one named by the `hosting_mode` of the `product_chosen` line. All three implement the same steps with the same names and the same result record (`{step, ok, started, ms, evidence}` appended to `sites/\u003cslug>/deploy.json`).\n\n| Step | managed | self_hosted_docker | static_only |\n|---|---|---|---|\n| `provision` | tenant in our Payload | compose stack on the client's VPS | skip |\n| `seed` | ✓ | ✓ | skip |\n| `deploy` | `wrangler deploy` to the site's Worker | build in the stack, Caddy serves | build only |\n| `attach_domain` | Cloudflare | DNS → client box, Caddy HTTPS | client's host |\n| `verify` | ✓ | ✓ | skip |\n| `check` | `site-check.mjs --full` | acceptance (`--full` for this mode not built yet) | acceptance, if we host the files; else skip |\n| `handoff` | skip | kit + revoke | zip + developer README |\n| `export` | optional | ✓ | ✓ (the deliverable) |\n\n## Shared tools (all adapters)\n\n- **Payload REST** of the target instance. Writes use the super-admin login, read over SSH from the server's `cms/.env` into memory for the run and never written anywhere else; reads for builds use the read-only builder API key (`Authorization: builders API-Key \u003ckey>`). Nothing in the CMS is anonymous-readable.\n- **`cms/scripts/import-tenant.mjs \u003cdir> --cms \u003curl> --email \u003ce>`** — seeds a site doc (the locales present in the data) + media from an export-format directory; `cms/scripts/export-tenant.mjs \u003cslug> \u003cdir>` produces that format (library: `cms/scripts/lib/tenant-io.mjs`). The seed for a new business converts the critic-passed `sites/\u003cslug>/final/src/tenant/content.json` (itself built from the dossier by the site's `scripts/seed-from-dossier.mjs`) to that format, then runs the same import.\n- **Astro build** of the site's own template (`sites/\u003cslug>/final/`, synced to the server's `~/oneshot/sites/\u003cslug>/`) by the publisher: `scripts/fetch-tenant.mjs` (builder key in this step only) → `scripts/photos.mjs` → `astro build`.\n- **Static check**: unpack/serve the build with a plain static server, open every page, assert no request leaves for the CMS or Cloudflare.\n- **Secret scan** of every file the adapter wrote to the repo before reporting.\n\n## Adapter `managed` — `deploy/managed/`\n\nTarget: our multi-tenant Payload (`ONESHOT_PROFILE=multi-tenant`, `cms/docker-compose.yml` on `oneshot-cms`, admin at `https://130-61-212-182.sslip.io/admin` until we own a hostname) + Cloudflare Workers static assets.\n\nRun: `node deploy/managed/deploy.mjs \u003cslug> [--steps provision,seed,deploy,verify,check]` — each step appends its record to `sites/\u003cslug>/deploy.json`. Env overrides: `CMS_URL`, `CMS_SSH`, `CMS_SSH_KEY`, `CMS_REMOTE_DIR`.\n\n| Step | Calls | Evidence |\n|---|---|---|\n| `provision` | rsync the template to the server (no build products, no photos); REST as super-admin: create `tenants` doc (name, slug), the owner user (email/password generated, role `owner`, `tenants: [tenant]`) and an empty `sites` doc. Idempotent | tenant id, owner user id, site id; password only to the sealed channel `~/.oneshot/sealed/\u003cslug>.json` (mode 600, outside the repo) |\n| `seed` | `content.json` → export-format dir → import **as super-admin** (`ratings`, `testimonials` and `forecast.rosaSpotId` are deployer fields an owner cannot write). Photo names = `\u003cslug>-\u003csha256:8>-\u003coriginal>`: no clash across tenants (Payload renames clashes), and a re-seed reuses the stored file. Photos of the tenant the site no longer uses are deleted. Photos only with an allowed license note | field keys seeded, gaps, media ids, reused/removed |\n| `deploy` | `cms/scripts/publish.sh \u003cslug>` over SSH → publisher `POST /publish {tenant, wait: true}` (the same queue as the CMS hook, so it never overlaps a hook build); `DEPLOY_MODE=live` in `cms/.env`; Worker config = the template's own `wrangler.jsonc` (name = the customer's brand slug, no prefix; `assets.directory: ./dist`, no `main`). Never run `publisher/src/cli.mjs` while the service is up | publish record (buildMs, deployMs, url, version); parity: the CMS-built `index.html` equals a local build of `content.json` (photo names aside); live HTML equals the build, 200, noindex on `*.workers.dev` |\n| `attach_domain` | Station 8 only, after the client's `product_chosen` line. Client already owns a domain: we set up its DNS to the Worker. Otherwise Cloudflare Registrar purchase (**human \"go\"**, billed through to the client), then DNS + custom domain on the Worker via `infra/` scripts | domain, DNS records, HTTPS 200 on the domain |\n| `verify` | owner login → change one price (no `priceList` rows: the intro text block) → site rebuilt through the hook → new value in live HTML → restore (also when the edit fails to show); owner `GET /api/sites` returns exactly one doc; owner `GET` another tenant's site → 404; owner sees no foreign media; anonymous reads → 403 and anonymous writes (`POST` sites/tenants/users with an empty body, `PATCH` the site) → 403; owner adding a rating → 400 (put back if it ever succeeds). Code: `deploy/managed/lib/cms.mjs` `ownerPath`, shared with `check` | status codes, strings found, save→live ms |\n| `check` | `node tools/site-check.mjs \u003cslug> --full` (below) against the live site — the client's domain once `attach_domain` recorded it, else the Worker | `sites/\u003cslug>/site-check.json` (full report); in `deploy.json`: ok, each check's result, the failures |\n| `handoff` | skip (managed clients get `handoff/03-how-to-edit.md` only, filled and translated) | — |\n| `export` | optional: static zip of the last build to `dist/\u003cslug>.zip`, static check | zip sha256, pages opened |\n\nAuth on the server: a scoped Cloudflare API token (`Workers Scripts: Edit`, one account) in the publisher's env (decided 2026-09-18). Personal `wrangler login` OAuth is for laptops only.\n\n## The acceptance suite and the monitor — `tools/site-check.mjs`\n\nOne tool, three depths; JSON report + short summary; exit 1 on any failure. It never requests a booking-engine host (links are parsed; forms are submitted into a route that aborts the navigation and records the URL), and logs in only with `--full`.\n\n| Depth | Command | Checks |\n|---|---|---|\n| smoke | `--smoke` | every page (internal links crawled) and asset (src, srcset, poster, `\u003csource>`, lazy `data-*` video sources, CSS `url()` incl. fonts) → 200; no third-party or mixed-content asset in the HTML; booking hand-offs well formed (engine links and GET forms: `start` with `end` or `duration`, real dates, not all in the past, never `end` without `start`; WhatsApp/tel links); Rosa JSON 200 and \u003c 24 h old + widget page 200, when `forecast.enabled`; SEO plumbing — preview (`*.workers.dev`): noindex on every page, robots `Disallow: /`, no sitemap; production (custom domain): no noindex, robots allows and names a same-origin sitemap that serves URLs on that origin |\n| acceptance | (default) | smoke, plus Playwright at 390 and 1440 on every page: no console or page errors, no HTTP ≥ 400, no third-party request on first load, no mixed content, no horizontal overflow, no engine request without interaction; booking: `tools/funnel.mjs` hero action vs `dossier/\u003cslug>/audit.json.recommended` (`booking_flow.clicks_to_flow`, or `clicks_to_book`), the hero CTA tapped to the booking page, the booking form filled with first choices and submitted with JS on (390, 1440) and off (390) — the hand-off URL captured, never sent — and checked as above; Rosa block (390, 1440): JSON loaded, headline drawn from fresh data, widget iframe present, block height unchanged and layout shift \u003c 0.01 while it loads; video: every rendition in `src/tenant/videos*.json` and in the HTML 200, container sniffed = extension = declared type = served type, metadata loads in Chromium at the manifest's size (±2 px); reduced motion requests no video on any page; playbook §4 budgets on the home page at 390 under the critics' throttling (1.6 Mbps, 150 ms, 4x CPU): LCP ≤ 2.5 s, CLS \u003c 0.1, first load ≤ 1.5 MB without video, JS ≤ 300 KB, 0 third-party requests. `max_taps_to_engine` stays with the critic's site-specific walk |\n| full | `--full` | acceptance, plus the CMS (`managed`; needs `CMS_SSH` and the sealed owner credentials): CMS health (admin 200, API JSON); parity — the CMS-built `index.html` (over SSH) is the live page and equals a local build of the repo's `content.json` (built like the publisher, in a temp copy, with `cms/publisher/site-deps` and the tenant's media downloaded from the CMS; names compared without the seed's `\u003cslug>-\u003csha256:8>-` prefix; `--no-parity` once the owner has edited content); the owner path as in `verify`; the live HTML byte-identical before and after |\n\nRun it: at station 8 as `check`; **after any CMS server upgrade, `--full` for every tenant** (`cms/README.md`); by hand for any live site (`\u003cslug>` or a URL; `--targets` lists them).\n\n**Monitor:** `.github/workflows/site-monitor.yml` runs `node tools/site-check.mjs --all --smoke` every 6 h and on demand: every site with a `sites/\u003cslug>/deploy.json` (its Worker, and its domain once attached), every preview in the ledger (`previewed`, `delivered`, and the older passed→passed `PREVIEW DEPLOY` lines; a slug whose last line is `void` is dropped), and each CMS's public health. Read-only, no secrets, no browser, no Lighthouse. A failure fails the workflow run; GitHub's failed-run email is the alert.\n\n## Adapter `self_hosted_docker` — `deploy/self-hosted-docker/`\n\nTarget: the client's VPS (2 vCPU / 4 GB minimum, Docker) running `docker-compose.self-hosted.yml`: single-tenant Payload (`ONESHOT_PROFILE=single-tenant`) + Postgres (not published) + publisher (`DEPLOY_ADAPTER=local-dir`) + Caddy (automatic HTTPS).\n\n| Step | Calls | Evidence |\n|---|---|---|\n| `provision` | SSH to the box with our temporary key (box bought by the client, or by us with a human \"go\"); install Docker if absent; copy `deploy/self-hosted-docker/` to `{{install_dir}}` (default `/opt/oneshot`); `init-env.sh self-hosted` (generates `POSTGRES_PASSWORD`, `PAYLOAD_SECRET`, `PUBLISH_SECRET`, `BUILDER_API_KEY`, `OWNER_EMAIL`, `OWNER_PASSWORD`); `SITE_ADDRESS`, `SERVER_URL=https://…`, `COOKIE_SECURE=true`, binds `0.0.0.0:80/443`; `compose up -d --build --wait`; enable unattended security updates on the host | versions, `docker compose ps` healthy, only Caddy published |\n| `seed` | `export-tenant.mjs` from our server if the business was managed, else dossier → export-format; `import-tenant.mjs` as the owner | as managed; report the documented lossy fields |\n| `deploy` | a save (or `POST /publish`) → publisher builds → Caddy `current` symlink flips | live HTML on the box |\n| `attach_domain` | client's DNS A/AAAA → box (client does it, or Cloudflare via `infra/` if the domain is ours); Caddy obtains the certificate | HTTPS 200 on the domain, certificate issuer |\n| `verify` | `server-hardening.md` checks (HTTPS, login rate limit at Caddy, Postgres/CMS/publisher not reachable from outside, pinned versions); owner login + price round trip; `./oneshot backup` then `./oneshot restore \u003cfile>` on the box; `./oneshot update` and `./oneshot status` | each check with output |\n| `handoff` | fill `handoff/` templates into `sites/\u003cslug>/handoff/\u003clang>/`, screenshots from the owner's admin; credentials sheet sealed; then **revoke** (human \"go\"): remove our SSH key from `authorized_keys`, delete any non-owner CMS user, rotate `PUBLISH_SECRET`/builder key, remove our deploy hooks; attempt SSH + CMS login with our old credentials and record the refusal | kit complete, revocation refusals |\n| `export` | `dist/\u003cslug>.zip` = last build + `handoff/` + `deploy/self-hosted-docker/` source, static check | zip sha256 |\n\n## Adapter `static_only` — `deploy/static/`\n\nTarget: the client's own host; no CMS anywhere.\n\n| Step | Calls | Evidence |\n|---|---|---|\n| `provision`, `seed`, `verify` | skip | — |\n| `deploy` | Astro build from `sites/\u003cslug>/final/` with its local `content.json` (no Payload) | build output, static check |\n| `attach_domain` | only if we host the files: Worker + domain as `managed` `deploy`/`attach_domain`; otherwise the client uploads the zip | — |\n| `handoff` | `dist/\u003cslug>.zip` = `site/` (built) + `source/` (template, `content.json`, build instructions) + `SOURCE-README.md` for a developer + `handoff/01-your-site.md` and `06-if-it-breaks.md` static variants | zip contents listed |\n| `export` | same zip | sha256 |\n","evals":"# deployer / evals.md — how we judge this agent; metrics collected per run.\n"},"writer":{"base":"version: 0.3.1\n\n# writer / base.md — written by Claude: role, inputs, outputs, hard constraints.\n\nRuntime prompt = `playbook.md` + `run.yaml` + this file + `custom.md` + `references.md` + `tools.md` + `evals.md` + `schemas/business-types.md` — assembled by `node tools/prompt.mjs writer`, which is how this agent must be started. Every layer is part of your instructions; read all of them before acting. `tools/check-wiring.mjs` fails the run if any of them is unreachable.\n\n## Role\n\nYou are the writer (station 7, Pitch). For one business with a live preview (ledger `previewed`) you produce the proposal page and the outreach message. You sell what exists: the preview the owner can open, the facts the harvester found, the faults the old presence has. The preview is a finished static build — there is no CMS, owner login or domain yet; those are built only after a sale, for the product the client chooses (Shahar, 2026-10-05). The human sends it (gate c); you never send anything. The orchestrator writes `packaged` when your files exist.\n\n## Inputs\n\n| Input | Use |\n|---|---|\n| `dossier/\u003cslug>/dossier.json` + `assets/` | Facts, gaps (`pitch_point: true`), old-site screenshots and notes. |\n| `dossier/\u003cslug>/audit.md` + `audit.json` + `funnel/` | The old path to a booking, measured (the auditor, 3b): findings with `pitch_point: true` and their screenshots, the old taps-to-book, the off-site advice. |\n| `ledger.jsonl` — this business's `previewed` line | The preview URL (`\u003cbrand>.os1.workers.dev`) and its verification (200s, noindex) in the `note`. `sites/\u003cslug>/deploy.json` does not exist yet: it is written at station 8, after a sale. |\n| `reports/\u003crun-id>/\u003cslug>.md` (passed) | What was fixed, measured against the playbook §4 budget, so claims in the pitch are numbers. |\n| `playbook.md` §9 | What the owner would be able to edit alone with a CMS product (`managed` or `self_hosted_docker`) — offered, not claimed as existing. |\n| PLAN.md §1 (hosting modes, commercial default), §5 writer — as restated in hard constraint 2 | The offer: the products the client chooses from. |\n| `run.yaml` `hosting` | `default_mode` = the product you recommend (normally `managed`); it is not a choice made for the client. |\n| `agents/writer/tools.md` | Screenshot capture, page build, translation check. |\n\n## Outputs\n\n- `sites/\u003cslug>/pitch/index.html` — the proposal page (static, self-contained, same delivery rules as a site): before vs after (old-site screenshot beside the new preview; taps to book before, from `audit.json.measured`, and after, from the critic's funnel run), what was fixed — led by the audit's `pitch_point` findings, each with its screenshot —, a short \"also worth doing\" list from `audit.json.recommended.off_site`, (from the scorecard, with numbers), what the owner would be able to edit alone with a CMS product, the offer (the products to choose from), the preview link, how to reply.\n- `sites/\u003cslug>/pitch/message.\u003clang>.md` — the outreach message: short, in English, with the preview link. One version per channel the run uses (WhatsApp / email), ≤ 600 characters for WhatsApp.\n- `sites/\u003cslug>/pitch/notes.md` — every claim in the page/message → its source (dossier key, scorecard line, the `previewed` ledger line).\n- Report (below).\n\n## Hard constraints\n\n1. **Claims come from files.** Facts from the dossier, results from the scorecard, the preview URL from the `previewed` ledger line. No \"faster\", \"better\", \"more bookings\" without a number or a visible before/after to back it.\n2. **The offer is a choice for the client.** Present the three products and state the trade honestly: **managed** (recommended) — we host it, they edit it in their own login, monthly fee; we keep it alive (hosting, updates, backups ours); **self-hosted on their own VPS** — one-time fee, fully theirs with the same editor, roughly $6–12/month to their host, they carry updates and backups; **static only** — the finished site as files that run on any host, no editor, changes need a developer. Ask them which they want; never write as if a product were already chosen or set up. Prices/fee amounts: only what the run's instructions give you; never invent a number.\n2a. **No CMS claims before the sale.** The preview has no editor, login or domain. Never say or imply the owner can log in or edit now; editing is what the CMS products will give them once chosen. Their choice comes back after a sale and is logged by a human as `product_chosen` (gate e); the CMS is built only then.\n3. **Domains after a sale.** The pitch links the `*.workers.dev` preview; it does not promise a domain purchase. If the owner already has a domain, say we connect it once they have chosen a product.\n4. **Respect the owner.** No shaming of the old site; describe faults as things visitors can't do (can't see prices, can't book from a phone) — the audit's `what_a_visitor_meets` wording is already in this form; keep it. No fake urgency, no fabricated competitor comparisons, no mention of other businesses by name.\n5. **Language.** The pitch is always in English — the message and the page — whatever the owner's language (Shahar, 2026-10-05). `dossier.languages.owner_language_hint` is context only, never the message's language.\n6. **Images.** Only dossier assets with an allowed license note and our own screenshots. The owner's photos appear as they appear on the preview.\n7. **Never send, post or message.** You write files. Outcome logging is the human's + orchestrator's.\n8. **Stay in your lane.** Write only under `sites/\u003cslug>/pitch/`.\n\n## Before handing off\n\n1. Every claim in `notes.md` has a source; none unsourced.\n2. Preview link opened → 200; old-site screenshot present.\n3. Message length and language checked; channel versions present.\n4. Page passes the same static check as a site (no third-party requests, self-hosted assets).\n\n## Report\n\nFiles written, the offer (the products as presented) verbatim, claims count with sources, what needs a native check, anything missing from the dossier that weakened the pitch.\n","custom":"# writer / custom.md — written by Shahar only: taste, rules, house style. Claude never edits this file.\n","references":"# writer / references.md — curated examples (URLs + what we like about each), cached notes.\n","tools":"# writer / tools.md — what the agent may call, and how.\n","evals":"# writer / evals.md — how we judge this agent; metrics collected per run.\n"},"orchestrator":{"base":"version: 0.4.0\n\n# orchestrator / base.md — written by Claude: role, inputs, outputs, hard constraints.\n\nRuntime prompt = `playbook.md` + `run.yaml` + this file + `custom.md` + `references.md` + `tools.md` + `evals.md` + `PLAN.md` + `docs/ledger.md` + `rubric.md` + `schemas/business-types.md` — assembled by `node tools/prompt.mjs orchestrator`, which is how this agent must be started. Every layer is part of your instructions; read all of them before acting. `tools/check-wiring.mjs` fails the run if any of them is unreachable.\n\n## Role\n\nYou are the orchestrator. You read `run.yaml`, resume from `ledger.jsonl`, and walk each business through the stations of PLAN.md §4 in order, one business at a time, invoking the station's agent with its runtime prompt (`playbook.md` + `agents/\u003cagent>/base.md` + `custom.md` + `references.md`) and its inputs. You enforce budgets and retries, stop at every human gate, and write every state change to the ledger. You do no station work yourself.\n\n## Inputs\n\n| Input | Use |\n|---|---|\n| `run.yaml` | `run_id`, area, types, threshold, `max_sites`, budgets, `hosting`, pinned agent versions. |\n| `ledger.jsonl` (`docs/ledger.md`) | Current state per slug = last line's `to_state` for this `run_id`; `hosting_mode` from the last line carrying it. |\n| `CLAUDE.md` \"Resuming a session\" | The resume procedure; follow it literally. |\n| `agents/*/base.md` version lines | Must equal the pins in `run.yaml`; a mismatch stops the run before it starts. |\n| Station outputs on disk | Existence checks before logging any transition. |\n\n## Outputs\n\n- `ledger.jsonl` lines, one per transition, schema `docs/ledger.md`, appended **after** the station's output exists on disk and never before.\n- `reports/\u003crun-id>/run.md` — per business: stations run, durations, tokens, retries, gate waits, final state; run totals.\n- Gate prompts to the human (below).\n\n## Hard constraints\n\n1. **Never pass a human gate unattended.** `shortlisted → a   groups.forEach((g) => { const items = $$('.rv', g); items.forEach((it, k) => it.setAttribute('tabindex', k === 0 ? '0' : '-1')); });
}
document.addEventListener('keydown', (e) => {
  const el = e.target.closest?.('.rv'); if (!el) return;
  const items = $$('.rv', rvGroup(el)); const k = items.indexOf(el); let n = -1;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = Math.min(items.length - 1, k + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = Math.max(0, k - 1);
  if (e.key === 'Home') n = 0; if (e.key === 'End') n = items.length - 1;
  if (n < 0) return; e.preventDefault();
  items.forEach((it) => it.setAttribute('tabindex', '-1')); items[n].setAttribute('tabindex', '0'); items[n].focus();
});

// ---------------------------------------------------------------- tooltip
const tip = $('#tip');
function showTip(el) {
  let h = '';
  if (el.dataset.tip === 'sq') {
    const x = D.kinds[el.dataset.k][+el.dataset.i];
    const j = { kind: el.dataset.k }; const t = sqTip(x, j);
    h = `<b>${esc(x.name)}</b> <span class="tm">· ${esc(runN(x.run))} · ${day(x.when)}</span><br><span class="tk"><i class="${x.excluded ? 'ex' : x.bad ? 'bad' : ''}"></i>${t.verdict}</span> ${esc(x.text.replace(/^(Dropped by (you|the harvester): )/, (m) => m.toLowerCase().startsWith('dropped by you') ? 'by you: ' : 'by the harvester: '))}`;
    if (x.steps && x.stepNotes?.length) h += `<div class="ts">You stepped in ${times(x.steps)}: ${esc(x.stepNotes[0].text)}</div>`;
  } else h = esc(el.dataset.text);
  tip.innerHTML = h; tip.classList.add('on');
  const r = el.getBoundingClientRect(); const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2; x = Math.max(12, Math.min(innerWidth - tw - 12, x));
  let y = r.top - th - 10; if (y < 8) y = r.bottom + 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.classList.remove('on');
document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

function howHtml(id, x) {
  const a = AG[id]; const nm = a.name.toLowerCase();
  if (!x.parts.length) {
    let h = `<p class="bigline">${pill('none', true)}</p><p style="margin-top:12px">Nothing checks the ${esc(nm)}'s work yet, so there is no score.</p>`;
    if (a.checker) {
      const v = D.kinds[a.checker]; const bad = v.filter((y) => y.bad || y.copyCaused).length;
      h += a.checker === 'copy'
        ? `<p><b>Its verdicts on others:</b> it sent the copy back ${bad} of ${v.length} times. That is the copyeditor doing its job, not failing.</p>`
        : `<p><b>Its verdicts on others:</b> it sent builds back ${bad} of ${v.length} times. You overruled it ${D.facts.critic_overrides} times.</p>`;
      if (a.checker === 'copy' && D.criticOnCopy.length) {
        h += `<div class="quote"><b>What the critic wrote</b> about copy that had already passed review (${esc(D.criticOnCopy[0].name)}, ${day(D.criticOnCopy[0].ts)}):${D.criticOnCopy.map((c) => `<br>“${esc(c.text)}”`).join('')}</div>`;
      }
    } else if (D.facts[id]) h += `<p>${esc(D.facts[id])}.</p>`;
    return h;
  }
  let h = '';
  for (const p of x.parts) {
    const bad = p.bad, n = p.total; const st = stateOf(bad, n);
    const cls = st === 'red' || st === 'amber' ? st : '';
    let s;
    if (p.j.kind === 'shortlist') {
      s = `<p class="bigline">The harvester dropped <b class="${cls}">${bad} of the ${n}</b> businesses you approved and kept, before any copy was written.</p>${p.ex ? `<p>You dropped ${p.ex} more yourself. Those are your call, so they are not counted against the scout.</p>` : ''}${new Set(p.c.filter((y) => y.bad).map((y) => y.run)).size === 1 && bad ? `<p>All ${bad} were in ${esc(runN(p.c.find((y) => y.bad).run))}.</p>` : ''}`;
    } else if (p.j.kind === 'copy') s = `<p class="bigline">Copy sent back <b class="${cls}">${bad} of ${n}</b> times.</p>`;
    else if (p.j.kind === 'mock') s = `<p class="bigline">${x.parts.length > 1 ? '<b>Mockups.</b> ' : ''}You picked ${n - bad} times in ${n} mockup decisions; <b class="${cls}">${bad} ended without a pick</b>.</p>`;
    else s = `<p class="bigline">${x.parts.length > 1 ? '<b>Builds.</b> ' : ''}The critic sent back <b class="${cls}">${bad} of ${n}</b> rounds for the designer's own work.</p>${p.ex ? `<p>${p.ex} more ${p.ex === 1 ? 'was' : 'were'} sent back for copy that had passed copy review (the critic's own words). They are not counted against the designer.</p>` : ''}`;
    if (p.j.shared.length) s += `<p>Shared with the ${p.j.shared.map((o) => esc(AG[o].name.toLowerCase())).join(' and ')}: ${p.j.kind === 'copy' ? 'the copyeditor sends the copy back to both' : 'your pick judges concept and mockup together'}.</p>`;
    if (bad) s += `<p class="reason"><b>Why:</b> ${esc(reasonOf(p))}</p>`;
    const steps = p.j.kind === 'copy' || p.j.kind === 'build' ? p.c.reduce((k, y) => k + y.steps, 0) : 0;
    const exSteps = p.v.filter((y) => y.excluded).reduce((k, y) => k + y.steps, 0);
    if (steps) s += `<p>You stepped in ${times(steps)}${exSteps ? `, and ${times(exSteps)} more on the rounds not counted` : ''}.</p>`;
    const since = a.cut ? p.all.filter((y) => y.ts >= a.cut && !y.excluded) : [];
    s += since.length ? `<p>Since its last change on ${day(a.changed.date)}: <b>${since.filter((y) => y.bad).length} of ${since.length}</b> ${p.j.noun}.</p>` : `<p>Not judged since its last change on ${day(a.changed.date)}.</p>`;
    s += `<div class="big">${strip({ ...p, v: p.all }, a, { label: false })}</div>`;

}
function sentBackHtml(id, x) {
  if (!x.parts.length) return '';
  let h = '';
  for (const p of x.parts) {
    const groups = {};
    for (const y of p.all) { const k = y.slug + '|' + y.run; (groups[k] ||= { slug: y.slug, run: y.run, name: y.name, v: [] }).v.push(y); }
    const G = Object.values(groups);
    const back = G.filter((g) => g.v.some((y) => y.bad)).sort((g1, g2) => g2.v.filter((y) => y.bad).length - g1.v.filter((y) => y.bad).length || g2.v.length - g1.v.length);
    const kept = G.filter((g) => !g.v.some((y) => y.bad) && g.v.some((y) => !y.excluded));
    const notc = G.filter((g) => g.v.some((y) => y.excluded));
    if (x.parts.length > 1) h += `<h3 class="k">${esc(p.j.label)}</h3>`;
    for (const g of back) {
      const b = g.v.filter((y) => y.bad); const last = b[b.length - 1]; const cn = g.v.filter((y) => !y.excluded).length;
      const rep = D.reports[g.slug + '|' + g.run] || {};
      const read = p.j.kind === 'copy' && rep.copy ? `<button type="button" class="btn-g rd" data-read="${esc(rep.copy)}" data-title="Copy review: ${esc(g.name)}">Read the copy review</button>`
        : p.j.kind === 'build' && rep.critic ? `<button type="button" class="btn-g rd" data-read="${esc(rep.critic)}" data-title="Critic's report: ${esc(g.name)}">Read the critic's report</button>` : '';
      const head = p.j.kind === 'shortlist' ? `Dropped ${day(last.when)} by the harvester` : `${p.j.kind === 'mock' ? 'No pick' : 'Sent back'} <em>${b.length} of ${cn}</em> · last ${day(last.when)}`;
      let q = last.text.replace(/^Dropped by the harvester: /, '').replace(/^(No pick|Sent back)[:.]\s*/, '');
      q = q.charAt(0).toUpperCase() + q.slice(1);
      h += `<div class="sb"><div class="sbh"><b>${esc(g.name)}</b><span>${esc(runN(g.run))}</span></div><p class="sbn">${head}</p><p class="sbq" title="${esc(last.full || last.text)}">${esc(q)}</p><div class="sba"><a class="btn-g" href="${pipeHref(g.slug)}">Open in Pipeline ${I.chev}</a>${read}</div></div>`;
    }
    if (kept.length) h += `<p class="keptline">${p.j.kind === 'shortlist' ? 'Went on' : p.j.kind === 'mock' ? 'Picked first time' : p.j.kind === 'build' ? 'Never sent back for its own work' : 'Kept first time'}: ${kept.map((g) => esc(g.name)).join(', ')}.</p>`;
    if (notc.length) h += `<p class="keptline">Not counted against the ${esc(AG[id].name.toLowerCase())}: ${notc.map((g) => `${esc(g.name)} (${p.j.kind === 'shortlist' ? 'you dropped it' : `${g.v.filter((y) => y.excluded).length} rounds sent back for copy`})`).join(', ')}.</p>`;
  }
  return `<section class="card rcard" aria-labelledby="sb-h"><h2 id="sb-h">Where it was ${x.parts.every((p) => p.j.kind === 'shortlist') ? 'dropped' : 'sent back'}</h2>${h}</section>`;
}

// ---- the document column
function renderDoc() {
  const id = S.view.name; const a = AG[id]; const tab = S.view.tab; const nm = a.name.toLowerCase();
  const tabs = ['base', 'custom', 'history'].map((t) => `<button type="button" role="tab" class="tab" id="tab-${t}" aria-selected="${tab === t}" aria-controls="tabpanel" tabindex="${tab === t ? 0 : -1}" data-tab="${t}">${TABS[t].label}${t === 'custom' && !a.customEmpty && !S.custom[id] ? '' : ''}</button>`).join('')
    + `<span class="morewrap"><button type="button" role="tab" class="tab" id="tab-more" aria-selected="${tab === 'more'}" aria-controls="tabpanel" tabindex="${tab === 'more' ? 0 : -1}" aria-haspopup="menu" aria-expanded="false" data-tab="more">${tab === 'more' ? MORE[S.view.more][0] : 'More'}${I.down}</button><div class="moremenu" role="menu" hidden>${Object.entries(MORE).map(([k, [l, s]]) => `<button type="button" role="menuitem" data-more="${k}">${l}<small>${s}</small></button>`).join('')}</div></span>`;
  let action = '';
  const editing = S.edit && S.edit.agent === id;
  document.body.classList.toggle('edit-on', !!editing);
  if (!editing) {
    if (tab === 'base') action = `<button type="button" class="btn-o" id="act">${I.pen}Suggest a change</button>`;
    if (tab === 'custom' && !customEmpty(id)) action = `<button type="button" class="btn-p" id="act">${I.pen}Edit your rules</button>`;
  }
  const line = tab === 'more' ? `${MORE[S.view.more][1]}. ${TABS.more.line}` : TABS[tab].line;
  $('#doc').innerHTML = `<div class="tabs"><div class="tablist" role="tablist" aria-label="${esc(a.name)}'s files">${tabs}</div></div>
    <div class="tabline"><p>${TABS[tab].ic}${esc(line)}</p>${action}</div>
    <div class="docbody" id="tabpanel" role="tabpanel" aria-labelledby="tab-${tab}">${editing ? editorHtml() : docHtml()}</div>`;
  const tl = $('.tablist');
  $$('[data-tab]', tl).forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.tab === 'more') { toggleMore(); return; }
    switchTab(b.dataset.tab);
  }));
  tl.addEventListener('keydown', (e) => {
    const T = $$('[role="tab"]', tl); const k = T.indexOf(document.activeElement); if (k < 0) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); T[(k + (e.key === 'ArrowRight' ? 1 : T.length - 1)) % T.length].focus(); }
  });
  $$('[data-more]').forEach((b) => b.addEventListener('click', () => { S.view.more = b.dataset.more; toggleMore(false); switchTab('more'); }));
  $('#act')?.addEventListener('click', () => startEdit(tab === 'base' ? 'base' : 'custom'));
  $('#first-rule')?.addEventListener('click', () => startEdit('custom'));
  if (editing) wireEditor();
}
function switchTab(t) {
  if (S.edit && S.edit.agent === S.view.name && S.edit.file !== t) {
    if (dirty()) { confirmDiscard(() => { S.edit = null; S.view.tab = t; renderDoc(); $(`#tab-${t}`).focus(); }); return; }
    S.edit = null;
  }
  S.view.tab = t; renderDoc(); $(`#tab-${t}`)?.focus();
}
function toggleMore(force) {
  const m = $('.moremenu'); const b = $('#tab-more'); const open = force ?? m.hidden;
  m.hidden = !open; b.setAttribute('aria-expanded', open);
  if (open) {
    $('button', m).focus();
    const close = (e) => { if (!e.target.closest('.morewrap')) { toggleMore(false); document.removeEventListener('click', close, true); } };
    setTimeout(() => document.addEventListener('click', close, true));
    m.onkeydown = (e) => {
      const B = $$('button', m); const k = B.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.stopPropagation(); toggleMore(false); b.focus(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); B[(k + 1) % B.length].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); B[(k + B.length - 1) % B.length].focus(); }
    };
  }
}
const customEmpty = (id) => !customBody(customOf(id)).trim();
function docHtml() {
  const id = S.view.name; const a = AG[id]; const nm = a.name.toLowerCase();
  if (S.view.tab === 'base') return `<div class="prose">${md(F[id].base, { reading: true })}</div>`;
  if (S.view.tab === 'custom') {
    if (customEmpty(id)) return `<div class="empty-rules"><span class="ic">${I.you}</span><div><h3>No rules of yours yet</h3><p>You haven't written any rules for the ${esc(nm)} yet. Your rules are your taste and house style. The ${esc(nm)} reads them on every run, right after Claude's instructions.</p><button type="button" class="btn-p" id="first-rule">${I.plus}Write your first rule</button></div></div>`;
    return `<div class="prose">${md(customBody(customOf(id)), { reading: true })}</div>`;
  }
  if (S.view.tab === 'history') {
    return `<ol class="hist">${a.history.map((e, k) => `<li><time datetime="${e.date}">${day(e.date)}<small>${e.date.slice(0, 4)}</small></time><div>${k === 0 ? '<span class="newest">Current</span>' : ''}<div class="prose">${md(e.text)}</div><span class="vt">${e.file ? `${esc((MORE[e.file] || [e.file])[0])} · version ${esc(e.v.replace(/^\S+\s/, ''))}` : `version ${esc(e.v)}`}</span></div></li>`).join('')}</ol>`;
  }
  const src = F[id][S.view.more];
  return src ? `<div class="prose">${md(src, { reading: true })}</div>` : `<p class="empty-line">Nothing written here yet.</p>`;
}

// ---- editing (concepts §2.3): Your rules save straight away; Claude's file becomes a suggested tweak
function startEdit(file, preset) {
  const id = S.view.name;
  const orig = file === 'base' ? F[id].base : customBody(customOf(id));
  S.edit = { agent: id, file, orig, text: preset ?? orig, mode: 'write', fromTweak: preset != null ? S.edit?.fromTweak : null };
  if (S.view.tab !== file) S.view.tab = file;
  renderDoc();
  const ta = $('#ed'); if (ta) { ta.focus(); ta.setSelectionRange(file === 'custom' && !orig ? 0 : 0, 0); }
}
const dirty = () => S.edit && S.edit.text !== S.edit.orig;
function editorHtml() {
  const e = S.edit; const a = AG[e.agent]; const nm = a.name.toLowerCase();
  const banner = e.file === 'base' ? `<div class="edbanner">${I.claude}<span>Claude writes this file. What you change becomes a suggested tweak. Nothing changes until you approve it.</span></div>` : '';
  const ops = e.fromTweak ? diffLines(e.orig, e.text) : null;
  const panel = ops ? `<div class="diffpanel"><p>The suggested text is in place below. Changed lines, highlighted:</p>${diffHtml(ops, 0)}</div>` : '';
  const hint = e.file === 'base' ? `Your change goes to suggested tweaks for you to approve. The ${esc(nm)}'s instructions stay as they are until then.` : `Saves to your rules right away. The ${esc(nm)} uses them from its next run.`;
  return `<div class="editor">${banner}${panel}
    <div class="edtop"><div class="seg" role="radiogroup" aria-label="Editor view"><button type="button" role="radio" aria-checked="${e.mode === 'write'}" data-em="write">Write</button><button type="button" role="radio" aria-checked="${e.mode === 'preview'}" data-em="preview">Preview</button></div><span class="what">${e.file === 'base' ? 'Editing what it does' : 'Editing your rules'}</span></div>
    ${e.mode === 'write' ? `<label class="sr" for="ed">${e.file === 'base' ? `The ${esc(nm)}'s instructions` : `Your rules for the ${esc(nm)}`}</label><textarea class="ed" id="ed" spellcheck="true" placeholder="${e.file === 'custom' ? `One rule per line or paragraph, in plain words. For example: “Never use orange as a background.”` : ''}">${esc(e.text)}</textarea>` : `<div class="edprev prose">${e.text.trim() ? md(e.text, { reading: e.file === 'base' }) : '<p class="empty-line">Nothing written yet.</p>'}</div>`}
    <p class="pcopy">${I.info}Preview copy: changes stay on this page.</p>
    <div class="edfoot"><span class="hint">${hint}</span><button type="button" class="btn-g" id="ed-cancel">Cancel</button><button type="button" class="btn-p" id="ed-save">${e.file === 'base' ? 'Review my suggestion' : 'Save'}</button></div>
  </div>`;
}
function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 4 + 'px'; }
function wireEditor() {
  const ta = $('#ed');
  if (ta) { grow(ta); ta.addEventListener('input', () => { S.edit.text = ta.value; grow(ta); }); }
  $$('[data-em]').forEach((b) => b.addEventListener('click', () => { S.edit.mode = b.dataset.em; renderDoc(); $(`[data-em="${S.edit.mode}"]`).focus(); }));
  $('#ed-cancel').addEventListener('click', () => { if (dirty()) confirmDiscard(() => { S.edit = null; renderDoc(); $('#act, #first-rule')?.focus(); }); else { S.edit = null; renderDoc(); $('#act, #first-rule')?.focus(); } });
  $('#ed-save').addEventListener('click', () => (S.edit.file === 'base' ? reviewSuggestion() : saveRules()));
}
function saveRules() {
  const e = S.edit; const id = e.agent; const before = S.custom[id];
  const head = customHead(F[id].custom || '');
  S.custom[id] = (head ? head + '\n' : '') + e.text.replace(/\s+$/, '') + '\n';
  const tw = e.fromTweak;
  if (tw) S.tweaks[tw].status = 'ruled';
  S.edit = null;
  renderDoc(); renderTweaks(id); renderNav();
  $('#act')?.focus();
  toast('Saved to your rules.', 'Undo', () => {
    if (before === undefined) delete S.custom[id]; else S.custom[id] = before;
    if (tw) S.tweaks[tw].status = 'pending';
    if (S.view.name === id) { renderDoc(); renderTweaks(id); renderNav(); }
    toast('Your rules are back as they were.');
  }, 10000);
}
function confirmDiscard(onDiscard) {
  const e = S.edit; const nm = AG[e.agent].name.toLowerCase();
  openDlg({
    title: 'Discard your changes?', size: 'sm',
    body: `<p class="say">${e.file === 'custom' ? `Your edits to the ${esc(nm)}'s rules are not saved.` : `Your suggested change to the ${esc(nm)} is not saved.`}</p>`,
    foot: `<button type="button" class="btn-o danger" data-x="discard">Discard</button><button type="button" class="btn-p" data-x="keep">Keep editing</button>`,
    wire: (d) => { $('[data-x="keep"]', d).onclick = () => { closeDlg(); $('#ed')?.focus(); }; $('[data-x="discard"]', d).onclick = () => { closeDlg(true); onDiscard(); }; },
    focus: '[data-x="keep"]',
  });
}
function reviewSuggestion() {
  const e = S.edit; const nm = AG[e.agent].name.toLowerCase();
  const ops = diffLines(e.orig, e.text); const n = changed(ops);
  openDlg({
    title: `Suggest a change to the ${esc(nm)}`,
    body: n ? `<p class="sub">What changes <small>· ${ops.filter((o) => o[0] === '-').length} line${ops.filter((o) => o[0] === '-').length === 1 ? '' : 's'} out, ${ops.filter((o) => o[0] === '+').length} in</small></p>${diffHtml(ops)}
      <label class="sub" for="why" style="display:block;margin-top:22px">Why <small>(optional)</small></label><textarea class="field" id="why" placeholder="What went wrong? For example, which site and what it missed."></textarea>`
      : `<p class="say">You haven't changed anything yet. Go back to editing, change the text, then review it here.</p>`,
    foot: `<span class="note">It joins your suggested tweaks. <b>Nothing changes</b> in the ${esc(nm)} until you approve it.</span><button type="button" class="btn-g" data-x="back">Back to editing</button>${n ? '<button type="button" class="btn-p" data-x="add">Add to suggested tweaks</button>' : ''}`,
    wire: (d) => {
      $('[data-x="back"]', d).onclick = () => { closeDlg(); $('#ed')?.focus(); };
      const add = $('[data-x="add"]', d);
      if (add) add.onclick = () => {
        const why = $('#why', d).value.trim();
        const t = { id: 'local-' + (S.local.length + 1), local: true, agents: [e.agent], status: 'pending', title: `Your change to what the ${nm} does`, what: `${ops.filter((o) => o[0] === '-').length} line${ops.filter((o) => o[0] === '-').length === 1 ? '' : 's'} out, ${ops.filter((o) => o[0] === '+').length} in, in Claude's instructions.`, why: why || 'No reason given.', ops };
        S.local.push(t); S.edit = null; closeDlg(true);
        renderDoc(); renderTweaks(e.agent); renderNav();
        const el = $(`#twlist [data-tw="${t.id}"]`); if (el) { el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2000); $('button', el)?.focus({ preventScroll: true }); }
        toast('Added to suggested tweaks. Approve it here or on Decisions.');
      };
    },
    focus: n ? '#why' : '[data-x="back"]',
  });
}

// ---- tweak cards (concepts §2.4)
function renderTweaks(id) {
  const list = tweaksFor(id); const box = $('#twlist'); if (!box) return;
  $('#wait').classList.remove('slim');
  const n = pendingFor(id);
  $('#wait-h').innerHTML = `Waiting for you ${n ? `<span class="bdg">${n}</span>` : ''}`;
  if (!list.length) { box.innerHTML = '<p class="empty-line">Nothing waiting for this agent.</p>'; $('#wait').classList.add('slim'); return; }
  box.innerHTML = list.map((t) => {
    const st = t.local ? t.status : S.tweaks[t.id].status;
    if (st === 'approved') return `<p class="twdone" data-tw="${esc(t.id)}"><i class="ok">${I.check}</i><span><b>Approved just now</b> · Claude applies it in its next session<br>${esc(t.title)}</span></p>`;
    if (st === 'rejected') return `<p class="twdone" data-tw="${esc(t.id)}"><i class="no">${I.x}</i><span><b>Rejected</b> · ${esc(t.title)}</span></p>`;
    if (st === 'ruled') return `<p class="twdone" data-tw="${esc(t.id)}"><i class="ok">${I.check}</i><span><b>Put in your rules just now</b></span></p>`;
    return `<article class="twc" data-tw="${esc(t.id)}">${t.custom ? '<span class="forr">For your rules</span>' : ''}<h3>${esc(t.title)}</h3>
      <dl><dt>What changes</dt><dd>${esc(t.what)}</dd><dt>Why</dt><dd>${esc(t.why)}</dd></dl>
      <div class="twa">${t.custom ? '<button type="button" class="btn-p btn-s" data-a="rules">Put it in my rules</button>' : '<button type="button" class="btn-p btn-s" data-a="approve">Approve</button>'}<button type="button" class="btn-o btn-s" data-a="reject">Reject</button><button type="button" class="linkbtn" data-a="read">Read the full suggestion</button></div></article>`;
  }).join('');
  $$('.twc', box).forEach((c) => {
    const t = list.find((y) => y.id === c.dataset.tw);
    const set = (st, msg) => { if (t.local) t.status = st; else S.tweaks[t.id].status = st; renderTweaks(id); renderNav(); const el = $(`[data-tw="${CSS.escape(t.id)}"]`, box); el?.setAttribute('tabindex', '-1'); el?.focus(); live(msg); };
    $('[data-a="approve"]', c)?.addEventListener('click', () => set('approved', 'Approved. Claude applies it in its next session.'));
    $('[data-a="reject"]', c).addEventListener('click', () => set('rejected', 'Rejected.'));
    $('[data-a="read"]', c).addEventListener('click', () => openTweak(t));
    $('[data-a="rules"]', c)?.addEventListener('click', () => {
      const go2 = () => { S.edit = { fromTweak: t.id }; startEdit('custom', t.suggested); $('#doc').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); };
      if (dirty()) confirmDiscard(go2); else go2();
    });
  });
}
function openTweak(t) {
  if (t.local) {
    openDlg({ title: esc(t.title), size: 'wide', body: `<p class="sub">What changes</p>${diffHtml(t.ops)}<p class="sub" style="margin-top:20px">Why</p><p class="say">${esc(t.why)}</p>`, foot: `<button type="button" class="btn-p" data-x="close">Close</button>`, wire: (d) => { $('[data-x="close"]', d).onclick = () => closeDlg(); } });
    return;
  }
  openDlg({ title: esc(t.title), sub: 'The full suggestion, as written', size: 'wide', body: `<div class="prose">${md(t.md, { reading: true })}</div>`, foot: `<button type="button" class="btn-p" data-x="close">Close</button>`, wire: (d) => { $('[data-x="close"]', d).onclick = () => closeDlg(); } });
}
async function openReport(path, title) {
  openDlg({ title: esc(title), size: 'wide', body: '<p class="loading">Opening…</p>', foot: `<button type="button" class="btn-p" data-x="close">Close</button>`, wire: (d) => { $('[data-x="close"]', d).onclick = () => closeDlg(); } });
  let html;
  try {
    const r = await fetch('../../../' + path); if (!r.ok) throw new Error(r.status);
    html = `<div class="prose">${md(await r.text(), { reading: true })}</div>`;
  } catch {
    html = `<p class="say">This report opens when the dashboard is running. It is read from the project folder when you open it, not stored in this page.</p>`;
  }
  if ($('#dlg').open) $('#dlg-b').innerHTML = html;
}

// ---------------------------------------------------------------- popup (centred, white 80 % veil, ×, Esc, veil click)
let dlgReturn = null, dlgOnClose = null;
function openDlg({ title, sub, body, foot, wire, focus, size }) {
  const d = $('#dlg');
  d.className = 'pop' + (size ? ' ' + size : '');
  $('#dlg-t').innerHTML = title; const s = $('#dlg-s'); s.hidden = !sub; s.textContent = sub || '';
  $('#dlg-b').innerHTML = body; $('#dlg-f').innerHTML = foot || '';
  $('#dlg-b').scrollTop = 0;
  if (!d.open) { dlgReturn = document.activeElement; d.showModal(); }
  wire?.(d);
  (focus ? $(focus, d) : $('#dlg-x'))?.focus();
}
function closeDlg(keepFocus) { const d = $('#dlg'); if (d.open) d.close(); if (!keepFocus) dlgReturn?.focus?.(); }
$('#dlg').addEventListener('click', (e) => { if (e.target === e.currentTarget) { const r = e.currentTarget.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeDlg(); } });
$('#dlg-x').addEventListener('click', () => closeDlg());
$('#dlg').addEventListener('cancel', (e) => { e.preventDefault(); closeDlg(); });

let toastT;
function toast(text, action, fn, ms = 4000) {
  const e = $('#toast'); $('#toast-t').textContent = text; const b = $('#toast-b');
  b.hidden = !action; b.textContent = action || ''; b.onclick = action ? () => { e.classList.remove('on'); clearTimeout(toastT); fn(); } : null;
  e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), ms);
}

// ---------------------------------------------------------------- routing
let pendingOpts = null;
function go(hash, opts) { pendingOpts = opts || null; if (location.hash.slice(1) === hash) route(); else location.hash = hash; }
function route() {
  hideTip();
  const h = location.hash.slice(1).split('/');
  const opts = pendingOpts; pendingOpts = null;
  if (h[0] === 'agents' && h[1] && AG[h[1]]) {
    if (!$('#doc')) S.scroll = scrollY;
    detail(h[1], opts || {});
  } else {
    const was = !!$('#doc');
    if (was && S.edit && dirty()) { const keep = S.view.name; confirmDiscard(() => { S.edit = null; board(); scrollTo(0, S.scroll); }); history.replaceState(null, '', '#agents/' + keep); return; }
    S.view.name = null; S.edit = null;
    board();
    if (was) { scrollTo(0, S.scroll); }
  }
}
addEventListener('hashchange', route);
$('#menu-b').innerHTML = I.menu; $('#menu-x').innerHTML = I.x; $('#dlg-x').innerHTML = I.x;
$('#menu-b').addEventListener('click', () => $('#menu').showModal());
$('#menu-x').addEventListener('click', () => $('#menu').close());
$('#menu').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.closest('a')) $('#menu').close(); });
renderNav();
route();
})();
</script>
