<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneShot Agents</title>
<meta name="description" content="OneShot Agents, direction B (Board): every agent one row, ranked worst first, with each piece of its checked work drawn as a square; read and change each agent in place.">
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:block;src:url("__FONT__") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--read:#1B1530;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;--rule2:#EEF0F5;--hover:#F8F9FC;
  /* LOCKED 2026-09-27 (Shahar): purple lead, blue for links only. */
  --acc:#6A2FE0;--acc-d:#5A22CC;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;
  /* status only (concepts §1.3) */
  --red:#C0182B;--red-bg:#FDECEE;--amber:#9A5B00;--amber-bg:#FFF4E0;--green:#1A7F37;--green-bg:#EDF7F0;--grey:#8A93A3;
  --chip:#F3F4F8;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.05);
  --shadow-pop:0 32px 80px rgba(11,18,32,.18),0 2px 8px rgba(11,18,32,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;scroll-padding-top:24px}
body{margin:0;background:var(--ground);font-size:16px;line-height:1.5}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-weight:700}
.skip:focus{top:12px}

/* ---------- shell (as the Overview run leaves it) ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidecol{background:var(--card);border-right:1px solid var(--rule)}
.side{position:sticky;top:0;height:100vh;padding:28px 16px 20px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;padding:0 12px 36px;text-decoration:none;color:var(--ink)}
.mark{width:26px;height:26px;border-radius:8px;background:var(--acc);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:15px;text-decoration:none}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav svg{width:22px;height:22px}
.nav .badge{margin-left:auto;min-width:24px;height:24px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:18px 8px 0;border-top:1px solid var(--rule)}
.side-foot b{display:block;font-size:15px;font-weight:700}
.side-foot div span{display:block;font-size:14px;color:var(--ink3)}
.disc{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex:none;background:var(--acc);color:#fff}
.mtop{display:none}
main{min-width:0;padding:0 40px 72px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:32px 0 24px}
.top h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.lede{font-size:17px;color:var(--ink2);margin-top:8px;line-height:1.45}
.lede b{color:var(--ink);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9CA3AF;flex:none}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- summary strip (Logip) ---------- */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:24px 0}
.cell{padding:0 28px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:16px;align-items:center}
.cell+.cell{border-left:1px solid var(--rule)}
.cell .ic{grid-row:1/3;width:48px;height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center}
.cell .ic svg{width:22px;height:22px}
.cell .ic.r{background:var(--red-bg);color:var(--red)}
.cell .ic.p{background:var(--t5);color:var(--acc)}
.cell .ic.g{background:var(--chip);color:var(--ink2)}
.cell .lb{font-size:15px;font-weight:600;color:var(--ink2);display:flex;align-items:baseline;gap:10px}
.cell .row2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1.1}
.num.r{color:var(--red)}.num.p{color:var(--acc)}.num.g{color:var(--ink3)}
.cell small{font-size:15px;color:var(--ink2)}
.go-link{border:0;background:none;padding:6px 2px;color:var(--acc);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border-radius:8px}
.go-link:hover{text-decoration:underline;text-underline-offset:3px}
.go-link svg{width:16px;height:16px}

/* ---------- segmented control ---------- */
.segrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 16px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:#fff;box-shadow:var(--shadow);gap:2px}
.seg button{height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--t5);color:var(--acc);font-weight:700}
.segnote{font-size:15px;color:var(--ink2)}

/* ---------- board (Models) ---------- */
.board{padding:8px 24px 0}
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 0 14px}
.bhead h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.bhead p{font-size:15px;color:var(--ink2);margin-top:4px}
.grid-row{display:grid;grid-template-columns:248px 136px minmax(0,1fr) 88px 104px 32px;align-items:center}
.work{display:grid;grid-template-columns:minmax(0,1fr) 104px;row-gap:10px;align-items:center}
.thead{min-height:44px;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);font-size:14px;font-weight:600;color:var(--ink3)}
.thead .work{row-gap:0}
.thead .r{text-align:right;padding-right:16px}
.thead .c-step.thc{text-align:center;line-height:1.25;font-size:14px;font-weight:600}
.brow{position:relative;min-height:72px;padding:12px 0;border-bottom:1px solid var(--rule2)}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--hover);box-shadow:-24px 0 0 var(--hover),24px 0 0 var(--hover)}
.brow.two{min-height:88px}
.c-agent{display:flex;align-items:center;gap:14px;min-width:0;padding-right:16px}
.mono{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--ink2);font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.c-agent>div{min-width:0}
.nm{font-size:16px;font-weight:700;text-decoration:none;color:var(--ink);line-height:1.3}
.nm::after{content:"";position:absolute;inset:0;z-index:0}
.nm:focus-visible{outline:0}
.nm:focus-visible::after{outline:2px solid var(--acc);outline-offset:-2px;border-radius:12px}
.role{display:block;font-size:14px;font-weight:500;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.shared{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--ink2);margin-top:2px;line-height:1.3}
.shared svg{width:14px;height:14px;color:var(--ink3)}
.c-step{text-align:center;font-size:22px;font-weight:300}
.c-step .z,.c-tw .z{color:var(--ink3);font-size:18px}
.c-tw{display:flex;justify-content:center}
.c-go{display:flex;justify-content:flex-end;color:var(--ink3)}
.c-go svg{width:20px;height:20px}
.frac{text-align:right;padding-right:16px;line-height:1.1}
.frac b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.frac b.red{color:var(--red)}.frac b.amber{color:var(--amber)}.frac b.green{color:var(--green)}
.why{grid-column:1/-1;font-size:14px;color:var(--ink3);font-weight:500;margin-top:-2px;line-height:1.4}
.why b{color:var(--ink2);font-weight:600}
.why b.wr{color:var(--red);font-weight:700}
.brow .why{font-size:15px;color:var(--ink2)}
.frac small{display:block;font-size:14px;color:var(--ink3);font-weight:500;margin-top:2px}
code{font-family:inherit;font-size:.9em;font-weight:600;background:var(--chip);color:#2B2F3A;border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.frac .none{font-size:15px;color:var(--ink3);font-weight:500}
.meta{display:contents}
.meta .lab{display:none}
.brow .sq,.brow .tick,.brow .twpill,.brow .stripnote{position:relative;z-index:1}

/* state pills (concepts §1.3) */
.state{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;line-height:1}
.state i{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.state.red{background:var(--red);color:#fff}.state.red i{background:#fff;color:var(--red)}
.state.amber{background:var(--amber-bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--amber)}.state.amber i{background:var(--amber);color:#fff}
.state.green{background:var(--green);color:#fff}.state.green i{background:#fff;color:var(--green)}
.state.early{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--grey)}.state.early i{width:8px;height:8px;background:var(--grey);margin:0 4px}
.state.none{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--grey)}.state.none i{background:transparent;color:var(--ink2);font-size:15px}
.state.sm{height:26px;font-size:13px;padding:0 10px 0 8px;gap:5px}
.state.sm i{width:14px;height:14px;font-size:11px}
.state.sm.early i{width:7px;height:7px;margin:0 3px}

/* verdict strips (Sypher) */
.strip{display:flex;align-items:center;gap:8px;min-width:0}
.strip .kl{font-size:14px;color:var(--ink3);font-weight:600;width:64px;flex:none}
.sqs{display:flex;flex-wrap:wrap;align-items:center;gap:9px 3px}
.sq{width:12px;height:12px;border-radius:50%;background:var(--green);position:relative;flex:none;outline-offset:2px}
.sq.bad{background:var(--red);border-radius:2px}
.sq.ex{background:#fff;border-radius:2px;box-shadow:inset 0 0 0 2px var(--grey)}
.sq.step::before{content:"";position:absolute;left:4px;top:-7px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.sq:hover,.sq:focus-visible{transform:scale(1.25)}
.sq:focus-visible,.tick:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.tick{width:2px;height:20px;margin:-4px 0 0;border-radius:2px;background:var(--acc);flex:none;position:relative}
.tick::after{content:"";position:absolute;inset:-4px -6px}
.stripnote{font-size:14px;color:var(--ink3);font-weight:500;padding-top:2px}
.big .sqs{gap:8px 4px}
.big .sq{width:16px;height:16px}
.big .sq.bad,.big .sq.ex{border-radius:3px}
.big .sq.step::before{left:5px;top:-8px;width:6px;height:6px}
.big .tick{height:24px}

.twpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.twpill:hover{background:var(--acc-d)}
.bdg{min-width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}

/* legend */
.legend{border-top:1px solid var(--rule2);margin:0 -24px;padding:18px 24px 20px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 20px;background:#FBFCFE;border-radius:0 0 20px 20px}
.legend .li{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:14px;color:var(--ink2);line-height:1.4}
.legend .keys{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 24px;padding-top:12px;border-top:1px dashed var(--rule)}
.legend .k{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.legend .k .sq:hover{transform:none}
.legend .rule{font-size:14px;color:var(--ink3)}

/* no-signal grid */
.nosig{margin-top:40px}
.nosig h2{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.count{min-width:28px;height:26px;border-radius:999px;background:#E9ECF2;color:var(--ink2);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
.nosig>p{font-size:15px;color:var(--ink2);margin-top:6px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.ncard{display:flex;flex-direction:column;gap:10px;min-height:128px;padding:18px 18px 16px;border-radius:16px;background:#fff;box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative}
.ncard:hover{box-shadow:0 1px 2px rgba(11,18,32,.05),0 12px 28px rgba(11,18,32,.08)}
.ncard .nh{display:flex;align-items:flex-start;gap:12px}
.ncard .nh>div{min-width:0;flex:1}
.ncard b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.ncard .role{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ncard .mono{width:36px;height:36px;font-size:13px;border-radius:10px}
.ncard .bdg{position:absolute;right:14px;top:14px}
.nf{font-size:14px;font-weight:600;color:var(--ink);display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.nf svg{width:16px;height:16px;color:var(--ink3);margin-top:1px}
.nl{font-size:14px;color:var(--ink3);margin-top:auto}

/* ---------- detail page ---------- */
.backlink{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 8px;margin:24px 0 0 -8px;border-radius:12px;font-size:15px;font-weight:700;color:var(--ink2);text-decoration:none}
.backlink:hover{background:#fff;color:var(--ink)}
.backlink svg{width:18px;height:18px}
.dhead{display:flex;gap:20px;align-items:flex-start;padding:16px 0 28px}
.dhead .mono{width:64px;height:64px;border-radius:18px;font-size:20px}
.dt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dt h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.drole{font-size:17px;color:var(--ink2);margin-top:6px}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px}
.sharedbtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px 6px 12px;line-height:1.3;text-align:left;border-radius:18px;border:1.5px solid var(--rule);background:#fff;font-size:14px;font-weight:700;color:var(--ink)}
.sharedbtn:hover{border-color:var(--t3);background:var(--t5)}
.sharedbtn svg{width:16px;height:16px;color:var(--acc)}
.changed{font-size:15px;color:var(--ink2);line-height:1.5;max-width:72ch}
.changed b{color:var(--ink);font-weight:700}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:24px;align-items:start}
.doc{min-width:0}
.tabs{position:sticky;top:0;z-index:5;background:#fff;border-radius:20px 20px 0 0;padding:16px 24px 0;border-bottom:1px solid var(--rule2)}
.tablist{display:flex;gap:4px;flex-wrap:wrap}
.tab{position:relative;height:48px;padding:0 16px;border:0;background:transparent;font-size:16px;font-weight:600;color:var(--ink2);border-radius:12px 12px 0 0;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink);background:var(--ground)}
.tab[aria-selected="true"]{color:var(--acc);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
.tab svg{width:16px;height:16px}
.tab .dotp{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.morewrap{position:relative}
.moremenu{position:absolute;left:0;top:52px;min-width:240px;background:#fff;border-radius:14px;box-shadow:var(--shadow-pop),0 0 0 1px var(--rule);padding:6px;z-index:10}
.moremenu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700}
.moremenu button small{font-size:14px;font-weight:500;color:var(--ink3)}
.moremenu button:hover,.moremenu button:focus-visible{background:var(--ground)}
.tabline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 40px;border-bottom:1px solid var(--rule2);background:#FBFCFE}
.tabline p{font-size:15px;color:var(--ink2);line-height:1.45}
.tabline p svg{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px;color:var(--ink3)}
.docbody{padding:32px 40px 48px}

.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.btn-p:hover{background:var(--acc-d)}
.btn-p svg{width:18px;height:18px}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--rule);background:#fff;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn-o:hover{border-color:var(--t3);background:var(--t5)}
.btn-o svg{width:18px;height:18px;color:var(--acc)}
.btn-o.danger{color:var(--red)}
.btn-o.danger:hover{border-color:#F2C9CE;background:#FFF7F8}
.btn-g{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn-g:hover{background:var(--ground)}
.btn-g svg{width:16px;height:16px}
.btn-s{height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.linkbtn{border:0;background:none;padding:4px 2px;color:var(--acc);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;border-radius:6px}

/* reading type (concepts §2.2) */
.prose{font-size:18px;line-height:1.65;color:var(--read);max-width:70ch}
.prose>*+*{margin-top:18px}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5{color:var(--read);font-weight:700;letter-spacing:-.015em;line-height:1.3}
.prose h1{font-size:28px;margin-top:40px}
.prose h2{font-size:28px;margin-top:48px}
.prose h3{font-size:22px;margin-top:36px}
.prose h4,.prose h5{font-size:19px;margin-top:28px}
.prose>:first-child{margin-top:0}
.prose ul,.prose ol{padding-left:26px}
.prose ul{list-style:disc}.prose ol{list-style:decimal}
.prose li{padding-left:4px}
.prose li+li{margin-top:8px}
.prose li>ul,.prose li>ol{margin-top:8px}
.prose li::marker{color:var(--ink3)}
.prose strong{font-weight:700;color:var(--ink)}
.prose a{color:var(--blue);font-weight:600;text-underline-offset:3px;overflow-wrap:anywhere}
.prose code{font-family:inherit;font-size:.86em;font-weight:600;background:var(--chip);color:#2B2F3A;border-radius:6px;padding:2px 7px;overflow-wrap:break-word;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.prose .fence{white-space:pre-wrap;background:var(--chip);border-radius:12px;padding:16px 20px;font-size:15px;line-height:1.6;color:#2B2F3A;overflow-wrap:anywhere}
.prose blockquote{margin:0;padding:4px 0 4px 20px;border-left:3px solid var(--t3);color:var(--ink2)}
.prose hr{border:0;border-top:1px solid var(--rule);margin:32px 0}
.prose .tw{overflow-x:auto;margin-left:-4px;margin-right:-4px}
.prose table{border-collapse:collapse;font-size:16px;line-height:1.5;width:100%;min-width:480px}
.prose th{text-align:left;font-weight:700;color:var(--ink);padding:10px 12px;border-bottom:1.5px solid var(--rule);vertical-align:bottom}
.prose td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.prose details.how{border-radius:14px;background:var(--ground);padding:0}
.prose details.how summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:16px;font-weight:700;color:var(--ink)}
.prose details.how summary::-webkit-details-marker{display:none}
.prose details.how summary svg{width:18px;height:18px;color:var(--ink3);transition:transform .15s}
.prose details.how[open] summary svg{transform:rotate(90deg)}
.prose details.how .in{padding:0 18px 16px;font-size:16px;color:var(--ink2)}

/* empty "Your rules" */
.empty-rules{display:flex;gap:20px;align-items:flex-start;padding:28px;border-radius:16px;background:var(--ground);max-width:640px}
.empty-rules .ic{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--acc);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.empty-rules .ic svg{width:24px;height:24px}
.empty-rules h3{font-size:19px;font-weight:700}
.empty-rules p{font-size:16px;color:var(--ink2);margin-top:6px;line-height:1.6}
.empty-rules .btn-p{margin-top:18px}

/* history */
.hist{max-width:70ch}
.hist li{display:grid;grid-template-columns:108px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--rule2)}
.hist li:first-child{padding-top:0}
.hist time{font-size:15px;font-weight:700;color:var(--ink);padding-top:2px}
.hist time small{display:block;font-size:14px;font-weight:500;color:var(--ink3);margin-top:2px}
.hist .prose{font-size:17px}
.hist .vt{display:inline-block;margin-left:8px;font-size:14px;color:var(--ink3);font-weight:600;white-space:nowrap}
.hist .newest{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--t5);color:var(--acc);font-size:13px;font-weight:700;margin-bottom:6px}

/* editor (concepts §2.3) */
.editor{display:flex;flex-direction:column}
.edbanner{display:flex;gap:12px;align-items:flex-start;background:var(--t5);color:var(--acc);border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;line-height:1.5;margin-bottom:20px}
.edbanner svg{width:20px;height:20px;margin-top:1px}
.edtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.edtop .seg{box-shadow:none;background:var(--ground)}
.edtop .seg button{height:36px;font-size:14px}
.edtop .seg button[aria-checked="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(11,18,32,.08)}
.edtop .what{font-size:14px;color:var(--ink3);font-weight:600}
textarea.ed{width:100%;min-height:calc(17px*1.6*12 + 40px);border:1.5px solid var(--rule);border-radius:14px;padding:18px 20px;font-size:17px;line-height:1.6;background:#fff;color:var(--read);resize:none;overflow:hidden}
textarea.ed:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.edprev{border:1.5px dashed var(--rule);border-radius:14px;padding:24px;min-height:200px}
.pcopy{font-size:14px;color:var(--ink3);margin-top:10px;display:flex;align-items:center;gap:6px}
.pcopy svg{width:14px;height:14px}
.edfoot{position:sticky;bottom:0;z-index:4;margin:20px -40px -48px;padding:14px 40px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--rule2);border-radius:0 0 20px 20px;display:flex;align-items:center;gap:12px}
.edfoot .hint{flex:1;font-size:14px;color:var(--ink2);line-height:1.45}
.diffpanel{border-radius:14px;border:1.5px solid var(--rule);margin-bottom:16px;overflow:hidden}
.diffpanel>p{font-size:14px;font-weight:700;color:var(--ink2);padding:10px 16px;background:var(--ground)}

/* diff (popup and panels) */
.diff{font-size:16px;line-height:1.55;border-radius:12px;overflow:hidden}
.diff .ln{padding:5px 14px 5px 36px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2)}
.diff .ln::before{position:absolute;left:14px;top:5px;font-weight:800}
.diff .add{background:var(--green-bg);color:#14652C}
.diff .add::before{content:"+";color:#14652C}
.diff .del{background:var(--red-bg);color:#A3142A;text-decoration:line-through;text-decoration-thickness:1px}
.diff .del::before{content:"−";color:#A3142A}
.diff .gap{color:var(--ink3);font-size:14px;padding:4px 14px 4px 36px;background:#FBFCFE}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.rcard{padding:22px 22px 20px}
.rcard h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rcard h3.k{font-size:14px;font-weight:700;color:var(--ink3);margin:18px 0 8px}
.how .part+.part{margin-top:18px;padding-top:18px;border-top:1px solid var(--rule2)}
.how p{font-size:15px;color:var(--ink2);line-height:1.55}
.how p+p{margin-top:8px}
.how p b{color:var(--ink);font-weight:700}
.how .bigline{font-size:17px;color:var(--ink);line-height:1.45}
.how .reason{color:var(--ink);background:var(--ground);border-radius:12px;padding:10px 12px;margin-top:10px}
.how .reason b{color:var(--ink)}
.how .bigline b.red{color:var(--red)}.how .bigline b.amber{color:var(--amber)}
.how .strip{margin:12px 0 6px}
.how .quote{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ground);font-size:15px;color:var(--ink2);line-height:1.5}
.how .quote b{color:var(--ink)}
.empty-line{font-size:15px;color:var(--ink3)}
.rcard.slim{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.rcard.slim h2{margin:0}
.twc{border-radius:16px;border:1.5px solid var(--rule);padding:16px 16px 14px;scroll-margin-top:24px}
.twc+.twc{margin-top:12px}
.twc.flash{border-color:var(--acc);box-shadow:0 0 0 4px var(--t5)}
.twc .forr{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--t5);color:var(--acc);font-size:13px;font-weight:700;margin-bottom:8px}
.twc h3{font-size:17px;font-weight:700;line-height:1.35}
.twc dl{margin-top:10px}
.twc dt{font-size:14px;font-weight:700;color:var(--ink3);margin-top:8px}
.twc dd{font-size:15px;color:var(--ink2);line-height:1.5;margin-top:2px}
.twa{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px}
.twdone{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);padding:12px 14px;border-radius:12px;background:var(--ground)}
.twdone+.twc,.twc+.twdone,.twdone+.twdone{margin-top:12px}
.twdone i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.twdone i.ok{background:var(--green-bg);color:var(--green)}
.twdone i.no{background:#EEF0F4;color:var(--ink2)}
.twdone i svg{width:14px;height:14px}
.twdone b{color:var(--ink);font-weight:700}
.sb{padding:14px 0;border-top:1px solid var(--rule2)}
.sb:first-of-type{border-top:0;padding-top:4px}
.sbh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sbh b{font-size:16px;font-weight:700;line-height:1.35}
.sbh span{font-size:14px;color:var(--ink3);white-space:nowrap}
.sbn{font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.sbn em{font-style:normal;color:var(--red)}
.sbq{font-size:15px;color:var(--ink2);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sba{display:flex;flex-wrap:wrap;gap:0;margin:6px 0 0 -8px}
.sba .btn-g{height:40px;padding:0 8px;font-size:15px;gap:2px}
.sba .btn-g.rd{color:var(--acc)}
.keptline{font-size:14px;color:var(--ink3);padding-top:12px;border-top:1px solid var(--rule2);line-height:1.5}

/* ---------- popup ---------- */
dialog.pop{width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:20px;background:#fff;color:var(--ink);box-shadow:var(--shadow-pop),0 0 0 1px var(--rule);overflow:hidden}
dialog.pop.sm{width:min(480px,calc(100vw - 32px))}
dialog.pop.wide{width:min(880px,calc(100vw - 32px))}
dialog.pop[open]{display:flex;flex-direction:column}
dialog.pop::backdrop{background:rgba(255,255,255,.8);backdrop-filter:blur(2px)}
.phd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 20px 0 28px}
.phd h2{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.01em;padding-top:6px}
.phd p{font-size:15px;color:var(--ink2);margin-top:4px}
.x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.x:hover{background:var(--ground);color:var(--ink)}
.x svg{width:20px;height:20px}
.pb{padding:20px 28px 0;overflow:auto;flex:1}
.pb .sub{font-size:15px;font-weight:700;margin:4px 0 10px}
.pb .sub small{font-weight:500;color:var(--ink3)}
.pb .say{font-size:16px;color:var(--ink2);line-height:1.6}
.pb .diff{border:1.5px solid var(--rule)}
.field{width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;line-height:1.5}
.field:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
textarea.field{min-height:104px;resize:vertical}
.pfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:20px 28px 24px;flex-wrap:wrap}
.pfoot .note{flex:1;min-width:200px;font-size:14px;color:var(--ink2)}
.pfoot .note b{color:var(--ink)}
.warn{font-size:15px;color:var(--red);font-weight:600;margin-top:10px}
.loading{font-size:16px;color:var(--ink3);padding:20px 0}

/* tooltip */
.tip{position:fixed;z-index:80;max-width:340px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;pointer-events:none;box-shadow:var(--shadow-pop);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tk{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tip .tk i{width:10px;height:10px;border-radius:3px;background:var(--green)}
.tip .tk i{border-radius:50%}
.tip .tk i.bad{background:#FF6B7D;border-radius:2px}
.tip .tk i.ex{background:transparent;border-radius:2px;box-shadow:inset 0 0 0 2px #C9CFDB}
.tip .tm{color:#C9CFDB}
.tip .ts{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.16);color:#E1D5F9}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 20px;font-size:15px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:var(--shadow-pop);transition:opacity .2s,transform .2s;pointer-events:none;z-index:90;display:flex;align-items:center;gap:16px;min-height:52px}
.edit-on .toast{bottom:96px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:36px;padding:0 14px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:700}
.toast button:hover{background:rgba(255,255,255,.24)}
.toast button:focus-visible{outline-color:#fff}

/* ---------- 1024 band: icon rail ---------- */
@media (max-width:1279px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:24px 12px 16px;align-items:center}
  .sidecol{width:72px}
  .logo{padding:0 0 28px}
  .logo span,.nav a span:not(.badge),.side-foot div{display:none}
  .nav a{width:48px;justify-content:center;padding:0;position:relative}
  .nav .badge{position:absolute;right:-4px;top:2px;min-width:20px;height:20px;font-size:12px;padding:0 6px}
  .side-foot{padding:16px 0 0;border:0}
  main{padding:0 32px 56px}
  .cell{padding:0 22px;column-gap:14px}
  .cell .ic{width:44px;height:44px}
  .board{padding:4px 20px 0}
  .legend{margin:0 -20px;padding:16px 20px 18px;grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-row{grid-template-columns:232px 136px minmax(0,1fr) 40px}
  .grid-row.thead .c-step,.grid-row.thead .c-tw{display:none}
  .brow{grid-template-rows:auto auto;row-gap:8px}
  .brow .c-agent,.brow .c-state,.brow .c-go{grid-row:1/3}
  .brow .work{grid-column:3;grid-row:1}
  .meta{display:flex;grid-column:3;grid-row:2;align-items:center;gap:16px;flex-wrap:wrap}
  .meta .c-step{font-size:15px;font-weight:600;text-align:left;color:var(--ink2)}
  .meta .c-step .z{font-size:15px}
  .meta .lab{display:inline;font-weight:500;color:var(--ink3)}
  .meta .c-tw{justify-content:flex-start}
  .meta .c-tw .z{display:none}
  .meta .nost{display:none}
  .brow .meta.empty{display:none}
  .brow:hover{box-shadow:-20px 0 0 var(--hover),20px 0 0 var(--hover)}
  .dgrid{grid-template-columns:minmax(0,1fr) 312px}
  .tabline,.docbody{padding-left:28px;padding-right:28px}
  .tabs{padding:12px 16px 0}
  .tab{padding:0 12px;font-size:15px}
  .edfoot{margin:20px -28px -48px;padding:14px 28px}
  .rcard{padding:20px 18px 18px}
}
@media (min-width:640px) and (max-width:1279px){
  .brow:has(.meta.empty) .work{grid-row:1/3}
}
@media (min-width:1600px){
  .grid-row{grid-template-columns:340px 160px minmax(0,1fr) 120px 120px 40px}
  .work{grid-template-columns:minmax(0,560px) 120px;justify-content:start}
  .dgrid{grid-template-columns:minmax(0,1fr) 440px}
  .docbody,.tabline{padding-left:56px;padding-right:56px}
  .edfoot{margin-left:-56px;margin-right:-56px;padding-left:56px;padding-right:56px}
}
@media (min-width:1280px){
  .rail{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;padding:2px 4px 4px;margin:-2px -4px 0;scrollbar-width:thin}
}

/* ---------- 390 band ---------- */
@media (max-width:639px){
  .app{display:block}
  .sidecol{display:none}
  .mtop{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 16px;background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
  .mtop .logo{padding:0}
  .mtop .logo span{display:none}
  .mtop .where{font-size:17px;font-weight:700;flex:1}
  .menu-b{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
  .menu-b svg{width:24px;height:24px}
  main{padding:0 16px 48px}
  .top{flex-direction:column;align-items:flex-start;gap:12px;padding:24px 0 18px}
  .top h1{font-size:28px}
  .lede{font-size:16px}
  .summary{grid-template-columns:minmax(0,1fr);padding:4px 0}
  .cell{padding:14px 18px;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto}
  .cell+.cell{border-left:0;border-top:1px solid var(--rule)}
  .cell .ic{width:40px;height:40px;border-radius:12px}
  .cell .row2{display:contents}
  .cell .num{grid-column:3;grid-row:1/3;font-size:32px}
  .cell .lb{grid-column:2;grid-row:1}
  .cell .row2>small,.cell .row2>.go-link{grid-column:2;grid-row:2;justify-self:start}
  .segrow{flex-direction:column;align-items:stretch;gap:10px;margin:20px 0 12px}
  .seg{display:grid;grid-template-columns:1fr 1fr}
  .seg button{white-space:normal;height:auto;min-height:44px;padding:6px 10px;line-height:1.25;font-size:14px}
  .board{padding:0;background:transparent;box-shadow:none}
  .bhead{padding:8px 0 12px}
  .thead{display:none}
  .brow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:none;gap:12px;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px 16px 16px;margin-bottom:12px;border:0}
  .brow:hover{box-shadow:var(--shadow)}
  .brow .c-agent{grid-row:auto;grid-column:1/-1;padding-right:0}
  .brow .c-state{grid-row:auto;grid-column:1/-1}
  .brow .c-go{display:none}
  .brow .work{grid-column:1/-1;grid-row:auto;grid-template-columns:minmax(0,1fr) auto}
  .brow .strip{flex-direction:column;align-items:flex-start;gap:4px}
  .brow .sqs{max-width:300px}
  .meta{grid-column:1/-1;grid-row:auto}
  .legend{margin:12px 0 0;border-radius:20px;grid-template-columns:minmax(0,1fr);box-shadow:var(--shadow);background:#fff;border:0}
  .ngrid{grid-template-columns:minmax(0,1fr);gap:10px}
  .ncard{min-height:0;padding:14px 16px}
  .ncard .nf{display:none}
  .ncard .role{-webkit-line-clamp:1}
  .ncard .nl{margin-top:0}
  .dhead{gap:14px;padding:12px 0 20px}
  .dhead .mono{width:48px;height:48px;font-size:16px;border-radius:14px}
  .dt h1{font-size:26px}
  .dgrid{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{order:-1}
  .tabs{padding:8px 8px 0;overflow-x:auto;top:56px}
  .edit-on .toast{bottom:150px}
  .tablist{flex-wrap:nowrap}
  .tab{height:44px;padding:0 10px;font-size:15px;white-space:nowrap}
  .tabline{flex-direction:column;align-items:stretch;padding:14px 18px}
  .tabline .btn-o,.tabline .btn-p{width:100%}
  .docbody{padding:24px 18px 32px}
  .prose{font-size:17px}
  .prose h2{font-size:24px}
  .prose h3{font-size:20px}
  .edfoot{margin:20px -18px -32px;padding:12px 18px;flex-wrap:wrap}
  .edfoot .hint{flex-basis:100%}
  .edfoot .btn-p{flex:1}
  .hist li{grid-template-columns:minmax(0,1fr);gap:6px}
  dialog.pop{max-height:calc(100vh - 24px)}
  .phd{padding:20px 12px 0 20px}
  .pb{padding:16px 20px 0}
  .pfoot{padding:16px 20px 20px;flex-direction:column-reverse;align-items:stretch}
  .pfoot .btn-p,.pfoot .btn-o,.pfoot .btn-g{width:100%;justify-content:center}
}
dialog.menu{margin:0 0 0 auto;height:100vh;max-height:none;width:min(300px,85vw);border:0;padding:20px 16px;background:#fff;box-shadow:var(--shadow-pop)}
dialog.menu::backdrop{background:rgba(255,255,255,.8)}
dialog.menu .nav a span{display:inline}
dialog.menu .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-weight:800;font-size:18px}

@media (prefers-reduced-motion:no-preference){
  dialog.pop[open]{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
  .sqs.draw .sq{animation:sqin .32s ease-out backwards}
  @keyframes sqin{from{opacity:0;transform:scale(.4)}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<div id="live" class="sr" aria-live="polite"></div>

<div class="app">
<div class="sidecol"><aside class="side" aria-label="Views">

</aside></div>

<div>
<header class="mtop">

function inline(s) {

function diffLines(a, b) {

}

      h += `<div class="sb"><div class="sbh"><b>${esc(g.name)}</b><span>${esc(runN(g.run))}</span></div><p class="sbn">${head}</p><p class="sbq" title="${esc(last.full || last.text)}">${esc(q)}</p><div class="sba"><a class="btn-g" href="${pipeHref(g.slug)}">Open in Pipeline ${I.chev}</a>${read}</div></div>`;
    }
    if (kept.length) h += `<p class="keptline">${p.j.kind === 'shortlist' ? 'Went on' : p.j.kind === 'mock' ? 'Picked first time' : p.j.kind === 'build' ? 'Never sent back for its own work' : 'Kept first time'}: ${kept.map((g) => esc(g.name)).join(', ')}.</p>`;
    if (notc.length) h += `<p class="keptline">Not counted against the ${esc(AG[id].name.toLowerCase())}: ${notc.map((g) => `${esc(g.name)} (${p.j.kind === 'shortlist' ? 'you dropped it' : `${g.v.filter((y) => y.excluded).length} rounds sent back for copy`})`).join(', ')}.</p>`;
  }
  return `<section class="card rcard" aria-labelledby="sb-h"><h2 id="sb-h">Where it was ${x.parts.every((p) => p.j.kind === 'shortlist') ? 'dropped' : 'sent back'}</h2>${h}</section>`;
}

// ---- the document column
function renderDoc() {
  const id = S.view.name; const a = AG[id]; const tab = S.view.tab; const nm = a.name.toLowerCase();
  const tabs = ['base', 'custom', 'history'].map((t) => `<button type="button" role="tab" class="tab" id="tab-${t}" aria-selected="${tab === t}" aria-controls="tabpanel" tabindex="${tab === t ? 0 : -1}" data-tab="${t}">${TABS[t].label}${t === 'custom' && !a.customEmpty && !S.custom[id] ? '' : ''}</button>`).join('')
    + `<span class="morewrap"><button type="button" role="tab" class="tab" id="tab-more" aria-selected="${tab === 'more'}" aria-controls="tabpanel" tabindex="${tab === 'more' ? 0 : -1}" aria-haspopup="menu" aria-expanded="false" data-tab="more">${tab === 'more' ? MORE[S.view.more][0] : 'More'}${I.down}</button><div class="moremenu" role="menu" hidden>${Object.entries(MORE).map(([k, [l, s]]) => `<button type="button" role="menuitem" data-more="${k}">${l}<small>${s}</small></button>`).join('')}</div></span>`;
  let action = '';
  const editing = S.edit && S.edit.agent === id;
  document.body.classList.toggle('edit-on', !!editing);
  if (!editing) {
    if (tab === 'base') action = `<button type="button" class="btn-o" id="act">${I.pen}Suggest a change</button>`;
    if (tab === 'custom' && !customEmpty(id)) action = `<button type="button" class="btn-p" id="act">${I.pen}Edit your rules</button>`;
  }
  const line = tab === 'more' ? `${MORE[S.view.more][1]}. ${TABS.more.line}` : TABS[tab].line;
  $('#doc').innerHTML = `<div class="tabs"><div class="tablist" role="tablist" aria-label="${esc(a.name)}'s files">${tabs}</div></div>
    <div class="tabline"><p>${TABS[tab].ic}${esc(line)}</p>${action}</div>
    <div class="docbody" id="tabpanel" role="tabpanel" aria-labelledby="tab-${tab}">${editing ? editorHtml() : docHtml()}</div>`;
  const tl = $('.tablist');
  $$('[data-tab]', tl).forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.tab === 'more') { toggleMore(); return; }
    switchTab(b.dataset.tab);
  }));
  tl.addEventListener('keydown', (e) => {
    const T = $$('[role="tab"]', tl); const k = T.indexOf(document.activeElement); if (k < 0) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); T[(k + (e.key === 'ArrowRight' ? 1 : T.length - 1)) % T.length].focus(); }
  });
  $$('[data-more]').forEach((b) => b.addEventListener('click', () => { S.view.more = b.dataset.more; toggleMore(false); switchTab('more'); }));
  $('#act')?.addEventListener('click', () => startEdit(tab === 'base' ? 'base' : 'custom'));
  $('#first-rule')?.addEventListener('click', () => startEdit('custom'));
  if (editing) wireEditor();
}
function switchTab(t) {
  if (S.edit && S.edit.agent === S.view.name && S.edit.file !== t) {
    if (dirty()) { confirmDiscard(() => { S.edit = null; S.view.tab = t; renderDoc(); $(`#tab-${t}`).focus(); }); return; }
    S.edit = null;
  }
  S.view.tab = t; renderDoc(); $(`#tab-${t}`)?.focus();
}
function toggleMore(force) {
  const m = $('.moremenu'); const b = $('#tab-more'); const open = force ?? m.hidden;
  m.hidden = !open; b.setAttribute('aria-expanded', open);
  if (open) {
    $('button', m).focus();
    const close = (e) => { if (!e.target.closest('.morewrap')) { toggleMore(false); document.removeEventListener('click', close, true); } };
    setTimeout(() => document.addEventListener('click', close, true));
    m.onkeydown = (e) => {
      const B = $$('button', m); const k = B.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.stopPropagation(); toggleMore(false); b.focus(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); B[(k + 1) % B.length].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); B[(k + B.length - 1) % B.length].focus(); }
    };
  }
}
const customEmpty = (id) => !customBody(customOf(id)).trim();
function docHtml() {
  const id = S.view.name; const a = AG[id]; const nm = a.name.toLowerCase();
  if (S.view.tab === 'base') return `<div class="prose">${md(F[id].base, { reading: true })}</div>`;
  if (S.view.tab === 'custom') {
    if (customEmpty(id)) return `<div class="empty-rules"><span class="ic">${I.you}</span><div><h3>No rules of yours yet</h3><p>You haven't written any rules for the ${esc(nm)} yet. Your rules are your taste and house style. The ${esc(nm)} reads them on every run, right after Claude's instructions.</p><button type="button" class="btn-p" id="first-rule">${I.plus}Write your first rule</button></div></div>`;
    return `<div class="prose">${md(customBody(customOf(id)), { reading: true })}</div>`;
  }
  if (S.view.tab === 'history') {
    return `<ol class="hist">${a.history.map((e, k) => `<li><time datetime="${e.date}">${day(e.date)}<small>${e.date.slice(0, 4)}</small></time><div>${k === 0 ? '<span class="newest">Current</span>' : ''}<div class="prose">${md(e.text)}</div><span class="vt">${e.file ? `${esc((MORE[e.file] || [e.file])[0])} · version ${esc(e.v.replace(/^\S+\s/, ''))}` : `version ${esc(e.v)}`}</span></div></li>`).join('')}</ol>`;
  }
  const src = F[id][S.view.more];
  return src ? `<div class="prose">${md(src, { reading: true })}</div>` : `<p class="empty-line">Nothing written here yet.</p>`;
}

// ---- editing (concepts §2.3): Your rules save straight away; Claude's file becomes a suggested tweak
function startEdit(file, preset) {
  const id = S.view.name;
  const orig = file === 'base' ? F[id].base : customBody(customOf(id));
  S.edit = { agent: id, file, orig, text: preset ?? orig, mode: 'write', fromTweak: preset != null ? S.edit?.fromTweak : null };
  if (S.view.tab !== file) S.view.tab = file;
  renderDoc();
  const ta = $('#ed'); if (ta) { ta.focus(); ta.setSelectionRange(file === 'custom' && !orig ? 0 : 0, 0); }
}
const dirty = () => S.edit && S.edit.text !== S.edit.orig;
function editorHtml() {
  const e = S.edit; const a = AG[e.agent]; const nm = a.name.toLowerCase();
  const banner = e.file === 'base' ? `<div class="edbanner">${I.claude}<span>Claude writes this file. What you change becomes a suggested tweak. Nothing changes until you approve it.</span></div>` : '';
  const ops = e.fromTweak ? diffLines(e.orig, e.text) : null;
  const panel = ops ? `<div class="diffpanel"><p>The suggested text is in place below. Changed lines, highlighted:</p>${diffHtml(ops, 0)}</div>` : '';
  const hint = e.file === 'base' ? `Your change goes to suggested tweaks for you to approve. The ${esc(nm)}'s instructions stay as they are until then.` : `Saves to your rules right away. The ${esc(nm)} uses them from its next run.`;
  return `<div class="editor">${banner}${panel}
    <div class="edtop"><div class="seg" role="radiogroup" aria-label="Editor view"><button type="button" role="radio" aria-checked="${e.mode === 'write'}" data-em="write">Write</button><button type="button" role="radio" aria-checked="${e.mode === 'preview'}" data-em="preview">Preview</button></div><span class="what">${e.file === 'base' ? 'Editing what it does' : 'Editing your rules'}</span></div>
    ${e.mode === 'write' ? `<label class="sr" for="ed">${e.file === 'base' ? `The ${esc(nm)}'s instructions` : `Your rules for the ${esc(nm)}`}</label><textarea class="ed" id="ed" spellcheck="true" placeholder="${e.file === 'custom' ? `One rule per line or paragraph, in plain words. For example: “Never use orange as a background.”` : ''}">${esc(e.text)}</textarea>` : `<div class="edprev prose">${e.text.trim() ? md(e.text, { reading: e.file === 'base' }) : '<p class="empty-line">Nothing written yet.</p>'}</div>`}
    <p class="pcopy">${I.info}Preview copy: changes stay on this page.</p>
    <div class="edfoot"><span class="hint">${hint}</span><button type="button" class="btn-g" id="ed-cancel">Cancel</button><button type="button" class="btn-p" id="ed-save">${e.file === 'base' ? 'Review my suggestion' : 'Save'}</button></div>
  </div>`;
}
function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 4 + 'px'; }
function wireEditor() {
  const ta = $('#ed');
  if (ta) { grow(ta); ta.addEventListener('input', () => { S.edit.text = ta.value; grow(ta); }); }
  $$('[data-em]').forEach((b) => b.addEventListener('click', () => { S.edit.mode = b.dataset.em; renderDoc(); $(`[data-em="${S.edit.mode}"]`).focus(); }));
  $('#ed-cancel').addEventListener('click', () => { if (dirty()) confirmDiscard(() => { S.edit = null; renderDoc(); $('#act, #first-rule')?.focus(); }); else { S.edit = null; renderDoc(); $('#act, #first-rule')?.focus(); } });
  $('#ed-save').addEventListener('click', () => (S.edit.file === 'base' ? reviewSuggestion() : saveRules()));
}
function saveRules() {
  const e = S.edit; const id = e.agent; const before = S.custom[id];
  const head = customHead(F[id].custom || '');
  S.custom[id] = (head ? head + '\n' : '') + e.text.replace(/\s+$/, '') + '\n';
  const tw = e.fromTweak;
  if (tw) S.tweaks[tw].status = 'ruled';
  S.edit = null;
  renderDoc(); renderTweaks(id); renderNav();
  $('#act')?.focus();
  toast('Saved to your rules.', 'Undo', () => {
    if (before === undefined) delete S.custom[id]; else S.custom[id] = before;
    if (tw) S.tweaks[tw].status = 'pending';
    if (S.view.name === id) { renderDoc(); renderTweaks(id); renderNav(); }
    toast('Your rules are back as they were.');
  }, 10000);
}
function confirmDiscard(onDiscard) {
  const e = S.edit; const nm = AG[e.agent].name.toLowerCase();
  openDlg({
    title: 'Discard your changes?', size: 'sm',
    body: `<p class="say">${e.file === 'custom' ? `Your edits to the ${esc(nm)}'s rules are not saved.` : `Your suggested change to the ${esc(nm)} is not saved.`}</p>`,
    foot: `<button type="button" class="btn-o danger" data-x="discard">Discard</button><button type="button" class="btn-p" data-x="keep">Keep editing</button>`,
    wire: (d) => { $('[data-x="keep"]', d).onclick = () => { closeDlg(); $('#ed')?.focus(); }; $('[data-x="discard"]', d).onclick = () => { closeDlg(true); onDiscard(); }; },
    focus: '[data-x="keep"]',
  });
}
function reviewSuggestion() {
  const e = S.edit; const nm = AG[e.agent].name.toLowerCase();
  const ops = diffLines(e.orig, e.text); const n = changed(ops);
  openDlg({
    title: `Suggest a change to the ${esc(nm)}`,
    body: n ? `<p class="sub">What changes <small>· ${ops.filter((o) => o[0] === '-').length} line${ops.filter((o) => o[0] === '-').length === 1 ? '' : 's'} out, ${ops.filter((o) => o[0] === '+').length} in</small></p>${diffHtml(ops)}
      <label class="sub" for="why" style="display:block;margin-top:22px">Why <small>(optional)</small></label><textarea class="field" id="why" placeholder="What went wrong? For example, which site and what it missed."></textarea>`
      : `<p class="say">You haven't changed anything yet. Go back to editing, change the text, then review it here.</p>`,
    foot: `<span class="note">It joins your suggested tweaks. <b>Nothing changes</b> in the ${esc(nm)} until you approve it.</span><button type="button" class="btn-g" data-x="back">Back to editing</button>${n ? '<button type="button" class="btn-p" data-x="add">Add to suggested tweaks</button>' : ''}`,
    wire: (d) => {
      $('[data-x="back"]', d).onclick = () => { closeDlg(); $('#ed')?.focus(); };
      const add = $('[data-x="add"]', d);
      if (add) add.onclick = () => {
        const why = $('#why', d).value.trim();
        const t = { id: 'local-' + (S.local.length + 1), local: true, agents: [e.agent], status: 'pending', title: `Your change to what the ${nm} does`, what: `${ops.filter((o) => o[0] === '-').length} line${ops.filter((o) => o[0] === '-').length === 1 ? '' : 's'} out, ${ops.filter((o) => o[0] === '+').length} in, in Claude's instructions.`, why: why || 'No reason given.', ops };
        S.local.push(t); S.edit = null; closeDlg(true);
        renderDoc(); renderTweaks(e.agent); renderNav();
        const el = $(`#twlist [data-tw="${t.id}"]`); if (el) { el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2000); $('button', el)?.focus({ preventScroll: true }); }
        toast('Added to suggested tweaks. Approve it here or on Decisions.');
      };
    },
    focus: n ? '#why' : '[data-x="back"]',
  });
}

// ---- tweak cards (concepts §2.4)
function renderTweaks(id) {
  const list = tweaksFor(id); const box = $('#twlist'); if (!box) return;
  $('#wait').classList.remove('slim');
  const n = pendingFor(id);
  $('#wait-h').innerHTML = `Waiting for you ${n ? `<span class="bdg">${n}</span>` : ''}`;
  if (!list.length) { box.innerHTML = '<p class="empty-line">Nothing waiting for this agent.</p>'; $('#wait').classList.add('slim'); return; }
  box.innerHTML = list.map((t) => {
    const st = t.local ? t.status : S.tweaks[t.id].status;
    if (st === 'approved') return `<p class="twdone" data-tw="${esc(t.id)}"><i class="ok">${I.check}</i><span><b>Approved just now</b> · Claude applies it in its next session<br>${esc(t.title)}</span></p>`;
    if (st === 'rejected') return `<p class="twdone" data-tw="${esc(t.id)}"><i class="no">${I.x}</i><span><b>Rejected</b> · ${esc(t.title)}</span></p>`;
    if (st === 'ruled') return `<p class="twdone" data-tw="${esc(t.id)}"><i class="ok">${I.check}</i><span><b>Put in your rules just now</b></span></p>`;
    return `<article class="twc" data-tw="${esc(t.id)}">${t.custom ? '<span class="forr">For your rules</span>' : ''}<h3>${esc(t.title)}</h3>
      <dl><dt>What changes</dt><dd>${esc(t.what)}</dd><dt>Why</dt><dd>${esc(t.why)}</dd></dl>
      <div class="twa">${t.custom ? '<button type="button" class="btn-p btn-s" data-a="rules">Put it in my rules</button>' : '<button type="button" class="btn-p btn-s" data-a="approve">Approve</button>'}<button type="button" class="btn-o btn-s" data-a="reject">Reject</button><button type="button" class="linkbtn" data-a="read">Read the full suggestion</button></div></article>`;
  }).join('');
  $$('.twc', box).forEach((c) => {
    const t = list.find((y) => y.id === c.dataset.tw);
    const set = (st, msg) => { if (t.local) t.status = st; else S.tweaks[t.id].status = st; renderTweaks(id); renderNav(); const el = $(`[data-tw="${CSS.escape(t.id)}"]`, box); el?.setAttribute('tabindex', '-1'); el?.focus(); live(msg); };
    $('[data-a="approve"]', c)?.addEventListener('click', () => set('approved', 'Approved. Claude applies it in its next session.'));
    $('[data-a="reject"]', c).addEventListener('click', () => set('rejected', 'Rejected.'));
    $('[data-a="read"]', c).addEventListener('click', () => openTweak(t));
    $('[data-a="rules"]', c)?.addEventListener('click', () => {
      const go2 = () => { S.edit = { fromTweak: t.id }; startEdit('custom', t.suggested); $('#doc').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); };
      if (dirty()) confirmDiscard(go2); else go2();
    });
  });
}
function openTweak(t) {
  if (t.local) {
    openDlg({ title: esc(t.title), size: 'wide', body: `<p class="sub">What changes</p>${diffHtml(t.ops)}<p class="sub" style="margin-top:20px">Why</p><p class="say">${esc(t.why)}</p>`, foot: `<button type="button" class="btn-p" data-x="close">Close</button>`, wire: (d) => { $('[data-x="close"]', d).onclick = () => closeDlg(); } });
    return;
  }
  openDlg({ title: esc(t.title), sub: 'The full suggestion, as written', size: 'wide', body: `<div class="prose">${md(t.md, { reading: true })}</div>`, foot: `<button type="button" class="btn-p" data-x="close">Close</button>`, wire: (d) => { $('[data-x="close"]', d).onclick = () => closeDlg(); } });
}
async function openReport(path, title) {
  openDlg({ title: esc(title), size: 'wide', body: '<p class="loading">Opening…</p>', foot: `<button type="button" class="btn-p" data-x="close">Close</button>`, wire: (d) => { $('[data-x="close"]', d).onclick = () => closeDlg(); } });
  let html;
  try {
    const r = await fetch('../../../' + path); if (!r.ok) throw new Error(r.status);
    html = `<div class="prose">${md(await r.text(), { reading: true })}</div>`;
  } catch {
    html = `<p class="say">This report opens when the dashboard is running. It is read from the project folder when you open it, not stored in this page.</p>`;
  }
  if ($('#dlg').open) $('#dlg-b').innerHTML = html;
}

// ---------------------------------------------------------------- popup (centred, white 80 % veil, ×, Esc, veil click)
let dlgReturn = null, dlgOnClose = null;
function openDlg({ title, sub, body, foot, wire, focus, size }) {
  const d = $('#dlg');
  d.className = 'pop' + (size ? ' ' + size : '');
  $('#dlg-t').innerHTML = title; const s = $('#dlg-s'); s.hidden = !sub; s.textContent = sub || '';
  $('#dlg-b').innerHTML = body; $('#dlg-f').innerHTML = foot || '';
  $('#dlg-b').scrollTop = 0;
  if (!d.open) { dlgReturn = document.activeElement; d.showModal(); }
  wire?.(d);
  (focus ? $(focus, d) : $('#dlg-x'))?.focus();
}
function closeDlg(keepFocus) { const d = $('#dlg'); if (d.open) d.close(); if (!keepFocus) dlgReturn?.focus?.(); }
$('#dlg').addEventListener('click', (e) => { if (e.target === e.currentTarget) { const r = e.currentTarget.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeDlg(); } });
$('#dlg-x').addEventListener('click', () => closeDlg());
$('#dlg').addEventListener('cancel', (e) => { e.preventDefault(); closeDlg(); });

let toastT;
function toast(text, action, fn, ms = 4000) {
  const e = $('#toast'); $('#toast-t').textContent = text; const b = $('#toast-b');
  b.hidden = !action; b.textContent = action || ''; b.onclick = action ? () => { e.classList.remove('on'); clearTimeout(toastT); fn(); } : null;
  e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), ms);
}

// ---------------------------------------------------------------- routing
let pendingOpts = null;
function go(hash, opts) { pendingOpts = opts || null; if (location.hash.slice(1) === hash) route(); else location.hash = hash; }
function route() {
  hideTip();
  const h = location.hash.slice(1).split('/');
  const opts = pendingOpts; pendingOpts = null;
  if (h[0] === 'agents' && h[1] && AG[h[1]]) {
    if (!$('#doc')) S.scroll = scrollY;
    detail(h[1], opts || {});
  } else {
    const was = !!$('#doc');
    if (was && S.edit && dirty()) { const keep = S.view.name; confirmDiscard(() => { S.edit = null; board(); scrollTo(0, S.scroll); }); history.replaceState(null, '', '#agents/' + keep); return; }
    S.view.name = null; S.edit = null;
    board();
    if (was) { scrollTo(0, S.scroll); }
  }
}
addEventListener('hashchange', route);
$('#menu-b').innerHTML = I.menu; $('#menu-x').innerHTML = I.x; $('#dlg-x').innerHTML = I.x;
$('#menu-b').addEventListener('click', () => $('#menu').showModal());
$('#menu-x').addEventListener('click', () => $('#menu').close());
$('#menu').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.closest('a')) $('#menu').close(); });
renderNav();
route();
})();
