:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;--rule2:#EEF0F5;--read:#1B1530;
  /* LOCKED 2026-09-27 (Shahar): purple lead, blue for links only. */
  --acc:#6A2FE0;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;
  /* status only (concepts §1.3) */
  --red:#C0182B;--red-bg:#FDECEE;--amber:#9A5B00;--amber-edge:#E39A0B;--amber-bg:#FFF4E0;--green:#1A7F37;--green-bg:#EDF7F0;--grey:#8A93A3;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.05);
  --shadow-pop:0 32px 80px rgba(11,18,32,.18),0 2px 8px rgba(11,18,32,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--ground);font-size:16px;line-height:1.5}
h1,h2,h3,h4,h5,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-weight:700}
.skip:focus{top:12px}

/* ---------- shell (as the Overview) ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidecol{background:var(--card);border-right:1px solid var(--rule)}
.side{position:sticky;top:0;height:100vh;padding:28px 16px 20px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;padding:0 12px 36px;text-decoration:none;color:var(--ink)}
.mark{width:26px;height:26px;border-radius:8px;background:var(--acc);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:15px;text-decoration:none}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav svg{width:22px;height:22px}
.nav .badge{margin-left:auto;min-width:24px;height:24px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:18px 8px 0;border-top:1px solid var(--rule)}
.side-foot b{display:block;font-size:15px;font-weight:700}
.side-foot div span{display:block;font-size:14px;color:var(--ink3)}
.you{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex:none;background:var(--acc);color:#fff}

.mtop{display:none}
main{min-width:0;padding:0 40px 72px;width:100%}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-top:28px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .lede{font-size:17px;color:var(--ink2);margin-top:8px}
.mode{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.mode .dot{width:8px;height:8px;border-radius:50%;background:#9CA3AF}
.topband{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin:22px 0 24px;align-items:start}
.tb-card{padding:22px 24px 10px}
.tb-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tb-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.fx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:14px 0;border-top:1px solid var(--rule2)}
.tb-h+.fx{border-top:0}
.fx .who2{display:flex;gap:6px;padding-top:2px}
.fx .who2 .ag{min-width:0;padding:0;border-radius:50%}
.fx .who2 .ag .nm{display:none}
.fx b{display:block;font-size:16px;font-weight:700;line-height:1.35}
.fx b span{display:block;font-size:15px;font-weight:700;color:var(--red);margin-top:1px}
.fx p{font-size:15px;color:var(--ink2);line-height:1.5;margin-top:2px}
.fx q{display:block;margin-top:6px;font-size:15px;color:var(--ink);font-style:normal;quotes:"“" "”"}
.fx .go{font-size:14px;align-self:center}
.wt{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 0;border-top:1px solid var(--rule2)}
.tb-h+.wt{border-top:0}
.wt .for{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.wt b{font-size:16px;font-weight:700;line-height:1.35}
.wt .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.wt .acts .btn-p.sm{height:40px;padding:0 16px}
.wt .acts .btn-o{height:40px;padding:0 14px}
.wt .acts .lnk{min-height:32px;font-size:14px}
.wt.done p{font-size:15px;color:var(--ink2)}.wt.done p b{font-size:15px;color:var(--ink)}
.tb-none{font-size:15px;color:var(--ink2);padding:6px 0 14px}
.chipag{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:#fff;border:0;box-shadow:var(--shadow);font-size:15px;font-weight:700;color:var(--ink)}
.chipag:hover{box-shadow:0 0 0 1.5px var(--t3),var(--shadow)}
.chipag .mini{width:28px;height:28px;font-size:12px}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- discs and state pills ---------- */
.disc{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;letter-spacing:.02em;flex:none;position:relative;background:#fff;color:#4B5563;box-shadow:inset 0 0 0 1.5px var(--grey)}
.disc.s-red{background:var(--red);color:#fff;box-shadow:none}
.disc.s-amber{background:var(--amber-bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--amber)}
.disc.s-green{background:var(--green);color:#fff;box-shadow:none}
.disc.s-me{background:var(--acc);color:#fff;box-shadow:none}
.disc .tb{position:absolute;right:-7px;top:-7px;min-width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;font-style:normal;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 0 2px #fff}
.disc.mini{width:28px;height:28px;font-size:11.5px}
.disc.mini .tb{display:none}
.disc.lg{width:56px;height:56px;font-size:18px}
.disc.lg .tb{right:-4px;top:-4px}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.pill i{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;line-height:1}
.pill svg{width:12px;height:12px}
.pill.s-red{background:var(--red);color:#fff}.pill.s-red i{background:#fff;color:var(--red)}
.pill.s-amber{background:var(--amber-bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--amber)}.pill.s-amber i{background:var(--amber);color:#fff}
.pill.s-green{background:var(--green);color:#fff}.pill.s-green i{background:#fff;color:var(--green)}
.pill.s-early,.pill.s-none{background:#fff;color:#4B5563;box-shadow:inset 0 0 0 1.5px var(--grey)}
.pill.s-early i{width:8px;height:8px;background:var(--grey);margin:0 3px}
.pill.s-none i{background:#EEF0F4;color:#4B5563}
.tcard .pill.rules{align-self:flex-start}
.pill.rules{background:var(--t5);color:var(--acc);height:28px;padding:0 12px}

/* ---------- checkpoint cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.cp{scroll-margin-top:16px;position:relative;padding:28px 28px 24px 34px;display:flex;flex-direction:column;overflow:hidden}
.cp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--edge,var(--grey))}
.cp.s-red{--edge:var(--red);--num:var(--red)}
.cp.s-amber{--edge:var(--amber-edge);--num:var(--amber)}
.cp.s-green{--edge:var(--green);--num:var(--green)}
.cp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.cp-h h2{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.cp-h p{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.5;max-width:44ch}
.cp-mid{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.num{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.num b{font-size:48px;font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.why{font-size:15px;line-height:1.5;color:var(--ink);margin-top:-6px;max-width:60ch}
.why small{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.num span{font-size:17px;color:var(--ink2);font-weight:500}
.who{display:flex;flex-wrap:wrap;gap:12px 32px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .lab{font-size:14px;font-weight:600;color:var(--ink3)}
.discs{display:flex;gap:14px}
.ag{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 2px;border-radius:12px;min-width:56px}
.ag .nm{font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;text-align:center;max-width:84px}
.ag:hover .disc{transform:translateY(-1px)}
.ag:hover .nm{color:var(--acc)}
div.ag{cursor:default}div.ag:hover .nm{color:var(--ink)}
.grp+.grp{padding-left:32px;border-left:1px solid var(--rule2)}

.rounds{border-top:1px solid var(--rule2)}
.rkey{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:24px;padding-bottom:10px;font-size:14px;color:var(--ink2);font-weight:600}
.rkey span{display:inline-flex;align-items:center;gap:7px}
.rkey span:first-child{color:var(--ink3);font-weight:500}
.rkey .mk{width:16px;height:16px}
.rkey .mk svg{width:9px;height:9px}
.rkey .mk.no svg{width:7px;height:7px}
.rkey .dia{width:10px;height:10px;display:inline-block;margin:0 2px}
.rr{display:grid;grid-template-columns:156px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--rule2)}
.rr .bn{font-size:15px;font-weight:700;line-height:1.3;min-width:0}
.rr .bn small{display:block;font-size:14px;font-weight:500;color:var(--ink2);margin-top:1px}
.marks{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;position:relative}
.mk{width:18px;height:18px;border-radius:50%;border:0;padding:0;flex:none;background:var(--ink3);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.mk svg{width:11px;height:11px}
.mk.ok{background:var(--green)}
.mk.no{background:#fff;box-shadow:inset 0 0 0 2.5px var(--red);color:var(--red)}
.mk.no svg{width:9px;height:9px}
.mk:hover{transform:scale(1.18)}
.dia{width:14px;height:14px;transform:rotate(45deg);border-radius:2px;border:2px solid var(--acc);background:#fff;padding:0;margin:0 1px;flex:none}
.dia:hover{background:var(--t5)}
.tag{font-size:14px;font-weight:600;color:var(--ink2);background:#EEF0F4;border-radius:999px;padding:2px 10px;margin-left:4px}
.open{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 6px 0 12px;border:0;border-radius:10px;background:none;font-size:15px;font-weight:700;color:var(--ink)}
.open:hover{background:var(--ground)}
.open svg{width:16px;height:16px;color:var(--ink3)}

.bar{display:flex;gap:4px;margin-top:22px;height:30px}
.bar .grpb{display:flex;gap:4px}
.bar .grpb+.grpb{margin-left:6px}
.cell{flex:1;min-width:0;height:30px;border-radius:7px;border:0;padding:0}
.cell{display:inline-flex;align-items:center;justify-content:center;color:#fff}
.cell svg{width:13px;height:13px}
.cell.ok{background:var(--green)}
.cell.no{background:var(--red)}
.cell.byyou{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 2px var(--acc)}
.cell:hover{filter:brightness(1.12)}
.barkey{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;font-size:14px;color:var(--ink2);font-weight:600}
.barkey span{display:inline-flex;align-items:center;gap:8px}
.barkey i{width:14px;height:14px;border-radius:4px;display:inline-block}
.drops{margin-top:20px;border-top:1px solid var(--rule2);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.drops h3{font-size:14px;font-weight:600;color:var(--ink3);margin-bottom:8px}
.bchips{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;font-size:14px;font-weight:700;color:var(--ink)}
.bchip i{width:10px;height:10px;border-radius:3px;background:var(--red);display:inline-block}
.bchip.went i{background:var(--green)}
.bchip.byme i{background:#fff;box-shadow:inset 0 0 0 2px var(--acc)}
.bchip:hover{border-color:var(--t3);background:var(--t5)}

.cp-f{margin-top:auto;padding-top:20px}
.cp-f .in{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;border-top:1px solid var(--rule2);padding-top:16px}
.cp-f p{font-size:15px;color:var(--ink2);line-height:1.55;flex:1 1 280px}
.cp-f p b{color:var(--ink);font-weight:700}
.tw{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:999px;border:0;background:var(--t5);color:var(--acc);font-size:15px;font-weight:700;white-space:nowrap}
.tw b{min-width:24px;height:24px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.tw:hover{background:var(--t4)}
.tw svg{width:16px;height:16px}
.tw.done{background:var(--green-bg);color:var(--green)}
.linkish{border:0;background:none;padding:0;color:var(--acc);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* ---------- legend, not checked ---------- */
.legend{margin-top:32px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:20px 24px}
.legend h2{grid-column:1/-1;font-size:15px;font-weight:700;color:var(--ink)}
.legend div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.legend p{font-size:14px;color:var(--ink2);line-height:1.45}
.unchk{margin-top:40px}
.unchk>h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.unchk>p{font-size:15px;color:var(--ink2);margin-top:4px}
.lanes{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.lane{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.lane h3{font-size:15px;font-weight:700;color:var(--ink2);padding-top:22px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:grid;grid-template-columns:40px minmax(0,1fr) 18px;gap:14px;align-items:center;text-align:left;padding:16px 16px 16px 18px;border-radius:16px;background:#fff;border:0;box-shadow:var(--shadow)}
.tile:hover{box-shadow:0 0 0 1.5px var(--t3),var(--shadow)}
.tile b{display:block;font-size:16px;font-weight:700}
.tile .r{display:block;font-size:14px;color:var(--ink2);margin-top:1px;line-height:1.4}
.tile .lc{display:block;font-size:14px;color:var(--ink3);margin-top:6px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.tile>svg{width:18px;height:18px;color:var(--ink3)}
.count16{margin-top:18px;font-size:15px;color:var(--ink2)}

/* ---------- code spans as chips (CHANGELOG lines, docs) ---------- */
.ch{font-family:inherit;background:#F3F4F8;border-radius:6px;padding:.08em .4em;font-size:.92em;font-weight:600;color:var(--ink);white-space:normal;overflow-wrap:anywhere}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:80;max-width:340px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45;pointer-events:none;box-shadow:var(--shadow-pop);opacity:0;transform:translateY(4px)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:700;margin-bottom:2px}
.tip .v{display:inline-block;font-weight:700;margin-right:6px}
.tip .v.no{color:#FF9AA5}.tip .v.ok{color:#8FE0A6}.tip .v.st{color:#C3ACF3}

/* ---------- popups ---------- */
dialog.pop{width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:20px;background:#fff;color:var(--ink);box-shadow:var(--shadow-pop),0 0 0 1px var(--rule);overflow:hidden}
dialog.pop[open]{display:flex;flex-direction:column}
dialog.pop::backdrop{background:rgba(255,255,255,.8);backdrop-filter:blur(2px)}
.phd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 20px 0 28px}
.phd h2{font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.015em;padding-top:4px}
.phd p{font-size:15px;color:var(--ink2);margin-top:4px}
.x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.x:hover{background:var(--ground);color:var(--ink)}
.x svg{width:20px;height:20px}
.pb{padding:20px 28px 28px;overflow:auto}
.pfoot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:12px;padding:16px 28px;border-top:1px solid var(--rule2);background:#fff}
.pfoot.between{justify-content:space-between}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.btn-p:hover{background:#5A22CC}
.btn-p.sm{height:44px;padding:0 18px;font-size:15px}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1.5px solid #D5D9E2;background:#fff;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn-o:hover{border-color:var(--t3);background:var(--t5)}
.btn-o svg{width:18px;height:18px;color:var(--acc)}
.btn-o.danger{color:var(--red)}
.btn-o.danger:hover{border-color:#F2C9CE;background:#FFF7F8}
.btn-g{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap;text-decoration:none}
.btn-g:hover{background:var(--ground)}
.btn-g svg{width:16px;height:16px;color:var(--ink3)}
.lnk{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--acc);font-size:15px;font-weight:700;min-height:40px;text-decoration:underline;text-decoration-color:var(--t3);text-underline-offset:4px}
.lnk:hover{text-decoration-color:var(--acc)}

/* story timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:14px}
.tl::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:var(--rule2)}
.ev{position:relative;padding-left:32px}
.ev::before{content:"";position:absolute;left:0;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ink3);box-shadow:0 0 0 4px #fff}
.ev.ok::before{background:var(--green)}.ev.no::before{background:#fff;box-shadow:inset 0 0 0 3px var(--red),0 0 0 4px #fff}
.ev.st::before{width:14px;height:14px;left:2px;top:8px;border-radius:2px;transform:rotate(45deg);background:#fff;border:2px solid var(--acc);box-sizing:border-box}
.ev .when{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:700}
.ev .when small{font-size:14px;font-weight:500;color:var(--ink3)}
.vp{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:700}
.vp.no{background:var(--red-bg);color:#A3132A}.vp.ok{background:var(--green-bg);color:#17702F}.vp.st{background:var(--t5);color:var(--acc)}.vp.n{background:#EEF0F4;color:var(--ink2)}
.ev .note{margin-top:6px;font-size:16px;line-height:1.6;color:var(--read);overflow-wrap:anywhere}
.ev .qs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ev .qs span{font-size:15px;color:var(--ink2)}
.ev .qs q{font-size:16px;color:var(--ink);quotes:"“" "”"}
.ev blockquote{margin:8px 0 0;background:var(--t5);border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.6;color:var(--ink)}
.ev.st .note{background:var(--t5);border-radius:12px;padding:12px 16px}

/* reader */
dialog.reader{width:min(880px,calc(100vw - 32px));height:calc(100vh - 64px)}

/* ---------- the agent popup ---------- */
dialog.agent{width:min(1040px,92vw);height:88vh;max-height:none}
.ag-scroll{overflow:auto;flex:1;position:relative;scroll-padding-top:72px}
.ag-top{position:sticky;top:0;z-index:6;height:60px;margin-bottom:-60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 0 36px;pointer-events:none}
.ag-top .x{pointer-events:auto;background:rgba(255,255,255,.9)}
.ag-tn{font-size:16px;font-weight:700;opacity:0;display:flex;align-items:center;gap:10px}
.ag-top.stuck{background:rgba(255,255,255,.97);box-shadow:0 1px 0 var(--rule2);backdrop-filter:blur(4px);pointer-events:auto}
.ag-top.stuck .ag-tn{opacity:1}
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;padding:32px 72px 28px 36px;background:linear-gradient(#FAFBFD,#FAFBFD);border-bottom:1px solid var(--rule2)}
.idn{display:flex;gap:18px;align-items:flex-start}
.idn h2{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.idn .role{font-size:17px;color:var(--ink2);margin-top:6px;line-height:1.45}
.idn .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}
.shared{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:14px;font-weight:700;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px;min-height:32px}
.shared:hover{color:var(--acc);text-decoration-color:var(--acc)}
.shared svg{width:16px;height:16px}
.lastc{font-size:15px;color:var(--ink2);margin-top:14px;line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.lastc .lnk{min-height:28px;font-size:15px}
.agwhy{font-size:16px;line-height:1.5;color:var(--ink);margin-top:12px;max-width:52ch}
summary.wsum{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px}
summary.wsum::-webkit-details-marker{display:none}
summary.wsum svg{width:16px;height:16px;transition:transform .15s;color:var(--ink3)}
details[open]>summary.wsum svg{transform:rotate(90deg)}
summary.wsum .hint{font-size:14px;color:var(--ink3);font-weight:500}
.lastc b{color:var(--ink)}
.how{display:flex;flex-direction:column;gap:12px}
.how h3,.sect h3{font-size:15px;font-weight:700;color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:12px 28px}
.stat{display:flex;align-items:baseline;gap:10px;min-width:0}
.stat b{font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1;white-space:nowrap;color:var(--ink)}
.stat.s-red b{color:var(--red)}.stat.s-amber b{color:var(--amber)}.stat.s-green b{color:var(--green)}
.stat span{font-size:15px;color:var(--ink2);line-height:1.4;max-width:30ch}
.how p{font-size:15px;color:var(--ink2);line-height:1.55}
.how p.lead{font-size:16px;color:var(--ink)}
.sect{padding:24px 36px 0}
.sect-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cnt{min-width:26px;height:24px;border-radius:999px;background:var(--t5);color:var(--acc);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.cnt.z{background:#EEF0F4;color:var(--ink2)}
.sect .none{font-size:15px;color:var(--ink2)}
.tws{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tcard{border-radius:16px;padding:18px 20px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule2),0 1px 2px rgba(11,18,32,.04);display:flex;flex-direction:column;gap:10px}
.tcard.flash{box-shadow:inset 0 0 0 2px var(--acc)}
.tcard h4{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.tcard dl{display:flex;flex-direction:column;gap:8px}
.tcard dt{font-size:14px;font-weight:700;color:var(--ink3)}
.tcard dd{font-size:16px;line-height:1.5;color:var(--ink)}
.tcard .acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:6px}
.tcard.done{flex-direction:row;align-items:center;gap:12px;padding:14px 18px}
.tcard.done .ok{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--green-bg);color:var(--green);flex:none}
.tcard.done .ok.r{background:#EEF0F4;color:var(--ink2)}
.tcard.done .ok svg{width:16px;height:16px}
.tcard.done p{font-size:15px;color:var(--ink2)}
.tcard.done p b{color:var(--ink)}
.wh{display:flex;flex-direction:column}
.wh h4{font-size:14px;font-weight:600;color:var(--ink3);margin:6px 0 4px}
.wr{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding:12px 0;border-top:1px solid var(--rule2)}
.wr .bn{font-size:16px;font-weight:700;line-height:1.3;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.wr .bn:hover{color:var(--acc)}
.wr .bn small{display:block;font-size:14px;font-weight:500;color:var(--ink2)}
.wr .mid{min-width:0}
.wr .mid b{font-size:15px;font-weight:700;color:var(--ink)}
.wr .mid b.r{color:var(--red)}
.wr .mid span{font-size:14px;color:var(--ink3);margin-left:6px}
.wr .mid p{font-size:15px;color:var(--ink2);line-height:1.45;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wr .ra{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.wr .ra .btn-g{height:36px}
.wr .ra .lnk{min-height:32px;font-size:14px}

.panes{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;margin-top:28px;border-top:1px solid var(--rule2);min-height:70%}
.vtabs{position:sticky;top:60px;align-self:start;padding:20px 12px 20px 24px;display:flex;flex-direction:column;gap:4px}
.vtabs button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;height:44px;padding:0 14px;border-radius:12px;border:0;background:none;font-size:15px;font-weight:600;color:var(--ink2)}
.vtabs button:hover{background:var(--ground);color:var(--ink)}
.vtabs button[aria-selected="true"]{background:var(--t5);color:var(--acc);font-weight:700}
.vtabs .sep{height:1px;background:var(--rule2);margin:8px 14px}
.vtabs small{font-size:14px;font-weight:600;color:var(--ink3)}
.pane{padding:24px 40px 48px 28px;min-width:0;border-left:1px solid var(--rule2)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--rule2)}
.ph h3{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph p{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.5}

/* reading type */
.md{font-size:18px;line-height:1.65;color:var(--read);max-width:70ch;overflow-wrap:break-word}
.md>*+*{margin-top:.8em}
.md h2{font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.015em;margin-top:1.4em;color:var(--ink)}
.md h3{font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin-top:1.5em;color:var(--ink)}
.md h4{font-size:19px;line-height:1.35;font-weight:700;margin-top:1.3em;color:var(--ink)}
.md h5{font-size:17px;font-weight:700;margin-top:1.2em}
.md>h2:first-child,.md>h3:first-child,.md>h4:first-child{margin-top:0}
.md ul,.md ol{padding-left:1.4em}
.md ul{list-style:disc}.md ol{list-style:decimal}
.md li{margin-top:.35em;padding-left:.2em}
.md li::marker{color:var(--t2)}
.md li>ul,.md li>ol{margin-top:.3em}
.md strong{font-weight:700;color:var(--ink)}
.md a{color:var(--blue);font-weight:600}
.md hr{border:0;height:1px;background:var(--rule);margin:1.6em 0}
.md blockquote{margin-left:0;padding:12px 18px;border-radius:12px;background:var(--ground);color:var(--ink2)}
.md blockquote>*+*{margin-top:.6em}
.md .code{background:#F6F7FA;border-radius:12px;padding:14px 18px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:var(--ink2);overflow-wrap:anywhere}
.md .tbl{overflow-x:auto;margin-left:-4px;padding:0 4px}
.md table{border-collapse:collapse;font-size:16px;line-height:1.5;width:100%;min-width:480px}
.md th{text-align:left;font-weight:700;color:var(--ink);padding:10px 12px 10px 0;border-bottom:1.5px solid var(--rule);vertical-align:bottom}
.md td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.md .ch{font-size:.86em}
.md del{color:var(--ink3)}
details.fold{border-radius:12px;background:var(--ground);padding:0 16px}
details.fold summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:48px;font-size:15px;font-weight:700;color:var(--ink2);cursor:pointer}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary svg{width:16px;height:16px;transition:transform .15s}
details.fold[open] summary svg{transform:rotate(90deg)}
details.fold .md{font-size:16px;padding-bottom:14px}

.hist{display:flex;flex-direction:column;max-width:72ch}
.he{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;padding:18px 0;border-top:1px solid var(--rule2)}
.he:first-child{border-top:0;padding-top:4px}
.he time{font-size:15px;font-weight:700;color:var(--ink);padding-top:2px}
.he time small{display:block;font-size:14px;font-weight:500;color:var(--ink3)}
.he .md{font-size:17px}
.he .vt{display:inline-block;margin-left:8px;font-size:14px;color:var(--ink3);font-weight:600;white-space:nowrap}

.emptyr{border-radius:20px;background:var(--ground);padding:36px 36px 32px;max-width:640px}
.emptyr .ic{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--acc);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.emptyr .ic svg{width:24px;height:24px}
.emptyr h4{font-size:20px;font-weight:700;margin-top:18px}
.emptyr p{font-size:17px;line-height:1.6;color:var(--ink2);margin-top:8px}
.emptyr .btn-p{margin-top:22px}
.hdrline{font-size:14px;color:var(--ink3);margin-bottom:18px}

/* editor */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--t5);color:var(--acc);border-radius:14px;padding:14px 18px;font-size:16px;font-weight:600;line-height:1.5;margin-bottom:16px}
.banner svg{width:20px;height:20px;margin-top:2px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--ground);gap:4px;margin-bottom:12px}
.seg button{height:36px;padding:0 16px;border-radius:9px;border:0;background:none;font-size:15px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,18,32,.1)}
.edwrap{position:relative;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--rule);background:#fff}
.edwrap:focus-within{box-shadow:inset 0 0 0 2px var(--acc)}
.mirror,.ed{font-family:inherit;font-size:17px;line-height:1.6;padding:18px 20px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;letter-spacing:0}
.mirror{position:absolute;inset:2px;color:transparent;pointer-events:none;overflow:hidden;border-radius:14px}
.mirror{padding:16px 18px}
.mirror span{display:block;min-height:1.6em;margin:0 -18px;padding:0 18px}
.mirror span.chg{background:var(--green-bg);box-shadow:inset 3px 0 0 var(--green)}
.ed{position:relative;display:block;width:100%;min-height:calc(12 * 1.6em + 36px);border:0;background:transparent;resize:none;outline:none;color:var(--read);overflow:hidden}
.edpv{border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--rule);padding:20px 24px}
.edpv .md .chg{background:var(--green-bg);box-shadow:-10px 0 0 var(--green-bg),-13px 0 0 var(--green);border-radius:2px}
.pvnote{font-size:14px;color:var(--ink2);margin-top:10px}
.edfoot{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin:16px -40px -48px -28px;padding:14px 40px 14px 28px;background:rgba(255,255,255,.96);border-top:1px solid var(--rule2);backdrop-filter:blur(4px)}
.edfoot p{font-size:15px;color:var(--ink2);flex:1 1 260px}
.edfoot div{display:flex;gap:10px}

/* diff */
.diff{border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--rule);overflow:hidden;font-size:16px;line-height:1.55}
.dl{padding:4px 16px 4px 40px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.55em}
.dl::before{position:absolute;left:16px;font-weight:800}
.dl.del{background:var(--red-bg);color:#A3132A;text-decoration:line-through;text-decoration-thickness:1px}
.dl.del::before{content:"−"}
.dl.add{background:var(--green-bg);color:#17702F}
.dl.add::before{content:"+"}
.dl.ctx{color:var(--ink3)}
.dl.gap{color:var(--ink3);font-weight:700;background:var(--ground);text-align:center;padding-left:16px}
.fl{display:block;font-size:15px;font-weight:700;margin:22px 0 8px}
.fl small{font-weight:500;color:var(--ink3)}
.field{width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;min-height:104px;resize:vertical;line-height:1.5}
.field:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.dsum{font-size:15px;color:var(--ink2);margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 20px;font-size:15px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:var(--shadow-pop);transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;display:flex;align-items:center;gap:16px;min-height:52px}
dialog .toast{bottom:calc(6vh + 92px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:36px;padding:0 14px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:15px}
.toast button:hover{background:rgba(255,255,255,.24)}
.toast button:focus-visible{outline-color:#fff}

/* ---------- 1024 band ---------- */
@media (max-width:1279px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:24px 12px 16px;align-items:center}
  .logo{padding:0 0 28px}
  .logo span,.nav a span:not(.badge),.side-foot div{display:none}
  .nav a{width:48px;justify-content:center;padding:0;position:relative}
  .nav .badge{position:absolute;right:-4px;top:2px;min-width:20px;height:20px;font-size:12px;padding:0 6px}
  .side-foot{padding:16px 0 0;border:0}
  main{padding:0 32px 56px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .topband{grid-template-columns:minmax(0,1fr)}
  .cp-mid{flex-direction:row;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .rr{grid-template-columns:220px minmax(0,1fr) auto}
  .legend{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lane{grid-template-columns:minmax(0,1fr);gap:8px}
  .lane h3{padding-top:0}
  .band{grid-template-columns:minmax(0,1fr);gap:22px;padding:28px 64px 24px 28px}
  .sect{padding:22px 28px 0}
  .panes{grid-template-columns:196px minmax(0,1fr)}
  .vtabs{padding:16px 8px 16px 16px}
  .pane{padding:22px 28px 40px 24px}
  .edfoot{margin:16px -28px -40px -24px;padding:14px 28px 14px 24px}
  .wr{grid-template-columns:180px minmax(0,1fr) auto}
}

/* ---------- 390 band ---------- */
@media (max-width:639px){
  .app{display:block}
  .sidecol{display:none}
  .mtop{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 16px;background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
  .mtop .logo{padding:0}
  .mtop .logo span{display:none}
  .mtop .where{font-size:17px;font-weight:700;flex:1}
  .menu-b{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
  .menu-b svg{width:24px;height:24px}
  main{padding:0 16px 48px}
  .top{flex-direction:column;gap:12px;padding-top:20px}
  .top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .top .lede{margin-top:0;color:var(--ink);font-size:18px;font-weight:600;line-height:1.45}
  .mode{white-space:normal}
  .topband{margin:16px 0 20px;gap:16px}
  .tb-card{padding:18px 18px 6px}
  .fx{grid-template-columns:auto minmax(0,1fr)}
  .fx .go{grid-column:2;justify-self:start}
  .grid{gap:16px}
  .cp{padding:22px 20px 18px 24px}
  .cp-h{flex-direction:column;gap:10px}
  .cp-mid{flex-direction:column;align-items:flex-start;gap:16px}
  .num b{font-size:40px}
  .who{gap:14px 20px}
  .grp+.grp{padding-left:20px}
  .discs{gap:8px}
  .rr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'bn op' 'mk mk';gap:8px 8px;padding:12px 0 14px}
  .rr .bn{grid-area:bn}.rr .marks{grid-area:mk;flex-wrap:wrap}
  .rr .open{grid-area:op;height:44px;align-self:start}
  .bar{height:28px;gap:3px}
  .cell{height:28px;flex:0 0 auto;width:calc((100% - 13 * 3px - 12px) / 14)}
  .bar .grpb{gap:3px}
  .legend{grid-template-columns:minmax(0,1fr);padding:18px 20px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  dialog.pop{width:100vw;max-width:100vw;height:100%;max-height:100%;border-radius:0;margin:0}
  dialog.pop.small{height:fit-content;max-height:calc(100vh - 24px);margin:auto;width:calc(100vw - 24px);border-radius:20px}
  .phd{padding:18px 12px 0 20px}
  .pb{padding:16px 20px 24px}
  .pfoot{padding:12px 16px;flex-direction:column-reverse}
  .pfoot .btn-p,.pfoot .btn-o,.pfoot .btn-g{width:100%;justify-content:center}
  .band{padding:20px 64px 20px 20px}
  .idn{flex-direction:column;gap:12px}
  .idn h2{font-size:26px}
  .band .how{margin-right:-44px}
  .stat b{font-size:34px}
  .sect{padding:20px 20px 0}
  .tws{grid-template-columns:minmax(0,1fr)}
  .wr{grid-template-columns:minmax(0,1fr);gap:4px}
  .wr .ra{flex-direction:row;align-items:center;justify-content:space-between}
  .panes{grid-template-columns:minmax(0,1fr);margin-top:20px}
  .vtabs{flex-direction:row;overflow-x:auto;padding:10px 16px;gap:6px;background:#fff;z-index:4;border-bottom:1px solid var(--rule2);scrollbar-width:none}
  .vtabs::-webkit-scrollbar{display:none}
  .vtabs button{flex:none;height:40px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--rule)}
  .vtabs button[aria-selected="true"]{box-shadow:none}
  .vtabs .sep{display:none}
  .pane{padding:20px 20px 40px;border-left:0}
  .ph{flex-direction:column}
  .md{font-size:17px}
  .he{grid-template-columns:minmax(0,1fr);gap:6px}
  .edfoot{margin:16px -20px -40px;padding:12px 20px}
  .edfoot div{width:100%}
  .edfoot div button{flex:1}
  .ed{padding:14px 14px}.mirror{padding:12px 12px}
  .mirror span{margin:0 -12px;padding:0 12px}
}
dialog.menu{margin:0 0 0 auto;height:100vh;max-height:none;width:min(300px,85vw);border:0;padding:20px 16px;background:#fff;box-shadow:var(--shadow-pop)}
dialog.menu::backdrop{background:rgba(255,255,255,.8)}
dialog.menu .nav a span{display:inline}
dialog.menu .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-weight:800;font-size:18px}

@media (prefers-reduced-motion:no-preference){
  dialog.pop[open]{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
  .tip{transition:opacity .1s,transform .1s}
  .mk,.ag .disc{transition:transform .12s}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>

uggested":null},{"id":"t2","file":"proposals/2026-09-globalsurf-02/002-custom-md-designer-from-gate-feedback.md","title":"Rewrite your designer taste notes to match your Global Surf feedback","what":"Replaces the text of your own designer notes with your Sep 29 feedback: lead with the business's own video and photos, readable text plus one script font for titles, no decorative lines or borders, soft rounded cards are fine, booking inside the site.","why":"Your current notes still say \"thin black lines\", \"geometric sans only\" and \"minimal, extreme\". That pushed the designer toward the near-empty pages you rejected. Until this is pasted, the agents are told your gate feedback wins wherever the notes disagree.","agents":["designer"],"rules":true,"suggested":"Lead with the business's own video and best photography: full-bleed, clear, unobstructed. On the first screen, only the header, at most one short centred title, and one short call to action.\n\nColour: clean and bright, taken from the place. One strong booking colour, always with white text on it. Grounds are clean whites and light neutrals.\n\nType: a readable, tasteful text face for everything people read, plus one expressive display face (a handwritten script is welcome) for section titles only. Never more than two families. Consistent through the whole site, booking included.\n\nStructure: distinct sections, each designed as a moment: rooms sold with galleries, levels with their footage, guests' words, the Instagram feed, a proper footer. Slideshows with dot navigation. Compact details. Buttons for actions, never underlined text.\n\nSurface: no decorative lines, rules or borders; separate with space, colour and imagery. Soft is fine when it is tasteful: rounded corners on cards and buttons, gentle shadows where they help.\n\nMotion: the video carries the movement. Small, useful microinteractions; no reveal animations on headings, no effects laid over the footage.\n\nBooking lives inside the site and looks // ---------- inline markdown ----------
function inline(s) {
  const parts = String(s).split(/(`[^`]+`)/g);
  return parts.map((p) => {
    if (/^`[^`]+`$/.test(p)) return `<code class="ch">${esc(p.slice(1, -1))}</code>`;
    let h = esc(p);
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    h = h.replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    h = h.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return h;
  }).join('');
}
// ---------- block markdown ----------

    let html = ordered ? `<ol${start !== 1 ? ` start="${start}"` : ''}>` : '<ul>';
    while (i < L.length) {
      const m = L[i].match(LIST);

      if (/\d/.test(m[2]) !== ordered) break;

      const body = paras.length > 1 ? paras.map((p) => `<p>${p}</p>`).join('') : paras[0];
      html += `<li>${raw.some((r) => hl && hl.has(r.trim())) ? `<span class="chg">${body}</span>` : body}${sub}</li>`;
    }

  while (i < L.length) {

    if (!l.trim()) { i++; continue; }

      continue;
    }

}

// ---------- line diff (LCS) ----------
function diffLines(a, b) {
  const A_ = a.split('\n'), B_ = b.split('\n');
  let s = 0; while (s < A_.length && s < B_.length && A_[s] === B_[s]) s++;
  let e = 0; while (e < A_.length - s && e < B_.length - s && A_[A_.length - 1 - e] === B_[B_.length - 1 - e]) e++;
  const a2 = A_.slice(s, A_.length - e), b2 = B_.slice(s, B_.length - e);
  const n = a2.length, m = b2.length;
  const T = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let x = n - 1; x >= 0; x--) for (let y = m - 1; y >= 0; y--) T[x][y] = a2[x] === b2[y] ? T[x + 1][y + 1] + 1 : Math.max(T[x + 1][y], T[x][y + 1]);
  const ops = A_.slice(0, s).map((t) => ['=', t]);
  let x = 0, y = 0;
  while (x < n || y < m) {
    if (x < n && y < m && a2[x] === b2[y]) { ops.push(['=', a2[x]]); x++; y++; }
    else if (y < m && (x === n || T[x][y + 1] >= T[x + 1][y])) { ops.push(['+', b2[y]]); y++; }
    else { ops.push(['-', a2[x]]); x++; }
  }
  return ops.concat(A_.slice(A_.length - e).map((t) => ['=', t]));
}
function diffHtml(ops, ctx = 1) {
  const keep = ops.map((o, k) => o[0] !== '=' || ops.slice(Math.max(0, k - ctx), k + ctx + 1).some((p) => p[0] !== '='));
  let html = ''; let gap = false;
  ops.forEach((o, k) => {
    if (!keep[k]) { if (!gap) { html += '<div class="dl gap">…</div>'; gap = true; } return; }
    gap = false;
    html += `<div class="dl ${o[0] === '+' ? 'add' : o[0] === '-' ? 'del' : 'ctx'}">${esc(o[1]) || ' '}</div>`;
  });
  return html;
}

    <div id="edbody"></div>
    <p class="pvnote">Preview copy: changes stay on this page.</p>
    <div class="edfoot"><p>${base ? 'Nothing changes yet: you review your suggestion, then it waits for your approval.' : `Saves to your rules right away. ${esc(name[0].toUpperCase() + name.slice(1))} uses them from its next run.`}</p>
      <div><button type="button" class="btn-g" id="ed-cancel">Cancel</button><button type="button" class="btn-p sm" id="ed-go">${base ? 'Review my suggestion' : 'Save'}</button></div></div>`;
  for (const b of $$('.seg button', pane)) b.onclick = () => { S.edit.mode = b.dataset.mode; renderEditor(); };
  const body = $('#edbody', pane);
  if (e.mode === 'write') {
    body.innerHTML = `<div class="edwrap"><div class="mirror" id="mirror" aria-hidden="true"></div><label class="sr" for="ed">${base ? 'What it does, as text' : 'Your rules, as text'}</label><textarea class="ed" id="ed" spellcheck="true"></textarea></div>`;
    const ta = $('#ed'); ta.value = e.text;
    const sync = () => {
      S.edit.text = ta.value;
      const ch = changedSet(e.orig, ta.value);
      $('#mirror').innerHTML = ta.value.split('\n').map((l) => `<span class="${l.trim() && ch.has(l.trim()) ? 'chg' : ''}">${esc(l) || ' '}</span>`).join('');
      ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
    };
    ta.addEventListener('input', sync); requestAnimationFrame(sync);
  } else {
    body.innerHTML = `<div class="edpv"><div class="md">${md(e.text, { hideVersion: base, hideTitle: true, hl: changedSet(e.orig, e.text) })}</div></div>`;
  }
  $('#ed-cancel').onclick = () => { if (editDirty()) askDiscard(() => { S.edit = null; renderPane(); }); else { S.edit = null; renderPane(); } };
  $('#ed-go').onclick = () => (base ? reviewSuggestion() : saveRules());
}
function askDiscard(then) {
  $('#dc-b').textContent = `Your edits to ${S.edit.kind === 'custom' ? `${lower(S.agent)}'s rules` : `what ${lower(S.agent)} does`} are not saved.`;
  $('#dc-yes').onclick = () => { $('#discard').close(); S.edit = null; renderPane(); then && then(); };
  $('#dc-no').onclick = () => $('#discard').close();
  openDlg($('#discard'));
  $('#dc-no').focus();
}
function saveRules() {
  const id = S.agent; const key = `${id}/custom`;
  const prev = S.files[key]; const e = S.edit;
  S.files[key] = e.text; S.edit = null;
  if (e.fromTweak) { const t = S.tweaks.find((x) => x.id === e.fromTweak); t.status = 'put'; t.touched = true; }
  renderAll(); renderAgent();
  toast('Saved to your rules.', () => { if (prev === undefined) delete S.files[key]; else S.files[key] = prev; if (e.fromTweak) { const t = S.tweaks.find((x) => x.id === e.fromTweak); t.status = 'pending'; } renderAll(); if (S.agent) renderAgent(); live('Undone.'); });
  live('Saved to your rules.');
}
let sgOps = null;
function reviewSuggestion() {
  const e = S.edit; const id = S.agent;
  if (!editDirty()) { toast('Nothing has changed yet.'); return; }
  sgOps = diffLines(e.orig, e.text);
  const add = sgOps.filter((o) => o[0] === '+' && o[1].trim()).length, del = sgOps.filter((o) => o[0] === '-' && o[1].trim()).length;
  $('#sg-t').textContent = `Suggest a change to ${lower(id)}`;
  $('#sg-b').innerHTML = `<label class="fl">What changes</label><p class="dsum">${add} line${add === 1 ? '' : 's'} added, ${del} removed.</p><div class="diff">${diffHtml(sgOps)}</div>
    <label class="fl" for="sg-why">Why <small>(optional)</small></label><textarea class="field" id="sg-why" placeholder="What went wrong? For example, which site and what it missed."></textarea>`;
  openDlg($('#suggest'));
}
$('#sg-back').onclick = () => { $('#suggest').close(); };
$('#sg-add').onclick = () => {
  const id = S.agent; const why = $('#sg-why').value.trim();
  const add = sgOps.filter((o) => o[0] === '+' && o[1].trim()).length, del = sgOps.filter((o) => o[0] === '-' && o[1].trim()).length;
  const t = { id: 'n' + Date.now(), title: `Your change to what ${lower(id)} does`, what: `${add} line${add === 1 ? '' : 's'} added and ${del} removed in Claude's instructions for ${lower(id)}.`, why: why || 'No reason given.', agents: [id], rules: false, status: 'pending', touched: true, diff: diffHtml(sgOps), mine: true };
  S.tweaks.unshift(t); S.edit = null;
  $('#suggest').close();
  renderAll(); renderAgent('wait');
  const c = $(`.tcard[data-tweak="${t.id}"]`); if (c) { c.classList.add('flash'); }
  toast('Added to suggested tweaks. Approve it here or on Decisions.');
};
async function answerTweak(tid, how, from) {
  const t = S.tweaks.find((x) => x.id === tid);
  if (how === 'put') {
    const id = t.agents[0];
    if (!$('#agent').open || S.agent !== id) await openAgent(id, null, from);
    S.tab = 'custom'; syncTabs();
    startEdit('custom', t.suggested || fileText(id, 'custom'), tid);
    return;
  }
  t.status = how === 'approve' ? 'approved' : 'rejected'; t.touched = true;
  renderAll(); if (S.agent && $('#agent').open) renderAgent();
  const msg = how === 'approve' ? 'Approved. Claude applies it in its next session.' : 'Rejected.';
  toast(msg); live(msg);
}

async function openAgent(id, focus, from) {
  await docsReady;
  if (S.agent && S.agent !== id && S.edit && editDirty()) { askDiscard(() => openAgent(id, focus, from)); return; }
  const fresh = S.agent !== id;
  S.agent = id; S.edit = null; if (fresh) S.tab = 'base';
  for (const t of S.tweaks) if (t.status === 'pending') t.touched = false;
  renderAgent(focus);
  const d = $('#agent');
  if (!d.open) openDlg(d, from);
  if (focus !== 'wait') { $('#ag-scroll').scrollTop = 0; const hn = $('#ag-name'); hn.tabIndex = -1; hn.focus({ preventScroll: true }); }
  if (focus === 'wait') { const w = $('#ag-wait'); w.scrollIntoView({ block: 'start' }); const f = $('#ag-wait .tcard:not(.done) button') || $('#ag-name'); f.tabIndex = f.tabIndex < 0 ? -1 : f.tabIndex; f.focus({ preventScroll: true }); }
  history.replaceState(null, '', '#agents/' + id);
}

// ---------- events (delegated) ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.tab) {
    if (S.edit && editDirty()) { askDiscard(() => { S.tab = t.dataset.tab; syncTabs(); renderPane(); }); return; }
    S.edit = null; S.tab = t.dataset.tab; syncTabs(); renderPane(); if (t.dataset.scroll) { $('.panes').scrollIntoView({ block: 'start' }); $('#tab-' + S.tab)?.focus({ preventScroll: true }); } return;
  }
  if (t.dataset.tw) { answerTweak(t.dataset.id, t.dataset.tw, t); return; }
  if (t.dataset.read) { openReader(t.dataset.read, t.dataset.rt, t); return; }
  if (t.dataset.diff) { const tw = S.tweaks.find((x) => x.id === t.dataset.diff); $('#rd-t').textContent = tw.title; $('#rd-s').textContent = 'Your suggested change, line by line.'; $('#rd-b').innerHTML = `<div class="diff">${tw.diff}</div><p class="fl">Why</p><p>${esc(tw.why)}</p>`; openDlg($('#reader'), t); return; }
  if (t.hasAttribute('data-crit')) { const cr = CP.critique; const hit = cr.rows.find((r) => r.marks.some((m) => m.k === 'v' && !m.ok && /hard fail from (the passed|unchanged) copy/i.test(m.note))); if (hit) openStory(`critique|${hit.slug}|${hit.run}`, t); return; }
  if (t.dataset.story) { openStory(t.dataset.story, t); return; }
  if (t.dataset.agent) { e.preventDefault(); if ($('#menu').open) $('#menu').close(); openAgent(t.dataset.agent, t.dataset.focus, t); return; }
});
// vertical tabs: arrow keys
document.addEventListener('keydown', (e) => {
  const t = e.target.closest?.('[role=tab]'); if (!t) return;
  const tabs = $$('.vtabs [role=tab]'); const i = tabs.indexOf(t);
  let j = null;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') j = (i + 1) % tabs.length;
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
  if (e.key === 'Home') j = 0; if (e.key === 'End') j = tabs.length - 1;
  if (j != null) { e.preventDefault(); tabs[j].focus(); tabs[j].click(); }
});

function renderAll() { renderNav(); renderHeader(); renderGrid(); renderUnchecked(); }
renderAll(); renderLegend();
// deep link: #agents/<name>[/<tab>]
const h = location.hash.match(/^#agents\/([\w-]+)(?:\/(\w+))?/);
if (h && A[h[1]]) { if (h[2] && TABS.some((t) => t[0] === h[2])) S.tab = h[2]; openAgent(h[1]).then(() => { if (h[2]) { S.tab = h[2]; syncTabs(); renderPane(); } }); }
window.__agents = { openAgent, openStory, answerTweak, startEdit, S };
})();
</script>
