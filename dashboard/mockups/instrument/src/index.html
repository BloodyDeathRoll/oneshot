<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneShot — Instrument</title>
<meta name="description" content="OneShot operator dashboard, direction A “Instrument”: one control panel, rules instead of cards, every number from data.json.">
<!--FONT-->
<style>
:root{
  --bg:#F3F5F9; --panel:#FFFFFF; --rule:#E5E8EF;
  --ink:#0B1220; --ink2:#4B5563; --ink3:#6B7280;
  --acc:#1F4BFF; --t1:#4A6DFF; --t2:#7A93FF; --t3:#AEBDFF; --t4:#D6DEFF; --t5:#EEF1FF;
  --ok:#1A7F37; --bad:#C0182B;
  --r:8px; --rs:4px;
}
*{box-sizing:border-box}
html{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-size:13px;line-height:1.3;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body{margin:0;height:100vh;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr);overflow:hidden}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
svg [tabindex]:focus{outline:none}
svg [tabindex]:focus>.hit{stroke:var(--acc);stroke-width:2}
.hit{fill:transparent}
svg{overflow:visible;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sidebar */
.side{grid-row:1/3;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.brand{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--rule)}
.brand .mark{width:16px;height:16px;border-radius:var(--rs);background:var(--acc);flex:none;position:relative}
.brand .mark::after{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;border-radius:2px;background:#fff}
.brand b{font-weight:600;font-size:13px}
.brand span{color:var(--ink3);font-size:11px;margin-left:auto}
.nav{padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;color:var(--ink3);padding:10px 8px 4px}
.nav .grp:first-child{padding-top:0}
.nav a,.nav .dis{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:var(--rs);color:var(--ink2);font-size:13px}
.nav a:hover{background:var(--t5);text-decoration:none;color:var(--ink)}
.nav a[aria-current=page]{background:var(--t5);color:var(--acc);font-weight:500}
.nav .dis{color:var(--ink3);cursor:not-allowed}
.nav .dis .ico{opacity:.55}
.nav .ico{width:16px;height:16px;flex:none}
.nav .ico path,.nav .ico rect,.nav .ico circle,.nav .ico line{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav .n{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--bg);border-radius:var(--rs);padding:1px 6px;min-width:20px;text-align:center}
.nav a[aria-current=page] .n{background:#fff;color:var(--acc)}
.nav .n.acc{background:var(--acc);color:#fff}
.nav .later{margin-left:auto;font-size:11px;color:var(--ink3)}
.side .foot{margin-top:auto;padding:12px 16px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink2);line-height:1.5}
.side .foot b{font-weight:500;color:var(--ink)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:0 16px;height:44px}
.top h1{font-size:15px;font-weight:600;margin:0 4px 0 0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--rule);border-radius:var(--rs);padding:2px;gap:2px}
.seg button{height:24px;padding:0 10px;border-radius:3px;font-size:12px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--t5);color:var(--acc);font-weight:500}
.seg button:hover{color:var(--ink)}
.field{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--rs);font-size:12px;color:var(--ink2)}
.field svg{width:12px;height:12px}
.field svg *{fill:none;stroke:currentColor;stroke-width:1.5}
.field b{font-weight:500;color:var(--ink)}
.top .meta{margin-left:auto;font-size:11px;color:var(--ink2);display:flex;gap:16px}
.top .meta b{font-weight:500;color:var(--ink)}

/* main + panels */
main{min-height:0;padding:0 16px 16px;overflow:hidden}
.view{height:100%;min-height:0}
.view[hidden]{display:none!important}
.panel{background:var(--panel);border-radius:var(--r);min-height:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:baseline;gap:10px;height:40px;padding:0 16px;flex:none;border-bottom:1px solid var(--rule)}
.ph h2{font-size:15px;font-weight:600;margin:0;line-height:40px}
.ph .sub{font-size:11px;color:var(--ink3)}
.ph .big{font-size:28px;font-weight:500;line-height:1;color:var(--acc);margin-right:0;letter-spacing:-.01em}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:8px;align-self:center}
.tabs{display:inline-flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:2px}
.tabs button{height:20px;padding:0 8px;border-radius:3px;font-size:11px;color:var(--ink2)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:500}
.tabs button:hover{color:var(--ink)}
.pb{padding:12px 16px;min-height:0;flex:1}

/* overview grid */
#overview{display:grid;grid-template-rows:96px 272px minmax(0,1fr);gap:12px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr)}
.kpi{padding:12px 16px 10px;border-left:1px solid var(--rule);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.kpi:first-child{border-left:0}
.kpi .l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);line-height:14px;white-space:nowrap}
.kpi .l span{color:var(--ink3)}
.kpi .v{display:flex;align-items:baseline;gap:8px;height:30px;margin-top:2px;flex:none}
.kpi .v b{font-size:20px;font-weight:500;line-height:26px;letter-spacing:-.01em}
.kpi .v .d{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi .v .d.up{color:var(--ok)}
.kpi .v .d.down{color:var(--bad)}
.kpi .v .ring{align-self:center;width:20px;height:20px;flex:none}
.kpi .s{height:24px;margin-top:auto;overflow:visible;flex:none}
.hollow{color:transparent;-webkit-text-stroke:1px var(--t3)}
.es{font-size:11px;line-height:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:auto 0 0;height:28px;flex:none}
.es b{font-weight:400;color:var(--ink3)}
.mid{display:grid;grid-template-columns:700px minmax(0,1fr);gap:12px;min-height:0}

/* tables */
table{border-collapse:collapse;width:100%;font-size:12px}
th{font-weight:500;color:var(--ink3);font-size:11px;text-align:left;height:28px;padding:0 8px;border-bottom:1px solid var(--rule);white-space:nowrap;background:#fff;position:sticky;top:0;z-index:2}
td{height:32px;padding:0 8px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F8F9FC}
th.num,td.num{text-align:right}
td.mute{color:var(--ink3)}
.tw{overflow:auto;min-height:0;flex:1}
.tw table{table-layout:fixed}
td.ell{overflow:hidden;text-overflow:ellipsis}
td.note{position:relative;color:var(--ink2)}
td.note:hover,td.note:focus{overflow:visible}
td.note .full{display:none;position:absolute;left:8px;top:calc(100% - 4px);z-index:6;background:var(--ink);color:#fff;padding:8px 10px;border-radius:var(--rs);max-width:640px;white-space:normal;font-size:11px;line-height:1.45}
td.note:hover .full,td.note:focus .full{display:block}
.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:var(--rs);font-size:11px;font-weight:500;background:var(--t5);color:var(--ink2);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}
.pill .dia{width:6px;height:6px;border:1.5px solid currentColor;transform:rotate(45deg);flex:none;background:#fff}
.pill.acc{background:var(--t5);color:var(--acc)}
.pill.ok{background:#E9F5EC;color:var(--ok)}
.pill.bad{background:#FBECEE;color:var(--bad)}
.pill.grey{background:var(--bg);color:var(--ink3)}
.arrow{color:var(--ink3);padding:0 3px}
.act td a{color:var(--ink)}
.who{color:var(--ink2)}
.who.you{color:var(--acc);font-weight:500}
.gate-link{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:var(--rs);background:var(--t5);color:var(--acc);font-weight:500}
.gate-link:hover{background:var(--t4);text-decoration:none}
.gate-link svg{width:12px;height:12px}
.gate-link svg *{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.needs .also td{color:var(--ink2)}
.needs .foot{padding:10px 16px 0;font-size:11px;line-height:1.45;color:var(--ink2);border-top:1px solid var(--rule);margin-top:auto}
.needs .foot b{font-weight:500;color:var(--ink)}
.empty-row td{color:var(--ink2);height:44px;white-space:normal;line-height:1.45}

/* chart bits */
.tip rect{fill:var(--ink)}
.tip text{fill:#fff;font-size:11px}
.tip .sq{fill:var(--acc)}
.tip{opacity:0;pointer-events:none;transition:none}
svg [tabindex]:hover .tip,svg [tabindex]:focus .tip{opacity:1}
svg [tabindex]{cursor:default}
.funnel .row .hl{fill:var(--t5);opacity:0}
.funnel .row:hover .hl,.funnel .row:focus .hl{opacity:1}
.funnel .row:focus .hl{stroke:var(--acc);stroke-width:2}
.funnel .row:hover .cnt,.funnel .row:focus .cnt{fill:var(--ink)}
.funnel text{font-size:12px;fill:var(--ink2)}
.funnel .axis text{font-size:11px;fill:var(--ink3)}
.funnel .cnt{fill:var(--ink);font-weight:500}
.funnel .pct{fill:var(--ink3);font-size:11px}
.funnel .zero .cnt{fill:var(--ink3);font-weight:400}
.bar{fill:var(--acc);transform-box:fill-box;transform-origin:left center}
.draw .bar{transform:scaleX(0)}
.draw.on .bar{transform:scaleX(1);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.spark rect{fill:var(--t3);transform-box:fill-box;transform-origin:center bottom}
.spark rect.today{fill:var(--acc)}
.spark rect.nil{fill:var(--t4)}
.draw .spark rect{transform:scaleY(0)}
.draw.on .spark rect{transform:scaleY(1);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.spark [tabindex]:hover rect,.spark [tabindex]:focus rect{fill:var(--t1)}
.spark [tabindex]:hover rect.today,.spark [tabindex]:focus rect.today{fill:var(--acc)}
.dots line.pass{stroke:var(--t3);stroke-dasharray:2 2}
.dots line.base{stroke:var(--rule)}
.dots circle{fill:var(--acc)}
.dots circle.ver{fill:#fff;stroke:var(--acc);stroke-width:1.5}
.dots text{font-size:11px;fill:var(--ink3)}
.ring circle.tr{fill:none;stroke:var(--t4);stroke-width:3}
.ring circle.val{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:butt;transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
.st rect.done{fill:var(--acc)}
.st rect.cur{fill:var(--t2)}
.st rect.cur.wait{fill:#fff;stroke:var(--acc);stroke-width:1.5}
.st rect.no{fill:var(--t5)}
.st rect.out{fill:var(--t4)}
.st rect.out.last{fill:var(--t3)}
.st .gate{fill:#fff;stroke:var(--t3);stroke-width:1}
.st .gate.passed{fill:var(--acc);stroke:var(--acc)}
.st .gate.open{fill:#fff;stroke:var(--acc);stroke-width:1.5}
.st [tabindex]:hover rect.seg,.st [tabindex]:focus rect.seg{stroke:var(--ink);stroke-width:1}

/* pipeline */
#pipeline{display:grid;grid-template-rows:minmax(0,1fr)}
#pipeline .ph{height:48px}
.tabs button{white-space:nowrap}
.pipe td.name{overflow:hidden;text-overflow:ellipsis}
.pipe td.name a{color:var(--ink);font-weight:500}
.pipe td.name small{color:var(--ink3);font-size:11px;margin-left:6px;font-weight:400}
.pipe tr.sel td{background:var(--t5)}
.pipe td.why{color:var(--ink2)}
.pres{display:inline-flex;gap:2px;vertical-align:middle;margin-left:2px}
.pres i{width:4px;height:10px;border-radius:1px;background:var(--t4)}
.pres i.on{background:var(--t1)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:12px;height:6px;border-radius:1px;margin-right:5px;vertical-align:1px}
.legend .d{display:inline-block;width:6px;height:6px;transform:rotate(45deg);margin-right:6px;vertical-align:1px;border:1px solid var(--acc);background:#fff}

/* 1024 */
@media (max-width:1279px){
  body{grid-template-columns:56px minmax(0,1fr)}
  .brand{justify-content:center;padding:0}
  .brand b,.brand span,.nav .grp,.nav .lbl,.nav .n,.nav .later,.side .foot{display:none}
  .nav{padding:12px 8px}
  .nav a,.nav .dis{justify-content:center;padding:0;width:40px;height:36px}
  .nav a[aria-current=page]{box-shadow:inset 3px 0 0 var(--acc);border-radius:0 var(--rs) var(--rs) 0}
  .top .meta{display:none}
  main{overflow:auto}
  #overview{grid-template-rows:auto auto auto minmax(360px,1fr);height:auto}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi{height:96px}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--rule)}
  .mid{display:contents}
  .mid .needs{order:-1}
  .needs .foot{margin-top:0}
  .pipe .hide1024{display:none}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .draw .bar{transform:none}
  .draw .spark rect{transform:none}
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="mark" aria-hidden="true"></span><b>OneShot</b><span>dashboard</span></div>
  <nav class="nav" aria-label="Views">
    <div class="grp">Run</div>
    <a href="#overview" data-view="overview" aria-current="page"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg><span class="lbl">Overview</span></a>
    <a href="#pipeline" data-view="pipeline"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="10" y2="8"/><line x1="2" y1="12" x2="6" y2="12"/></svg><span class="lbl">Pipeline</span><span class="n" id="n-pipe"></span></a>
    <div class="dis" title="Built in the picked direction after the gate" aria-disabled="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><line x1="1.5" y1="6" x2="14.5" y2="6"/></svg><span class="lbl">Sites</span><span class="n" id="n-sites"></span></div>
    <div class="dis" title="Built in the picked direction after the gate" aria-disabled="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 6l2.5 2-2.5 2"/><line x1="8.5" y1="10.5" x2="11.5" y2="10.5"/></svg><span class="lbl">Agents</span></div>
    <div class="grp">Learn</div>
    <div class="dis" title="Built in the picked direction after the gate" aria-disabled="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2l2 2 4-4.4"/></svg><span class="lbl">Decisions</span><span class="n" id="n-dec"></span></div>
    <div class="grp">Money</div>
    <div class="dis" id="nav-cost" aria-disabled="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v7M6 6.5h3a1.2 1.2 0 010 2.4H6.8a1.2 1.2 0 000 2.4H10"/></svg><span class="lbl">Cost</span><span class="later" id="cost-later"></span></div>
  </nav>
  <div class="foot" id="side-foot"></div>
</aside>

<header class="top">
  <h1 id="view-title">Overview</h1>
  <div class="seg" role="group" aria-label="Run" id="run-seg"></div>
  <div class="field" id="range" title="Follows the ledger: first line to today"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="2" width="10" height="9" rx="1.5"/><line x1="1" y1="5" x2="11" y2="5"/></svg><span>Range</span><b id="range-v"></b></div>
  <div class="meta" id="top-meta"></div>
</header>

<main>
  <section class="view" id="overview" aria-labelledby="view-title">
    <div class="panel kpis draw" id="kpis"></div>
    <div class="mid">
      <div class="panel funnel">
        <div class="ph"><h2>Funnel</h2><span class="sub" id="funnel-sub"></span><div class="r"><span class="sub">count · % of previous stage</span></div></div>
        <div class="pb draw" id="funnel"></div>
      </div>
      <div class="panel needs">
        <div class="ph"><span class="big" id="needs-n"></span><h2>Needs you</h2><span class="sub" id="needs-sub"></span><div class="r"><a href="#pipeline" style="font-size:11px">Pipeline →</a></div></div>
        <div class="tw" id="needs"></div>
        <div class="foot" id="needs-foot"></div>
      </div>
    </div>
    <div class="panel act">
      <div class="ph"><h2>Recent activity</h2><span class="sub" id="act-sub"></span><div class="r"><div class="tabs" role="tablist" aria-label="Filter activity" id="act-tabs"></div></div></div>
      <div class="tw" id="act"></div>
    </div>
  </section>

  <section class="view" id="pipeline" hidden aria-labelledby="view-title">
    <div class="panel pipe">
      <div class="ph"><span class="big" id="pipe-n"></span><h2 id="pipe-h">businesses</h2><span class="sub" id="pipe-sub"></span>
        <div class="r"><div class="legend" aria-hidden="true"><span><i style="background:var(--acc)"></i>done</span><span><i style="background:var(--t2)"></i>current</span><span><i style="background:var(--t5)"></i>not reached</span><span><i style="background:var(--t3)"></i>reached, then out</span><span><span class="d"></span>gate</span></div><div class="tabs" role="tablist" aria-label="Filter by group" id="pipe-tabs"></div></div></div>
      <div class="tw" id="pipe"></div>
    </div>
  </section>
</main>

<noscript><p style="padding:16px">This mockup draws every chart from the embedded <code>data.json</code> with JavaScript.</p></noscript>
<!--DATA-->
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const day = ts => { const d = new Date(ts); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const dayS = s => { const [,m,d] = s.split('-').map(Number); return `${d} ${MON[m-1]}`; };
const hm = ts => { const d = new Date(ts); return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
const short = r => r.replace(/^\d{4}-\d{2}-/, '');
const base = s => s ? s.replace(/\(\d+\)$/, '') : s;
const num = n => (n == null) ? '' : (Number.isInteger(n) ? String(n) : n.toFixed(1));
const runs = D.runs.map(r => r.run_id);
const state = { view: 'overview', run: D.run.run_id, slug: null, act: 'all', grp: 'all' };
let first = true, focusAfter = null;

// ---------- routing ----------
function readHash() {
  const h = location.hash.slice(1);
  const [path, q] = h.split('?');
  const [view, slug] = path.split('/');
  state.view = (view === 'pipeline') ? 'pipeline' : 'overview';
  state.slug = slug || null;
  const p = new URLSearchParams(q || '');
  if (p.get('run') && runs.includes(p.get('run'))) state.run = p.get('run');
}
function go() {
  const q = state.run !== D.run.run_id ? `?run=${state.run}` : '';
  location.hash = `#${state.view}${state.slug ? '/' + state.slug : ''}${q}`;
}
addEventListener('hashchange', () => { readHash(); render(); });

// ---------- shared ----------
const tip = (x, y, rows, anchor='start') => {
  const w = Math.max(...rows.map(r => r.length)) * 6.3 + 20, h = rows.length * 15 + 11;
  const tx = anchor === 'end' ? x - w : x;
  return `<g class="tip" transform="translate(${tx},${y})"><rect width="${w}" height="${h}" rx="4"/>${rows.map((r,i)=>`<text x="10" y="${16 + i*15}" ${i?'':'font-weight="500"'}>${esc(r)}</text>`).join('')}</g>`;
};
const kpiOrder = [
  ['live_sites','Live sites','live_sites'],
  ['needs_you','Needs you','gates_open'],
  ['pitched','Pitched',null],
  ['replies','Replies',null],
  ['clients','Clients',null],
  ['avg_critic','Critic mean','critic']
];
const isCurrent = () => state.run === D.run.run_id;
const kp = () => D.kpis_by_run[state.run];
const runRow = () => D.runs.find(r => r.run_id === state.run);
const bizOfRun = () => D.businesses.filter(b => b.run_id === state.run);

function deltaText(key) {
  if (!isCurrent()) return { cls:'', txt:'no earlier run', title:'first run in the ledger' };
  const d = D.deltas[key];
  if (!d) return { cls:'', txt:'' };
  if (d.delta == null) return { cls:'', txt:'first run here', title: d.note };
  const s = d.delta > 0 ? '+' : '';
  return { cls: d.delta > 0 ? 'up' : d.delta < 0 ? 'down' : '', txt: `${s}${num(d.delta)} vs ${short(d.previous_run)}`, title: `${d.previous} in ${d.previous_run}` };
}

// ---------- charts ----------
function barcode(days, vals, label) {
  const bw = 10, gap = 3, h = 24, W = days.length * (bw + gap) - gap;
  const max = Math.max(...vals);
  const bars = days.map((d, i) => {
    const v = vals[i], bh = v === 0 ? 1 : (max ? Math.max(2, Math.round(v / max * (h - 2))) : 1);
    const cls = (i === days.length - 1 ? 'today' : '') + (v === 0 ? ' nil' : '');
    return `<g tabindex="0" role="img" aria-label="${esc(dayS(d))} · ${v} ${esc(label)}"><rect class="hit" x="${i*(bw+gap)}" y="0" width="${bw}" height="${h}" rx="1"/><rect class="${cls}" x="${i*(bw+gap)}" y="${h-bh}" width="${bw}" height="${bh}" rx="1"/>${tip(i*(bw+gap) + bw/2 - 6, -34, [`${dayS(d)} · ${v}`])}</g>`;
  }).join('');
  return `<svg class="spark" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-label="${esc(label)} per day"><title>${esc(label)} per day, ${dayS(days[0])} – ${dayS(days.at(-1))}</title><line x1="0" x2="${W}" y1="${h}" y2="${h}" stroke="#E5E8EF"/>${bars}</svg>`;
}
function ring(v) {
  const r = 8, c = 2 * Math.PI * r, span = c * 0.75, off = span * (1 - v / 100);
  return `<svg class="ring" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="${v} of 100"><title>${v} of 100</title><circle class="tr" cx="10" cy="10" r="${r}" stroke-dasharray="${span} ${c}" transform="rotate(135 10 10)"/><circle class="val" cx="10" cy="10" r="${r}" stroke-dasharray="${span} ${c}" stroke-dashoffset="${first && !RM ? span : off}" data-off="${off}" transform="rotate(135 10 10)"/></svg>`;
}
function dots(sites) {
  const W = 168, h = 24, x = v => Math.round(v / 100 * (W - 20)) + 2;
  const rows = sites.map((s, i) => {
    const y = 4 + i * 8;
    return `<g tabindex="0" role="img" aria-label="${esc(s.name)} · ${num(s.critic_score)} · ${esc(s.critic_score_kind)}"><rect class="hit" x="${x(s.critic_score)-7}" y="${y-5}" width="14" height="10" rx="2"/><circle cx="${x(s.critic_score)}" cy="${y}" r="3" class="${s.critic_score_kind === 'verification' ? 'ver' : ''}"/>${tip(x(s.critic_score) - 6, y - 40, [s.name, `${num(s.critic_score)} · ${s.critic_score_kind}`], 'end')}</g>`;
  }).join('');
  return `<svg class="dots" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}"><title>Latest critic score per live site on a 0–100 scale, pass line at 80</title><line class="base" x1="${x(0)}" x2="${x(100)}" y1="${h-1}" y2="${h-1}"/><line class="base" x1="${x(0)}" x2="${x(0)}" y1="${h-5}" y2="${h-1}"/><line class="base" x1="${x(100)}" x2="${x(100)}" y1="${h-5}" y2="${h-1}"/><line class="pass" x1="${x(80)}" x2="${x(80)}" y1="0" y2="${h-1}"/><text x="${x(80)-4}" y="${h-1}" text-anchor="end">80</text><text x="${x(100)+3}" y="${h-1}">100</text>${rows}</svg>`;
}
function funnel(rows, W) {
  const labelW = 92, cntW = 36, pctW = 44, axisH = 18, rh = 28;
  const barW = W - labelW - cntW - pctW - 12;
  const max = Math.max(1, ...rows.map(r => r.count));
  const stepT = max >= 20 ? 10 : max >= 8 ? 5 : 1; const ticks = []; for (let t = 0; t <= max; t += stepT) ticks.push(t);
  const x = v => labelW + v / max * barW;
  const H = axisH + rows.length * rh;
  const grid = ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="${axisH - 4}" y2="${H}" stroke="${t ? '#EEF1FF' : '#E5E8EF'}"/><text x="${x(t)}" y="10" text-anchor="${t ? 'middle' : 'start'}">${t}</text>`).join('');
  const body = rows.map((r, i) => {
    const y = axisH + i * rh, prev = i ? rows[i-1].count : null;
    const pct = prev ? Math.round(r.count / prev * 100) + '%' : '';
    const zero = r.count === 0;
    const bar = zero ? `<rect x="${labelW}" y="${y+6}" width="1" height="16" fill="#D6DEFF"/>` : `<rect class="bar" x="${labelW}" y="${y+6}" width="${Math.max(1, x(r.count) - labelW)}" height="16" rx="1"/>`;
    const lbl = `${r.label} · ${r.count}${prev ? ` of ${prev} ${rows[i-1].label} · ${pct}` : prev === 0 ? ' · previous stage is empty' : ' businesses'}`;
    return `<g class="row ${zero ? 'zero' : ''}" tabindex="0" role="img" aria-label="${esc(lbl)}"><rect class="hl hit" x="-4" y="${y}" width="${W+8}" height="${rh}" rx="3"/><text x="0" y="${y+18}">${esc(r.label)}</text>${bar}<text class="cnt" x="${labelW+barW+cntW}" y="${y+18}" text-anchor="end">${r.count}</text><text class="pct" x="${labelW+barW+cntW+pctW}" y="${y+18}" text-anchor="end">${pct}</text>${tip(x(r.count) > W * .55 ? x(r.count) - 8 : x(r.count) + 8, i ? y - 30 : y + rh + 2, [r.label, `${r.count}${prev != null ? ' of ' + prev + ' ' + rows[i-1].label : ' businesses in the run'}`, prev ? `${pct} of previous stage` : prev === 0 ? 'previous stage is empty' : `state: ${r.state}`], x(r.count) > W * .55 ? 'end' : 'start')}</g>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Funnel"><title>Funnel: businesses of the run that ever reached each state</title><g class="axis">${grid}</g>${body}</svg>`;
}
function stationBar(b, segW, below) {
  const S = D.stations, gap = 1, h = 12, W = S.length * (segW + gap) - gap;
  const passedGate = n => n === 9 ? !!b.outcome : !!b.station_dates[n + 1];
  const hist = b.history || [];
  const segs = S.map((s, i) => {
    const n = s.n, reached = !!b.station_dates[n];
    let cls = 'no';
    if (reached) cls = b.out ? (n === b.station ? 'out last' : 'out') : (n < b.station ? 'done' : (n === b.station ? (b.gate ? 'cur wait' : 'cur') : 'done'));
    const line = reached ? hist.find(l => l.ts === b.station_dates[n] && s.states.includes(base(l.to))) : null;
    const when = reached ? `reached ${day(b.station_dates[n])}` : 'not reached';
    const who = line ? ` · ${line.agent}${line.v ? ' ' + line.v : ''}` : '';
    const rows = [`${n} ${s.name}`, when + who];
    if (s.gate) rows.push(`gate: ${s.gate}${passedGate(n) ? ' · passed' : (b.gate === s.gate ? ' · waiting on Shahar' : '')}`);
    if (n === b.station && b.out) rows.push(`out: ${b.group.replace('_',' ')}`);
    const x = i * (segW + gap);
    const gate = s.gate ? `<rect class="gate ${passedGate(n) ? 'passed' : (b.gate === s.gate ? 'open' : '')}" x="${x + segW - 3}" y="${h/2 - 3}" width="6" height="6" transform="rotate(45 ${x + segW} ${h/2})"/>` : '';
    return `<g tabindex="0" role="img" aria-label="${esc(rows.join(' · '))}"><rect class="hit" x="${x}" y="0" width="${segW}" height="${h}" rx="2"/><rect class="seg ${cls}" x="${x}" y="${h/2-3}" width="${segW}" height="6"/>${gate}${tip(i > 5 ? x + segW : x, below ? h + 6 : -(rows.length*15+11) - 4, rows, i > 5 ? 'end' : 'start')}</g>`;
  }).join('');
  return `<svg class="st" width="${W + 4}" height="${h}" viewBox="0 0 ${W+4} ${h}"><title>Stations 1–9 for ${esc(b.name)}</title>${segs}</svg>`;
}

// ---------- overview ----------
function renderKpis() {
  const k = kp(), days = D.series.days, sites = bizOfRun().filter(b => b.group === 'delivered' && b.critic_score != null);
  const es = D.empty_states;
  const cells = kpiOrder.map(([key, label, series]) => {
    const v = k[key], d = deltaText(key);
    let head = '', right = '', body = '';
    if (v == null || (v === 0 && es[key])) {
      const e = es[key] || (key === 'avg_critic' ? { filled_by: 'the critic\'s PASS line (critiqued → passed) on a live site', earliest: 'no live site in this run' } : {});
      head = `<b class="hollow" aria-label="0, nothing yet">0</b><span class="d" title="${esc(d.title || '')}">${esc(d.txt)}</span>`;
      body = `<p class="es" title="${esc(e.filled_by)}. Earliest: ${esc(e.earliest)}."><b>fills on</b> ${esc((e.filled_by || '').replace(/^a ledger line /, ''))}<br>${esc(e.earliest)}</p>`;
    } else {
      const shown = key === 'avg_critic' ? num(v) : String(v);
      head = `${key === 'avg_critic' ? ring(v) : ''}<b data-count="${v}" data-dec="${Number.isInteger(v) ? 0 : 1}">${first && !RM ? (Number.isInteger(v) ? '0' : '0.0') : shown}</b><span class="d ${d.cls}" title="${esc(d.title || '')}">${esc(d.txt)}</span>`;
      if (series === 'critic') {
        right = `${sites.length} sites · pass 80`;
        body = `<div class="s">${dots(sites)}</div>`;
      } else if (isCurrent() && D.series[series]) {
        right = `${dayS(days[0])} – ${dayS(days.at(-1))}`;
        body = `<div class="s">${barcode(days, D.series[series], label.toLowerCase())}</div>`;
      } else {
        body = `<p class="es" title="${esc(es.sparkline.filled_by)}">per-day series is kept for the current run only (${esc(es.sparkline.filled_by)})</p>`;
      }
    }
    return `<div class="kpi"><div class="l"><span>${label}</span><span>${right}</span></div><div class="v">${head}</div>${body}</div>`;
  }).join('');
  $('#kpis').innerHTML = cells;
}
function renderFunnel() {
  const el = $('#funnel'); const W = el.clientWidth - 32;
  el.innerHTML = funnel(kp().funnel, W);
  $('#funnel-sub').textContent = `${short(state.run)} · ever reached`;
}
function renderNeeds() {
  const gates = D.gates.filter(g => g.slug && g.run_id === state.run);
  const other = D.gates.filter(g => !g.slug);
  $('#needs-n').textContent = gates.length;
  $('#needs-sub').textContent = gates.length ? `open since ${day(gates[0].since)}` : `no open gate in ${short(state.run)}`;
  const rows = gates.map(g => `<tr><td class="ell"><a href="#pipeline/${esc(g.slug)}${isCurrent() ? '' : '?run=' + state.run}" title="Open ${esc(g.name)} in the pipeline">${esc(g.name)}</a></td><td><span class="pill acc"><i></i>${esc(g.kind)}</span></td><td class="num mute">${day(g.since)} · ${g.days} d</td><td class="num"><a class="gate-link" href="#pipeline/${esc(g.slug)}${isCurrent() ? '' : '?run=' + state.run}" aria-label="Go to the gate for ${esc(g.name)}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5"/></svg></a></td></tr>`).join('');
  const also = other.map(g => `<tr class="also"><td class="ell" title="${esc((g.target.proposals||[]).join('\n'))}">${esc(g.name.replace(' without a merge record', ''))} <span class="mute">· no merge record</span></td><td><span class="pill grey"><i></i>${esc(g.kind)}</span></td><td class="num mute ell" colspan="2" title="Opens the ${esc(g.target.view)} view, built after the pick">${esc(g.target.view)} · later</td></tr>`).join('');
  $('#needs').innerHTML = `<table><thead><tr><th style="width:42%">Business</th><th style="width:34%">Gate</th><th class="num">Since</th><th class="num" style="width:40px"><span class="sr">Open</span></th></tr></thead><tbody>${rows || `<tr class="empty-row"><td colspan="4">Nothing waits on you in ${esc(short(state.run))}.</td></tr>`}${also}</tbody></table>`;
  const e = D.empty_states.pitched;
  $('#needs-foot').innerHTML = gates.length ? `<b>Pitched, replies and clients stay at 0</b> until a <b>packaged → pitched</b> line is written — ${esc(e.earliest)}.` : `Pitched fills on: ${esc(e.filled_by)}.`;
}
function renderAct() {
  const tabs = [['all','All'],['human','Human'],['critic','Critic']];
  $('#act-tabs').innerHTML = tabs.map(([k,l]) => `<button role="tab" aria-selected="${state.act===k}" data-act="${k}">${l}</button>`).join('');
  const rows = D.recent_activity.filter(r => state.act === 'all' || r.agent === state.act);
  $('#act-sub').textContent = `last ${D.recent_activity.length} ledger lines, all runs · times UTC`;
  $('#act').innerHTML = `<table><thead><tr><th style="width:96px">Time</th><th style="width:200px">Business</th><th style="width:110px">Agent</th><th style="width:210px">Transition</th><th>Note</th></tr></thead><tbody>${rows.map(r => `<tr><td class="mute">${day(r.ts)} ${hm(r.ts)}</td><td class="ell">${r.slug === 'dashboard' ? `<span class="mute">dashboard</span>` : `<a href="#pipeline/${esc(r.slug)}${r.run_id !== D.run.run_id ? '?run=' + esc(r.run_id) : ''}">${esc(r.slug)}</a>`}</td><td class="${r.agent === 'human' ? 'who you' : 'who'}">${esc(r.agent === 'human' ? D.human : r.agent)}</td><td class="ell"><span class="mute">${esc(r.from ?? 'new')}</span><span class="arrow">→</span>${esc(r.to)}</td><td class="note ell" tabindex="0">${esc(r.note)}<span class="full">${esc(r.note)}</span></td></tr>`).join('') || `<tr class="empty-row"><td colspan="5">No ${esc(state.act)} lines among the last ${D.recent_activity.length}.</td></tr>`}</tbody></table>`;
}

// ---------- pipeline ----------
const GRP = { gate:'At a gate', pipeline:'In progress', delivered:'Delivered', dropped:'Dropped', not_approved:'Not approved', not_shortlisted:'Not shortlisted', superseded:'Superseded' };
function renderPipe() {
  const all = bizOfRun().sort((a, b) => (b.station - a.station) || (a.out - b.out) || a.name.localeCompare(b.name));
  const groups = {}; all.forEach(b => { groups[b.group] = (groups[b.group] || 0) + 1; });
  const tabs = [['all', `All ${all.length}`], ...Object.keys(GRP).filter(g => groups[g]).map(g => [g, `${GRP[g]} ${groups[g]}`])];
  $('#pipe-tabs').innerHTML = tabs.map(([k,l]) => `<button role="tab" aria-selected="${state.grp===k}" data-grp="${k}">${l}</button>`).join('');
  const rows = all.filter(b => state.grp === 'all' || b.group === state.grp);
  const narrow = innerWidth < 1280, segW = narrow ? 26 : 32;
  $('#pipe-n').textContent = rows.length;
  $('#pipe-h').textContent = rows.length === 1 ? 'business' : 'businesses';
  const R = runRow();
  $('#pipe-sub').textContent = `${short(state.run)} · ${D.run.mode} run · ${day(R.first_ts)} – ${day(R.last_ts)}`;
  const pillFor = b => b.gate ? `<span class="pill acc" title="gate: ${esc(b.gate)}"><span class="dia"></span>${esc(b.state)}</span>` : b.group === 'dropped' ? `<span class="pill bad"><i></i>dropped</span>` : b.out ? `<span class="pill grey"><i></i>${esc(b.state)}</span>` : `<span class="pill"><i></i>${esc(b.state)}</span>`;
  const pres = b => b.presence == null ? '' : `<span class="pres" title="presence ${b.presence}/5">${[1,2,3,4,5].map(i => `<i class="${i <= b.presence ? 'on' : ''}"></i>`).join('')}</span>`;
  const body = rows.map((b, ri) => {
    const hit = b.slug === state.slug ? ' class="sel"' : '';
    const next = b.out ? `<span class="mute">out</span>` : esc(b.next_step);
    const owner = b.out ? '' : `<span class="who ${b.owner === D.human ? 'you' : ''}">${esc(b.owner || '')}</span>`;
    return `<tr${hit} id="row-${esc(b.slug)}"><td class="name"><a href="#pipeline/${esc(b.slug)}${isCurrent() ? '' : '?run=' + state.run}" title="${esc(b.slug)}">${esc(b.name)}</a>${b.type ? `<small>${esc(b.type.replace('_',' '))}</small>` : ''}</td><td class="num hide1024">${pres(b)}</td><td>${pillFor(b)}</td><td>${stationBar(b, segW, ri < 2)}</td><td class="ell">${next}</td><td>${owner}</td><td class="num">${b.days_since_change} d</td><td class="num hide1024">${b.critic_score != null ? num(b.critic_score) : ''}</td><td class="note why ell" tabindex="0">${esc(b.why)}<span class="full">${esc(b.why)}</span></td></tr>`;
  }).join('');
  $('#pipe').innerHTML = `<table><thead><tr><th style="width:${narrow ? 176 : 212}px">Business</th><th class="num hide1024" style="width:64px">Presence</th><th style="width:${narrow ? 104 : 116}px">State</th><th style="width:${9*(segW+1)+8}px">Stations 1–9 <span style="font-weight:400">· gates ◇</span></th><th style="width:${narrow ? 112 : 136}px">Next step</th><th style="width:${narrow ? 64 : 80}px">Owner</th><th class="num" style="width:${narrow ? 52 : 60}px">In state</th><th class="num hide1024" style="width:52px">Critic</th><th>Last note</th></tr></thead><tbody>${body || `<tr class="empty-row"><td colspan="9">No business in this group for ${esc(short(state.run))}.</td></tr>`}</tbody></table>`;
  if (state.slug) { const r = $('#row-' + CSS.escape(state.slug)); if (r) r.scrollIntoView({ block: 'center', behavior: 'instant' }); }
}

// ---------- chrome ----------
function renderChrome() {
  $('#view-title').textContent = state.view === 'pipeline' ? 'Pipeline' : 'Overview';
  document.querySelectorAll('.nav a[data-view]').forEach(a => a.toggleAttribute('aria-current', a.dataset.view === state.view) || (a.dataset.view === state.view ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current')));
  $('#run-seg').innerHTML = runs.map(r => `<button aria-pressed="${state.run===r}" data-run="${r}" title="${r}">${short(r)}</button>`).join('');
  $('#range-v').textContent = `${dayS(D.series.days[0])} – ${dayS(D.series.days.at(-1))} ${D.series.days.at(-1).slice(0,4)}`;
  const g = new Date(D.generated_at);
  $('#top-meta').innerHTML = `<span>ledger <b>${D.totals.ledger_lines}</b> lines</span><span>decisions <b>${D.totals.human_decisions}</b></span><span>data <b>${day(D.generated_at)} ${hm(D.generated_at)}</b> UTC</span>`;
  $('#n-pipe').textContent = bizOfRun().length;
  $('#n-sites').textContent = kp().live_sites;
  $('#n-dec').textContent = D.totals.human_decisions;
  const gatesN = D.gates.filter(x => x.slug && x.run_id === state.run).length;
  const np = $('#n-pipe'); if (gatesN) np.title = `${gatesN} at a gate`;
  $('#cost-later').textContent = D.expenses.tracked ? '' : 'not tracked';
  $('#nav-cost').title = `${D.empty_states.cost.filled_by}. ${D.empty_states.cost.earliest}.`;
  const R = runRow();
  $('#side-foot').innerHTML = `<b>${esc(D.run.run_id)}</b><br>${esc(D.run.mode)} run · ${R.businesses} businesses<br>anchor ${esc(D.run.anchors[0].split(',')[0])} · max ${D.run.max_sites} sites`;
}

function render() {
  renderChrome();
  $('#overview').hidden = state.view !== 'overview';
  $('#pipeline').hidden = state.view !== 'pipeline';
  if (state.view === 'overview') { renderKpis(); renderFunnel(); renderNeeds(); renderAct(); animate(); }
  else renderPipe();
  first = false;
  if (focusAfter) { const f = $(focusAfter); if (f) f.focus(); focusAfter = null; }
}
function animate() {
  const els = document.querySelectorAll('.draw');
  if (RM || !first) { els.forEach(e => e.classList.add('on')); document.querySelectorAll('.ring .val').forEach(c => c.style.strokeDashoffset = c.dataset.off); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    els.forEach(e => e.classList.add('on'));
    document.querySelectorAll('.ring .val').forEach(c => c.style.strokeDashoffset = c.dataset.off);
    const t0 = performance.now(), dur = 600;
    const targets = [...document.querySelectorAll('[data-count]')];
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      targets.forEach(el => { const v = +el.dataset.count, dec = +el.dataset.dec; el.textContent = (v * e).toFixed(dec); });
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }));
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  // re-rendering replaces the buttons, so keyboard focus is put back on the chosen one
  if (b.dataset.run) { state.run = b.dataset.run; state.slug = null; focusAfter = '#run-seg [aria-pressed=true]'; const before = location.hash; go(); if (location.hash === before) render(); }
  if (b.dataset.act) { state.act = b.dataset.act; renderAct(); $('#act-tabs [aria-selected=true]').focus(); }
  if (b.dataset.grp) { state.grp = b.dataset.grp; renderPipe(); $('#pipe-tabs [aria-selected=true]').focus(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.getAttribute('role') === 'tab' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const tabs = [...t.parentElement.children]; const i = tabs.indexOf(t);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length]; n.focus(); n.click(); e.preventDefault();
  }
});
let rw = innerWidth;
addEventListener('resize', () => { if (Math.abs(innerWidth - rw) > 40) { rw = innerWidth; first = false; render(); } });

readHash();
render();
})();
</script>
