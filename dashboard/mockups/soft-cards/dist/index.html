:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;
  --acc:#6A2FE0;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;
  --green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--red-bg:#FCEBED;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.06);
  --r:20px;--r2:12px;--gap:24px;--pad:28px;
}
*{box-sizing:border-box}
html{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:var(--ground);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;font-size:15px;line-height:1.45;font-weight:400}
a{color:inherit}
button,select{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;overflow:visible}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lnk{color:var(--blue);font-weight:600;text-decoration:none}
.lnk:hover{text-decoration:underline}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:28px 20px 24px;z-index:2}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 28px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--acc);display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px;border:0;background:transparent;border-radius:var(--r2);font-weight:500;font-size:15px;color:var(--ink2);cursor:pointer}
.nav button:hover{background:var(--ground);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav button svg{width:22px;height:22px;flex:none}
.nav .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:13px;font-weight:700;min-width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.nav .n{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink3);display:grid;gap:4px}
.side-foot b{color:var(--ink2);font-weight:700}

/* ---------- main ---------- */
main{min-width:0;padding:0 24px 48px}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;background:var(--ground);z-index:1}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1}
.top .sub{font-size:13px;color:var(--ink3);margin-left:14px;font-weight:500}
.controls{display:flex;gap:12px;align-items:center}
.psel{position:relative;display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);height:40px;padding:0 14px;gap:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.psel svg.ic{width:16px;height:16px;flex:none}
.psel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 22px 0 0;height:40px;font-weight:600;color:var(--ink);cursor:pointer;max-width:260px}
.psel .chev{position:absolute;right:14px;width:12px;height:12px;pointer-events:none}
.psel:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.psel select:focus{outline:none}
.view{display:none}.view.on{display:block}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px}
.card-h h2{font-size:18px;font-weight:700;letter-spacing:-.005em}
.card-h .meta{font-size:13px;color:var(--ink3);font-weight:500}
.label{font-size:13px;font-weight:700;color:var(--ink2)}
.card:focus-visible,.card.flash{outline:2px solid var(--acc);outline-offset:4px;border-radius:var(--r)}

/* overview grid */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 376px;grid-template-areas:"kpis needs" "funnel activity";gap:var(--gap);align-items:stretch}
.kpis{grid-area:kpis;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-content:stretch}
.needs{grid-area:needs}.funnel{grid-area:funnel}.activity{grid-area:activity}

/* kpi card (compact, Shopeers anatomy) */
.kpi{display:flex;flex-direction:column;padding:22px 24px}
.kpi .label{display:block;margin-bottom:10px}
.kpi-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-size:40px;font-weight:300;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.num.hollow{color:transparent;-webkit-text-stroke:1.5px var(--t3)}
@supports not (-webkit-text-stroke:1px #000){.num.hollow{color:var(--t3)}}
.delta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink3);font-weight:500;min-height:22px;flex-wrap:wrap}
.dpill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-weight:700;font-size:13px;line-height:18px}
.dpill.up{background:var(--green-bg);color:var(--green)}
.dpill.down{background:var(--red-bg);color:var(--red)}
.dpill.flat{background:var(--ground);color:var(--ink2)}
.dpill svg{width:10px;height:10px}
.spark .dates{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-top:4px;font-weight:500}
.kpi .empty{margin-top:12px;font-size:13px;color:var(--ink3);line-height:1.4;font-weight:500}
.btn-tint{display:inline-flex;align-items:center;margin-top:auto;padding-top:12px;color:var(--acc);font-weight:700;font-size:13px;text-decoration:none;align-self:flex-start}
.btn-tint span{background:var(--t5);border-radius:999px;padding:6px 12px}
.btn-tint:hover span{background:var(--t4)}
.gauge-row{display:flex;align-items:flex-end;gap:12px;margin-top:2px}

/* needs-you accent card */
.needs{background:var(--acc);color:#fff;display:flex;flex-direction:column;padding:var(--pad)}
.needs .label{color:#fff;display:flex;align-items:center;gap:12px}
.needs .circ{width:40px;height:40px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);display:inline-flex;align-items:center;justify-content:center;flex:none}
.needs .circ svg{width:20px;height:20px}
.needs .bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:20px}
.needs .big{font-size:64px;font-weight:300;line-height:1;letter-spacing:-.03em}
.needs .wspark .dates{color:var(--acc-sec)}
.needs .sub{color:var(--acc-sec);font-size:14px;font-weight:500;margin-top:8px}
.needs .sub b{color:#fff;font-weight:700}
.gates{margin-top:16px;border-top:1px solid rgba(255,255,255,.22)}
.gates li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.22)}
.needs .foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--acc-sec);font-weight:500;border-top:1px solid rgba(255,255,255,.22)}
.needs .foot a.open{flex:none;background:#fff;color:var(--acc);text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px;line-height:1}
.needs .foot a.open:focus-visible{outline-color:#fff}
.gates li:last-child{border-bottom:0}
.gates .who{min-width:0}
.gates .who b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gates .who span{display:block;font-size:13px;color:var(--acc-sec);font-weight:500;margin-top:2px}
.gates a.open{flex:none;background:#fff;color:var(--acc);text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px;line-height:1}
.gates a.open:hover{background:var(--t5)}
.gates a.open:focus-visible{outline-color:#fff}
.gates li.more .who b{font-weight:500}

/* funnel */
.fsum{margin-top:20px;padding-top:20px;border-top:1px solid var(--rule);font-size:15px;color:var(--ink2);font-weight:500}
.fsum b{color:var(--ink);font-weight:700}
.fleg{margin-top:8px}
.fleg li{display:flex;align-items:center;gap:12px;height:44px;border-bottom:1px solid var(--rule);font-size:15px;color:var(--ink2);font-weight:500}
.fleg li:last-child{border-bottom:0}
.fleg i{width:10px;height:10px;border-radius:999px;flex:none}
.fleg b{margin-left:auto;font-weight:700;color:var(--ink);font-size:16px}

/* activity */
.feed li{display:flex;align-items:flex-start;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--rule)}
.feed li:last-child{border-bottom:0}
.disc{width:32px;height:32px;border-radius:999px;background:var(--t5);color:var(--acc);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.disc.human{background:var(--acc);color:#fff}
.feed .body{min-width:0;flex:1}
.l1row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.feed .l1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .l2{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-weight:500}
.feed .l2 b{color:var(--ink);font-weight:700}
.feed .l3{font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
time{font-size:13px;color:var(--ink3);flex:none;font-weight:500}
.feed-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--ink3)}
.linkbtn{border:0;background:var(--t5);color:var(--acc);font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer}
.linkbtn:hover{background:var(--t4)}

/* ---------- pills / table (pipeline) ---------- */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{border:0;background:var(--ground);color:var(--ink2);font-weight:600;font-size:13px;border-radius:999px;padding:8px 14px;cursor:pointer;line-height:1}
.pills button:hover{background:var(--t5);color:var(--acc)}
.pills button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pills button i{font-style:normal;margin-left:6px;font-weight:500;color:var(--ink2)}
.pills button[aria-pressed="true"] i{color:#fff}
table.pipe{width:100%;border-collapse:collapse;margin-top:8px}
table.pipe th{font-size:13px;font-weight:700;color:var(--ink3);text-align:left;padding:0 12px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
table.pipe td{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule);vertical-align:middle;height:64px}
table.pipe tr:last-child td{border-bottom:0}
table.pipe th:last-child,table.pipe td:last-child{text-align:right;padding-right:0}
table.pipe tbody tr:hover td{background:#FAFAFE}
.biz b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.biz span{display:block;font-size:13px;color:var(--ink3);margin-top:2px;font-weight:500}
.prog{width:288px}
.prog .under{font-size:13px;color:var(--ink3);margin-top:6px;font-weight:500;white-space:nowrap}
.prog .under b{color:var(--ink2);font-weight:600}
.spill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1}
.spill::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.spill.gate{background:var(--t5);color:var(--acc)}
.spill.live{background:var(--green-bg);color:var(--green)}
.spill.drop{background:var(--red-bg);color:var(--red)}
.spill.grey{background:var(--ground);color:var(--ink2)}
.owner{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600;font-size:14px}
.owner i{width:28px;height:28px;border-radius:999px;background:var(--t5);color:var(--acc);font-style:normal;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.owner.you i{background:var(--acc);color:#fff}
.owner.none{color:var(--ink3);font-weight:500}
td.days{font-weight:700;font-size:15px;white-space:nowrap}
td.days span{font-weight:500;color:var(--ink3);font-size:13px;margin-left:2px}
td.next{font-size:14px;color:var(--ink2);font-weight:500;white-space:nowrap;max-width:260px}
td.next b{color:var(--ink);font-weight:600}
td.next .why{display:block;font-size:13px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;max-width:240px}
.owner-inline{display:none;align-items:center;gap:6px;margin-top:4px;margin-left:10px;font-size:13px;color:var(--ink2)}
.owner-inline i{width:20px;height:20px;border-radius:999px;background:var(--t5);color:var(--acc);font-style:normal;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.owner-inline i.you{background:var(--acc);color:#fff}
.pipe-sum{display:flex;gap:24px;font-size:13px;color:var(--ink3);font-weight:500;margin-top:4px}

/* ---------- sites ---------- */
.sites-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;font-size:15px;color:var(--ink2);font-weight:500}
.sites-head b{color:var(--ink);font-weight:700}
.sites-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.site{padding:16px 16px 28px;display:flex;flex-direction:column;gap:0}
.site .shot{display:block;border-radius:var(--r2);overflow:hidden;background:var(--t5);aspect-ratio:16/10;position:relative}
.site .shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.site .shot span{position:absolute;right:10px;bottom:10px;background:rgba(11,18,32,.78);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.site .body{padding:20px 12px 0}
.site-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.site-h h2{font-size:18px;font-weight:700;letter-spacing:-.005em;line-height:1.25}
.site-meta{font-size:13px;color:var(--ink3);font-weight:500;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.site-score{display:flex;align-items:flex-end;gap:14px;margin-top:18px}
.site-score .num{font-size:44px}
.site-score .v{font-size:13px;color:var(--ink3);font-weight:500;line-height:1.4;padding-bottom:3px}
.site-score .v b{color:var(--ink);font-weight:700;font-size:14px}
.site-score .v .pass{color:var(--green)}.site-score .v .fail{color:var(--red)}
.scorechart{margin-top:14px}
.site .links{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:8px;font-size:13px;color:var(--ink3);font-weight:500}
.site .links li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.site .links li span.k{min-width:76px;color:var(--ink2)}
.site .links .na{color:var(--ink3)}

/* ---------- agents ---------- */
.ag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.ag-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.ag .card-h{align-items:center;margin-bottom:8px}
.vpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;background:var(--ground);color:var(--ink2);white-space:nowrap}
.vpill i{width:8px;height:8px;border-radius:999px;background:var(--green);flex:none}
.vpill.bad{background:var(--red-bg);color:var(--red)}.vpill.bad i{background:var(--red)}
.stats{display:flex;margin:12px 0 20px;border-bottom:1px solid var(--rule);padding-bottom:20px}
.stats div{flex:1;padding:0 16px;border-left:1px solid var(--rule)}
.stats div:first-child{padding-left:0;border-left:0}
.stats .k{font-size:13px;color:var(--ink3);font-weight:500}
.stats .v{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.stats .v.bad{color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--red-bg);color:var(--red);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.chip.quiet{background:var(--ground);color:var(--ink2)}
.ovl{margin-top:14px;display:grid;gap:8px}
.ovl li{display:flex;gap:10px;font-size:13px;color:var(--ink2);align-items:baseline}
.ovl li time{min-width:82px}
.ovl li{min-width:0}
.ovl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovl li b{color:var(--ink);font-weight:700;white-space:nowrap}
.chlog{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chlog b{color:var(--ink2);font-weight:700}
.sect{font-size:13px;color:var(--ink3);font-weight:600;margin-top:16px}
.mini h3{font-size:15px;font-weight:700}
.mini .vpill{margin-top:8px}
.mini .n{font-size:13px;color:var(--ink3);margin-top:10px;font-weight:500}
.mini .chlog{-webkit-line-clamp:3}

/* ---------- decisions ---------- */
.dec{display:grid;grid-template-columns:minmax(0,1fr) 376px;gap:var(--gap);align-items:start}
.tl{list-style:none;margin-top:8px;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--rule)}
.tl li{position:relative;padding:0 0 22px 48px}
.tl .dot{position:absolute;left:8px;top:6px;width:16px;height:16px;border-radius:999px;background:#fff;border:2px solid var(--t3)}
.tl li.gate .dot{background:var(--acc);border-color:var(--acc)}
.tl li.ovr .dot{border-color:var(--red);border-width:3px}
.tl .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl .h b{font-size:15px;font-weight:700}
.tl .h .tr{font-size:13px;color:var(--ink2);font-weight:600}
.tl .h .tag{border-radius:999px;padding:3px 9px;font-size:13px;font-weight:700;line-height:1}
.tl .tag.g{background:var(--t5);color:var(--acc)}.tl .tag.o{background:var(--red-bg);color:var(--red)}
.tl .h time{margin-left:auto}
.tl .note{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl li.open .note{display:block;-webkit-line-clamp:unset}
.tl .more{margin-top:6px;border:0;background:none;color:var(--acc);font-weight:700;font-size:13px;padding:0;cursor:pointer}
.props li{padding:12px 0;border-bottom:1px solid var(--rule);display:grid;gap:4px}
.props li:last-child{border-bottom:0}
.props .t{font-size:15px;font-weight:700;line-height:1.35}
.props .t a{color:var(--ink);text-decoration:none}
.props .t a:hover{color:var(--blue)}
.props .m{font-size:13px;color:var(--ink3);font-weight:500;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.props .m .tag{border-radius:999px;padding:2px 8px;font-weight:700;background:var(--ground);color:var(--ink2)}
.props .m .tag.c{background:var(--t5);color:var(--acc)}
.props .m a{color:var(--blue);font-weight:600;text-decoration:none}

/* ---------- svg shared ---------- */
.tip,.tipdot{opacity:0;pointer-events:none}
.datum:hover>.tip,.datum:focus>.tip,.datum:hover>.tipdot,.datum:focus>.tipdot,.seg:hover>.tip,.seg.sel>.tip{opacity:1}
.datum,.bar{outline:none;cursor:default}
.datum:focus-visible>.hit,.bar:focus-visible>.hit{stroke:var(--acc);stroke-width:2}
.tip.dark rect{fill:var(--ink)}
.tip.dark text{fill:#fff}
.tip.light rect{fill:#fff;stroke:var(--rule)}
.tip.light text{fill:var(--ink)}
.tip text{font-size:13px;font-weight:600;font-family:inherit}
.tip text.h{font-weight:700}
.tip .sec{fill:var(--t3);font-weight:500}
.tip.light .sec{fill:var(--ink3)}
.ax{font-size:13px;fill:var(--ink3);font-weight:500}
.ax.ink{fill:var(--ink2)}
.ax.b{fill:var(--ink);font-weight:700;font-size:18px}

/* draw-in, once */
.anim .draw{transition:stroke-dashoffset .7s ease-out}
.anim .grow{transform-origin:left center;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.anim .grow.up{transform-origin:center bottom}
.anim .grow.pre{transform:scaleX(0)}
.anim .grow.up.pre{transform:scaleY(0)}
.anim .fadein{transition:opacity .4s ease-out .5s}
.anim .fadein.pre{opacity:0}
@media (prefers-reduced-motion:reduce){.anim .draw,.anim .grow,.anim .fadein{transition:none}}

/* ---------- 1024 ---------- */
@media (max-width:1280px){
  body{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:20px 8px 20px}
  .logo{justify-content:center;padding:4px 0 24px}
  .logo span{display:none}
  .nav button{flex-direction:column;gap:6px;padding:10px 4px;font-size:11px;font-weight:600;text-align:center;line-height:1.1;position:relative}
  .nav button svg{margin-top:2px}
  .nav .badge{position:absolute;top:2px;right:2px;margin:0;min-width:18px;height:18px;font-size:11px;padding:0 5px}
  .nav .n{display:none}
  .side-foot{display:none}
  .ov{grid-template-columns:minmax(0,1fr);grid-template-areas:"needs" "kpis" "funnel" "activity"}
  .needs{flex-direction:row;align-items:stretch;gap:32px}
  .needs .head{flex:0 0 260px;display:flex;flex-direction:column}
  .needs .gates{margin-top:0;flex:1;border-top:0}
  .top .sub{display:none}
  .prog{width:200px}
  .biz b{max-width:180px}
  table.pipe th:nth-child(5),table.pipe td:nth-child(5){display:none}
  .owner-inline{display:inline-flex}
  td.next .why{max-width:200px}
  .pipe-head{flex-direction:column;align-items:flex-start;gap:16px}
  .pipe-sum{flex-wrap:wrap;gap:8px 16px}
  .sites-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ag-grid{grid-template-columns:minmax(0,1fr)}
  .ag-mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dec{grid-template-columns:minmax(0,1fr)}
  .dec .props-card{order:-1}
}

parking and check-in contradictions left unresolved on the page. 0 broken images, working with JavaScript off, Esc-closes-and-returns-focus verified. Lighthouse NOT run - no runner in tools/. Awaiting the human pick."},{"ts":"2026-09-20T11:25:00Z","from":"mocked","to":"concepted","agent":"creative-director","v":"0.1.0","note":"Archetype: the kitchen noticeboard. The governing constraint is that KA's best photograph - fifteen people at the long table - is 576x768, less than half the width a full-bleed hero needs, which is exactly what Shahar called pixelated. So this site may never show a photograph larger than a postcard and its first screen has none at all: type, three score tags, three pinned booking cards. Three concepts: The board / Today / Fifteen at the table. Prints are matted at postcard size (references.md #9) and type carries the page (#8)."},{"ts":"2026-09-20T12:50:00Z","from":"concepted","to":"mocked","agent":"designer","v":"0.2.0","note":"Rebuilt to the kitchen-noticeboard archetype. Nothing is shared with the previous attempt except the two typefaces: dark clay wall, everything pinned to it, and NO photograph rendered wider than a postcard anywhere on the site - the first screen has none at all. That is not a style choice: KA's best photograph is 576x768 and stretching it across a hero is what Shahar called pixelated. calm 'The board': centred head, three centred booking cards, today's breakfast as a list, matted prints, a bed ledger, tag labels, 0 bytes of JS. interactive 'Today': one large card whose print cross-fades through four moments of the day with a WebGL heat shimmer, capped at 380px rendered. unique 'Fifteen at the table': overlapping type, a 9.8/9.5/4.8 tally, prints set on a table-edge rule, place-card quotes, the long-table print run like a home film. Whole dist under 800KB each. 0 broken images, no-JS path verified, Esc-closes-and-returns-focus verified."},{"ts":"2026-09-20T14:20:00Z","from":"mocked","to":"mocked","agent":"critic","v":"0.2.0","note":"Station 4f quick pre-score written to reports/2026-09-ahangama-02/ka-surf-hostel-and-restaurant.md. All three variants pass: no hard fail, dimensions 1/3/7 well above the gate. Evidence measured per mockup into audit.json by the new tools/audit-mockup.mjs - first-load network log on a throttled phone (1.6 Mbps, 150 ms RTT, 4x CPU), LCP and CLS, booking targets diffed character for character against the dossier, JavaScript-off path, keyboard Esc and focus return, reduced-motion, alt and tap-target coverage. Lighthouse itself NOT run: no runner exists in tools/, and the scorecard says so rather than implying one. Awaiting the human pick."},{"ts":"2026-09-20T15:00:00Z","from":"mocked","to":"concepted","agent":"human","v":null,"note":"REJECTED at the pick gate. Shahar verbatim: \"no mockup looks good. I'd ask for 3 new mockups.\" No variant picked. All three were built on the kitchen-noticeboard archetype (concepts.md), so a rejection of all three is a rejection of the archetype, not of one layout. Goes back to station 4d for a new archetype and three new concepts before any markup. The hard constraint that produced the noticeboard still holds: KA's best photograph is 576x768 and may not be used full-bleed."},{"ts":"2026-09-20T15:40:00Z","from":"concepted","to":"concepted","agent":"creative-director","v":"0.1.0","note":"ROUND 2 after the pick gate rejected all three round-1 mockups. Shahar named three faults: the noticeboard idea itself, too text-heavy, and dated/cheap. The archetype is replaced: THE CHART. Admiralty Chart 3730, the 1900s survey of this coast, public domain at 16733px, is the ground and the device that answers where is this - which is what KA sells: five minutes from Kabalana, two from the station. Licensed ocean photography carries the full-bleed moments; the hostels own 576px photographs stay small and close, which is what they can hold. Contemporary grotesk, flat, no tilts or paper mats. Three concepts: Five minutes / Soundings / Latitude."},{"ts":"2026-09-20T16:30:00Z","from":"concepted","to":"mocked","agent":"designer","v":"0.2.0","note":"ROUND 2, on the chart archetype. Admiralty Chart 3730 - the 1900s survey of this coast, public domain at 16733px - is the ground, because position is what KA sells: five minutes from Kabalana. calm Five minutes: a split head, chart beside ocean, name on the seam, the distance as a measured scale bar, 0 bytes of JS. interactive Soundings: the chart pinned and washing out into the water it describes, the dissolve driven by the charts own ink density so the soundings are the last thing to leave. unique Latitude: one horizon, sea above the line and chart paper below, the sentence straddling it, then the horizon becomes a spine of depth marks down the margin. Licensed atmosphere carries the wide shots and every one is credited in place and in the footer; the hostels own 576px photographs stay close and small. Flat and contemporary - no tilts, no mats, no shadows. All three pass check-design and the audit; 0 third-party on first load."},{"ts":"2026-09-20T17:20:00Z","from":"mocked","to":"mocked","agent":"designer","v":"0.2.0","note":"CORRECTION. The first build of the chart archetype used photographs of Hikkaduwa (33km up the coast), Weligama, Thiranagama and Negombo (180km) on a page about Ahangama, and cropped the Admiralty sheet to its Weligama Bay plan. Shahar caught it: a photograph of somewhere else shown as this place is a false claim about the business, same class as an invented price. Fourteen images deleted, including nine tea-factory interiors that Commons files under Ahangama. The pages now use real Ahangama photography - the reef shelf, the beach with the stilt poles, the stilt fishermen - plus chart texture and open sea that name nowhere. Those Ahangama frames are CC BY-SA so they are shown whole and never adapted; shader inputs are public-domain and CC BY only. tools/check-places.mjs now fails a build on any of this. Accent colour changed from chart red /* ---------- helpers ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dShort=iso=>{const d=new Date(iso);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`};
const tShort=iso=>{const d=new Date(iso);return `${dShort(iso)} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`};
const runShort=id=>id.replace(/^\d{4}-\d{2}-/,'');
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;else if(v!=null)e.setAttribute(k,v)}for(const k of kids){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e};
const sv=(tag,attrs={},...kids)=>{const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs)){if(k==='text')e.textContent=v;else if(v!=null)e.setAttribute(k,v)}for(const k of kids)if(k)e.append(k);return e};
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);

/* tooltip: dark (Logip) or light (Shopeers) */
function tip(kind,x,y,lines,anchor='mid'){
  const g=sv('g',{class:`tip ${kind}`,'aria-hidden':'true'});
  g.append(sv('rect',{rx:8,ry:8,height:lines.length*20+16}));
  lines.forEach((l,i)=>g.append(sv('text',{x:12,y:16+i*20+6,class:l[1]||(i===0?'h':''),text:l[0]})));
  g.dataset.x=x;g.dataset.y=y;g.dataset.anchor=anchor;
  return g;
}
function sizeTips(svg){
  for(const g of svg.querySelectorAll('.tip')){
    const texts=[...g.querySelectorAll('text')];
    const w=Math.ceil(Math.max(...texts.map(t=>t.getComputedTextLength())))+24;
    const rect=g.querySelector('rect');rect.setAttribute('width',w);
    const h=+rect.getAttribute('height');
    const x=+g.dataset.x,y=+g.dataset.y,a=g.dataset.anchor;
    const W=svg.clientWidth||+svg.getAttribute('width');
    let tx=a==='mid'?x-w/2:a==='left'?x:x-w;
    tx=Math.max(-8,Math.min(tx,W-w+8));
    g.setAttribute('transform',`translate(${tx},${y-h-10})`);
  }
}
const once=(()=>{const done=new Set();return k=>done.has(k)?false:(done.add(k),true)})();
function drawIn(svg,key){
  const go=()=>{svg.querySelectorAll('.pre').forEach(e=>e.classList.remove('pre'));svg.querySelectorAll('.draw').forEach(p=>p.style.strokeDashoffset=0)};
  if(reduced||!once(key))go();else requestAnimationFrame(()=>requestAnimationFrame(go));
}
function countUp(node,to,key){
  const dec=Number.isInteger(to)?0:1;
  if(reduced||!once(key)){node.textContent=to.toFixed(dec);return}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/600);node.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

let lastHash='';

/* ---------- charts ---------- */
function sparkline(days,values,key,opts={}){
  const W=opts.w||150,H=opts.h||36,pad=3,n=values.length,white=!!opts.white;
  const max=Math.max(1,...values)*1.35;
  const x=i=>pad+i*(W-pad*2-28)/(n-1);
  const y=v=>H-pad-(v/max)*(H-pad*2);
  const svg=sv('svg',{width:W,height:H,role:'img','aria-label':`${key} per day, ${dShort(days[0])} to ${dShort(days.at(-1))}`});
  svg.append(sv('title',{text:`${key} per day`}));
  const pts=values.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const stroke=white?'#fff':'var(--acc)',fill=white?'rgba(255,255,255,.16)':'var(--t5)';
  svg.append(sv('path',{d:`${line} L${pts.at(-1)[0]} ${H} L${pts[0][0]} ${H}Z`,fill,class:'fadein pre'}));
  const path=sv('path',{d:line,fill:'none',stroke,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round',class:'draw'});
  svg.append(path);
  svg.append(sv('circle',{cx:pts.at(-1)[0],cy:pts.at(-1)[1],r:4,fill:stroke}));
  svg.append(sv('text',{x:pts.at(-1)[0]+9,y:pts.at(-1)[1]+4.5,style:`font-weight:700;font-size:13px;fill:${white?'#fff':'var(--ink)'}`,text:fmt(values.at(-1))}));
  values.forEach((v,i)=>{
    const g=sv('g',{class:'datum',tabindex:0,role:'img','aria-label':`${dShort(days[i])}: ${fmt(v)} ${key.toLowerCase()}`});
    g.append(sv('circle',{cx:pts[i][0],cy:pts[i][1],r:7,fill:'transparent',class:'hit'}));
    g.append(sv('circle',{cx:pts[i][0],cy:pts[i][1],r:3,fill:white?'var(--acc)':'#fff',stroke:stroke,'stroke-width':2,class:'tipdot'}));
    g.append(tip('light',pts[i][0],pts[i][1]-4,[[`${dShort(days[i])} · ${fmt(v)}`]]));
    svg.append(g);
  });
  const fig=el('figure',{class:'spark'+(white?' wspark':'')});
  fig.append(svg,el('div',{class:'dates'},el('span',{text:dShort(days[0])}),el('span',{text:dShort(days.at(-1))})));
  requestAnimationFrame(()=>{const L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L;sizeTips(svg);drawIn(svg,'spark-'+key+'-'+state.run+'-'+state.range)});
  return fig;
}
function gauge(value,sites){
  const W=156,H=88,cx=78,cy=80,r=60,sw=10;
  const svg=sv('svg',{width:W,height:H,role:'img','aria-label':`Critic mean ${fmt(value)} of 100; pass mark 80`});
  svg.append(sv('title',{text:'Critic mean, last score of each live site'}));
  const arc=`M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  svg.append(sv('path',{d:arc,fill:'none',stroke:'var(--t5)','stroke-width':sw,'stroke-linecap':'round'}));
  const L=Math.PI*r;
  const val=sv('path',{d:arc,fill:'none',stroke:'var(--acc)','stroke-width':sw,'stroke-linecap':'round',class:'draw'});
  val.style.strokeDasharray=L;val.style.strokeDashoffset=L-(value/100)*L;
  svg.append(val);
  const a=Math.PI*(1-0.8),tx=cx+Math.cos(a)*r,ty=cy-Math.sin(a)*r,dx=Math.cos(a),dy=-Math.sin(a);
  svg.append(sv('line',{x1:tx+dx*9,y1:ty+dy*9,x2:tx+dx*15,y2:ty+dy*15,stroke:'var(--ink)','stroke-width':2,'stroke-linecap':'round'}));
  svg.append(sv('text',{x:tx+dx*20,y:ty+dy*20+5,class:'ax ink',text:'pass 80'}));
  const num=sv('text',{x:cx,y:cy-2,'text-anchor':'middle',style:'font-size:36px;font-weight:300;letter-spacing:-.02em;fill:var(--ink)',text:'0'});
  svg.append(num);
  const g=sv('g',{class:'datum',tabindex:0,role:'img','aria-label':`Per site: ${sites.map(s=>`${s.name} ${fmt(s.score)}`).join(', ')}`});
  g.append(sv('rect',{x:0,y:0,width:W,height:H,fill:'transparent',rx:12,class:'hit'}));
  g.append(tip('dark',cx,cy-r-14,[['Latest score per site'],...sites.map(s=>[`${s.name}  ${fmt(s.score)}`,'sec'])]));
  svg.append(g);
  countUp(num,value,'gauge-'+state.run);
  requestAnimationFrame(()=>sizeTips(svg));
  if(!reduced&&once('gauge-draw-'+state.run)){val.style.strokeDashoffset=L;requestAnimationFrame(()=>requestAnimationFrame(()=>{val.style.strokeDashoffset=L-(value/100)*L}))}
  return svg;
}
/* score across rounds and verifications (Sites) */
function scoreChart(series,W,key){
  const H=110,padL=30,padR=12,top=14,bottom=24,n=series.length;
  const x=i=>n===1?padL+(W-padL-padR)/2:padL+i*(W-padL-padR)/(n-1);
  const lo=50,hi=100;
  const y=v=>top+(1-(v-lo)/(hi-lo))*(H-top-bottom);
  const svg=sv('svg',{width:W,height:H,role:'img','aria-label':`Critic score across ${n} scored lines: ${series.map(s=>`${s.kind==='round'?'round '+s.round:s.kind} ${fmt(s.score)} ${s.verdict}`).join(', ')}`});
  svg.append(sv('title',{text:'Critic score per round and verification'}));
  for(const t of [60,80,100]){svg.append(sv('line',{x1:padL,x2:W-padR,y1:y(t),y2:y(t),stroke:t===80?'var(--ink2)':'var(--rule)','stroke-dasharray':t===80?'4 4':null}));svg.append(sv('text',{x:padL-8,y:y(t)+4,'text-anchor':'end',class:'ax',text:String(t)}))}
  svg.append(sv('text',{x:W-padR,y:y(80)-5,'text-anchor':'end',class:'ax ink',text:'pass'}));
  const pts=series.map((s,i)=>[x(i),y(s.score)]);
  if(n>1){
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    svg.append(sv('path',{d:`${line} L${pts.at(-1)[0]} ${y(lo)} L${pts[0][0]} ${y(lo)}Z`,fill:'var(--t5)',class:'fadein pre'}));
    const path=sv('path',{d:line,fill:'none',stroke:'var(--acc)','stroke-width':2,'stroke-linejoin':'round',class:'draw'});svg.append(path);
    requestAnimationFrame(()=>{const L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L});
  }
  let vi=0;
  series.forEach((s,i)=>{
    const isR=s.kind==='round';const lbl=isR?`R${s.round}`:`V${++vi}`;
    const g=sv('g',{class:'datum',tabindex:0,role:'img','aria-label':`${isR?'Round '+s.round:'Verification '+vi}, ${dShort(s.ts)}: ${fmt(s.score)}, ${s.verdict}`});
    g.append(sv('circle',{cx:pts[i][0],cy:pts[i][1],r:10,fill:'transparent',class:'hit'}));
    g.append(sv('circle',{cx:pts[i][0],cy:pts[i][1],r:5,fill:isR?'var(--acc)':'#fff',stroke:'var(--acc)','stroke-width':2}));
    g.append(sv('text',{x:pts[i][0],y:H-6,'text-anchor':'middle',class:'ax',text:lbl}));
    g.append(tip('dark',pts[i][0],pts[i][1]-6,[[`${isR?'round '+s.round:'verification '+vi} · ${fmt(s.score)} · ${s.verdict}`],[dShort(s.ts),'sec']]));
    svg.append(g);
  });
  requestAnimationFrame(()=>{sizeTips(svg);drawIn(svg,'score-'+key)});
  return svg;
}
/* column chart with one highlighted (max) column and a dashed mean (Agents) */
function columns(items,W,key,opts={}){
  const H=opts.h||132,top=28,bottom=22,padL=26,n=items.length;
  const max=Math.max(1,...items.map(i=>i.value));
  const gap=n>16?3:8;
  const cw=Math.max(3,Math.min(28,(W-padL-(n-1)*gap)/n));
  const x=i=>padL+i*(cw+gap);
  const y=v=>top+(1-v/max)*(H-top-bottom);
  const mean=items.reduce((a,i)=>a+i.value,0)/n;
  const maxI=items.findIndex(i=>i.value===max);
  const svg=sv('svg',{width:W,height:H,role:'img','aria-label':`${opts.title||key}: ${items.map(i=>`${i.label} ${i.value}`).join(', ')}; mean ${mean.toFixed(1)}`});
  svg.append(sv('title',{text:opts.title||key}));
  for(let t=0;t<=max;t+=Math.max(1,Math.ceil(max/4))){svg.append(sv('line',{x1:padL,x2:W,y1:y(t),y2:y(t),stroke:'var(--rule)'}));svg.append(sv('text',{x:padL-8,y:y(t)+4,'text-anchor':'end',class:'ax',text:String(t)}))}
  svg.append(sv('line',{x1:padL,x2:W,y1:y(mean),y2:y(mean),stroke:'var(--ink2)','stroke-dasharray':'4 4'}));
  svg.append(sv('text',{x:W,y:y(mean)-5,'text-anchor':'end',class:'ax ink',text:`mean ${mean.toFixed(1)}`}));
  items.forEach((it,i)=>{
    const hi=i===maxI&&max>1;
    const g=sv('g',{class:'datum',tabindex:0,role:'img','aria-label':`${it.title||it.label}: ${it.value}`});
    g.append(sv('rect',{x:x(i)-gap/2,y:top-8,width:cw+gap,height:H-top+8-bottom+8,fill:'transparent',rx:6,class:'hit'}));
    g.append(sv('rect',{x:x(i),y:y(it.value),width:cw,height:y(0)-y(it.value),rx:Math.min(6,cw/2),fill:hi?'var(--acc)':'var(--t4)',class:'grow up pre'}));
    if(n<=16)g.append(sv('text',{x:x(i)+cw/2,y:H-6,'text-anchor':'middle',class:'ax',text:it.label}));
    if(hi){const tg=sv('g',{});tg.append(sv('rect',{x:x(i)+cw/2-12,y:y(it.value)-26,width:24,height:20,rx:6,fill:'var(--ink)'}));tg.append(sv('text',{x:x(i)+cw/2,y:y(it.value)-12,'text-anchor':'middle',style:'fill:#fff;font-size:13px;font-weight:700',text:String(it.value)}));g.append(tg)}
    g.append(tip('dark',x(i)+cw/2,y(it.value)-(hi?30:4),[[`${it.title||it.label} · ${it.value} ${opts.unit||''}`.trim()],...(it.sub?[[it.sub,'sec']]:[])]));
    svg.append(g);
  });
  if(n>16)svg.append(sv('text',{x:padL,y:H-6,class:'ax',text:`${items[0].label} … ${items.at(-1).label} (${n} passes)`}));
  requestAnimationFrame(()=>{sizeTips(svg);drawIn(svg,'cols-'+key)});
  return svg;
}
/* horizontal stacked bars: fails per agent, segments per business (Agents glance) */
function failsChart(rows,W){
  const rowH=48,labelW=120,H=rows.length*rowH;
  const max=Math.max(1,...rows.map(r=>r.total));
  const barW=W-labelW-56;
  const svg=sv('svg',{width:W,height:H,role:'img','aria-label':`Fails by agent: ${rows.map(r=>`${r.agent} ${r.total}`).join(', ')}`});
  svg.append(sv('title',{text:'Fails this run by agent, split by business'}));
  const tints=['var(--acc)','var(--t2)','var(--t3)','var(--t4)'];
  rows.forEach((r,i)=>{
    const y=i*rowH+rowH/2;
    svg.append(sv('text',{x:0,y:y+5,class:'ax ink',style:'font-weight:700;font-size:15px',text:r.agent}));
    let x=labelW;
    if(!r.total){svg.append(sv('rect',{x:labelW+.5,y:y-9.5,width:40,height:19,rx:8,fill:'none',stroke:'var(--t3)','stroke-dasharray':'3 3'}))}
    r.parts.forEach((p,j)=>{
      const w=p.n/max*barW;
      const g=sv('g',{class:'datum',tabindex:0,role:'img','aria-label':`${r.agent}, ${p.name}: ${p.n} fail${p.n===1?'':'s'}`});
      g.append(sv('rect',{x,y:y-10,width:w,height:20,fill:tints[Math.min(j,3)],rx:0,class:'hit'}));
      g.append(sv('text',{x:x+w/2,y:y+4.5,'text-anchor':'middle',style:`font-size:13px;font-weight:700;fill:${j===0?'#fff':'var(--ink)'}`,text:w>18?String(p.n):''}));
      g.append(tip('dark',x+w/2,y-10,[[`${p.name} · ${p.n} fail${p.n===1?'':'s'}`],[`${r.agent}`,'sec']]));
      svg.append(g);x+=w;
    });
    svg.append(sv('text',{x:W,y:y+6,'text-anchor':'end',class:'ax b',style:r.total?'':'fill:var(--ink3);font-weight:400',text:String(r.total)}));
  });
  requestAnimationFrame(()=>sizeTips(svg));
  return svg;
}

/* ---------- Overview ---------- */
function deltaLine(delta){
  const dl=el('div',{class:'delta'});
  if(delta&&delta.delta!=null){
    const d=delta.delta;const p=el('span',{class:'dpill '+(d>0?'up':d<0?'down':'flat')});
    if(d!==0)p.append(sv('svg',{viewBox:'0 0 10 10','aria-hidden':'true'},sv('path',{d:d>0?'M5 1 9 8H1z':'M5 9 1 2h8z',fill:'currentColor'})));
    p.append((d>0?'+':'')+fmt(d));
    dl.append(p,el('span',{text:`vs ${runShort(delta.previous_run)} (${fmt(delta.previous)})`}));
  }else dl.append(el('span',{text:'no earlier run to compare',title:delta?delta.note:''}));
  return dl;
}
function kpiCard(key,label,val,delta,spark){
  const c=el('article',{class:'card kpi','aria-label':`${label}: ${fmt(val)}`});
  c.append(el('span',{class:'label',text:label}));
  const row=el('div',{class:'kpi-row'});
  const n=el('div',{class:'num',text:'0'});row.append(n);
  if(spark)row.append(spark);
  c.append(row,deltaLine(delta));
  countUp(n,val,'kpi-'+key+'-'+state.run);
  return c;
}
function emptyCard(key,label,delta){
  const es=D.empty_states[key];
  const c=el('article',{class:'card kpi','aria-label':`${label}: 0, ${es.filled_by}`});
  c.append(el('span',{class:'label',text:label}),el('div',{class:'kpi-row'},el('div',{class:'num hollow',text:'0'})));
  c.append(el('p',{class:'empty',title:`${es.filled_by}. ${es.earliest[0].toUpperCase()+es.earliest.slice(1)}. ${delta&&delta.note?delta.note:''}`,text:`fills on ${es.filled_by.replace(/^a ledger line /,'').replace(' (agent: human)','')}`}));
  return c;
}
function renderKPIs(){
  const box=$('#kpis');box.innerHTML='';
  const K=D.kpis_by_run[state.run];
  const dl=k=>isCur()?D.deltas[k]:{delta:null,note:'no earlier run'};
  const n=rangeN(),dd=days.slice(-n);

/* ---------- Pipeline ---------- */
const GROUP_LABEL={gate:'waiting on you',delivered:'waiting on you',pipeline:'in progress',dropped:'dropped',not_approved:'not approved',not_shortlisted:'not shortlisted',superseded:'superseded',pitched:'pitched',outcome:'outcome'};
const GROUP_ORDER=['gate','delivered','pitched','outcome','pipeline','dropped','not_approved','not_shortlisted','superseded'];
function stationBar(b,W){
  const H=22,ty=8,th=8,n=D.stations.length,seg=W/n;
  const active=!b.out,fillCol=active?'var(--acc)':'var(--t3)',reachedTo=b.station||0;
  const svg=sv('svg',{width:W,height:H});
  const g=sv('g',{class:'bar',tabindex:0,role:'img','aria-label':`${b.name}: station ${reachedTo} of ${n}, ${D.stations[reachedTo-1]?.name||''}, state ${b.state}${b.next_step&&b.next_step!=='—'?`, next ${b.next_step} (${b.owner===D.human?'you':b.owner})`:''}. Arrow keys walk the stations.`});
  g.append(sv('rect',{x:0,y:ty,width:W,height:th,rx:4,fill:'var(--t5)',class:'hit'}));
  g.append(sv('rect',{x:0,y:ty,width:Math.max(0,seg*reachedTo),height:th,rx:4,fill:fillCol,class:'grow pre'}));
  const segs=[];
  for(const s of D.stations){
    const sx=(s.n-1)*seg,date=b.station_dates[s.n];
    const hit=sv('g',{class:'seg'});
    hit.append(sv('rect',{x:sx,y:0,width:seg,height:H,fill:'transparent'}));
    const lines=[[`${s.n} ${s.name}`],[date?`reached ${dShort(date)}`:'not reached','sec']];
    if(s.gate)lines.push([`gate: ${s.gate}`,'sec']);
    if(s.n===reachedTo)lines.push([`current · ${b.state}`,'sec']);
    hit.append(tip('dark',sx+seg/2,ty-2,lines));
    hit.dataset.text=lines.map(l=>l[0]).join(', ');
    g.append(hit);segs.push(hit);
    if(s.gate){
      const gx=s.n*seg-(s.n===n?6:0),passed=reachedTo>s.n||(reachedTo===s.n&&!b.gate);
      g.append(sv('circle',{cx:gx,cy:ty+th/2,r:5.5,fill:passed?fillCol:'#fff',stroke:(passed||(reachedTo>=s.n-1&&active))?fillCol:'var(--t3)','stroke-width':2}));
    }
  }
  let sel=-1;
  const select=i=>{segs.forEach((s,j)=>s.classList.toggle('sel',j===i));sel=i;if(i>=0)live(`${b.name}: ${segs[i].dataset.text}`)};
  g.addEventListener('focus',()=>select(Math.max(0,reachedTo-1)));
  g.addEventListener('blur',()=>select(-1));
  g.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(Math.min(n-1,sel+1))}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(Math.max(0,sel-1))}
    else if(e.key==='Home'){e.preventDefault();select(0)}else if(e.key==='End'){e.preventDefault();select(n-1)}
  });
  svg.append(sv('title',{text:`Stations for ${b.name}`}),g);
  requestAnimationFrame(()=>{sizeTips(svg);drawIn(svg,'bar-'+b.slug+'-'+b.run_id)});
  return svg;
}
function pillFor(b){
  if(b.gate)return ['gate',b.gate];

  if(b.group==='dropped')return ['drop','dropped'];
  if(b.group==='pitched'||b.group==='outcome')return ['live',b.state];
  return ['grey',GROUP_LABEL[b.group]||b.group];
}

function renderAgents(){
  const run=state.run;
  const A=Object.entries(D.agents).map(([name,a])=>({name,a,r:a.by_run[run]||{lines:0,passes:0,fails:0,rounds_per_pass:[],fails_by_slug:{},versions_seen:[]}}));
  const withFails=A.filter(x=>x.r.fails>0).sort((p,q)=>q.r.fails-p.r.fails);
  const totalFails=withFails.reduce((s,x)=>s+x.r.fails,0);
  const box=$('#agg-chart');box.innerHTML='';
  $('#agg-meta').textContent=`${runShort(run)} · ${totalFails} fail${totalFails===1?'':'s'} across ${withFails.length} agent${withFails.length===1?'':'s'}`;
  const compactA=matchMedia('(max-width:1280px)').matches;
  const W=compactA?Math.min(1232,innerWidth)-72-48-56:1096;
  const rows=withFails.map(x=>({agent:x.name,total:x.r.fails,parts:Object.entries(x.r.fails_by_slug).sort((p,q)=>q[1]-p[1]).map(([slug,n])=>({name:shortName(slug),n}))}));
  const scored=A.filter(x=>x.r.passes>0&&x.r.fails===0);
  rows.push(...scored.map(x=>({agent:x.name,total:0,parts:[]})));
  if(rows.length)box.append(failsChart(rows,W));
  const leg=el('p',{class:'sect',style:'margin-top:12px'});
  leg.append(rows.filter(r=>r.total).map(r=>`${r.agent}: ${r.parts.map(p=>`${p.name} ${p.n}`).join(' · ')}`).join('  —  ')||'no fail line in this run',`. ${A.filter(x=>!x.r.passes&&!x.r.fails).length} agents have no pass/fail state in the ledger.`);
  box.append(leg);
  const grid=$('#ag-grid');grid.innerHTML='';
  const big=[...withFails,...scored.sort((p,q)=>q.r.passes-p.r.passes)];
  const cw=(matchMedia('(max-width:1280px)').matches?Math.min(1232,innerWidth)-72-48:(1152-24)/2)-56;
  for(const x of big){
    const c=el('article',{class:'card ag','aria-label':x.name});
    const h=el('div',{class:'card-h'});h.append(el('h2',{text:x.name}));
    const vp=el('span',{class:'vpill'+(x.a.pin_matches_changelog?'':' bad'),title:`run.yaml pins ${x.a.version_pinned}; CHANGELOG latest ${x.a.version_changelog} (${x.a.changelog_date})`});
    vp.append(el('i',{'aria-hidden':'true'}),`v${x.a.version_pinned} · ${x.a.pin_matches_changelog?'pin = changelog':`changelog ${x.a.version_changelog}`}`);
    h.append(vp);c.append(h);
    const st=el('div',{class:'stats'});
    const stat=(k,v,bad)=>st.append(el('div',{},el('div',{class:'k',text:k}),el('div',{class:'v'+(bad?' bad':''),text:String(v)})));
    stat('Passes',x.r.passes);stat('Fails',x.r.fails,x.r.fails>0);stat('Overrides',x.a.third_fail_overrides.filter(o=>o.run_id===run).length,false);stat('Ledger lines',x.r.lines);
    c.append(st);
    if(x.r.rounds_per_pass.length){
      c.append(el('div',{class:'label',text:'Rounds needed per pass'}));
      const items=x.r.rounds_per_pass.map(p=>({label:shortName(p.slug).slice(0,3),title:`${shortName(p.slug)} · pass on ${dShort(p.ts)}`,value:p.rounds,sub:dShort(p.ts)}));
      c.append(el('figure',{style:'margin-top:8px'},columns(items,cw,x.name+'-'+run,{title:`${x.name}: rounds needed per pass`,unit:'rounds'})));
    }
    if(Object.keys(x.r.fails_by_slug).length){
      const ch=el('div',{class:'chips'});ch.append(el('span',{class:'label',style:'align-self:center',text:'Fails by business'}));
      for(const [slug,n] of Object.entries(x.r.fails_by_slug).sort((p,q)=>q[1]-p[1]))ch.append(el('span',{class:'chip',text:`${shortName(slug)} ${n}`}));
      c.append(ch);
    }
    const ov=x.a.third_fail_overrides.filter(o=>o.run_id===run);
    if(ov.length){
      c.append(el('div',{class:'label',style:'margin-top:16px',text:'Third-fail overrides by Shahar'}));
      const ul=el('ul',{class:'ovl'});
      for(const o of ov)ul.append(el('li',{title:o.note},el('time',{datetime:o.ts,text:tShort(o.ts)}),el('b',{text:shortName(o.slug)}),el('span',{text:o.note})));
      c.append(ul);
    }
    c.append(el('p',{class:'chlog',title:x.a.changelog_line},el('b',{text:`CHANGELOG ${x.a.version_changelog} · ${dShort(x.a.changelog_date)} — `}),x.a.changelog_line.replace(/^\*\*[^*]+\*\*\s*—\s*[\d-]+\s*—\s*/,'').replace(/`/g,'')));
    grid.append(c);
  }
  const mini=$('#ag-mini');mini.innerHTML='';
  for(const x of A.filter(x=>!big.includes(x))){
    const c=el('article',{class:'card mini','aria-label':x.name});
    c.append(el('h3',{text:x.name}));
    const vp=el('span',{class:'vpill'+(x.a.pin_matches_changelog?'':' bad'),title:`run.yaml pins ${x.a.version_pinned}; CHANGELOG latest ${x.a.version_changelog}`});vp.append(el('i',{'aria-hidden':'true'}),`v${x.a.version_pinned} · ${x.a.pin_matches_changelog?'pin = changelog':'pin ≠ changelog'}`);
    c.append(vp,el('div',{class:'n',text:`${x.r.lines} ledger line${x.r.lines===1?'':'s'} this run · no pass/fail state`}));
    c.append(el('p',{class:'chlog',title:x.a.changelog_line},el('b',{text:`${x.a.version_changelog} · ${dShort(x.a.changelog_date)} — `}),x.a.changelog_line.replace(/^\*\*[^*]+\*\*\s*—\s*[\d-]+\s*—\s*/,'').replace(/`/g,'')));
    mini.append(c);
  }
}

/* ---------- Decisions ---------- */
function renderDecisions(){
  const start=rangeStart();
  const all=D.decisions.filter(d=>d.run_id===state.run&&d.ts.slice(0,10)>=start);
  const gates=all.filter(d=>d.gate).length,ovr=all.filter(d=>d.override).length;
  const filt=$('#dec-filters');filt.innerHTML='';
  for(const [k,l,n] of [['all','All',all.length],['gate','Gates',gates],['override','Overrides',ovr]]){const b=el('button',{type:'button','aria-pressed':String(state.decFilter===k)});b.append(l,el('i',{text:n}));b.onclick=()=>{state.decFilter=k;renderDecisions()};filt.append(b)}
  const shown=all.filter(d=>state.decFilter==='all'||d[state.decFilter]);
  $('#dec-sum').innerHTML='';$('#dec-sum').append(el('span',{text:`${runShort(state.run)} · ${all.length} in range · ${gates} gates · ${ovr} overrides`}));
  const ol=$('#tl');ol.innerHTML='';
  if(!shown.length)ol.append(el('li',{},el('span',{class:'dot','aria-hidden':'true'}),el('div',{class:'h'},el('b',{text:'No decision in this range'}))));
  for(const d of shown){
    const li=el('li',{class:(d.gate?'gate ':'')+(d.override?'ovr':'')});
    li.append(el('span',{class:'dot','aria-hidden':'true'}));
    const h=el('div',{class:'h'});
    h.append(el('b',{text:bizName(d.slug)}),el('span',{class:'tr',text:`${d.from??'start'} → ${d.to}`}));
    if(d.gate)h.append(el('span',{class:'tag g',text:D.gate_states[d.from]||'gate'}));
    if(d.override)h.append(el('span',{class:'tag o',text:'override'}));
    h.append(el('time',{datetime:d.ts,text:tShort(d.ts)}));
    li.append(h);
    const note=el('p',{class:'note',text:d.note});li.append(note);
    if(d.note.length>220){const b=el('button',{class:'more',type:'button',text:'Show the full reason','aria-expanded':'false'});b.onclick=()=>{const o=li.classList.toggle('open');b.textContent=o?'Show less':'Show the full reason';b.setAttribute('aria-expanded',String(o))};li.append(b)}
    ol.append(li);
  }
  const pl=$('#props-list');pl.innerHTML='';
  const props=D.proposals;
  $('#props-meta').textContent=`${props.filter(p=>p.status).length} without a merge record`;
  for(const p of props){
    const li=el('li');
    li.append(el('div',{class:'t'},el('a',{href:REPO+p.file,text:p.title})));
    const m=el('div',{class:'m'});
    m.append(el('span',{text:runShort(p.run_id)}),el('span',{class:'tag'+(p.custom_md?' c':''),text:p.custom_md?'custom.md proposal':p.kind}));
    if(p.status)m.append(el('span',{class:'tag',text:p.status}));
    m.append(el('a',{href:REPO+p.file,text:p.file.split('/').pop()}));
    li.append(m);pl.append(li);
  }
}

/* ---------- render ---------- */
function render(){
  $('#title-sub').textContent=`${runShort(state.run)} · ${dShort(rangeStart())} – ${dShort(days.at(-1))}`;
  renderKPIs();renderNeeds();renderFunnel();renderFeed();renderPipeline();renderSites();renderAgents();renderDecisions();
  document.querySelectorAll('.view.on svg').forEach(sizeTips);
}
render();
let rw=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-rw)>40){rw=innerWidth;render()}});
const h=location.hash.replace('#','').split('/');
if(h[0])go(h[0],h[1]);
})();
</script>
</body>
