<!-- Agents view (run dashboard-04, B "Board", as picked 2026-10-06): markup, styles and script; registers window.OSViews.agents(api). Built into the page by build.mjs. Everything is computed in the browser from api.D (live data.json); agent files are read live through the server (files/agents/...). Class names carry the agv- prefix. -->
<style>
.agv{--agv-read:#1B1530;--agv-chip:#F3F4F8;--agv-rule2:#EEF0F5;--agv-hover:#F8F9FC;--agv-amber:#9A5B00;--agv-amber-bg:#FFF4E0;--agv-grey:#8A93A3;--agv-red-bg:#FDECEE;font-size:16px;line-height:1.5;padding-bottom:24px}
.agv *,.agv-pop *{box-sizing:border-box}
:where(.agv) :is(h1,h2,h3,p,ul,ol,dl,dd){margin:0}
:where(.agv) button,:where(.agv) textarea{font:inherit;color:inherit}
:where(.agv) button{cursor:pointer}
.agv-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.agv-lede{font-size:17px;color:var(--ink2);margin:4px 0 20px}
.agv-lede b{color:var(--ink);font-weight:700}
/* summary */
.agv-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:22px 0}
.agv-cell{padding:0 28px;display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center}
.agv-cell+.agv-cell{border-left:1px solid var(--rule)}
.agv-cell .agv-ic{grid-row:1/3;width:46px;height:46px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center}
.agv-cell .agv-ic svg{width:22px;height:22px}
.agv-ic.r{background:var(--agv-red-bg);color:var(--red)}.agv-ic.p{background:var(--t5);color:var(--acc)}.agv-ic.g{background:var(--agv-chip);color:var(--ink2)}
.agv-cell .agv-lb{font-size:15px;font-weight:600;color:var(--ink2)}
.agv-cell .agv-r2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.agv-num{font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1.1}
.agv-num.r{color:var(--red)}.agv-num.p{color:var(--acc)}.agv-num.g{color:var(--ink3)}
.agv-cell small{font-size:15px;color:var(--ink2)}
.agv-golink{border:0;background:none;padding:6px 2px;color:var(--acc);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border-radius:8px}
.agv-golink:hover{text-decoration:underline;text-underline-offset:3px}
.agv-golink svg{width:16px;height:16px}
/* segmented control */
.agv-segrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 16px;flex-wrap:wrap}
.agv-seg{display:inline-flex;padding:4px;border-radius:999px;background:#fff;box-shadow:var(--shadow);gap:2px}
.agv-seg button{height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:600;color:var(--ink2);white-space:nowrap}
.agv-seg button:hover{color:var(--ink)}
.agv-seg button[aria-checked="true"]{background:var(--t5);color:var(--acc);font-weight:700}
.agv-segnote{font-size:15px;color:var(--ink2)}
/* board */
.agv-board{padding:6px 24px 0}
.agv-bhead{padding:18px 0 12px}
.agv-pack{padding:18px 20px;display:block}.agv-pack ul{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:22px;overflow-wrap:anywhere}.agv-pack .agv-role{display:block;margin-top:2px}.agv-pack .agv-nf{margin-top:10px;font-weight:600}
.agv-bhead h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.agv-bhead p{font-size:15px;color:var(--ink2);margin-top:4px}
.agv-row{display:grid;grid-template-columns:300px 160px minmax(0,1fr) 32px;align-items:center;position:relative}
.agv-work{display:grid;grid-template-columns:minmax(0,1fr) 120px;row-gap:10px;align-items:center}
.agv-thead{min-height:44px;border-top:1px solid var(--agv-rule2);border-bottom:1px solid var(--agv-rule2);font-size:14px;font-weight:600;color:var(--ink3)}
.agv-thead .agv-r{text-align:right;padding-right:16px}
.agv-brow{min-height:76px;padding:14px 0;border-bottom:1px solid var(--agv-rule2)}
.agv-brow:last-child{border-bottom:0}
.agv-brow:hover{background:var(--agv-hover);box-shadow:-24px 0 0 var(--agv-hover),24px 0 0 var(--agv-hover)}
.agv-brow.two{min-height:96px}
.agv-agent{min-width:0;padding-right:16px}
.agv-nm{font-size:16px;font-weight:700;text-decoration:none;color:var(--ink);line-height:1.3}
.agv-nm::after{content:"";position:absolute;inset:0;z-index:0}
.agv-nm:focus-visible{outline:0}
.agv-nm:focus-visible::after{outline:2px solid var(--acc);outline-offset:-2px;border-radius:12px}
.agv-role{display:block;font-size:14px;font-weight:500;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.agv-go{display:flex;justify-content:flex-end;color:var(--ink3)}
.agv-go svg{width:20px;height:20px}
.agv-frac{text-align:right;padding-right:16px;line-height:1.1}
.agv-frac b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.agv-frac small{display:block;font-size:14px;color:var(--ink3);font-weight:500;margin-top:2px}
.agv-frac .agv-none{font-size:15px;color:var(--ink3)}
.agv-brow .agv-sq,.agv-brow .agv-tick{position:relative;z-index:1}
/* states: light tint, coloured text */
.agv-state{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;line-height:1}
.agv-state i{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.agv-state.red{background:var(--agv-red-bg);color:var(--red)}.agv-state.red i{background:var(--red);color:#fff}
.agv-state.amber{background:var(--agv-amber-bg);color:#7A4600}.agv-state.amber i{background:var(--agv-amber);color:#fff}
.agv-state.fixed{background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc)}.agv-state.fixed i{background:var(--acc);color:#fff}
.agv-state.green{background:var(--green-bg);color:#14652C}.agv-state.green i{background:var(--green);color:#fff}
.agv-state.early,.agv-state.none{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--agv-grey)}
.agv-state.early i{width:8px;height:8px;background:var(--agv-grey);margin:0 4px}
.agv-state.none i{background:transparent;color:var(--ink2);font-size:15px}
.agv-state.sm{height:26px;font-size:13px;padding:0 10px 0 8px;gap:5px}
.agv-state.sm i{width:14px;height:14px;font-size:11px}
/* marks: round = kept, square = sent back, hollow = not counted */
.agv-strip{display:flex;align-items:center;gap:8px;min-width:0}
.agv-strip .agv-kl{font-size:14px;color:var(--ink3);font-weight:600;width:64px;flex:none}
.agv-sqs{display:flex;flex-wrap:wrap;align-items:center;gap:9px 3px}
.agv-sq{width:12px;height:12px;border-radius:50%;background:var(--green);position:relative;flex:none}
.agv-sq.bad{background:var(--red);border-radius:2px}
.agv-sq.ex{background:#fff;border-radius:2px;box-shadow:inset 0 0 0 2px var(--agv-grey)}
.agv-sq.step::before{content:"";position:absolute;left:4px;top:-7px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.agv-sq:hover,.agv-sq:focus-visible{transform:scale(1.25)}
.agv-sq:focus-visible,.agv-tick:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.agv-tick{width:2px;height:20px;margin-top:-4px;border-radius:2px;background:var(--acc);flex:none;position:relative}
.agv-tick::after{content:"";position:absolute;inset:-4px -6px}
.agv-snote{font-size:14px;color:var(--ink3);font-weight:500}
.agv-big .agv-sqs{gap:8px 4px}
.agv-big .agv-sq{width:16px;height:16px}
.agv-big .agv-sq.bad,.agv-big .agv-sq.ex{border-radius:3px}
.agv-big .agv-sq.step::before{left:5px;top:-8px;width:6px;height:6px}
/* legend */
.agv-legend{border-top:1px solid var(--agv-rule2);margin:0 -24px;padding:14px 24px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;background:#FBFCFE;border-radius:0 0 20px 20px}
.agv-k{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.agv-k .agv-sq:hover{transform:none}
.agv-legend details{margin-left:auto;font-size:14px;color:var(--ink2)}
.agv-legend summary{cursor:pointer;font-weight:700;border-radius:6px}
.agv-legend details[open]{flex-basis:100%;margin-left:0}
.agv-rules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 20px;margin-top:12px}
.agv-rules>div{display:flex;flex-direction:column;align-items:flex-start;gap:8px;line-height:1.4}
/* no-signal grid */
.agv-nosig{margin-top:36px}
.agv-tweaks{margin-top:24px;padding:24px 28px}
.agv-tweaks .dcv-sh{margin-top:0}
.agv-tweaks .dcv-surf.dcv-empty{background:var(--ground);border-radius:12px;box-shadow:none}
.agv-nosig h2{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.agv-count{min-width:28px;height:26px;border-radius:999px;background:#E9ECF2;color:var(--ink2);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
.agv-nosig>p{font-size:15px;color:var(--ink2);margin-top:6px}
.agv-ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.agv-ncard{display:flex;flex-direction:column;gap:10px;min-height:120px;padding:18px;border-radius:16px;background:#fff;box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative}
.agv-ncard:hover{box-shadow:0 1px 2px rgba(11,18,32,.05),0 12px 28px rgba(11,18,32,.08)}
.agv-ncard b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.agv-ncard .agv-role{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.agv-ncard .agv-bdg{position:absolute;right:14px;top:14px}
.agv-nf{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.agv-nl{font-size:14px;color:var(--ink3);margin-top:auto}
.agv-bdg{min-width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
/* agent page */
.agv-back{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 8px;margin:4px 0 0 -8px;border-radius:12px;font-size:15px;font-weight:700;color:var(--ink2);text-decoration:none}
.agv-back:hover{background:#fff;color:var(--ink)}
.agv-back svg{width:18px;height:18px}
.agv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:10px 0 22px;flex-wrap:wrap}
.agv-dt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.agv-dt h2{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.agv-dt h2:focus{outline:none}
.agv-drole{font-size:17px;color:var(--ink2);margin-top:6px}
.agv-viewseg button{min-width:112px}
.agv-simple{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:stretch}
.agv-block{padding:28px 32px 30px;display:flex;flex-direction:column}
.agv-block h3{font-size:15px;font-weight:700;color:var(--ink3);margin-bottom:12px}
.agv-block .agv-bigp{font-size:20px;line-height:1.55;color:var(--agv-read)}
.agv-block .agv-bigp b{font-weight:700}
.agv-cta{margin-top:auto;padding-top:24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.agv-cta p{font-size:15px;color:var(--ink2);line-height:1.5;flex:1;min-width:240px}
.agv-btnp{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.agv-btnp:hover{background:#5A22CC}
.agv-btnp svg{width:18px;height:18px}
.agv-btnp.lg{height:52px;padding:0 24px;font-size:16px}
.agv-btno{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--rule);background:#fff;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.agv-btno:hover{border-color:var(--t3);background:var(--t5)}
.agv-btno svg{width:18px;height:18px;color:var(--acc)}
.agv-btng{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap}
.agv-btng:hover{background:var(--ground)}
.agv-btng svg{width:16px;height:16px}
.agv-s{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.agv-btnp:disabled,.agv-btno:disabled{opacity:.55;cursor:not-allowed}
.agv-linkbtn{border:0;background:none;padding:4px 2px;color:var(--acc);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.agv-twlines{margin-top:24px;padding:18px 24px}
.agv-twlines h3{font-size:15px;font-weight:700;color:var(--ink3);margin-bottom:6px}
.agv-twl{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:10px 0;flex-wrap:wrap}
.agv-twl+.agv-twl{border-top:1px solid var(--agv-rule2)}
.agv-twl .agv-tt{font-size:16px;font-weight:600;flex:1;min-width:240px}
.agv-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--t5);color:var(--acc);font-size:13px;font-weight:700;margin-right:8px;vertical-align:1px}
.agv-tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.agv-res{font-size:15px;color:var(--ink2)}
.agv-res b{color:var(--ink)}
.agv-res.err{color:var(--red);font-weight:600}
/* advanced */
.agv-changed{font-size:15px;color:var(--ink2);line-height:1.5;margin:-8px 0 22px}
.agv-changed b{color:var(--ink);font-weight:700}
.agv-dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.agv-doc{min-width:0}
.agv-tabs{border-radius:20px 20px 0 0;padding:14px 24px 0;border-bottom:1px solid var(--agv-rule2);background:#fff}
.agv-tablist{display:flex;gap:4px;flex-wrap:wrap}
.agv-tab{position:relative;min-height:48px;padding:8px 16px;border:0;background:transparent;font-size:16px;font-weight:600;color:var(--ink2);border-radius:12px 12px 0 0;display:inline-flex;align-items:center;gap:6px;text-align:left}
.agv-tab:hover{color:var(--ink);background:var(--ground)}
.agv-tab[aria-selected="true"]{color:var(--acc);font-weight:700}
.agv-tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
.agv-tab svg{width:16px;height:16px}
.agv-tl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.agv-tl small{font-size:13px;font-weight:500;color:var(--ink3);margin-top:3px}
.agv-tab[aria-selected="true"] .agv-tl small{color:var(--acc)}
.agv-morewrap{position:relative}
.agv-menu{position:absolute;left:0;top:52px;min-width:240px;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(11,18,32,.16),0 0 0 1px var(--rule);padding:6px;z-index:10}
.agv-menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700}
.agv-menu button small{font-size:14px;font-weight:500;color:var(--ink3)}
.agv-menu button:hover,.agv-menu button:focus-visible{background:var(--ground)}
.agv-tabline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 40px;border-bottom:1px solid var(--agv-rule2);background:#FBFCFE}
.agv-tabline p{font-size:15px;color:var(--ink2);line-height:1.45}
.agv-tabline p a{color:#1F4BFF;font-weight:600}
.agv-tabline p .agv-err{color:#B4232F;font-weight:600}
.agv-retry{margin-left:6px;padding:4px 12px;border:1px solid #C3ACF3;border-radius:999px;background:#F3EEFD;color:#6A2FE0;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.agv-retry:hover{background:#E1D5F9}
.agv-docbody{padding:30px 40px 44px}
.agv-empty{font-size:15px;color:var(--ink3)}
.agv-emptyrules{display:flex;gap:20px;align-items:flex-start;padding:26px;border-radius:16px;background:var(--ground);max-width:640px}
.agv-emptyrules h3{font-size:19px;font-weight:700}
.agv-emptyrules p{font-size:16px;color:var(--ink2);margin-top:6px;line-height:1.6}
.agv-emptyrules .agv-btnp{margin-top:16px}
/* reading type */
.agv-prose{font-size:18px;line-height:1.65;color:var(--agv-read);max-width:70ch}
.agv-prose>*+*{margin-top:18px}
.agv-prose h2,.agv-prose h3,.agv-prose h4,.agv-prose h5{color:var(--agv-read);font-weight:700;letter-spacing:-.015em;line-height:1.3}
.agv-prose h2{font-size:28px;margin-top:44px}.agv-prose h3{font-size:22px;margin-top:34px}.agv-prose h4,.agv-prose h5{font-size:19px;margin-top:26px}
.agv-prose>:first-child{margin-top:0}
.agv-prose ul,.agv-prose ol{padding-left:26px}.agv-prose ul{list-style:disc}.agv-prose ol{list-style:decimal}
.agv-prose li+li{margin-top:8px}.agv-prose li>ul,.agv-prose li>ol{margin-top:8px}
.agv-prose strong{font-weight:700;color:var(--ink)}
.agv-prose a{color:var(--blue);font-weight:600;overflow-wrap:anywhere}
.agv-prose code{font-family:inherit;font-size:.86em;font-weight:600;background:var(--agv-chip);color:#2B2F3A;border-radius:6px;padding:2px 7px;overflow-wrap:break-word}
.agv-prose .agv-fence{white-space:pre-wrap;background:var(--agv-chip);border-radius:12px;padding:16px 20px;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.agv-prose blockquote{margin:0;padding:4px 0 4px 20px;border-left:3px solid var(--t3);color:var(--ink2)}
.agv-prose hr{border:0;border-top:1px solid var(--rule);margin:32px 0}
.agv-prose .agv-tw{overflow-x:auto}
.agv-prose table{border-collapse:collapse;font-size:16px;line-height:1.5;width:100%;min-width:480px}
.agv-prose th{text-align:left;font-weight:700;padding:10px 12px;border-bottom:1.5px solid var(--rule)}
.agv-prose td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.agv-prose details{border-radius:14px;background:var(--ground)}
.agv-prose summary{cursor:pointer;padding:14px 18px;font-size:16px;font-weight:700;color:var(--ink)}
.agv-prose details .agv-in{padding:0 18px 16px;font-size:16px;color:var(--ink2)}
.agv-hist li{display:grid;grid-template-columns:108px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--agv-rule2);list-style:none}
.agv-hist{padding:0;max-width:72ch}
.agv-hist time{font-size:15px;font-weight:700}
.agv-hist .agv-prose{font-size:17px}
.agv-vt{display:inline-block;margin-top:6px;font-size:14px;color:var(--ink3);font-weight:600}
/* editor */
.agv-edbanner{background:var(--t5);color:var(--acc);border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;line-height:1.5;margin-bottom:18px}
.agv-edtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.agv-edtop .agv-seg{box-shadow:none;background:var(--ground)}
.agv-edtop .agv-seg button{height:36px;font-size:14px}
.agv-edtop .agv-seg button[aria-checked="true"]{background:#fff}
.agv-ed{width:100%;min-height:360px;border:1.5px solid var(--rule);border-radius:14px;padding:18px 20px;font-size:17px;line-height:1.6;background:#fff;color:var(--agv-read);resize:vertical}
.agv-ed:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
