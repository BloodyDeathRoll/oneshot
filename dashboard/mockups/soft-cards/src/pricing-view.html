<!-- Pricing view (2026-10-17): the price-list suggestion from docs/pricing.lk.json (api.D.pricing); registers window.OSViews.pricing(api). Built into the page by build.mjs. Read-only. Class names carry the prv- prefix. -->
<style>
.prv{display:grid;gap:var(--gap)}
.prv-intro{font-size:16px;line-height:26px;color:var(--ink2);max-width:78ch;margin:0;text-wrap:pretty}
.prv-tag{display:inline-block;font-size:13px;line-height:20px;font-weight:700;color:var(--acc);background:var(--t5);border-radius:999px;padding:2px 10px;margin-left:10px;vertical-align:middle}
.prv-offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--gap)}
.prv-offer h3{font-size:18px;line-height:26px;font-weight:700;margin:0}
.prv-offer .prv-price{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;line-height:22px}
.prv-offer .prv-price dt{color:var(--ink3);font-weight:600}
.prv-offer .prv-price dd{margin:0;font-weight:700;color:var(--ink)}
.prv-offer p{margin:12px 0 0;font-size:14px;line-height:22px;color:var(--ink2);text-wrap:pretty}
table.prv-t{width:100%;border-collapse:collapse;margin-top:8px}
table.prv-t th{font-size:13px;font-weight:700;color:var(--ink3);text-align:left;padding:0 16px 10px 0;border-bottom:1px solid var(--rule)}
table.prv-t td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14px;line-height:22px}
table.prv-t td:first-child{font-weight:600;color:var(--ink)}
table.prv-t td:nth-child(2){white-space:nowrap}
table.prv-t tr:last-child td{border-bottom:0}
.prv ul{margin:8px 0 0;padding-left:20px;font-size:15px;line-height:24px;color:var(--ink2)}
.prv ul li+li{margin-top:6px}
@media (max-width:720px){
  table.prv-t thead{display:none}
  table.prv-t tr{display:block;padding:12px 0;border-bottom:1px solid var(--rule)}
  table.prv-t tr:last-child{border-bottom:0}
  table.prv-t td{display:block;padding:2px 0;border:0;white-space:normal}
  table.prv-t td:nth-child(2){white-space:normal}
}
</style>
<div class="prv" id="prv"></div>
<script>
(function(){
function table(api,head,rows){
  const {el}=api;
  const t=el('table',{class:'prv-t'});
  t.append(el('thead',{},el('tr',{},...head.map(h=>el('th',{scope:'col',text:h})))));
  const b=el('tbody');
  for(const r of rows)b.append(el('tr',{},...r.map(c=>el('td',{text:c??''}))));
  t.append(b);return t;
}
function card(api,title,...kids){
  const {el}=api;
  return el('section',{class:'card'},el('div',{class:'card-h'},el('h2',{text:title})),...kids);
}
function render(api){
  const {el,D}=api;
  const root=document.getElementById('prv');if(!root)return;
  root.innerHTML='';
  const P=D.pricing;
  if(!P){root.append(el('section',{class:'card'},el('p',{class:'prv-intro',text:'No price list yet: docs/pricing.lk.json is missing.'})));return}
  const h=el('p',{class:'prv-intro'});
  h.append(el('b',{text:P.title+', in '+P.currency}),el('span',{class:'prv-tag',text:P.status||'suggestion'}),el('br'),P.note||'');
  root.append(h);
  const offers=el('div',{class:'prv-offers'});
  for(const o of P.offers||[]){
    const price=el('dl',{class:'prv-price'});
    for(const[k,v]of[['One-time',o.one_time],['Recurring',o.recurring]])if(v&&v!=='—')price.append(el('dt',{text:k}),el('dd',{text:v}));
    offers.append(el('section',{class:'card prv-offer'},el('h3',{},o.name,o.default?el('span',{class:'prv-tag',text:'default'}):null),price,el('p',{text:o.buys})));
  }
  root.append(offers);
  root.append(card(api,'Upsells, after the site is live',table(api,['Upsell','Price','Note'],(P.upsells||[]).map(u=>[u.name,u.price,u.note]))));
  root.append(card(api,'What it costs us, per client',table(api,['Line','Cost','Note'],(P.costs||[]).map(c=>[c.line,c.cost,c.note]))));
  root.append(card(api,'Terms',el('ul',{},...(P.terms||[]).map(t=>el('li',{text:t})))));
  root.append(card(api,'Open for you to decide',el('ul',{},...(P.open||[]).map(t=>el('li',{text:t})))));
}
window.OSViews=window.OSViews||{};
window.OSViews.pricing=function(api){render(api)};
})();
</script>
