<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneShot — Overview</title>
<meta name="description" content="OneShot operator dashboard, direction C “Statement”. Every number comes from dashboard/data.json, generated from ledger.jsonl.">
<style>
/*FONT*/
:root{
  --ink:#0B1220; --sec:#4B5563; --ter:#6B7280; --rule:#E5E8EF; --band:#F2F4F8; --card:#FFFFFF;
  --acc:#1F4BFF; --t1:#4A6DFF; --t2:#7A93FF; --t3:#AEBDFF; --t4:#D6DEFF; --t5:#EEF1FF;
  --green:#1A7F37; --red:#C0182B;
  --rail:72px; --gutter:40px; --content:1280px;
  --r:16px; --pill:999px;
  --s1:8px; --s2:16px; --s3:32px; --s4:64px;
  --dur-n:600ms; --dur-c:700ms;
}
*{box-sizing:border-box}
html{font-family:"Geist Variable","Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:#fff;font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{margin:0;background:#fff;min-height:100vh}
button,a{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.pill:focus-visible,[role=tab]:focus-visible{border-radius:var(--pill)}
svg{display:block;overflow:visible}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:var(--pill);z-index:10}
.skip:focus{top:8px}

/* ---------- rail ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);border-right:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 0 16px;z-index:5}
.brand{width:36px;height:36px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:-.02em;margin-bottom:22px}
.brand span{transform:translateY(-.5px)}
.tabs{display:flex;flex-direction:column;gap:6px;width:100%}
[role=tab]{position:relative;width:100%;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ter);font-size:11px;font-weight:500;letter-spacing:.005em;border-radius:0}
[role=tab] svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[role=tab][aria-selected=true]{color:var(--ink)}
[role=tab][aria-selected=true]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
[role=tab]:hover:not([aria-disabled=true]){color:var(--ink)}
[role=tab][aria-disabled=true]{color:var(--ter);font-weight:400;cursor:default}
[role=tab][aria-disabled=true] .later{position:absolute;right:10px;top:8px;width:6px;height:6px;border:1px solid var(--ter);border-radius:50%}
.rail-foot{margin-top:auto;font-size:11px;color:var(--ter);text-align:center;line-height:1.3;padding:0 6px}
.rail-foot b{display:block;color:var(--ink);font-weight:500}

/* ---------- page + top bar ---------- */
.page{margin-left:var(--rail);padding:0 var(--gutter) var(--s4)}
.top{height:56px;display:flex;align-items:center;gap:var(--s2);max-width:var(--content);margin:0 auto;border-bottom:1px solid var(--rule)}
.top h1{font-size:20px;font-weight:500;margin:0 var(--s2) 0 0;letter-spacing:-.01em}
.runs{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border:1px solid var(--rule);border-radius:var(--pill);background:#fff;color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;line-height:1}
.pill:hover{border-color:#C7CCD6}
.pill[aria-checked=true],.pill[aria-pressed=true],.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.small{height:26px;padding:0 10px;font-size:12px}
.pill .n{font-weight:400;color:inherit;opacity:.72}
.pill.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.acc:hover{background:#1840E0;border-color:#1840E0}
.pill.tint{background:var(--t5);border-color:var(--t5);color:var(--acc)}
.pill.tint:hover{border-color:var(--t3)}
.pill .arrow{font-weight:400}
.range{margin-left:auto;position:relative}
.range .pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.75}
.menu{position:absolute;right:0;top:40px;min-width:280px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:8px;box-shadow:0 8px 24px rgba(11,18,32,.08);z-index:6}
.menu[hidden]{display:none}
.menu [role=menuitemradio]{display:flex;width:100%;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;font-size:13px;text-align:left}
.menu [role=menuitemradio]:hover{background:var(--band)}
.menu [role=menuitemradio][aria-checked=true]{font-weight:600}
.menu [role=menuitemradio] span{color:var(--ter);font-weight:400}
.menu p{margin:6px 12px 4px;font-size:12px;color:var(--ter)}

main{max-width:var(--content);margin:0 auto}
[role=tabpanel][hidden]{display:none}

/* ---------- statement band ---------- */
.statement{display:grid;grid-template-columns:1fr 440px;gap:var(--s4);align-items:start;min-height:320px;padding:40px 0 40px;border-bottom:1px solid var(--rule)}
.big{font-size:120px;font-weight:200;line-height:.9;letter-spacing:-.02em;margin:0;display:flex;align-items:flex-end;gap:14px}
.big .hollow{display:block}
.cap{font-size:12px;color:var(--ter);margin:10px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cap b{color:var(--ink);font-weight:500}
.gates{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.gates .pill{height:36px;font-size:14px;padding:0 16px 0 14px}
.gates .pill .kind{color:var(--ter);font-weight:400}
.gates .pill:hover .arrow{transform:translateX(2px)}
.gates .arrow{transition:transform .12s}
.meta{margin-top:22px;display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--ter)}
.meta .delta{color:var(--ink)}
.meta .spark{display:flex;align-items:center;gap:8px}
.block{background:var(--acc);color:#fff;border-radius:var(--r);padding:30px 32px 30px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.block p{margin:0;font-size:28px;font-weight:400;line-height:1.15;letter-spacing:-.015em}
.block p .ln{display:block}
.block .sub{display:block;font-size:13px;color:var(--t5);font-weight:400;margin-top:12px;letter-spacing:0;max-width:none;line-height:1.35}
.block .pill{background:#fff;border-color:#fff;color:var(--acc);align-self:flex-start}
.block .pill:hover{background:var(--t5);border-color:var(--t5)}
.block .pill:focus-visible{outline-color:#fff}
.block .ring{position:absolute;right:-70px;top:-70px;width:220px;height:220px;border:1px solid rgba(255,255,255,.28);border-radius:50%;pointer-events:none}
.block .ring.b{right:-110px;top:20px;width:160px;height:160px}

/* ---------- kpi rule row ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--rule);padding:22px 0 24px;gap:var(--s3)}
.kpi{min-width:0}
.kpi .l{font-size:12px;color:var(--ter);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.kpi .v{font-size:32px;font-weight:200;line-height:1;letter-spacing:-.01em;margin:0;height:34px;display:flex;align-items:flex-end;gap:8px}
.kpi .v small{font-size:12px;color:var(--ter);font-weight:400;letter-spacing:0;padding-bottom:4px}
.kpi .d{font-size:12px;color:var(--ter);margin:10px 0 0;min-height:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .d a{color:var(--acc);border-bottom:1px solid var(--t3)}
.kpi .d a:hover{border-bottom-color:var(--acc)}
.up{color:var(--green)}.down{color:var(--red)}
.kpi .foot{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ter)}
.hollow text{fill:none;stroke:var(--t3);stroke-width:1.25;font-weight:300;paint-order:stroke}

/* ---------- section heads ---------- */
.sec{padding:40px 0 0}
.sec-h{display:flex;align-items:center;gap:var(--s2);margin:0 0 20px}
.sec-h h2{font-size:20px;font-weight:500;margin:0;letter-spacing:-.01em}
.sec-h .chip{font-size:12px;color:var(--ter);border:1px solid var(--rule);border-radius:var(--pill);height:26px;display:inline-flex;align-items:center;padding:0 10px;gap:6px}
.sec-h .chip b{color:var(--ink);font-weight:600}
.sec-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.sec-h .note{font-size:12px;color:var(--ter)}

/* ---------- funnel ---------- */
.funnel{width:100%;height:256px}
.funnel .col{cursor:default}
.funnel .col rect.bar{fill:var(--t5)}
.funnel .col.cur rect.bar{fill:var(--acc)}
.funnel .col.zero rect.bar{fill:none;stroke:var(--t3);stroke-dasharray:3 3}
.funnel .col text{font-size:13px;fill:var(--ink)}
.funnel .col .val{font-weight:500;font-size:14px}
.funnel .col.cur .val.in{fill:#fff}
.funnel .col.zero .val{fill:var(--ter)}
.funnel .col .name{fill:var(--sec);font-size:12px}
.funnel .col .pct{fill:var(--ter);font-size:11px}
.funnel .base{stroke:var(--rule)}
.funnel .lead{stroke:var(--ink);stroke-dasharray:3 3;fill:none}
.funnel .tag rect{fill:var(--ink)}
.funnel .tag text{fill:#fff;font-size:12px;font-weight:500}
.funnel .col:hover rect.bar,.funnel .col:focus rect.bar{fill:var(--t4)}
.funnel .col.cur:hover rect.bar,.funnel .col.cur:focus rect.bar{fill:var(--t1)}
.funnel .col.zero:hover rect.bar,.funnel .col.zero:focus rect.bar{fill:var(--t5)}
.col:focus,.pt:focus{outline:none}
.funnel .col:focus-visible rect.bar{stroke:var(--acc);stroke-width:2;stroke-dasharray:none}
.spark .pt:focus-visible circle.hit{fill:var(--ink);stroke:var(--acc);stroke-width:2}
.seg .pt:focus-visible rect:first-child{stroke:var(--acc);stroke-width:2}
.tip{opacity:0;pointer-events:none;transition:none}
:hover>.tip,:focus>.tip,:focus-visible>.tip{opacity:1}
.tip rect{fill:var(--ink)}
.tip text,.funnel .col .tip text{fill:#fff;font-size:12px;font-weight:500}
.bar{transform-origin:bottom;transform:scaleY(1)}
.draw .bar{animation:grow var(--dur-c) cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.spark path.line{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.spark circle.end{fill:var(--acc)}
.spark .pt{cursor:default}
.spark .pt circle.hit{fill:transparent}
.spark .pt:hover circle.hit,.spark .pt:focus circle.hit{fill:var(--ink)}
.draw .spark path.line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dash var(--dur-c) ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.seg rect{rx:2}
.seg .pt:hover rect,.seg .pt:focus rect{opacity:.75}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--ter);font-size:12px;text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:0 12px 0 0;border-bottom:1px solid var(--rule);height:44px;vertical-align:middle;color:var(--ink)}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl tr:nth-child(even) td{background:transparent}
.tbl tbody tr:hover td,.tbl tbody tr:focus-within td{background:var(--band)}
.tbl tbody tr:focus{outline:none}
.tbl tbody tr:focus-visible td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl td.t{color:var(--ter);white-space:nowrap;font-size:12px}
.tbl td.b{font-weight:500;white-space:nowrap}
.tbl td.a{color:var(--sec);white-space:nowrap}
.tbl td.a .hum{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:1px}
.tbl td.s{white-space:nowrap;color:var(--sec)}
.tbl td.s b{color:var(--ink);font-weight:500}
.tbl td.note{color:var(--sec);max-width:0;width:44%}
.tbl td.note span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tbody tr.open td{height:auto;padding-top:12px;padding-bottom:12px;vertical-align:top}
.tbl tbody tr.open td.note span{white-space:normal;line-height:1.45}
.empty{padding:28px 0;color:var(--sec);font-size:13px;max-width:60ch}
.empty .h0{font-size:32px;font-weight:200;color:var(--t3);margin:0 0 8px}
.more{margin-top:14px}
.state{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--pill);font-size:12px;font-weight:500;background:var(--band);color:var(--sec);white-space:nowrap}
.state.gate{background:var(--acc);color:#fff}
.state.live{background:var(--ink);color:#fff}
.state.out{background:transparent;border:1px solid var(--rule);color:var(--ter)}

/* ---------- pipeline ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.stations{display:inline-flex;gap:3px}
.stations:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:var(--pill)}
.st{height:22px;min-width:22px;padding:0 6px;border-radius:var(--pill);border:1px solid var(--rule);color:var(--ter);font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:2px;background:#fff;line-height:1}
.st.done{background:var(--ink);border-color:var(--ink);color:#fff}
.st.cur{background:var(--acc);border-color:var(--acc);color:#fff}
.st.done.out{background:var(--ter);border-color:var(--ter)}
.st.cur.out{background:#fff;border-color:var(--ter);color:var(--ter);border-style:dashed}
.st .g{font-size:9px}
.tbl td.you{font-weight:600}
.tbl td.own{color:var(--sec)}
.tbl td.days{text-align:right;padding-right:24px}
.tbl td.why{color:var(--sec);max-width:0;width:30%}
.tbl td.why span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.hi td{background:var(--t5)}
.tbl tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl th.days{text-align:right;padding-right:24px}
.tblwrap{overflow-x:auto}
.type{color:var(--ter);font-weight:400;font-size:12px;margin-left:8px}

/* ---------- 1024 ---------- */
@media (max-width:1180px){
  :root{--gutter:24px}
  .statement{grid-template-columns:1fr;gap:var(--s3);padding:40px 0 32px;min-height:0}
  .block{min-height:120px;flex-direction:row;align-items:center;justify-content:space-between;padding:24px 28px}
  .block p{font-size:24px}
  .block .ring{display:none}
  .kpis{grid-template-columns:repeat(3,1fr);row-gap:28px}
  .tbl td.note{width:0;padding:0}
  .tbl td.note span{display:none}
  .tbl tbody tr.open td.note{display:none}
  .tbl th.note-h{display:none}
  .tbl tbody tr.open td.note{display:table-cell}
  .tbl tbody tr.open td.note span{display:block}
  .tbl td.why,.tbl th.why-h{display:none}
  .pipe .type{display:none}
  .pipe .st{height:20px;min-width:20px;padding:0 4px;font-size:10px}
  .pipe .state{font-size:11px;padding:0 8px;height:22px}
  .pipe td.s{white-space:normal}
  .pipe td.days,.pipe th.days{padding-right:0}
}
@media (max-width:1180px){
  .tbl.act tbody tr td.note{display:none}
  .tbl.act tbody tr.open{display:table-row}
  .tbl.act tbody tr.open td.note{display:table-cell;width:100%;padding:0 0 12px}
  .tbl.act tbody tr.open td.note span{display:block;white-space:normal;line-height:1.45}
  .tbl.act tbody tr.open td{height:auto;padding-top:12px;padding-bottom:0}
  .tbl.act tbody tr.open td:not(.note){border-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .draw .bar{animation:none}
  .draw .spark path.line{stroke-dashoffset:0;animation:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<nav class="rail" aria-label="Views">
  <a class="brand" href="#overview" aria-label="OneShot overview"><span>1S</span></a>
  <div class="tabs" role="tablist" aria-orientation="vertical" aria-label="Views">
    <button role="tab" id="tab-overview" data-view="overview" aria-selected="true" aria-controls="view-overview" tabindex="0">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg><span>Overview</span></button>
    <button role="tab" id="tab-pipeline" data-view="pipeline" aria-selected="false" aria-controls="view-pipeline" tabindex="-1">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h9M3 15h5"/></svg><span>Pipeline</span></button>
    <button role="tab" id="tab-sites" aria-disabled="true" tabindex="-1" title="Built after the pick" aria-describedby="later-note">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14"/></svg><span>Sites</span><i class="later"></i></button>
    <button role="tab" id="tab-agents" aria-disabled="true" tabindex="-1" title="Built after the pick" aria-describedby="later-note">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg><span>Agents</span><i class="later"></i></button>
    <button role="tab" id="tab-decisions" aria-disabled="true" tabindex="-1" title="Built after the pick" aria-describedby="later-note">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l7 7-7 7-7-7z"/></svg><span>Decisions</span><i class="later"></i></button>
  </div>
  <span id="later-note" class="vh">Sites, Agents and Decisions are built after the mockup pick.</span>
  <div class="rail-foot" id="railfoot"></div>
</nav>

<div class="page">
  <header class="top">
    <h1 id="viewtitle">Overview</h1>
    <div class="runs" role="radiogroup" aria-label="Run" id="runs"></div>
    <div class="range">
      <button class="pill" id="rangebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="rangemenu"><span id="rangelabel">—</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5l3.5 3.5 3.5-3.5"/></svg></button>
      <div class="menu" id="rangemenu" role="menu" aria-label="Date range" hidden></div>
    </div>
  </header>

  <main id="main">
    <section id="view-overview" role="tabpanel" aria-labelledby="tab-overview">
      <div class="statement" id="statement"></div>
      <div class="kpis" id="kpis"></div>
      <section class="sec" aria-labelledby="funnel-h">
        <div class="sec-h"><h2 id="funnel-h">Funnel</h2><span class="chip" id="funnelchip"></span><span class="note" id="funnelnote"></span></div>
        <div id="funnel"></div>
      </section>
      <section class="sec" aria-labelledby="act-h">
        <div class="sec-h"><h2 id="act-h">Recent activity</h2><span class="chip" id="actchip"></span>
          <div class="right" role="group" aria-label="Filter activity" id="actfilters"></div></div>
        <div id="activity"></div>
      </section>
    </section>

    <section id="view-pipeline" role="tabpanel" aria-labelledby="tab-pipeline" hidden>
      <section class="sec" aria-labelledby="pipe-h" style="padding-top:32px">
        <div class="sec-h"><h2 id="pipe-h">Businesses</h2><span class="chip" id="pipechip"></span>
          <div class="right filters" role="group" aria-label="Filter businesses" id="pipefilters"></div></div>
        <p class="note" id="pipenote" style="font-size:12px;color:var(--ter);margin:-8px 0 16px"></p>
        <div id="pipetable"></div>
      </section>
    </section>
  </main>
</div>

<script id="data" type="application/json"><!--DATA--></script>
<script>
(async function(){
'use strict';
/* ---------- data ---------- */
let D;
try { D = JSON.parse(document.getElementById('data').textContent); }
catch (e) { D = await (await fetch('../../../data.json')).json(); } // src-only fallback; dist embeds the JSON

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WORDS = ['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
const words = n => n <= 10 ? WORDS[n] : String(n);
const day = ts => { const d = new Date(ts); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const time = ts => { const d = new Date(ts); return `${day(ts)} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
const isoDay = ts => ts.slice(0,10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const fmt = (n, dp=0) => n == null ? '' : Number(n).toLocaleString('en-GB', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const byRun = {}; D.runs.forEach(r => byRun[r.run_id] = r);

/* ---------- count-up (once, on first paint) ---------- */
function countUp(node, to, dp) {
  if (reduced || S.animated) { node.textContent = fmt(to, dp); return; }
  const t0 = performance.now(), dur = 600;
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt(to * e, dp); if (p < 1) requestAnimationFrame(step); else node.textContent = fmt(to, dp); };
  requestAnimationFrame(step);
}

/* ---------- charts ---------- */
function hollowZero(size) { // the empty state numeral: an outline "0"
  const h = size, w = Math.round(size * .62);
  return `<svg class="hollow" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="0, nothing yet"><text x="${w/2}" y="${h*.86}" text-anchor="middle" font-size="${size}" font-weight="300">0</text></svg>`;
}
function sparkline(series, label, w=96, h=20) {
  const from = rangeOf().from, ys = series.slice(from), xs = days.slice(from);
  const max = Math.max(1, ...ys), n = ys.length;
  const px = i => n === 1 ? w/2 : (i / (n - 1)) * (w - 4) + 2;
  const py = v => h - 3 - (v / max) * (h - 6);
  const d = ys.map((v,i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(' ');
  let len = 0; for (let i=1;i<n;i++) len += Math.hypot(px(i)-px(i-1), py(ys[i])-py(ys[i-1]));
  const pts = ys.map((v,i) => {
    const x = px(i), y = py(v), t = `${day(xs[i])} · ${v}`, tw = t.length * 6.6 + 16, tx = Math.min(Math.max(x - tw/2, -8), w - tw + 8);
    return `<g class="pt" tabindex="0" role="img" aria-label="${esc(label)}, ${esc(t)}"><circle class="hit" cx="${x}" cy="${y}" r="3"/><rect x="${x-5}" y="0" width="10" height="${h}" fill="transparent"/>
      <g class="tip"><rect x="${tx}" y="${-28}" width="${tw}" height="22" rx="6"/><text x="${tx + tw/2}" y="${-13}" text-anchor="middle">${esc(t)}</text></g></g>`; }).join('');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="--len:${len.toFixed(0)}"><title>${esc(label)}</title><path class="line" d="${d}"/><circle class="end" cx="${px(n-1)}" cy="${py(ys[n-1])}" r="3"/>${pts}</svg>`;
}
function segments(items, w=96, h=6) { // three-segment bar, one segment per site
  const gap = 3, sum = items.reduce((a,i) => a + i.v, 0) || 1, tints = ['var(--acc)','var(--t2)','var(--t3)'];
  let x = 0;
  const segs = items.map((it, i) => { const sw = (it.v / sum) * (w - gap * (items.length - 1)); const t = `${it.name} · ${fmt(it.v,1)}${it.kind ? ' · ' + it.kind : ''}`;
    const tw = t.length * 6.6 + 16, tx = Math.min(Math.max(x + sw/2 - tw/2, -8), w - tw + 8);
    const s = `<g class="pt" tabindex="0" role="img" aria-label="${esc(t)}"><rect x="${x.toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="${h}" fill="${tints[i%3]}"/><rect x="${x.toFixed(1)}" y="-6" width="${sw.toFixed(1)}" height="${h+12}" fill="transparent"/>
      <g class="tip"><rect x="${tx}" y="-34" width="${tw}" height="22" rx="6"/><text x="${tx+tw/2}" y="-19" text-anchor="middle">${esc(t)}</text></g></g>`; x += sw + gap; return s; }).join('');
  return `<svg class="seg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><title>critic score per live site</title>${segs}</svg>`;
}
function funnel(f, W) {
  const H = 256, top = 30, baseY = 212, maxH = 170, colW = W < 1100 ? Math.floor((W - 6*16) / 7 - 0) : 120, gap = W < 1100 ? 16 : 32;
  const max = Math.max(1, ...f.map(s => s.count));
  const groupW = 7 * colW + 6 * gap, x0 = 0;
  let curIdx = -1; f.forEach((s,i) => { if (s.count > 0) curIdx = i; });
  const cols = f.map((s, i) => {
    const x = x0 + i * (colW + gap), h = s.count ? Math.max(2, (s.count / max) * maxH) : 40, y = baseY - h;
    const prev = i ? f[i-1].count : null, pct = prev ? Math.round(s.count / prev * 100) : null;
    const cls = ['col', i === curIdx ? 'cur' : '', s.count === 0 ? 'zero' : ''].join(' ');
    const inside = h >= 40;
    const tipT = s.count === 0 ? `${s.label} · 0 so far` : prev == null ? `${s.label} · ${s.count} businesses` : `${s.label} · ${s.count} of ${prev} ${f[i-1].label} · ${pct}%`;
    const tw = tipT.length * 6.6 + 16, tx = Math.min(Math.max(x + colW/2 - tw/2, 0), W - tw);
    return `<g class="${cls}" tabindex="0" role="img" aria-label="${esc(tipT)}">
      <rect x="${x}" y="${y}" width="${colW}" height="${h}" rx="6" class="bar"/>
      <text class="val${inside ? ' in' : ''}" x="${x + colW/2}" y="${inside ? y + 22 : y - 8}" text-anchor="middle">${s.count}</text>
      <text class="name" x="${x + colW/2}" y="${baseY + 20}" text-anchor="middle">${esc(s.label)}</text>
      ${pct != null && s.count ? `<text class="pct" x="${x + colW/2}" y="${baseY + 36}" text-anchor="middle">${pct}% of previous</text>` : ''}
      <g class="tip"><rect x="${tx}" y="2" width="${tw}" height="22" rx="6"/><text x="${tx + tw/2}" y="17" text-anchor="middle">${esc(tipT)}</text></g>
    </g>`; }).join('');
  // leader from the current column to a black label at the right
  let leader = '';
  if (curIdx >= 0) {
    const s = f[curIdx], x = x0 + curIdx * (colW + gap) + colW, h = Math.max(2, (s.count / max) * maxH), y = baseY - h - 14;
    const after = f.slice(curIdx + 1).map(z => z.label);
    const text = `${s.count} ${s.label}, none ${after[0] || ''}`.trim();
    const tw = text.length * 6.9 + 20;
    const fits = groupW + 24 + tw <= W;            // room to the right of the seven columns?
    const lx = fits ? groupW + 24 : W - tw;
    const cy = Math.min(y + 4, baseY - 40 - 22);    // never through the dashed zero outlines
    const ty = cy - 12;
    leader = `<g class="leader" aria-hidden="true"><path class="lead" d="M${x + 6} ${y + 4} V${cy} H${lx - 10}"/><circle cx="${x + 6}" cy="${y + 4}" r="2.5" fill="var(--ink)"/>
      <g class="tag"><rect x="${lx}" y="${ty}" width="${tw}" height="24" rx="6"/><text x="${lx + tw/2}" y="${ty + 16}" text-anchor="middle">${esc(text)}</text></g></g>`;
  }
  return `<svg class="funnel" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Funnel of the run, businesses that ever reached each stage"><title>Funnel: ${f.map(s => `${s.label} ${s.count}`).join(', ')}</title>
    <line class="base" x1="0" x2="${W}" y1="${baseY + .5}" y2="${baseY + .5}"/>${cols}${leader}</svg>`;
}

    b.addEventListener('click', () => { S.run = r.run_id; S.group = 'all'; S.hi = null; renderAll(); });
    box.appendChild(b);
  });
  box.addEventListener('keydown', e => {
    if (!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) return;
    const items = [...box.querySelectorAll('[role=radio]')], i = items.indexOf(document.activeElement); if (i < 0) return;
    const j = (i + (/Right|Down/.test(e.key) ? 1 : items.length - 1)) % items.length; items[j].focus(); items[j].click(); e.preventDefault();

}
function renderRange() {
  const btn = document.getElementById('rangebtn'), menu = document.getElementById('rangemenu'), lab = document.getElementById('rangelabel');
  lab.textContent = rangeLabel(rangeOf());
  menu.innerHTML = `<p>Filters the sparklines and the activity table. Ledger days ${day(days[0])} – ${day(days[days.length-1])}.</p>` +
    RANGES.map(r => `<button role="menuitemradio" aria-checked="${r.id === S.range}" data-r="${r.id}">${r.label}<span>${rangeLabel(r)}</span></button>`).join('');
  const open = o => { menu.hidden = !o; btn.setAttribute('aria-expanded', String(o)); if (o) menu.querySelector('[aria-checked=true]').focus(); };
  btn.onclick = () => open(menu.hidden);
  menu.onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; S.range = b.dataset.r; open(false); renderRange(); renderOverview(); btn.focus(); };
  menu.onkeydown = e => {
    const items = [...menu.querySelectorAll('[role=menuitemradio]')], i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { open(false); btn.focus(); }
    if (e.key === 'ArrowDown') { items[(i+1) % items.length].focus(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { items[(i-1+items.length) % items.length].focus(); e.preventDefault(); }
  };
  document.addEventListener('click', e => { if (!e.target.closest('.range')) open(false); });
}

function renderStatement() {

  const n = gates.length;
  const since = gates.length ? gates.reduce((a,g) => a < g.since ? a : g.since, gates[0].since) : null;

      <p class="cap"><b>waiting on you</b>${n ? `<span>${esc(kinds.join(' · '))}</span><span>since ${day(since)} · ${maxDays} day${maxDays === 1 ? '' : 's'}</span>` : `<span>no open gate in ${esc(shortRun(S.run))}</span>`}</p>

      </div>

      </div>
    </div>

      <p>${sentence.map(l => `<span class="ln">${esc(l)}</span>`).join('')}<span class="sub">${esc(sub)}</span></p>
      ${n ? `<a class="pill" href="#pipeline?g=gate">Open the ${n === 1 ? 'one' : words(n).toLowerCase()} →</a>` : `<a class="pill" href="#pipeline">Open the pipeline →</a>`}
    </div>`;
  const c = box.querySelector('[data-count]'); if (c) countUp(c, n, 0);

const GROUPS = [['all','All'],['gate','Waiting on you'],['delivered','Delivered'],['pipeline','With an agent'],['dropped','Dropped'],['not_approved','Not approved'],['not_shortlisted','Not shortlisted'],['superseded','Superseded']];

function stationBar(b) {
  const hist = b.history || [];

  const sum = `stations: ${b.station} of 9, ${cur ? cur.name : ''}${b.station_dates[b.station] ? ', reached ' + day(b.station_dates[b.station]) : ''}. Arrow keys read each station.`;
  return `<span class="stations" role="group" tabindex="0" aria-label="${esc(sum)}">${D.stations.map(st => {
    const reached = !!b.station_dates[st.n], cur = b.station === st.n, out = b.out;
    const line = hist.find(h => st.states.some(s => h.to === s || (h.to || '').startsWith(s + '(') || (h.to || '').startsWith(s + ':')));
    const lab = `${st.n} ${st.name}${st.gate ? ` · gate: ${st.gate}` : ''}${reached ? ` · reached ${day(b.station_dates[st.n])}${line ? ` · ${line.agent}${line.v ? ' ' + line.v : ''}` : ''}` : ' · not reached'}${cur ? ' · current' : ''}`;
    const cls = ['st', reached && !cur ? 'done' : '', cur ? 'cur' : '', out ? 'out' : ''].join(' ');
    return `<span class="${cls}" tabindex="-1" role="img" aria-label="${esc(lab)}" title="${esc(lab)}">${st.n}${st.gate ? `<span class="g" aria-hidden="true">${reached && !cur ? '◆' : '◇'}</span>` : ''}</span>`; }).join('')}</span>`;
}
function statePill(b) {
  if (b.gate) return `<span class="state gate">${esc(b.gate)}</span>`;
  if (b.group === 'delivered') return `<span class="state live">${esc(b.state)}</span>`;
  if (b.out) return `<span class="state out">${esc(b.label)}</span>`;
  return `<span class="state">${esc(b.state)}</span>`;
}
function renderPipeline() {
  const all = D.businesses.filter(b => b.run_id === S.run);
  const counts = {}; all.forEach(b => { counts[groupOf(b)] = (counts[groupOf(b)] || 0) + 1; });
  const fbox = document.getElementById('pipefilters');
  fbox.innerHTML = GROUPS.filter(([g]) => g === 'all' || counts[g]).map(([g, l]) => `<button class="pill small" aria-pressed="${S.group === g}" data-g="${g}">${l}<span class="n">${g === 'all' ? all.length : counts[g]}</span></button>`).join('');
  fbox.onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; S.group = b.dataset.g; S.hi = null; renderPipeline(); fbox.querySelector(`[data-g=${S.group}]`).focus(); };
  const order = { gate: 0, pipeline: 1, delivered: 2, dropped: 3, not_approved: 4, not_shortlisted: 5, superseded: 6 };
  const rows = all.filter(b => S.group === 'all' || groupOf(b) === S.group)
    .sort((a, b) => (order[groupOf(a)] - order[groupOf(b)]) || (b.station - a.station) || a.name.localeCompare(b.name));
  document.getElementById('pipechip').innerHTML = `<b>${rows.length}</b> of ${all.length} businesses · ${esc(shortRun(S.run))}`;
  document.getElementById('pipenote').textContent = `Stations 1–9; ◇ marks a gate. Days = days since the business's last ledger line. Owner “you” = ${D.human}.`;
  const box = document.getElementById('pipetable');
  if (!rows.length) { box.innerHTML = `<div class="empty"><p class="h0">0</p>No business in this group for ${esc(S.run)}.</div>`; return; }
  box.innerHTML = `<div class="tblwrap"><table class="tbl pipe"><thead><tr><th>Business</th><th>Stations</th><th>State</th><th>Next step</th><th>Owner</th><th class="days">Days</th><th class="why-h">Last note</th></tr></thead><tbody>
    ${rows.map(b => { const you = b.owner === D.human; const next = b.out ? 'none' : esc(b.next_step);
      return `<tr id="row-${esc(b.slug)}" tabindex="0" class="${S.hi === b.slug ? 'hi' : ''}" aria-label="${esc(b.name)}, station ${b.station} of 9, ${esc(b.gate || b.label)}, next: ${esc(b.out ? 'none, ' + b.label : b.next_step)}${b.owner ? ', owner ' + esc(b.owner) : ''}, ${b.days_since_change} days. Press Enter to read the last note.">
      <td class="b">${esc(b.name)}${b.type ? `<span class="type">${esc(b.type.replace('_',' '))}</span>` : ''}</td>
      <td>${stationBar(b)}</td><td>${statePill(b)}</td>
      <td class="s">${next}</td><td class="${you ? 'you' : 'own'}">${b.owner ? (you ? 'you' : esc(b.owner)) : '·'}</td>
      <td class="days">${b.days_since_change}</td><td class="why note"><span>${esc(b.why)}</span></td></tr>`; }).join('')}
    </tbody></table></div>`;
  box.querySelectorAll('.stations').forEach(bar => bar.addEventListener('keydown', e => {
    const pills = [...bar.querySelectorAll('.st')], i = pills.indexOf(document.activeElement);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const j = i < 0 ? (e.key === 'ArrowRight' ? 0 : pills.length - 1) : (i + (e.key === 'ArrowRight' ? 1 : pills.length - 1)) % pills.length; pills[j].focus(); e.preventDefault(); e.stopPropagation(); }
    if (e.key === 'Escape' && i >= 0) { bar.focus(); e.stopPropagation(); }
  }));
  const tog = tr => tr.classList.toggle('open');
  box.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', e => { if (!e.target.closest('.st')) tog(tr); });
    tr.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === tr) { tog(tr); e.preventDefault(); } });
  });
  if (S.hi) { const r = document.getElementById('row-' + S.hi); if (r) { r.classList.add('open'); r.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }); r.focus({ preventScroll: true }); } }
}

/* ---------- views + routing ---------- */
const tabs = [...document.querySelectorAll('[role=tab][data-view]')];
function showView(v) {
  if (S.view !== v && S.animated) scrollTo(0, 0); // a view switch starts at the top; the initial route keeps the browser's position
  S.view = v;
  tabs.forEach(t => { const on = t.dataset.view === v; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
  document.getElementById('view-overview').hidden = v !== 'overview';
  document.getElementById('view-pipeline').hidden = v !== 'pipeline';
  document.getElementById('viewtitle').textContent = v === 'overview' ? 'Overview' : 'Pipeline';
  document.title = `OneShot — ${v === 'overview' ? 'Overview' : 'Pipeline'}`;
}
function route() {
  const h = location.hash.replace(/^#/, '') || 'overview';
  const [path, q] = h.split('?'); const [view, slug] = path.split('/');
  const v = view === 'pipeline' ? 'pipeline' : 'overview';
  if (q) { const g = new URLSearchParams(q).get('g'); if (g) S.group = g; }
  if (slug) { S.hi = slug; S.group = 'all'; const b = bizOf[slug]; if (b && !b[S.run]) S.run = Object.keys(b)[0]; }
  showView(v); renderAll();
}
const go = v => { history.pushState(null, '', '#' + v); route(); };
tabs.forEach(t => t.addEventListener('click', () => go(t.dataset.view)));
document.querySelector('[role=tablist]').addEventListener('keydown', e => {
  if (!['ArrowDown','ArrowUp','Home','End'].includes(e.key)) return;
  const i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const j = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : tabs.length - 1)) % tabs.length;
  go(tabs[j].dataset.view); tabs[j].focus(); e.preventDefault();
});
document.querySelectorAll('[role=tab][aria-disabled=true]').forEach(t => t.addEventListener('click', e => e.preventDefault()));
addEventListener('hashchange', route);

function renderAll() {
  renderRuns();
  document.querySelectorAll('#runs [role=radio]').forEach(b => { b.setAttribute('aria-checked', String(b.dataset.run === S.run)); b.tabIndex = b.dataset.run === S.run ? 0 : -1; });
  if (S.view === 'overview') renderOverview(); else renderPipeline();
  if (!S.animated) { document.body.classList.add('draw'); S.animated = true; setTimeout(() => document.body.classList.remove('draw'), 1200); }
}
document.getElementById('railfoot').innerHTML = `<b>data</b>${day(D.generated_at)}`;
renderRange();
route();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === 'overview') renderFunnel(); }, 120); });
})();
</script>
</body>
</html>
