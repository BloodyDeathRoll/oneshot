<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oneshot · Overview</title>
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url("__FONT__") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;--rule2:#EEF0F5;
  /* LOCKED 2026-09-27 (Shahar): purple lead, blue for links only. */
  --acc:#6A2FE0;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;
  --green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--red-bg:#FCEBED;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 6px 20px rgba(11,18,32,.05);
  --shadow-pop:0 2px 6px rgba(11,18,32,.06),0 28px 72px rgba(11,18,32,.18);
  --r:20px;--r2:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:linear-gradient(90deg,var(--card) 240px,var(--ground) 240px);font-size:16px;line-height:1.5}
@media (max-width:1199px){body{background:linear-gradient(90deg,var(--card) 72px,var(--ground) 72px)}}
@media (max-width:640px){body{background:var(--ground)}}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--rule2);display:flex;flex-direction:column;padding:28px 16px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:0 12px 28px}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--acc);display:inline-grid;place-items:center;flex:none}
.logo i:after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:var(--r2);font-weight:600;font-size:15px;color:var(--ink2);cursor:pointer}
.nav button:hover{background:var(--ground);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav svg{width:22px;height:22px}
.nav .n{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink2);background:var(--ground);border-radius:999px;min-width:26px;height:24px;display:inline-grid;place-items:center;padding:0 8px}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule2);display:flex;align-items:center;gap:10px}
.side-foot .who{font-size:15px;font-weight:700;line-height:1.3}
.side-foot .upd{font-size:14px;color:var(--ink3);font-weight:500}
.topbar{display:none}

.main{padding:40px 40px 72px;min-width:0}
.wrap{max-width:1120px;margin:0 auto}

/* ---------- greeting ---------- */
.hello{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}
.hello h1{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.hello p{font-size:17px;color:var(--ink2);margin-top:6px;font-weight:500}
.mode{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2);background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);white-space:nowrap;margin-top:4px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.disc{width:40px;height:40px;border-radius:12px;background:var(--ground);color:var(--ink2);display:inline-grid;place-items:center;flex:none}
.disc svg{width:20px;height:20px}

/* money */
.money{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mcard{padding:28px 32px 30px;display:flex;flex-direction:column;min-width:0}
.mcard .mh{display:flex;align-items:center;gap:12px}
.mcard .mh h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mcard .info{display:none}
.mcard .fig{display:flex;align-items:baseline;gap:12px;margin-top:22px}
.mcard .big{font-size:72px;font-weight:300;line-height:.95;letter-spacing:-.045em;color:var(--ink)}
.mcard .big.zero{color:var(--ink3)}
.mcard .so{font-size:17px;color:var(--ink3);font-weight:500}
.mcard .hint{font-size:15px;color:var(--ink2);margin-top:18px;max-width:440px;line-height:1.55}
.mcard .hint q{quotes:"‘" "’";font-weight:700;color:var(--ink)}

/* the 100,000-ft strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:24px;padding:4px 0}
.cell{display:flex;align-items:center;gap:14px;padding:18px 24px;min-width:0}
.cell+.cell{border-left:1px solid var(--rule)}
.cell .l{font-size:15px;color:var(--ink2);font-weight:600;line-height:1.25}
.cell .v{font-size:32px;font-weight:300;line-height:1.1;color:var(--ink3);letter-spacing:-.02em;margin-top:2px}
.cell.on .v{color:var(--acc);font-weight:400}
.cell.on .disc{background:var(--t5);color:var(--acc)}

/* ---------- next steps ---------- */
.sec{margin-top:48px}
.sec-h{display:flex;align-items:center;gap:12px}
.sec-h h2{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.count{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 10px;border-radius:999px;background:var(--t5);color:var(--acc);font-weight:800;font-size:16px}
.sec-sub{font-size:16px;color:var(--ink2);margin-top:6px}
.steps{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:16px}

.step{padding:24px 28px 28px;display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-areas:'h h' 't l';column-gap:32px;row-gap:20px;align-items:start}
.step>.shead{grid-area:h}.step>.thumb{grid-area:t}.step>.lines{grid-area:l}
.thumb{display:block;position:relative;border-radius:var(--r2);overflow:hidden;background:var(--ground);aspect-ratio:16/10;box-shadow:inset 0 0 0 1px rgba(11,18,32,.06)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.thumb:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(11,18,32,.07)}
.sbody{min-width:0}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--rule2)}
.shead h3{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;font-size:15px;color:var(--ink2);font-weight:500}
.meta .sep{width:4px;height:4px;border-radius:50%;background:var(--rule);display:inline-block}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.ini{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:800;background:var(--t5);color:var(--acc);flex:none}
.ini.alon{background:var(--acc-sec)}
.ini.you{background:var(--acc);color:#fff}
.qual b{color:var(--ink);font-weight:700}
.status{display:flex;align-items:center;gap:10px;flex:none;padding-top:2px}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ready{background:var(--t5);color:var(--acc)}
.pill.sent{background:var(--ground);color:var(--ink2)}
.pill.good{background:var(--green-bg);color:var(--green)}
.pill.sold{background:var(--green);color:#fff}
.pill.sold:before{background:#fff}
.age{font-size:15px;color:var(--ink2);font-weight:600;white-space:nowrap}
.age.old{color:var(--red)}

.lines{margin:0;padding:0;display:grid;gap:18px;align-content:center;min-height:180px}
.line{display:grid;grid-template-columns:128px minmax(0,1fr);gap:20px;align-items:center;min-height:48px}
.line dt{font-size:15px;color:var(--ink3);font-weight:600;text-align:right}
.line dd{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;min-width:0}
.line dd.split{justify-content:space-between}
.line dd .grp{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}

/* the four kinds of action */
.lk{display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:700;font-size:16px;text-decoration:none;padding:9px 4px;border-radius:8px}
.lk svg{width:16px;height:16px}
.lk:hover{text-decoration:underline;text-underline-offset:4px}
.lk+.lk,.lk+.off{margin-left:10px}
.off{display:inline-flex;align-items:center;gap:8px;color:var(--ink3);font-weight:700;font-size:16px;cursor:default;padding:4px;border-radius:8px}
.off svg{width:18px;height:18px}
.off small{display:block;font-size:14px;font-weight:500;line-height:1.2}
.off span{line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px 0 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip svg{width:18px;height:18px;color:var(--ink2)}
.chip:hover{border-color:var(--t3);background:#FCFBFF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--acc);color:#fff;box-shadow:0 1px 2px rgba(106,47,224,.25),0 4px 12px rgba(106,47,224,.18)}
.btn.p:hover{background:#5B24CC}
.btn.p:disabled{background:var(--t3);box-shadow:none;cursor:not-allowed}
.btn.s{background:var(--card);color:var(--ink);border:1.5px solid var(--rule)}
.btn.s:hover{border-color:var(--t3)}
.ghost{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:0;background:transparent;color:var(--ink2);font-size:15px;font-weight:700;border-radius:12px;cursor:pointer}
.ghost svg{width:20px;height:20px}
.ghost:hover{background:var(--ground);color:var(--ink)}

/* compact step: a decision */
.step.dec{grid-template-areas:none;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:20px 24px}
.step.dec .disc{width:52px;height:52px;border-radius:14px}
.step.dec .disc svg{width:24px;height:24px}
.step.dec h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.step.dec p{font-size:15px;color:var(--ink2);margin-top:2px}

.empty{padding:22px 24px;font-size:16px;color:var(--ink2)}

/* pitched group + waiting on Alon */
.sec.small .sec-h h2{font-size:20px}
.sec.small .count{height:26px;min-width:30px;font-size:14px;background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--rule)}
.sec.small .sec-sub{font-size:15px}
.rows{list-style:none;margin:14px 0 0;padding:6px 0}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;align-items:center;padding:12px 24px}
.row+.row{border-top:1px solid var(--rule2)}
.row .thumb{border-radius:8px}
.row h3{font-size:16px;font-weight:700}
.row p{font-size:15px;color:var(--ink2);margin-top:2px}
.row .acts{display:flex;align-items:center;gap:8px}
.row .btn{height:40px;font-size:15px;padding:0 16px}
.row.ho{grid-template-columns:auto minmax(0,1fr) auto}
details.grp summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;border-radius:12px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary svg{width:22px;height:22px;color:var(--ink2);transition:transform .15s}
details.grp[open] summary svg{transform:rotate(90deg)}

/* ---------- popup ---------- */
dialog.pop{border:0;padding:0;background:transparent;width:min(600px,calc(100% - 32px));max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow:visible;color:var(--ink)}
dialog.pop::backdrop{background:rgba(255,255,255,.8)}
dialog.pop[open]{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.pin{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-pop),0 0 0 1px rgba(11,18,32,.05);display:flex;flex-direction:column;max-height:inherit;overflow:hidden}
.ph{display:flex;align-items:flex-start;gap:16px;padding:24px 24px 0 28px}
.ph .tt{flex:1;min-width:0;padding-top:6px}
.ph h2{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.ph p{font-size:15px;color:var(--ink2);margin-top:4px}
.x{width:40px;height:40px;border-radius:12px;border:0;background:var(--ground);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}
.x:hover{background:var(--rule2);color:var(--ink)}
.x svg{width:18px;height:18px}
.pb{padding:20px 28px 4px;overflow:auto;min-height:0}
.pf{padding:16px 28px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pf.line-top{border-top:1px solid var(--rule2);margin-top:16px;padding-top:18px}
form.pb{padding-bottom:0}
form.pb>.pf{margin:16px -28px 0}
.pf .note{font-size:15px;color:var(--ink2)}
.pf .note button{border:0;background:none;padding:0;font-weight:700;color:var(--acc);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.pf .sp{flex:1}

.fld{display:grid;gap:4px;font-size:15px;margin-bottom:6px}
.fld .k{color:var(--ink3);font-weight:600}
.fld .v{color:var(--ink);font-weight:700}
.kv{display:flex;gap:10px;font-size:15px;margin-bottom:12px;align-items:baseline}
.kv .k{color:var(--ink3);font-weight:600;flex:none;width:64px}
.kv .v{font-weight:700;min-width:0}
.box{background:var(--ground);border-radius:var(--r2);position:relative}
.box .bh{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 18px}
.box .bh span{font-size:14px;font-weight:700;color:var(--ink3)}
.box .txt{padding:6px 20px 20px;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.box .txt.md{white-space:normal}
.md h4{font-size:16px;font-weight:800;margin:18px 0 6px;letter-spacing:-.005em}
.md p{margin:0 0 10px}
.md ol,.md ul{margin:0 0 10px;padding-left:22px}
.md li{margin:0 0 6px}
.md li ul{margin:6px 0 0}
.md>:first-child{margin-top:0}
mark.gap{background:var(--red-bg);color:var(--red);font-weight:700;border-radius:6px;padding:1px 6px}
.cp{display:inline-flex;align-items:center;gap:6px;height:40px;min-width:40px;justify-content:center;padding:0 10px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);cursor:pointer;color:var(--ink);font-size:14px;font-weight:700}
.cp svg{width:18px;height:18px}
.cp:hover{border-color:var(--t3)}
.cp.done{color:var(--green);border-color:#BFE3CB}
.btn.p.done{background:var(--green)}
.btn svg{width:18px;height:18px}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;color:var(--red);background:var(--red-bg);border-radius:12px;padding:12px 14px;font-weight:600}
.warn svg{width:18px;height:18px;margin-top:2px}
details.before{margin-top:16px;border:1.5px solid var(--rule2);border-radius:12px}
details.before summary{cursor:pointer;padding:12px 16px;font-size:15px;font-weight:700;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
details.before summary::-webkit-details-marker{display:none}
details.before summary svg{width:18px;height:18px;color:var(--ink2);transition:transform .15s}
details.before[open] summary svg{transform:rotate(90deg)}
details.before ul{margin:0;padding:0 18px 14px 40px;font-size:15px;color:var(--ink2);line-height:1.55}
details.before li+li{margin-top:6px}

/* forms */
fieldset{border:0;margin:0 0 20px;padding:0}
legend{font-size:17px;font-weight:700;padding:0;margin-bottom:12px}
.lbl{display:block;font-size:15px;font-weight:700;margin-bottom:8px}
.lbl small{font-weight:500;color:var(--ink3);font-size:15px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choices label{position:relative}
.choices input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choices span{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--rule);font-size:15px;font-weight:700;background:var(--card);cursor:pointer}
.choices span svg{width:18px;height:18px;color:var(--ink2)}
.choices input:checked+span{border-color:var(--acc);background:var(--t5);color:var(--acc)}
.choices input:checked+span svg{color:var(--acc)}
.choices input:focus-visible+span{outline:2.5px solid var(--acc);outline-offset:2px}
.inp{width:100%;height:46px;border:1.5px solid var(--rule);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--card)}
textarea.inp{height:auto;min-height:104px;padding:12px 14px;resize:vertical;line-height:1.5}
.inp:focus{outline:2.5px solid var(--acc);outline-offset:1px;border-color:transparent}
.two{display:grid;grid-template-columns:200px 1fr;gap:16px;margin-bottom:6px}
.err{color:var(--red);font-size:15px;font-weight:600;margin-top:10px}
.to{display:flex;gap:10px;margin-bottom:20px}
.done-h{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:14px}
.done-h i{width:28px;height:28px;border-radius:50%;background:var(--green-bg);color:var(--green);display:inline-grid;place-items:center}
.done-h svg{width:16px;height:16px}
.prompt{font-size:15px;line-height:1.55}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:15px;font-weight:600;padding:14px 20px;border-radius:14px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}

/* menu sheet (phone) */
dialog.sheet{border:0;padding:0;margin:0 0 auto;width:100%;max-width:100%;background:transparent}
dialog.sheet::backdrop{background:rgba(255,255,255,.8)}
dialog.sheet .pin{border-radius:0 0 20px 20px;padding:12px 16px 20px}

/* ---------- 1024: rail ---------- */
@media (max-width:1199px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:24px 12px}
  .logo{padding:0 0 24px;justify-content:center}
  .logo b,.nav span,.side-foot .txt{display:none}
  .nav button{justify-content:center;padding:12px 0}
  .side-foot{justify-content:center;padding:16px 0 0}
  .main{padding:32px 32px 64px}
  .mcard .big{font-size:64px}
  .cell{padding:16px 18px}
  .cell .disc{display:none}
  .step{grid-template-columns:208px minmax(0,1fr);column-gap:24px;padding:22px 24px 24px}
  .step>.thumb{align-self:center}
  .chip{padding:0 14px 0 12px;gap:7px}
  .lines{min-height:150px;gap:9px}
  .line{grid-template-columns:112px minmax(0,1fr);gap:14px;min-height:44px}
}
@media (max-width:900px){
  .line{grid-template-columns:1fr;gap:8px}
  .line dt{text-align:left}
  .strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cell:nth-child(4){border-left:0}
  .cell:nth-child(n+4){border-top:1px solid var(--rule)}
}
/* ---------- phone ---------- */
@media (max-width:640px){
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 16px;background:var(--card);border-bottom:1px solid var(--rule2);position:sticky;top:0;z-index:5}
  .topbar .logo{padding:0}
  .topbar .logo b{display:none}
  .topbar .here{font-size:17px;font-weight:700;flex:1}
  .topbar .x{background:transparent}
  .main{padding:20px 16px 56px}
  .hello{flex-direction:column;gap:12px;margin-bottom:20px}
  .hello h1{font-size:26px}

  .cell:last-child{grid-column:1/-1}
  .cell .v{font-size:26px}
  .sec{margin-top:36px}
  .sec-h h2{font-size:22px}
  .sec-sub{font-size:15px}
  .step{grid-template-columns:1fr;grid-template-areas:'t' 'h' 'l';row-gap:16px;padding:16px}
  .shead{flex-direction:column;gap:10px;padding-bottom:16px}

  .lines{gap:14px}
  .line{min-height:0}
  .line dt{font-size:14px}

  .line dd.split .btn.p{width:100%;height:48px}
  .line dd.split .ghost{justify-content:center}

  .step.dec{grid-template-columns:auto minmax(0,1fr);padding:16px}

  .row{grid-template-columns:72px minmax(0,1fr);padding:12px 16px}

  .ph{padding:20px 16px 0 20px}

  dialog.pop{width:calc(100% - 16px)}
}

@media (max-width:640px){.mlong{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);

  return e;
}
const svg=(d,vb='0 0 24 24',sw=1.75)=>`<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  overview:svg('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>'),
  pipeline:svg('<path d="M4 7h16M4 12h10M4 17h13"/>'),
  sites:svg('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/>'),
  agents:svg('<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>'),
  decisions:svg('<path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>'),
  ext:svg('<path d="M7 17 17 7M9 7h8v8"/>','0 0 24 24',2.2),
  mail:svg('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>'),
  chat:svg('<path d="M20 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.2A8 8 0 1 1 20 11.5z"/>'),
  person:svg('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>'),
  phone:svg('<path d="M6.5 3.5h2.5l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5l1.5-2 4 1.5v2.5a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/>'),
  clock:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  handoff:svg('<circle cx="9" cy="8" r="3.5"/><path d="M3 20c.7-3.5 3-5.5 6-5.5 1.6 0 3 .5 4 1.5M15 15h6m-2.5-2.5L21 15l-2.5 2.5"/>'),
  copy:svg('<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/>'),
  check:svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>','0 0 24 24',2.4),
  close:svg('<path d="M6 6l12 12M18 6 6 18"/>','0 0 24 24',2),
  info:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>','0 0 24 24',2),
  menu:svg('<path d="M4 7h16M4 12h16M4 17h16"/>','0 0 24 24',2),
  chev:svg('<path d="m9 6 6 6-6 6"/>','0 0 24 24',2),
  warn:svg('<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>','0 0 24 24',2),
  inflow:svg('<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/>'),
  outflow:svg('<path d="M6 3.5h12v17l-2.5-1.5-2 1.5-1.5-1.5-1.5 1.5-2-1.5L6 20.5z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/>'),
  build:svg('<path d="M4 20h16M6 20V10l6-5 6 5v10"/><path d="M10 20v-5h4v5"/>'),
  send:svg('<path d="M20.5 3.5 10 14M20.5 3.5 14 20.5l-4-6.5-6.5-4z"/>'),
  sent:svg('<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>'),
  reply:svg('<path d="M9.5 8 5 12.5 9.5 17"/><path d="M5 12.5h9a5 5 0 0 1 5 5V19"/>'),
  client:svg('<path d="M12 3.5 14.6 9l5.9.6-4.4 4 1.3 5.9L12 16.6l-5.4 2.9 1.3-5.9-4.4-4L9.4 9z"/>'),
  tweak:svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
};
const CH_ICON={email:I.mail,whatsapp:I.chat,inperson:I.person};

/* ---------- small helpers ---------- */
const NOW=new Date();
const op=id=>D.operators[id]||id;
const others=Object.keys(D.operators).filter(o=>o!==D.viewer);
const other=others[0];
const daysSince=ts=>Math.max(0,Math.floor((NOW-new Date(ts))/864e5));
const dShort=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const plural=(n,w,ws)=>`${n} ${n===1?w:(ws||w+'s')}`;
const money=amt=>{const e=Object.entries(amt||{}).filter(([,v])=>v);if(!e.length)return '$0';return e.map(([c,v])=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:v%1?2:0}).format(v)).join(' + ')};
function say(t){const l=$('#live');l.textContent='';setTimeout(()=>l.textContent=t,30)}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),4000)}
function ini(id){return h('span',{class:'ini'+(id===D.viewer?' you':id==='alon'?' alon':''),'aria-hidden':'true',text:(op(id)||'?')[0].toUpperCase()})}

/* what the operator recorded in this page (a mockup: kept in memory, nothing is posted) */
const rec={};          // slug -> {state:'pitched'|'reply'|'meeting'|'sale'|'ignored', channel, date, note}
const handoffs=[];     // {slug,name,to,task,ts}

const CHANNEL={whatsapp:'WhatsApp',email:'email','in person':'in person',phone:'phone'};
function statusOf(s){
  const r=rec[s.slug];
  if(!r){
    if(s.state==='packaged')return {k:'ready',t:'Ready to send'};
    if(s.pitch_sent)return {k:'sent',t:`Pitched ${dShort(s.pitch_sent.ts)}${s.pitch_sent.channel?' by '+(CHANNEL[s.pitch_sent.channel.toLowerCase()]||s.pitch_sent.channel):''}`};
    return {k:'ready',t:'Ready to send'};
  }
  const sent=`Pitched ${dShort(r.date)} by ${CHANNEL[r.channel]}`;
  if(r.state==='pitched')return {k:'sent',t:sent};
  if(r.state==='reply')return {k:'good',t:`Replied ${dShort(r.odate)}`};
  if(r.state==='meeting')return {k:'good',t:`Meeting booked ${dShort(r.odate)}`};
  if(r.state==='sale')return {k:'sold',t:`Bought ${dShort(r.odate)}`};
  return {k:'sent',t:`No answer · ${sent.toLowerCase()}`};
}
const isReady=s=>!rec[s.slug]&&s.state==='packaged';

/* ---------- sidebar ---------- */
const VIEWS=[['overview','Overview'],['pipeline','Pipeline'],['sites','Sites'],['agents','Agents'],['decisions','Decisions']];
function renderNav(box){
  box.innerHTML='';
  for(const [k,label] of VIEWS){
    const n=k==='decisions'?D.other.reduce((a,g)=>a+(g.count||1),0):null;
    const b=h('button',{type:'button','aria-current':k==='overview'?'page':null,title:label,
      onclick:()=>{if(k!=='overview'){$('#sheet').open&&$('#sheet').close();toast(`${label} is another view. This mockup shows the Overview only.`)}}},
      h('span',{html:I[k],style:'display:contents'}),h('span',{text:label}),n?h('span',{class:'n',text:String(n),'aria-label':`${n} waiting`}):null);
    box.append(b);
  }
}
function renderFoot(){
  const g=new Date(D.generated_at);
  $('#side-foot').append(ini(D.viewer),h('div',{class:'txt'},h('div',{class:'who',text:`Signed in as ${op(D.viewer)}`}),
    h('div',{class:'upd',text:`Updated ${dShort(g)}, ${g.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`})));
}

/* ---------- greeting ---------- */
function renderHello(){
  const hr=NOW.getHours();
  $('#greet').textContent=`Good ${hr<12?'morning':hr<18?'afternoon':'evening'}, ${op(D.viewer)}`;
  const ready=D.sites.filter(isReady).length,sent=countPitched();
  $('#summary').textContent=(ready?`${plural(ready,'site is','sites are').replace(/^1 site is/,'1 site is')} ready to pitch. `:'No site is waiting to be pitched. ')+
    (sent?`${plural(sent,'pitch')} sent so far.`:'Nothing has been sent yet.');
  const m=$('#mode');m.querySelector('span').innerHTML='Preview copy<span class="mlong"> · what you record stays until you reload</span>';
}
function countPitched(){return D.kpis.pitched+Object.keys(rec).length}

/* ---------- money ---------- */
function renderMoney(){
  const box=$('#money');box.innerHTML='';
  const month=NOW.toISOString().slice(0,7);
  for(const [label,book,icon,empty,ask] of [
    ['Revenues',D.revenues,I.inflow,'No payments recorded yet.','When a client pays, tell Claude <q>record a payment</q> and it shows here.'],
    ['Expenses',D.expenses,I.outflow,'No expenses recorded yet.','When you pay for a domain, hosting or a tool, tell Claude <q>record an expense</q>.']]){
    const n=book.entries,total=money(book.accumulated);
    const info=h('button',{type:'button',class:'info','aria-label':`How ${label.toLowerCase()} get recorded`,html:I.info,
      onclick:e=>openPop(e.currentTarget,label,null,()=>[h('div',{class:'pb'},h('p',{style:'font-size:16px;line-height:1.6',html:`${empty} ${ask}`})),h('div',{class:'pf'},h('button',{type:'button',class:'btn s',text:'Close',onclick:closePop}))])});
    box.append(h('article',{class:'card mcard','aria-label':`${label}: ${total}${n?'':' so far'}`},
      h('div',{class:'mh'},h('span',{class:'disc',html:icon}),h('h2',{text:label}),info),
      h('div',{class:'fig'},h('span',{class:'big'+(n?'':' zero'),text:total}),h('span',{class:'so',text:n?'in total':'so far'})),
      n?h('p',{class:'hint',text:`${money(book.monthly?.[month])} this month · ${plural(n,'payment')} recorded`})
       :h('p',{class:'hint',html:`${empty} ${ask}`}),
      h('p',{class:'short',text:n?`${money(book.monthly?.[month])} this month`:'None recorded yet'})));
  }
}

/* ---------- the 100,000-ft strip ---------- */
function renderStrip(){
  const box=$('#strip');box.innerHTML='';
  const rs=Object.values(rec);
  const k={
    building:D.kpis.building,
    ready:D.sites.filter(isReady).length,
    pitched:countPitched(),
    replies:D.kpis.replies+rs.filter(r=>r.state==='reply'||r.state==='meeting').length,
    clients:D.kpis.clients+rs.filter(r=>r.state==='sale').length};
  for(const [key,label,icon] of [['building','Being built',I.build],['ready','Ready to send',I.send],['pitched','Pitched',I.sent],['replies','Replies',I.reply],['clients','Clients',I.client]]){
    const v=k[key];
    box.append(h('div',{class:'cell'+(v?' on':''),role:'group','aria-label':`${label}: ${v}`},h('span',{class:'disc',html:icon}),
      h('div',{},h('div',{class:'l',text:label}),h('div',{class:'v',text:String(v)}))));
  }
}

/* ---------- one site step ---------- */
function thumb(s,small){
  return h('a',{class:'thumb',href:s.preview_url,target:'_blank',rel:'noopener',tabindex:'-1','aria-hidden':'true'},
    h('img',{src:`../../mockups/soft-cards/dist/img/${s.slug}.jpg`,alt:'',loading:small?'lazy':null,width:'672',height:'420'}));
}
function metaLine(s){
  const bits=[s.type,h('span',{title:`Run ${s.run_id}`,text:s.run}),
    s.ran_by?h('span',{class:'who'},ini(s.ran_by),h('span',{text:op(s.ran_by)},h('span',{class:'sr',text:' ran it'}))):null,
    s.critic_score!=null?h('span',{class:'qual'},'Quality ',h('b',{text:String(s.critic_score)}),'/100'):null].filter(Boolean);
  const m=h('p',{class:'meta'});
  bits.forEach((b,i)=>{if(i)m.append(h('span',{class:'sep','aria-hidden':'true'}));m.append(b)});
  return m;
}
function links(s){
  const out=[];
  out.push(h('a',{class:'lk',href:s.preview_url,target:'_blank',rel:'noopener'},'Preview website',h('span',{class:'sr',text:` of ${s.name} (opens a new tab)`}),h('span',{html:I.ext,style:'display:contents'})));
  if(s.proposal_url&&s.proposal_live)out.push(h('a',{class:'lk',href:s.proposal_url,target:'_blank',rel:'noopener'},'Pitch',h('span',{class:'sr',text:` page for ${s.name} (opens a new tab)`}),h('span',{html:I.ext,style:'display:contents'})));
  else{
    const why=`The pitch page for ${s.name} is written but not online yet.`;
    out.push(h('span',{class:'off','aria-disabled':'true',tabindex:'0',role:'link',title:why,'aria-label':`Pitch, not online yet. ${why}`},h('span',{html:I.clock,style:'display:contents'}),h('span',{},'Pitch',h('small',{text:'not online yet'}))));
  }
  return out;
}
function draftChips(s){
  return s.drafts.map(d=>h('button',{type:'button',class:'chip',onclick:e=>openDraft(e.currentTarget,s,d)},h('span',{html:CH_ICON[d.kind],style:'display:contents'}),d.label));
}
function stepSite(s){
  const st=statusOf(s),age=daysSince(s.since);
  const li=h('li',{class:'card step',id:'s-'+s.slug,'aria-labelledby':'n-'+s.slug});
  li.append(
    h('div',{class:'shead'},
      h('div',{},h('h3',{id:'n-'+s.slug,text:s.name}),metaLine(s)),
      h('div',{class:'status'},h('span',{class:'pill '+st.k,text:st.t}),h('span',{class:'age'+(age>=14?' old':''),text:age?`for ${plural(age,'day')}`:'since today'}))),
    thumb(s));
  const lines=h('dl',{class:'lines'},
    h('div',{class:'line'},h('dt',{text:'Look first'}),h('dd',{},...links(s))),
    s.drafts.length?h('div',{class:'line'},h('dt',{text:'Send it yourself'}),h('dd',{},...draftChips(s))):null,
    h('div',{class:'line'},h('dt',{text:'Then record it'}),h('dd',{class:'split'},
      h('button',{type:'button',class:'btn p',onclick:e=>openStatus(e.currentTarget,s)},'Update status',h('span',{class:'sr',text:` of ${s.name}`})),
      h('button',{type:'button',class:'ghost',onclick:e=>openHandoff(e.currentTarget,s)},h('span',{html:I.handoff,style:'display:contents'}),'Hand off',h('span',{class:'sr',text:` ${s.name} to ${op(other)}`})))));
  li.append(lines);
  return li;
}
function stepDecision(g){
  return h('li',{class:'card step dec'},
    h('span',{class:'disc',html:I.tweak}),
    h('div',{},h('h3',{text:g.name}),h('p',{text:g.kind==='approve or reject'?'Approve or reject each one. Nothing changes until you do.':g.kind})),
    h('button',{type:'button',class:'btn s',onclick:()=>toast('This opens Decisions at the tweaks. Decisions is another view, not part of this mockup.')},'Review them'));
}
function renderSteps(){
  const ol=$('#steps');ol.innerHTML='';
  const toMe=handoffs.filter(x=>x.to===D.viewer);   // handoffs to you come first
  const ready=D.sites.filter(isReady).sort((a,b)=>new Date(a.since)-new Date(b.since)||a.name.localeCompare(b.name));
  for(const x of toMe)ol.append(h('li',{class:'card step dec'},h('span',{class:'disc',html:I.handoff}),h('div',{},h('h3',{text:`${op(x.by)} asks: ${x.task}`}),h('p',{text:x.name})),h('span')));
  for(const s of ready)ol.append(stepSite(s));
  for(const g of D.other)ol.append(stepDecision(g));
  const n=toMe.length+ready.length+D.other.length;
  $('#steps-n').textContent=String(n);$('#steps-n').setAttribute('aria-label',`${n} steps`);
  $('#steps-sub').textContent=ready.length?'Oldest first. You send each pitch yourself, then record it here.':'';
  if(!n)ol.append(h('li',{class:'card empty',text:'Nothing is waiting on you. New sites appear here when they are ready to pitch.'}));
}

/* ---------- pitched, waiting for a reply ---------- */
function renderPitched(){
  const sec=$('#pitched');sec.innerHTML='';
  const list=D.sites.filter(s=>!isReady(s));
  sec.hidden=!list.length;if(!list.length)return;
  const det=h('details',{class:'grp',open:true},
    h('summary',{},h('span',{html:I.chev,style:'display:contents'}),h('span',{class:'sec-h'},h('h2',{text:'Pitched, waiting for a reply'}),h('span',{class:'count',text:String(list.length)}))));
  const ul=h('ul',{class:'card rows'});
  for(const s of list){
    const st=statusOf(s);
    ul.append(h('li',{class:'row'},thumb(s,true),
      h('div',{},h('h3',{text:s.name}),h('p',{},h('span',{class:'pill '+st.k,text:st.t}))),
      h('div',{class:'acts'},h('button',{type:'button',class:'btn p',onclick:e=>openStatus(e.currentTarget,s)},'Update status',h('span',{class:'sr',text:` of ${s.name}`})))));
  }
  det.append(ul);sec.append(det);
}

/* ---------- waiting on the other operator ---------- */
function renderWaiting(){
  const sec=$('#waiting');sec.innerHTML='';
  const mine=handoffs.filter(x=>x.by===D.viewer);
  sec.append(h('div',{class:'sec-h'},h('h2',{id:'wait-h',text:`Waiting on ${op(other)}`}),h('span',{class:'count',text:String(mine.length)})));
  if(!mine.length){sec.append(h('p',{class:'sec-sub',text:`Nothing handed off. Use Hand off on a site to ask ${op(other)} for something.`}));return}
  const ul=h('ul',{class:'card rows'});
  for(const x of mine){
    ul.append(h('li',{class:'row ho'},ini(x.to),h('div',{},h('h3',{text:x.task}),h('p',{text:`${x.name} · asked ${dShort(x.ts)}`})),
      h('div',{class:'acts'},copyBtn(()=>handoffPrompt(x),'Copy prompt'))));
  }
  sec.append(ul);
}

/* ---------- popup: one component for all ---------- */
const dlg=$('#dlg');let opener=null;
function openPop(from,title,sub,build){
  opener=from;
  const inner=$('#dlg-in');inner.innerHTML='';
  inner.append(h('div',{class:'ph'},h('div',{class:'tt'},h('h2',{id:'dlg-t',text:title}),sub?h('p',{id:'dlg-s',text:sub}):null),
    h('button',{type:'button',class:'x','aria-label':'Close',html:I.close,onclick:closePop})),...build());
  dlg.setAttribute('aria-labelledby','dlg-t');sub?dlg.setAttribute('aria-describedby','dlg-s'):dlg.removeAttribute('aria-describedby');
  if(!dlg.open)dlg.showModal();
  const f=inner.querySelector('[autofocus]')||inner.querySelector('.x');f&&f.focus();
}
function closePop(){if(dlg.open)dlg.close()}
dlg.addEventListener('click',e=>{if(e.target===dlg)closePop()});
dlg.addEventListener('close',()=>{if(opener&&document.contains(opener))opener.focus();opener=null});

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch{const ta=h('textarea',{style:'position:fixed;opacity:0;top:0'});ta.value=t;(dlg.open?dlg:document.body).append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();return ok}
}
function copyBtn(get,label){
  const b=h('button',{type:'button',class:'cp',title:label||'Copy','aria-label':label||'Copy'},h('span',{html:I.copy,style:'display:contents'}),label?h('span',{text:label}):null);
  b.onclick=async()=>{await copyText(get());const was=b.innerHTML;b.classList.add('done');b.innerHTML=I.check+'<span>Copied</span>';say('Copied');setTimeout(()=>{b.innerHTML=was;b.classList.remove('done')},1600)};
  return b;
}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mdHtml(t){ // headings, lists, bold: the in-person scripts
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  let out='',inOl=false,inUl=false,inSub=false,para=[];
  const flush=()=>{if(para.length){out+=`<p>${inl(para.join(' '))}</p>`;para=[]}};
  const closeSub=()=>{if(inSub){out+='</ul>';inSub=false}};
  const closeLists=()=>{closeSub();if(inOl){out+='</li></ol>';inOl=false}if(inUl){out+='</li></ul>';inUl=false}};
  for(const line of t.split('\n')){
    let m;
    if(!line.trim()){flush();continue}
    if(m=line.match(/^#{2,}\s+(.*)/)){flush();closeLists();out+=`<h4>${inl(m[1])}</h4>`;continue}
    if(m=line.match(/^\d+\.\s+(.*)/)){flush();closeSub();if(inUl){out+='</li></ul>';inUl=false}out+=inOl?`</li><li>${inl(m[1])}`:`<ol><li>${inl(m[1])}`;inOl=true;continue}
    if((m=line.match(/^\s{2,}-\s+(.*)/))&&(inOl||inUl)){out+=inSub?`<li>${inl(m[1])}</li>`:`<ul><li>${inl(m[1])}</li>`;inSub=true;continue}
    if(m=line.match(/^-\s+(.*)/)){flush();if(inOl){closeSub();out+='</li></ol>';inOl=false}out+=inUl?`</li><li>${inl(m[1])}`:`<ul><li>${inl(m[1])}`;inUl=true;continue}
    closeLists();para.push(line.trim());
  }
  flush();closeLists();return out;
}
const plain=t=>t.replace(/\*\*(.+?)\*\*/g,'$1').replace(/^#{2,}\s+/gm,'');

function openDraft(from,s,d){
  openPop(from,`${d.label} — ${s.name}`,null,()=>{
    const pb=h('div',{class:'pb'});
    if(d.to)pb.append(h('div',{class:'kv'},h('span',{class:'k',text:'To'}),h('span',{class:'v',text:d.to})));
    if(d.subject)pb.append(h('div',{class:'kv'},h('span',{class:'k',text:'Subject'}),h('span',{class:'v',text:d.subject})));
    const txt=d.kind==='inperson'?h('div',{class:'txt md',html:mdHtml(d.message)})
      :h('div',{class:'txt',html:d.placeholder?esc(d.message).replace(esc(d.placeholder),`<mark class="gap">${esc(d.placeholder)}</mark>`):esc(d.message)});
    if(d.placeholder&&!s.proposal_live)pb.append(h('p',{class:'warn',style:'margin:0 0 14px'},h('span',{html:I.warn,style:'display:contents'}),
      h('span',{text:'There is a gap to fill: the pitch page link. The pitch page is not online yet, so this email cannot go out as it is.'})));
    const copyAll=()=>d.kind==='inperson'?plain(d.message):(d.subject&&d.kind==='email'?d.message:d.message);
    pb.append(h('div',{class:'box'},h('div',{class:'bh'},h('span',{text:d.kind==='inperson'?'What to say':d.kind==='email'?'The email':'The message'}),copyBtn(copyAll)),txt));
    if(d.notes.length)pb.append(h('details',{class:'before'},h('summary',{},h('span',{html:I.chev,style:'display:contents'}),'Before you send'),h('ul',{},...d.notes.map(n=>h('li',{text:n})))));
    const pf=h('div',{class:'pf line-top'},h('p',{class:'note'},'Sent it? ',h('button',{type:'button',onclick:()=>openStatus(opener,s,d.kind)},'Update status'),' to record it.'));
    return [pb,pf];
  });
}

/* Update status: records what happened, sends nothing */
function openStatus(from,s,preset){
  const pitched=!isReady(s);
  openPop(from,`Update status — ${s.name}`,'Record what happened. Nothing is sent from here.',()=>{
    const f=h('form',{class:'pb',novalidate:true});
    const today=NOW.toISOString().slice(0,10);
    const opts=pitched?[['reply','Replied',I.reply],['meeting','Booked a meeting',I.clock],['sale','Bought',I.client],['ignored','No answer',I.close]]
      :[['whatsapp','WhatsApp',I.chat],['email','Email',I.mail],['in person','In person',I.person],['phone','Phone',I.phone]];
    const pre=preset==='inperson'?'in person':preset;
    f.append(h('fieldset',{},h('legend',{text:pitched?'What did the owner do?':'Did you send the pitch? How?'}),
      h('div',{class:'choices'},...opts.map(([v,l,ic])=>h('label',{},h('input',{type:'radio',name:'c',value:v,checked:v===pre,autofocus:v===(pre||opts[0][0])&&null}),h('span',{},h('span',{html:ic,style:'display:contents'}),l))))));
    f.append(h('div',{class:'two'},
      h('div',{},h('label',{class:'lbl',for:'f-date',text:'When'}),h('input',{class:'inp',type:'date',id:'f-date',value:today,max:today})),
      h('div',{},h('label',{class:'lbl',for:'f-note'},'Note ',h('small',{text:'(optional)'})),h('input',{class:'inp',id:'f-note',placeholder:pitched?'What they said':'Who you spoke to',autocomplete:'off'}))));
    const err=h('p',{class:'err',role:'alert'});
    f.append(err);
    const save=h('button',{type:'submit',class:'btn p'},pitched?'Save':'Save as pitched');
    const pf=h('div',{class:'pf line-top'},save,h('button',{type:'button',class:'btn s',onclick:closePop},'Cancel'));
    f.append(pf);
    f.addEventListener('submit',e=>{
      e.preventDefault();
      const c=f.querySelector('input[name=c]:checked');
      if(!c){err.textContent=pitched?'Choose what the owner did.':'Choose how you sent it.';f.querySelector('input[name=c]').focus();return}
      const date=f.querySelector('#f-date').value||today,note=f.querySelector('#f-note').value.trim();
      if(pitched){const r=rec[s.slug]||{state:'pitched',channel:'whatsapp',date};r.state=c.value;r.odate=date;r.onote=note;rec[s.slug]=r}
      else rec[s.slug]={state:'pitched',channel:c.value,date,note};
      closePop();renderAll();
      const st=statusOf(s);
      toast(pitched?`${s.name}: ${st.t}.`:`Recorded: ${s.name}, ${st.t.replace(/^P/,'p')}. It moved to “Pitched, waiting for a reply”.`);
      const tgt=document.getElementById('pitched');tgt&&!tgt.hidden&&tgt.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
    });
    setTimeout(()=>{const first=f.querySelector('input[name=c]:checked')||f.querySelector('input[name=c]');first&&first.focus()},0);
    return [f];
  });
}

/* Hand off: writes a task for the other operator and gives a prompt to send them */
function handoffPrompt(x){
  const s=D.sites.find(y=>y.slug===x.slug);
  return [`Oneshot handoff from ${op(x.by)} to ${op(x.to)} (${x.ts.slice(0,10)}).`,
    `Business: ${s.name} (${s.slug}) · run ${s.run_id} · state: ${s.state}`,
    [s.preview_url&&`Preview: ${s.preview_url}`,s.proposal_url&&s.proposal_live&&`Pitch: ${s.proposal_url}`].filter(Boolean).join(' · '),
    `Request: ${x.task}`,
    `Start: pull main, read CLAUDE.md, PLAN.md and notes/${s.slug}.md, then run \`node tools/team.mjs status ${s.slug}\`.`].filter(Boolean).join('\n');
}
function openHandoff(from,s){
  openPop(from,`Hand off — ${s.name}`,`Ask ${op(other)} to do something on this site.`,()=>{
    const f=h('form',{class:'pb',novalidate:true});
    let to=other;
    const q=h('label',{class:'lbl',for:'f-task',text:`What should ${op(to)} do?`});
    f.append(h('fieldset',{},h('legend',{class:'lbl',style:'font-size:15px;margin-bottom:8px',text:'To'}),
      h('div',{class:'choices'},...Object.keys(D.operators).map(o=>h('label',{},h('input',{type:'radio',name:'to',value:o,checked:o===other,onchange:()=>{to=o;q.textContent=o===D.viewer?'What do you need to do?':`What should ${op(o)} do?`}}),
        h('span',{},ini(o),op(o)+(o===D.viewer?' (you)':'')))))));
    const ta=h('textarea',{class:'inp',id:'f-task',placeholder:'For example: send the WhatsApp pitch, he knows the owner'});
    f.append(q,ta);
    const err=h('p',{class:'err',role:'alert'});f.append(err);
    const pf=h('div',{class:'pf line-top'},h('button',{type:'submit',class:'btn p'},'Hand off'),h('button',{type:'button',class:'btn s',onclick:closePop},'Cancel'));
    f.append(pf);
    f.addEventListener('submit',e=>{
      e.preventDefault();
      const task=ta.value.trim();
      if(task.length<3){err.textContent=`Write what ${op(to)} should do first.`;ta.focus();return}
      const x={slug:s.slug,name:s.name,to,by:D.viewer,task,ts:new Date().toISOString()};
      handoffs.push(x);renderAll();
      // the same popup changes in place to the prompt to send
      const inner=$('#dlg-in');
      inner.querySelector('.ph h2').textContent=`Handed off — ${s.name}`;
      const sub=inner.querySelector('.ph p');if(sub)sub.textContent=`Saved as ${op(to)}'s task. ${op(to)} sees it on the Overview.`;
      f.replaceWith(h('div',{class:'pb'},
        h('p',{class:'done-h'},h('i',{html:I.check}),`Now send ${to===D.viewer?'yourself':op(to)==='Alon'?'him':op(to)} this:`),
        h('div',{class:'box'},h('div',{class:'bh',style:'padding:14px 18px 0'},h('span',{text:'Prompt for Claude'})),h('div',{class:'txt prompt',text:handoffPrompt(x)}))),
        h('div',{class:'pf'},copyBtn(()=>handoffPrompt(x),'Copy prompt'),h('span',{class:'sp'}),h('button',{type:'button',class:'btn s',onclick:closePop},'Done')));
      const cpb=inner.querySelector('.pf .cp');cpb.className='btn p';cpb.dataset.cp='1';
      cpb.focus();
      say(`Handed off to ${op(to)}`);
    });
    setTimeout(()=>ta.focus(),0);
    return [f];
  });
}
