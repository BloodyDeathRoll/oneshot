:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;--rule2:#EEF0F5;
  --acc:#6A2FE0;--acc-h:#5A22CC;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;
  --green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--red-bg:#FCEBED;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.06);
  --shadow-h:0 2px 4px rgba(11,18,32,.05),0 16px 40px rgba(11,18,32,.10);
  --r:20px;--r2:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:linear-gradient(90deg,var(--card) 239px,var(--rule) 239px,var(--rule) 240px,var(--ground) 240px);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;font-size:16px;line-height:1.5}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;background:transparent;display:flex;flex-direction:column;padding:28px 18px 24px;z-index:3}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 32px;font-weight:800;font-size:19px;letter-spacing:-.015em}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--acc);display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:grid;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:15px}
.nav a svg{width:22px;height:22px}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current=page]{background:var(--t5);color:var(--acc);font-weight:700}
.nav .badge{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink3);display:grid;gap:2px}
.side-foot b{color:var(--ink);font-weight:700}

/* ---------- main ---------- */
main{padding:36px 40px 72px;min-width:0}
.wrap{max-width:1120px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.top .sub{font-size:16px;color:var(--ink2);margin-top:4px}
.mode{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--ink2);white-space:nowrap}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}

/* money band */
.money{display:grid;grid-template-columns:1fr 1px 1fr;padding:34px 0 32px}

.m{padding:0 36px;min-width:0}

.m-label{font-size:17px;font-weight:700}
.m-num{display:flex;align-items:baseline;gap:14px;margin:18px 0 20px}

.track{height:6px;border-radius:999px;background:var(--t5)}
.m-hint{font-size:15px;color:var(--ink2);margin-top:14px;max-width:46ch}

/* filter tabs */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:36px 0 20px;flex-wrap:wrap}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{position:relative;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 18px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--ink2);font-size:15px;font-weight:700}
.tab .n{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--ground);color:var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700}
.tab:hover:not([aria-disabled=true]){color:var(--ink)}
.tab[aria-pressed=true]{background:var(--acc);color:#fff}
.tab[aria-pressed=true] .n{background:rgba(255,255,255,.2);color:#fff}
.tab[aria-disabled=true]{cursor:default;color:var(--ink3);box-shadow:none;background:transparent;border:1.5px solid var(--rule)}
.tab[aria-disabled=true] .n{background:transparent;color:var(--ink3);font-weight:600}
.building{font-size:15px;color:var(--ink3);display:flex;align-items:center;gap:8px;margin-left:auto}

/* tooltip */
.tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:max-content;max-width:260px;padding:9px 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;line-height:1.4;text-align:left;pointer-events:none;display:none;z-index:20;white-space:normal}
.tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.has-tip:hover .tip,.has-tip:focus-visible .tip,.has-tip:focus-within .tip{display:block}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}

.empty-wide{grid-column:1/-1;padding:48px 32px;text-align:center;color:var(--ink2);font-size:16px}

/* site card */

.thumb{position:relative;display:block;aspect-ratio:16/10;background:var(--ground);overflow:hidden;border-bottom:1px solid var(--rule2)}

.thumb .go{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(11,18,32,.16)}

.body{padding:20px 22px 0;display:flex;flex-direction:column;flex:1}
.name{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.25}

.status{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.ready{background:var(--t5);color:var(--acc)}
.pill.grey{background:#EEF0F4;color:var(--ink2)}

.pill.sale{background:var(--green);color:#fff}

.age{font-size:15px;color:var(--ink2)}
.age.old{color:var(--red);font-weight:700}
.fact{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--ink2);min-height:24px}

.fact svg{width:18px;height:18px;color:var(--ink3)}
.links{display:flex;gap:24px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule2)}

.ext.off:hover{text-decoration:none}

.label{font-size:14px;color:var(--ink3);font-weight:600;margin:18px 0 8px}
.msgs{display:grid;gap:8px}
.msg{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 14px 0 16px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);font-size:15px;font-weight:700;color:var(--ink);text-align:left}

.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;margin-top:16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:700}

.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:16px 0 18px;border-top:1px solid var(--rule2)}

/* rail */
.rail{display:grid;gap:24px;position:sticky;top:24px}
.rail .card{padding:24px}

.wait{display:flex;gap:16px;align-items:flex-start;margin-top:18px;padding:18px;border-radius:16px;background:var(--ground)}
.wait .big{font-size:44px;line-height:.95;font-weight:300;color:var(--acc);letter-spacing:-.02em}
.wait p{font-size:16px;font-weight:700;line-height:1.35}
.wait a{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--blue);font-weight:700;font-size:15px;text-decoration:none}
.wait a:hover{text-decoration:underline;text-underline-offset:3px}
.wait a svg{width:16px;height:16px}
.quiet{font-size:15px;color:var(--ink2);margin-top:12px}
.ho-list{display:grid;gap:14px;margin-top:16px}
.ho{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding-top:14px;border-top:1px solid var(--rule2)}
.ho:first-child{border-top:0;padding-top:0}
.ho .route{font-size:14px;color:var(--ink3)}
.ho b{display:block;font-size:15px}
.ho p{font-size:15px;color:var(--ink2);grid-column:2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ho .smallbtn{grid-column:2;justify-self:start}
.smallbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);font-size:14px;font-weight:700}
.smallbtn svg{width:16px;height:16px;color:var(--acc)}
.smallbtn:hover{border-color:var(--t3);background:var(--t5)}

/* ---------- popup ---------- */
dialog.pop{padding:0;border:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0;overflow:hidden}
dialog.pop::backdrop{background:rgba(255,255,255,.8)}
.pop-wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:24px 16px}
.box{width:min(600px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--rule),0 24px 64px rgba(11,18,32,.16),0 4px 12px rgba(11,18,32,.06);animation:pop .16s ease-out}

.box-head{display:flex;align-items:flex-start;gap:16px;padding:24px 20px 0 28px}
.box-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.35;flex:1;padding-top:6px}
.box-head .sub{font-size:15px;color:var(--ink2);font-weight:500;margin-top:4px;letter-spacing:0}
.x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;flex:none}
.x:hover{background:var(--ground);color:var(--ink)}
.x svg{width:20px;height:20px}
.box-body{padding:20px 28px 24px;overflow:auto;min-height:0}
.box-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;border-top:1px solid var(--rule);font-size:15px;color:var(--ink2);flex-wrap:wrap}
.to{font-size:15px;color:var(--ink2);margin-bottom:14px}
.to b{color:var(--ink);font-weight:700}
.fl{font-size:14px;color:var(--ink3);font-weight:600;margin:0 0 8px}
.copybox{position:relative;background:var(--ground);border-radius:12px;padding:18px 64px 18px 20px;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.copybox.subj{font-weight:700;padding-top:12px;padding-bottom:12px;margin-bottom:16px}
.copybox a{color:var(--blue);font-weight:600}
.copybox mark{background:#FFF3C4;color:var(--ink);border-radius:4px;padding:0 3px;font-weight:700}
.copy{position:absolute;top:10px;right:10px;height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:14px;font-weight:700}
.copybox.subj .copy{top:50%;transform:translateY(-50%)}
.copy:hover{color:var(--acc);border-color:var(--t3)}
.copy svg{width:18px;height:18px}
.copy.done{color:var(--green);border-color:#BFE3CA;background:var(--green-bg)}
.script{white-space:normal;max-height:min(52vh,560px);overflow:auto}
.script h3{font-size:16px;font-weight:700;margin:18px 0 6px}
.script h3:first-child{margin-top:0}
.script p{margin:0 0 10px}
.script ol{list-style:decimal;padding-left:22px;margin:0 0 10px}
.script ul{list-style:disc;padding-left:22px;margin:0 0 10px}
.script li{margin:0 0 6px}
.script li ul{margin:6px 0 0}
details.notes{margin-top:16px;border:1.5px solid var(--rule);border-radius:12px}
details.notes summary{list-style:none;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;font-size:15px;font-weight:700;cursor:pointer}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary svg{width:18px;height:18px;color:var(--ink3);margin-left:auto;transition:transform .15s}
details.notes[open] summary svg{transform:rotate(180deg)}
details.notes ul{padding:0 16px 14px 34px;list-style:disc;font-size:15px;color:var(--ink2);display:grid;gap:6px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
legend{font-size:16px;font-weight:700;margin-bottom:10px;padding:0}
.q{font-size:17px;font-weight:700;margin-bottom:16px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chips.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 10px;border-radius:12px;border:1.5px solid var(--rule);font-size:15px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.2}
.chip input:hover+span{border-color:var(--t3)}
.chip input:checked+span{border-color:var(--acc);background:var(--t5);color:var(--acc)}
.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:3px}
.two{display:grid;grid-template-columns:200px 1fr;gap:16px}
.field label{display:block;font-size:16px;font-weight:700;margin-bottom:8px}
.field label small{font-weight:500;color:var(--ink3);font-size:14px}
.input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);font-size:16px}
textarea.input{height:auto;min-height:120px;padding:12px 14px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--t4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;border:0;font-size:16px;font-weight:700}
.btn.p{background:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc-h)}
.btn.p:disabled{background:#C9CDD6;cursor:not-allowed}
.btn.s{background:transparent;color:var(--ink2)}

.btn svg{width:18px;height:18px}
.acts{display:flex;gap:8px;margin-left:auto}
.footnote{font-size:14px;color:var(--ink3)}
.recip{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:999px;border:1.5px solid var(--acc);background:var(--t5);width:max-content;font-weight:700;color:var(--acc)}
.okline{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;margin-bottom:14px}
.okline i{width:32px;height:32px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center}
.okline i svg{width:18px;height:18px}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:14px 18px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;box-shadow:0 12px 32px rgba(11,18,32,.25);z-index:50;animation:pop .16s ease-out}

/* mobile top bar */
.topbar{display:none}
.sheet{display:none}

/* ---------- 1024 ---------- */
@media (max-width:1279px){
  .grid{grid-template-columns:minmax(0,1fr)}

}

}

  .topbar .logo{padding:0;font-size:17px}
  .topbar .logo span{display:inline}
  .topbar .here{font-size:15px;color:var(--ink3);font-weight:600}
  .menu{margin-left:auto;width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center}
  .menu svg{width:22px;height:22px}
  .sheet.on{display:block;position:fixed;inset:56px 0 auto 0;z-index:9;background:var(--card);padding:8px 16px 16px;box-shadow:0 16px 32px rgba(11,18,32,.12)}

  main{padding:20px 16px 56px}

  .tip{left:0;transform:none}

  .top h1{font-size:26px}
  .mode{height:32px;font-size:13px;padding:0 12px}
  .money{grid-template-columns:1fr;padding:6px 0}
  .money .div{height:1px}
  .m{padding:18px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
  .m-head{gap:10px}
  .disc-ic{width:36px;height:36px;border-radius:10px}
  .m-num{margin:0;justify-content:flex-end}
  .m-num b{font-size:40px}
  .m-num span{font-size:15px}
  .track{display:none}
  .m-hint{grid-column:1/-1;margin-top:10px;font-size:15px}
  .bar{margin:28px 0 14px}
  .tab{height:40px;padding:0 6px 0 14px;font-size:14px;gap:8px}
  .tab .n{min-width:26px;height:26px}
  .building{margin-left:0;width:100%}
  .rail{grid-template-columns:1fr}
  .rail .card+.card{border-left:0;border-top:1px solid var(--rule)}
  .gallery{grid-template-columns:1fr;gap:16px}
  .body{padding:18px 18px 0}
  .links{gap:8px}
  .links .ext{flex:1;justify-content:center;height:44px;border-radius:12px;border:1.5px solid var(--rule)}
  .foot{padding:14px 0 16px}
  .pop-wrap{padding:12px;align-items:flex-end}
  .box{max-height:calc(100% - 12px)}
  .box-head{padding:20px 12px 0 20px}
  .box-body{padding:16px 20px 20px}
  .box-foot{padding:14px 20px}
  .chips,.chips.c3{grid-template-columns:1fr 1fr}
  .copybox{padding:60px 18px 18px}
  .copybox.subj{padding:12px 64px 12px 18px}
  .two{grid-template-columns:1fr}
  .acts{width:100%}
  .acts .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  const el=$('#tabs');el.innerHTML='';
  for(const [k,t] of TABS){
    const n=count(k),off=n===0&&k!=='all';
    const b=h('button',{type:'button',class:'tab'+(off?' has-tip':''),'aria-pressed':String(S.filter===k),'aria-disabled':off?'true':null,'aria-describedby':off?'tip-'+k:null,
      onclick:()=>{if(off)return;S.filter=k;try{history.replaceState(null,'','#'+k)}catch{}renderTabs();renderGallery()}},
      t,h('span',{class:'n',text:String(n)}),off?h('span',{class:'tip',role:'tooltip',id:'tip-'+k,'aria-hidden':'true',text:TAB_TIP[k]}):null);
    el.append(b);
  }
  $('#building').replaceChildren(svg(I.build,'style="width:18px;height:18px"'),'Being built: ',h('b',{text:String(DATA.counts.building)}));
}

/* ---------- gallery ---------- */
const STATUS_ORDER={ready:0,pitched:1,noanswer:1,reply:2,meeting:2,sale:3};
function statusPill(s){
  switch(s.status){
    case 'ready':return h('span',{class:'pill ready'},h('i'),'Ready to send');
    case 'pitched':return h('span',{class:'pill grey'},`Pitched ${fmtDate(s.pitched_at)}${s.channel?how(s.channel):''}`);
    case 'noanswer':return h('span',{class:'pill grey'},'No answer');
    case 'reply':return h('span',{class:'pill reply'},h('i'),'Replied');
    case 'meeting':return h('span',{class:'pill reply'},h('i'),'Booked a meeting');
    case 'sale':return h('span',{class:'pill sale'},'Bought');
  }
}
function ageText(s){
  if(s.status!=='ready')return null;
  const d=s.days;if(d==null)return null;
  return h('span',{class:'age'+(d>=14?' old':'')},d===0?'since today':`for ${d} day${d===1?'':'s'}`);
}
function renderGallery(){
  const el=$('#gallery');el.innerHTML='';
  const list=S.sites.filter(s=>S.filter==='all'||BUCKET[s.status]===S.filter)
    .sort((a,b)=>STATUS_ORDER[a.status]-STATUS_ORDER[b.status]||(b.days??-1)-(a.days??-1)||a.name.localeCompare(b.name));
  if(!list.length){el.append(h('div',{class:'card empty-wide',text:'No site is ready to pitch yet. Sites appear here when a run finishes its pitch.'}));return}
  const maxDays=Math.max(...S.sites.filter(s=>s.status==='ready').map(s=>s.days||0));
  for(const s of list){
    const hot=s.status==='ready'&&maxDays>0&&s.days===maxDays;
    const card=h('article',{class:'card site'+(hot?' hot':''),'aria-labelledby':'n-'+s.slug});
    card.append(h('a',{class:'thumb',href:s.preview_url,target:'_blank',rel:'noopener','aria-label':`Preview website: ${s.name} (opens in a new tab)`},
      h('img',{src:`../../mockups/soft-cards/dist/img/${s.slug}.jpg`,alt:'',loading:'lazy',width:'672',height:'420'}),
      hot?h('span',{class:'flag'},svg(I.clock,'style="width:15px;height:15px"'),'Waiting longest'):null,
      h('span',{class:'go'},svg(I.ext))));
    const body=h('div',{class:'body'});
    body.append(h('h3',{class:'name',id:'n-'+s.slug,text:s.name}),
      h('p',{class:'meta'},s.type,s.type?' · ':'',h('abbr',{title:`Run ${s.run_id}`,text:s.run+' run'})),
      h('div',{class:'status'},statusPill(s),ageText(s)));
    // one fact line, same height on every card
    if(!s.proposal_live)body.append(h('p',{class:'fact'},svg(I.clock),'Pitch page not online yet'));
    else if(s.quality!=null)body.append(h('p',{class:'fact'},svg(I.star),'Quality ',h('b',{text:`${s.quality}/100`})));
    else body.append(h('p',{class:'fact','aria-hidden':'true'}));
    const links=h('div',{class:'links'},
      h('a',{class:'ext',href:s.preview_url,target:'_blank',rel:'noopener'},'Preview website',svg(I.ext),h('span',{class:'sr',text:'(opens in a new tab)'})));
    if(s.proposal_live)links.append(h('a',{class:'ext',href:s.proposal_url,target:'_blank',rel:'noopener'},'Pitch',svg(I.ext),h('span',{class:'sr',text:'(opens in a new tab)'})));
    else links.append(h('span',{class:'ext off has-tip',role:'link',tabindex:'0','aria-disabled':'true','aria-describedby':'pt-'+s.slug},svg(I.clock),'Pitch',
      h('span',{class:'tip',role:'tooltip',id:'pt-'+s.slug,'aria-hidden':'true',text:`Not online yet: the pitch page for ${s.name} is written but not deployed.`})));
    body.append(links);
    body.append(h('p',{class:'label',id:'ml-'+s.slug,text:'Messages to send yourself'}));
    const msgs=h('div',{class:'msgs',role:'group','aria-labelledby':'ml-'+s.slug});
    for(const d of s.drafts){
      const ic=d.kind==='email'?I.mail:d.kind==='inperson'?I.speak:I.bubble;
      msgs.append(h('button',{type:'button',class:'msg','aria-haspopup':'dialog',onclick:e=>openDraft(s,d,e.currentTarget)},svg(ic),d.label,svg(I.chev,'class="chev"')));
    }
    body.append(msgs);
    body.append(h('button',{type:'button',class:'primary','aria-haspopup':'dialog',onclick:e=>openStatus(s,e.currentTarget)},svg(I.edit),'Update status',h('span',{class:'sr',text:' for '+s.name})));
    body.append(h('div',{class:'foot'},
      h('div',{class:'who'},disc(s.ran_by.operator),h('div',{},h('b',{text:s.ran_by.name}),h('small',{text:'Ran this site'}))),
      h('button',{type:'button',class:'ghost','aria-haspopup':'dialog',onclick:e=>openHandoff(s,e.currentTarget)},svg(I.handoff),'Hand off',h('span',{class:'sr',text:' '+s.name+' to '+opName(other)}))));
    card.append(body);
    el.append(card);
  }
}

/* ---------- rail ---------- */
function renderRail(){
  const el=$('#rail');el.innerHTML='';
  const w=h('section',{class:'card','aria-labelledby':'w-h'},h('h2',{id:'w-h',text:'Waiting on you'}));
  if(!DATA.waiting.length)w.append(h('p',{class:'quiet',text:'Nothing else is waiting on you.'}));
  for(const g of DATA.waiting){
    w.append(h('div',{class:'wait'},g.n!=null?h('span',{class:'big',text:String(g.n)}):null,
      h('div',{},h('p',{text:g.what}),h('a',{href:'#decisions',onclick:e=>{e.preventDefault();toast('In the dashboard this opens Decisions, where you approve or reject each one.')}},cap(g.action),svg(I.chev)))));
  }
  const ho=h('section',{class:'card','aria-labelledby':'h-h'},h('h2',{id:'h-h'},'Handoffs',S.handoffs.length?h('span',{class:'n',text:String(S.handoffs.length)}):null));
  if(!S.handoffs.length)ho.append(h('p',{class:'quiet',text:`Nothing handed off. Use Hand off on a site to ask ${opName(other)} for something.`}));
  else{
    const ul=h('div',{class:'ho-list'});
    for(const a of S.handoffs){
      const s=S.sites.find(x=>x.slug===a.slug);
      ul.append(h('div',{class:'ho'},disc(a.to),h('div',{},h('span',{class:'route',text:`${a.by===me?'You':opName(a.by)} → ${a.to===me?'you':opName(a.to)}`}),h('b',{text:s?s.name:a.slug})),
        h('p',{text:a.task}),
        s?h('button',{type:'button',class:'smallbtn',onclick:e=>copyText(handoffPrompt(s,a.to,a.task,a.id),e.currentTarget)},svg(I.copy),'Copy prompt'):null));
    }
    ho.append(ul);
  }
  el.append(w,ho);
}
const how=c=>c==='in person'?' in person':' by '+c;
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);

/* ---------- popup ---------- */
const pop=$('#pop'),box=$('#box');let opener=null;
pop.addEventListener('click',e=>{if(e.target===pop||e.target.id==='pop-wrap')closePop()});
pop.addEventListener('close',()=>{if(opener&&document.contains(opener))opener.focus();opener=null});
function closePop(){if(pop.open)pop.close()}
function openPop(title,sub,body,foot,from){
  if(from)opener=from;
  box.replaceChildren(
    h('div',{class:'box-head'},h('h2',{id:'pop-title'},title,sub?h('p',{class:'sub',text:sub}):null),h('button',{type:'button',class:'x','aria-label':'Close',onclick:closePop},svg(I.x))),
    h('div',{class:'box-body'},body),
    foot?h('div',{class:'box-foot'},foot):null);
  if(!pop.open)pop.showModal();
  box.querySelector('.box-body').scrollTop=0;
  (box.querySelector('[data-autofocus]')||box.querySelector('.x')).focus();
}
async function copyText(t,btn,label){
  try{await navigator.clipboard.writeText(t)}catch{const ta=h('textarea',{style:'position:fixed;opacity:0'});ta.value=t;(btn.closest('dialog')||document.body).append(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove()}
  const was=[...btn.childNodes];btn.classList.add('done');btn.replaceChildren(svg(I.check),'Copied');live('Copied');
  setTimeout(()=>{btn.classList.remove('done');btn.replaceChildren(...was)},1600);
}
function copyBtn(get,label){return h('button',{type:'button',class:'copy',title:'Copy','aria-label':label||'Copy',onclick:e=>copyText(get(),e.currentTarget)},svg(I.copy))}
function richText(t){
  // links become links; a [PLACEHOLDER] is marked so it is not sent by mistake
  const frag=document.createDocumentFragment();
  for(const part of t.split(/(https?:\/\/[^\s)]+|\[[A-Z][A-Z ]+\])/g)){
    if(/^https?:\/\//.test(part)){const u=part.replace(/[.,]$/,'');frag.append(h('a',{href:u,target:'_blank',rel:'noopener',text:u}),part.slice(u.length))}
    else if(/^\[[A-Z ]+\]$/.test(part))frag.append(h('mark',{title:'Fill this in before sending',text:part}));
    else frag.append(part);
  }
  return frag;
}
function inline(s){ // **bold** only; no markdown symbols reach the page
  const frag=document.createDocumentFragment();
  s.split(/(\*\*[^*]+\*\*)/g).forEach(p=>{if(/^\*\*/.test(p))frag.append(h('b',{},richText(p.slice(2,-2))));else frag.append(richText(p))});
  return frag;
}
const plain=s=>s.replace(/\*\*/g,'');
function scriptView(blocks){
  const box=h('div',{class:'copybox script',tabindex:'0','aria-label':'Script'});
  let list=null,sub=null;
  for(const b of blocks){
    if(b.t==='li2'&&list){if(!sub){sub=h('ul');list.lastChild.append(sub)}sub.append(h('li',{},inline(b.s)));continue}
    sub=null;
    if(b.t==='ol'||b.t==='li'){const tag=b.t==='ol'?'ol':'ul';if(!list||list.tagName.toLowerCase()!==tag){list=h(tag);box.append(list)}list.append(h('li',{},inline(b.s)));continue}
    list=null;
    box.append(b.t==='h'?h('h3',{},inline(b.s)):h('p',{},inline(b.s)));
  }
  return box;
}
function scriptPlain(blocks){
  return blocks.map(b=>b.t==='h'?'\n'+plain(b.s):b.t==='ol'?`${b.n}. ${plain(b.s)}`:b.t==='li'?`• ${plain(b.s)}`:b.t==='li2'?`   – ${plain(b.s)}`:plain(b.s)).join('\n').trim();
}
function openDraft(s,d,from){
  const body=[];
  if(d.to)body.push(h('p',{class:'to'},'To: ',h('b',{text:d.to})));
  if(d.kind==='inperson'){
    body.push(h('div',{style:'position:relative'},scriptView(d.script),copyBtn(()=>scriptPlain(d.script),'Copy script')));
  }else{
    if(d.subject){body.push(h('p',{class:'fl',text:'Subject'}),h('div',{class:'copybox subj'},d.subject,copyBtn(()=>d.subject,'Copy subject')));body.push(h('p',{class:'fl',text:'Message'}))}
    body.push(h('div',{class:'copybox'},richText(d.text),copyBtn(()=>d.text,'Copy message')));
  }
  const notes=[...(d.notes||[])];
  if(d.text&&/\[LINK TO THE PROPOSAL PAGE\]/.test(d.text))notes.unshift(s.proposal_live?`Replace the highlighted placeholder with the pitch page link: ${s.proposal_url}`:'The highlighted placeholder is for the pitch page link. That page is not online yet: put it online first, or take the line out.');
  if(notes.length)body.push(h('details',{class:'notes'},h('summary',{},'Before you send',svg(I.down)),h('ul',{},notes.map(n=>h('li',{text:n})))));
  const foot=h('p',{},'Sent it? ',h('button',{type:'button',class:'linkbtn',onclick:()=>openStatus(s,null)},'Update status'),' to record it.');
  openPop(`${d.label} — ${s.name}`,d.kind==='inperson'?'What to say when you show the site in person.':'You send it yourself. Copy it, then paste it into '+(d.kind==='email'?'your email.':'WhatsApp.'),body,foot,from);
}
function chips(name,opts,legend,checked,cls){
  return h('fieldset',{},h('legend',{text:legend}),h('div',{class:'chips'+(cls?' '+cls:'')},opts.map(([v,t],i)=>h('label',{class:'chip'},h('input',{type:'radio',name,value:v,checked:v===checked,'data-autofocus':!checked&&i===0?true:null}),h('span',{text:t})))));
}
const isoOf=n=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function whenField(){
  const f=chips('when',[['today',`Today, ${fmtDate(isoOf(0))}`],['yesterday',`Yesterday, ${fmtDate(isoOf(-1))}`],['earlier','Earlier']],'When','today','c3');
  f.append(h('input',{class:'input',type:'date',id:'st-date','aria-label':'Date sent',max:isoOf(0),value:isoOf(-2),hidden:true,style:'margin-top:8px;max-width:220px'}));
  return f;
}
function openStatus(s,from){
  const ready=s.status==='ready';
  const today=new Date();const iso=new Date(today.getTime()-today.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const form=h('form',{id:'st-form',onsubmit:e=>{e.preventDefault();save()}});
  if(ready){
    form.append(h('p',{class:'q',text:'Did you send the pitch?'}),
      chips('how',[['WhatsApp','WhatsApp'],['email','Email'],['in person','In person'],['phone','Phone']],'How did you send it?'),
      whenField(),
      h('div',{class:'field'},h('label',{for:'st-note'},'Note ',h('small',{text:'(optional)'})),h('input',{class:'input',id:'st-note',placeholder:'Who you spoke to'})));
  }else{
    form.append(h('p',{class:'q',text:'What did the owner do?'}),
      chips('what',[['reply','Replied'],['meeting','Booked a meeting'],['sale','Bought'],['noanswer','No answer']],'Their answer'),
      h('div',{class:'field'},h('label',{for:'st-note'},'Note ',h('small',{text:'(optional)'})),h('input',{class:'input',id:'st-note',placeholder:'What they said'})));
  }
  const saveBtn=h('button',{type:'submit',form:'st-form',class:'btn p',disabled:true},ready?'Save as pitched':'Save');
  form.addEventListener('change',()=>{saveBtn.disabled=!form.querySelector(`input[name=${ready?'how':'what'}]:checked`);const d=form.querySelector('#st-date');if(d)d.hidden=form.querySelector('input[name=when]:checked')?.value!=='earlier'});
  function save(){
    const pick=form.querySelector(`input[name=${ready?'how':'what'}]:checked`);if(!pick)return;
    const site=S.sites.find(x=>x.slug===s.slug);
    let msg;
    if(ready){const w=form.querySelector('input[name=when]:checked')?.value||'today';const when=w==='today'?iso:w==='yesterday'?isoOf(-1):($('#st-date').value||iso);Object.assign(site,{status:'pitched',pitched_at:when,channel:pick.value});msg=`${s.name}: pitched ${fmtDate(when)}${how(pick.value)}.`}
    else{site.status=pick.value;msg=`${s.name}: ${pick.nextSibling.textContent.toLowerCase()}.`}
    closePop();renderAll();toast(msg+' Kept until you reload.');live(msg);
  }
  const foot=[h('span',{class:'footnote',text:'This preview keeps it until you reload.'}),h('div',{class:'acts'},h('button',{type:'button',class:'btn s',onclick:closePop},'Cancel'),saveBtn)];
  openPop(`Update status — ${s.name}`,'Record what happened. Nothing is sent from here.',form,foot,from);
}
function handoffPrompt(b,to,task,id){
  const from=opName(me);
  return [`Oneshot handoff from ${from} to ${opName(to)} (${new Date().toISOString().slice(0,10)}).`,
    `Business: ${b.name} (${b.slug}) · run ${b.run_id} · state: ${b.state}`,
    [b.preview_url&&`Preview: ${b.preview_url}`,b.proposal_url&&b.proposal_live&&`Pitch: ${b.proposal_url}`].filter(Boolean).join(' · '),
    `Request: ${task||'<write the request>'}`,
    `Start: pull main, read CLAUDE.md, PLAN.md and notes/${b.slug}.md, then run \`node tools/team.mjs status ${b.slug}\`.`+(id?` This is assignment ${id}: close it with \`node tools/team.mjs done ${id} "<what you did>"\` when finished.`:'')
  ].filter(Boolean).join('\n');
}
function openHandoff(s,from){
  const ta=h('textarea',{class:'input',id:'ho-task','data-autofocus':true,placeholder:`What should ${opName(other)} do on this site?`,rows:'4'});
  const go=h('button',{type:'submit',form:'ho-form',class:'btn p',disabled:true},svg(I.handoff),'Hand off');
  ta.addEventListener('input',()=>{go.disabled=!ta.value.trim()});
  const form=h('form',{id:'ho-form',onsubmit:e=>{e.preventDefault();done()}},
    h('div',{class:'field',style:'margin-bottom:20px'},h('span',{class:'fl',style:'display:block',text:'To'}),h('div',{class:'recip'},disc(other),opName(other))),
    h('div',{class:'field'},h('label',{for:'ho-task',text:`What should ${opName(other)} do?`}),ta));
  function done(){
    const task=ta.value.trim();if(!task)return;
    S.handoffs.unshift({slug:s.slug,to:other,by:me,task});
    renderRail();
    const prompt=handoffPrompt(s,other,task);
    const cp=h('button',{type:'button',class:'btn p','data-autofocus':true,onclick:e=>copyText(prompt,e.currentTarget)},svg(I.copy),'Copy prompt');
    openPop(`Hand off — ${s.name}`,null,
      [h('p',{class:'okline'},h('i',{},svg(I.check)),`Saved as ${opName(other)}'s task. Now send him this:`),
       h('div',{class:'copybox',style:'font-size:15px'},prompt,copyBtn(()=>prompt,'Copy prompt'))],
      [h('span',{class:'footnote',text:'Send it to him yourself, for now by message.'}),h('div',{class:'acts'},h('button',{type:'button',class:'btn s',onclick:closePop},'Done'),cp)]);
    live(`Saved as ${opName(other)}'s task`);
  }
  openPop(`Hand off — ${s.name}`,`Ask ${opName(other)} to do something on this site. You get a message to send him.`,form,
    [h('span',{class:'footnote',text:'Nothing is sent from here.'}),h('div',{class:'acts'},h('button',{type:'button',class:'btn s',onclick:closePop},'Cancel'),go)],from);
}

/* ---------- mobile menu ---------- */
$('#menu-btn').addEventListener('click',e=>{const on=$('#sheet').classList.toggle('on');e.currentTarget.setAttribute('aria-expanded',String(on))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on')){$('#sheet').classList.remove('on');$('#menu-btn').setAttribute('aria-expanded','false');$('#menu-btn').focus()}});

function renderAll(){renderSummary();renderTabs();renderGallery();renderRail()}
const hash=location.hash.slice(1);
if(TABS.some(([k])=>k===hash)&&(hash==='all'||count(hash)))S.filter=hash;
renderNav($('#nav'));renderNav($('#nav2'));renderFoot();renderMoney();renderAll();
</script>
