<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneShot Overview</title>
<meta name="description" content="OneShot Overview, direction C (Cockpit): money on top, where every site stands, and one site at a time with all of its actions.">
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:block;src:url("__FONT__") format("woff2")}
:root{
  --ground:#F5F7FB;--card:#FFFFFF;--ink:#0B1220;--ink2:#4B5563;--ink3:#6B7280;--rule:#E5E8EF;--rule2:#EEF0F5;
  /* LOCKED 2026-09-27 (Shahar): purple lead, blue for links only. */
  --acc:#6A2FE0;--t1:#8859E6;--t2:#A682EC;--t3:#C3ACF3;--t4:#E1D5F9;--t5:#F3EEFD;--acc-sec:#EDE6FB;
  --blue:#1F4BFF;--green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;
  --shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.05);
  --shadow-pop:0 32px 80px rgba(11,18,32,.18),0 2px 8px rgba(11,18,32,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--ground);font-size:16px;line-height:1.5}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-weight:700}
.skip:focus{top:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidecol{background:var(--card);border-right:1px solid var(--rule)}
.side{position:sticky;top:0;height:100vh;padding:28px 16px 20px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;padding:0 12px 36px;text-decoration:none;color:var(--ink)}
.mark{width:26px;height:26px;border-radius:8px;background:var(--acc);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:15px;text-decoration:none}
.nav a:hover{background:var(--ground);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t5);color:var(--acc);font-weight:700}
.nav svg{width:22px;height:22px}
.nav .badge{margin-left:auto;min-width:24px;height:24px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:18px 8px 0;border-top:1px solid var(--rule)}
.side-foot b{display:block;font-size:15px;font-weight:700}
.side-foot div span{display:block;font-size:14px;color:var(--ink3)}

.mtop{display:none}
main{min-width:0;padding:0 40px 64px;max-width:1200px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:104px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top p{font-size:16px;color:var(--ink2);margin-top:6px}
.mode{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9CA3AF;flex:none}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- money + team ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 368px;gap:24px}
.money{background:var(--acc);color:#fff;border-radius:24px;padding:28px 32px 32px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:40px;row-gap:20px;isolation:isolate}
.money::before,.money::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);z-index:-1;pointer-events:none}
.money::before{width:380px;height:380px;right:-130px;bottom:-210px}
.money::after{width:240px;height:240px;right:-60px;bottom:-140px}
.money-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.money-head h2{font-size:17px;font-weight:700;letter-spacing:-.005em}
.chip-w{font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;white-space:nowrap}
.mcol+.mcol{border-left:1px solid rgba(255,255,255,.22);padding-left:40px}
.mlabel{font-size:15px;font-weight:600;color:var(--t4);display:flex;align-items:center;gap:10px}
.mlabel i{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center}
.mlabel svg{width:18px;height:18px}
.mbig{font-weight:300;letter-spacing:-.03em;line-height:1;margin:16px 0 14px;display:flex;align-items:baseline;gap:10px}
.rev .mbig{font-size:72px}
.exp .mbig{font-size:40px;margin-top:28px}
.mbig small{font-size:17px;font-weight:500;letter-spacing:0;color:var(--t4)}
.mhint{font-size:15px;line-height:1.55;color:var(--t4);max-width:40ch}
.mhint q{color:#fff;font-weight:600;quotes:"“" "”"}
.money :focus-visible{outline-color:#fff}

.team{padding:24px 24px 20px;display:flex;flex-direction:column}
.team h2{font-size:17px;font-weight:700}
.team .sub{font-size:14px;color:var(--ink3);margin-top:2px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 88px 88px;margin-top:14px;flex:1;align-content:start}
.cmp .who{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:12px;font-size:14px;font-weight:700}
.cmp .who small{font-size:14px;font-weight:500;color:var(--ink3);margin-top:-6px}
.cmp .m{font-size:15px;color:var(--ink2);padding:12px 0;border-top:1px solid var(--rule2);display:flex;align-items:center}
.cmp .v{font-size:20px;font-weight:600;text-align:center;padding:10px 0;border-top:1px solid var(--rule2)}
.cmp .v.zero{color:var(--ink3);font-weight:400}
.cmp .none{grid-row:span 3;white-space:nowrap;border-top:1px solid var(--rule2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:var(--ink3);line-height:1.35;padding:8px 4px}
.team-row{display:none}

.disc{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none;background:var(--t5);color:var(--acc)}
.disc.alon{background:var(--acc-sec)}
.disc.me{background:var(--acc);color:#fff}
.disc.lg{width:40px;height:40px;font-size:16px}

/* ---------- chain ---------- */
.chain{margin-top:24px;padding:20px 28px;display:flex;align-items:center}
.chain ol{display:flex;align-items:center;width:100%}
.chain li{display:flex;align-items:center;flex:1 1 auto}
.chain li:last-child{flex:0 0 auto}
.chain li:not(:last-child)::after{content:"";flex:1 1 auto;min-width:14px;height:2px;background:var(--rule);margin:0 6px}
.chain li.on:not(:last-child)::after{background:var(--t3)}
.node{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 8px;border-radius:999px;border:1.5px solid #D5D9E2;color:var(--ink2);background:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.node b{min-width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;background:var(--ground);color:var(--ink3);padding:0 8px}
.node.on{background:var(--acc);border-color:var(--acc);color:#fff}
.node.on b{background:#fff;color:var(--acc)}
.node .s{display:none}

/* ---------- list + detail ---------- */
.work{display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;margin-top:24px;align-items:start}
.list{padding:20px 12px 16px}
.lh{display:flex;align-items:center;gap:10px;padding:4px 12px 12px}
.lh h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.lh h3{font-size:17px;font-weight:700}
.count{min-width:28px;height:26px;border-radius:999px;background:var(--t5);color:var(--acc);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
.count.zero{background:var(--ground);color:var(--ink2)}
.sec{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule2)}
[role="listbox"]{display:flex;flex-direction:column;gap:4px}
.row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;row-gap:3px;align-items:start;min-height:72px;padding:12px 14px 12px 16px;border-radius:14px;cursor:pointer;outline-offset:-2px}
.row:hover{background:var(--ground)}
.row .chev{display:none;color:var(--ink3)}
.row .chev svg{width:18px;height:18px}
.row[aria-selected="true"]{background:var(--t5)}
.row[aria-selected="true"]::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.row>.disc{grid-row:1/3;align-self:center}
.row .nm{font-size:16px;font-weight:700;line-height:1.35;min-width:0}
.row .sm{grid-column:2/4;font-size:14px;color:var(--ink2);line-height:1.4}
.nw{white-space:nowrap}
.row .sm i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:7px;vertical-align:1px}
.row .sm i.g{background:#9CA3AF}.row .sm i.gr{background:var(--green)}
.row .age{font-size:15px;font-weight:600;color:var(--ink2);white-space:nowrap;line-height:1.4}
.row .age.old{color:var(--red)}
.wrow{display:grid;grid-template-columns:36px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:12px 14px 12px 16px;border-radius:14px;text-decoration:none;color:inherit}
.wrow:hover{background:var(--ground)}
.wrow .ic{width:36px;height:36px;border-radius:10px;background:var(--t5);color:var(--acc);display:inline-flex;align-items:center;justify-content:center}
.wrow .ic svg{width:18px;height:18px}
.wrow b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.wrow span{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.wrow .go{color:var(--blue);width:20px;height:20px}
.empty{font-size:15px;color:var(--ink2);padding:2px 16px 4px;line-height:1.55}
.hrow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 14px 12px 16px;border-radius:14px}
.hrow b{font-size:15px;font-weight:700}
.hrow p{font-size:15px;color:var(--ink2);margin-top:2px}
.hrow .btn-o{margin-top:10px}

.detail{padding:28px;min-width:0}
.thumb{display:block;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--ground);box-shadow:inset 0 0 0 1px var(--rule)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(11,18,32,.06)}
.thumb .badge{position:absolute;right:14px;top:14px;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--blue);font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(11,18,32,.14);z-index:1}
.thumb .badge svg{width:14px;height:14px}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink3)}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.thumb.big{margin-top:20px}
.dh h2{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.dh .meta{font-size:15px;color:var(--ink2);margin-top:4px}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:16px;font-size:15px;color:var(--ink2)}
.facts .f{display:inline-flex;align-items:center;gap:8px}
.facts .f b{color:var(--ink);font-weight:700}
.facts .warn{color:var(--ink2)}
.facts svg{width:16px;height:16px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.pill.ready{background:var(--t5);color:var(--acc)}
.pill.grey{background:#EEF0F4;color:var(--ink2)}
.pill.good{background:var(--green-bg);color:var(--green)}
.pill.sale{background:var(--green);color:#fff}
.acts{margin-top:24px;padding-top:8px;border-top:1px solid var(--rule2);display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center}
.acts .lb{font-size:15px;color:var(--ink3);font-weight:600;padding:16px 0}
.acts .ac{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:12px 0;min-height:64px}
.acts .ac.pills{gap:10px}
.acts .lb+.ac{border:0}
.acts .last{justify-content:space-between}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:15px;font-weight:700;text-decoration:none;min-height:40px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:15px;height:15px}
.off{display:inline-flex;align-items:center;gap:8px;color:var(--ink3);font-size:15px;font-weight:700;cursor:default;line-height:1.2}
.off svg{width:16px;height:16px}
.off small{display:block;font-size:14px;font-weight:500}
.btn-o{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 13px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn-o:hover{border-color:var(--t3);background:var(--t5)}
.btn-o svg{width:18px;height:18px;color:var(--acc)}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.btn-p:hover{background:#5A22CC}
.btn-p svg{width:18px;height:18px}
.btn-g{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--ink2);font-size:15px;font-weight:700}
.btn-g:hover{background:var(--ground);color:var(--ink)}
.btn-g svg{width:20px;height:20px}
.back{display:none}
.sheetbar{display:none}

/* ---------- popup ---------- */
dialog.pop{width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:20px;background:#fff;color:var(--ink);box-shadow:var(--shadow-pop),0 0 0 1px var(--rule);overflow:hidden}
dialog.pop[open]{display:flex;flex-direction:column}
dialog.pop::backdrop{background:rgba(255,255,255,.8);backdrop-filter:blur(2px)}
.phd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 20px 0 28px}
.phd h2{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.01em;padding-top:6px}
.phd p{font-size:15px;color:var(--ink2);margin-top:4px}
.x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.x:hover{background:var(--ground);color:var(--ink)}
.x svg{width:20px;height:20px}
.pb{padding:20px 28px 28px;overflow:auto}
.to{font-size:15px;color:var(--ink2);margin-bottom:12px}
.to b{color:var(--ink);font-weight:700}
.box{background:var(--ground);border-radius:12px;position:relative}
.box-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 18px;font-size:14px;font-weight:700;color:var(--ink2);position:sticky;top:-20px;background:var(--ground);border-radius:12px 12px 0 0;z-index:1}
.msg{padding:6px 18px 18px;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg a{color:var(--blue);font-weight:600}
.script{white-space:normal;font-size:16px}
.script h4{font-size:16px;font-weight:800;margin:20px 0 6px}
.script p{margin:0 0 10px}
.script ol,.script ul{margin:0 0 10px;padding-left:22px}
.script ol{list-style:decimal}.script ul{list-style:disc}
.script li{margin:4px 0}
.script li ul{margin:4px 0 0}
.subj{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 18px;margin-bottom:12px}
.subj span{font-size:14px;font-weight:700;color:var(--ink2);flex:none}
.subj b{font-size:16px;font-weight:700;flex:1;min-width:0}
.cp{height:40px;min-width:40px;border-radius:10px;border:0;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);box-shadow:0 1px 2px rgba(11,18,32,.08);padding:0 10px;font-size:14px;font-weight:700;flex:none}
.cp:hover{color:var(--acc)}
.cp svg{width:18px;height:18px}
.cp.done{color:var(--green)}
details.notes{margin-top:16px;border:1.5px solid var(--rule);border-radius:12px}
details.notes.first{margin:0 0 14px;border-color:#F2C9CE;background:#FFF7F8}
details.notes summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary svg{width:16px;height:16px;transition:transform .15s}
details.notes[open] summary svg{transform:rotate(90deg)}
details.notes ul{padding:0 16px 14px 40px;list-style:disc;font-size:15px;color:var(--ink2);line-height:1.55}
details.notes li+li{margin-top:6px}
.pf{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule2);font-size:15px;color:var(--ink2)}
.linkish{border:0;background:none;padding:0;color:var(--acc);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.q{font-size:16px;font-weight:700;margin:4px 0 12px}
fieldset{border:0;margin:0;padding:0}
legend{padding:0}
.flabel{display:block;font-size:15px;font-weight:700;margin:20px 0 8px}
.flabel small{font-weight:500;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--rule);font-size:15px;font-weight:700;background:#fff}
.chips input:checked+span{background:var(--t5);border-color:var(--acc);color:var(--acc)}
.chips input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.field{width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;font-size:16px;background:#fff}
.field:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
input.field{height:48px;max-width:240px}
textarea.field{min-height:96px;resize:vertical;line-height:1.5}
.err{color:var(--red);font-size:15px;font-weight:600;margin-top:10px}
.pfoot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.ok{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;margin-bottom:14px}
.ok i{width:28px;height:28px;border-radius:50%;background:var(--green-bg);color:var(--green);display:inline-flex;align-items:center;justify-content:center}
.ok svg{width:16px;height:16px}
.prompt{font-size:15px;line-height:1.55}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:14px;padding:14px 20px;font-size:15px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:var(--shadow-pop);transition:opacity .2s,transform .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 1024 band: icon rail ---------- */
@media (max-width:1279px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:24px 12px 16px;align-items:center}
  .sidecol{width:72px}
  .logo{padding:0 0 28px}
  .logo span,.nav a span:not(.badge),.side-foot div{display:none}

<body>

<div class="app">

<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = {
  ext: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12Z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
  handoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 11-4.7M15 17h7m-3-3 3 3-3 3"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>',
  inn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19V9l7-5 7 5v10"/><path d="M9 19v-6h6v6"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M8 8l4-4 4 4"/></svg>',
  tweak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};
const NAV = [
  ['overview', 'Overview', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>'],
  ['pipeline', 'Pipeline', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>'],
  ['sites', 'Sites', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg>'],
  ['agents', 'Agents', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>'],
  ['decisions', 'Decisions', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>'],
];
const DASH = '../../mockups/soft-cards/dist/index.html';
const opName = (op) => D.operators[op] || op;
const initial = (op) => (opName(op) || '?')[0].toUpperCase();
const disc = (op, cls = '') => `<span class="disc ${op === D.viewer ? 'me' : op === 'alon' ? 'alon' : ''} ${cls}" aria-hidden="true">${esc(initial(op))}</span>`;
const other = Object.keys(D.operators).find((o) => o !== D.viewer);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const day = (iso) => { const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const money = (amt) => { const e = Object.entries(amt || {}).filter(([, v]) => v); if (!e.length) return '$0'; return e.map(([c, v]) => new Intl.NumberFormat('en-US', { style: 'currency', currency: c, maximumFractionDigits: v % 1 ? 2 : 0 }).format(v)).join(' + '); };
const live = (t) => { const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); };
let toastT;
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 4000); };
const mqPhone = matchMedia('(max-width:639px)');

// ---------- state (a mockup: changes live in this page only, nothing is posted) ----------
const S = { sel: D.sites[0]?.slug || null, status: {}, handoffs: D.handoffs.slice(), base: { ...D.chain } };
for (const s of D.sites) S.status[s.slug] = s.pitch_sent ? { kind: 'pitched', date: s.pitch_sent.ts, how: s.pitch_sent.channel } : { kind: 'ready' };
const site = (slug) => D.sites.find((s) => s.slug === slug);
const HOW = { whatsapp: 'WhatsApp', email: 'email', inperson: 'in person', phone: 'phone' };
function statusOf(s) {
  const st = S.status[s.slug];
  switch (st.kind) {
    case 'ready': return { label: 'Ready to send', cls: 'ready', dot: '' };
    case 'pitched': return { label: `Pitched ${day(st.date)}${st.how ? ' by ' + (HOW[st.how] || st.how) : ''}`, cls: 'grey', dot: 'g' };
    case 'reply': return { label: 'Replied', cls: 'good', dot: 'gr' };
    case 'meeting': return { label: 'Booked a meeting', cls: 'good', dot: 'gr' };
    case 'sale': return { label: 'Bought', cls: 'sale', dot: 'gr' };
    case 'none': return { label: 'No answer', cls: 'grey', dot: 'g' };
  }
}
function counts() {
  const k = Object.values(S.status);
  const local = (f) => k.filter(f).length;
  return {
    building: S.base.building,
    ready: local((x) => x.kind === 'ready'),
    pitched: S.base.pitched + local((x) => x.kind !== 'ready'),
    replies: S.base.replies + local((x) => x.kind === 'reply' || x.kind === 'meeting'),
    clients: S.base.clients + local((x) => x.kind === 'sale'),
  };
}
const ageText = (s) => s.days === 0 ? 'Today' : s.days === 1 ? '1 day' : `${s.days} days`;
const waitText = (s) => s.days === 0 ? 'since today' : s.days === 1 ? 'for 1 day' : `for ${s.days} days`;

// ---------- sidebar ----------
function renderNav() {
  const dec = D.waiting.reduce((n, w) => n + (w.count || 0), 0);
  const html = NAV.map(([id, label, ic]) => `<a href="${id === 'overview' ? '#main' : DASH + '#' + id}" ${id === 'overview' ? 'aria-current="page"' : ''} title="${label}">${ic}<span>${label}</span>${id === 'decisions' && dec ? `<span class="badge" aria-label="${dec} waiting">${dec}</span>` : ''}</a>`).join('');
  $('#nav').innerHTML = html; $('#nav2').innerHTML = html;
  const t = new Date(D.generated_at);
  $('#side-foot').innerHTML = `${disc(D.viewer, 'lg')}<div><b>Signed in as ${esc(opName(D.viewer))}</b><span>Updated ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</span></div>`;
  $('#menu-b').innerHTML = I.menu; $('#menu-x').innerHTML = I.x; $('#dlg-x').innerHTML = I.x;
}

// ---------- money ----------
function renderMoney() {
  const col = (cls, label, book, icon, hint) => {
    const total = money(book.accumulated);
    const month = new Date().toISOString().slice(0, 7);
    const sub = book.entries ? `${money(book.monthly?.[month])} this month · ${book.entries} recorded` : hint;
    return `<div class="mcol ${cls}"><div class="mlabel"><i>${icon}</i>${label}</div><div class="mbig" aria-label="${label}: ${total}">${total}${book.entries ? '' : '<small>so far</small>'}</div><p class="mhint">${sub}</p></div>`;
  };
  $('#money').innerHTML = `<div class="money-head"><h2 id="money-h">Money</h2><span class="chip-w">All time, every run</span></div>`
    + col('rev', 'Revenues', D.money.revenues, I.inn, 'No payments recorded yet. When a client pays, tell Claude <q>record a payment</q> and it shows here.')
    + col('exp', 'Expenses', D.money.expenses, I.out, 'No expenses recorded yet. When you pay for a domain, hosting or a tool, tell Claude <q>record an expense</q>.');
}

// ---------- team (Shahar | Alon) ----------
function renderTeam() {
  const c = counts();
  const ops = Object.keys(D.operators);
  const per = ops.map((op) => {
    const t = D.team.find((x) => x.op === op);
    return { op, ready: D.sites.filter((s) => s.ran_by === op && S.status[s.slug].kind === 'ready').length, handoffs: S.handoffs.filter((h) => h.to === op).length, runs: t.active_runs, any: t.any_runs };
  });
  const rows = [['Sites ready to pitch', 'ready'], ['Handoffs to them', 'handoffs'], ['Active runs', 'runs']];
  let cmp = `<span></span>` + per.map((p) => `<span class="who">${disc(p.op, 'lg')}${esc(opName(p.op))}${p.op === D.viewer ? '<span class="sr"> (you)</span>' : ''}</span>`).join('');
  const blank = per.map((p) => !p.any && !p.ready && !p.handoffs && !p.runs);
  rows.forEach(([label, k], i) => {
    cmp += `<span class="m">${label}</span>`;
    per.forEach((p, j) => {
      if (blank[j]) { if (i === 0) cmp += `<span class="none" style="grid-column:${j + 2}">No runs yet</span>`; return; }
      cmp += `<span class="v ${p[k] ? '' : 'zero'}" style="grid-column:${j + 2}" aria-label="${esc(opName(p.op))}: ${p[k]}">${p[k]}</span>`;
    });
  });
  const line = (p, b) => b ? '<span class="z">No runs yet</span>' : `<span>${p.ready} ready to pitch · ${p.handoffs} handoff${p.handoffs === 1 ? '' : 's'} · ${p.runs} active run${p.runs === 1 ? '' : 's'}</span>`;
  $('#team').innerHTML = `<h2 id="team-h">${per.map((p) => esc(opName(p.op))).join(' and ')}</h2><p class="sub">Who has what, across every run</p><div class="cmp">${cmp}</div>`
    + `<div class="team-row">${per.map((p, j) => `<div class="p">${disc(p.op, 'lg')}<div><b>${esc(opName(p.op))}${p.op === D.viewer ? ' (you)' : ''}</b>${line(p, blank[j])}</div></div>`).join('')}</div>`;
}

// ---------- chain ----------
function renderChain() {
  const c = counts();
  const N = [['building', 'Being built', 'Built'], ['ready', 'Ready to send', 'Ready'], ['pitched', 'Pitched', 'Pitched'], ['replies', 'Replies', 'Replies'], ['clients', 'Clients', 'Clients']];
  $('#chain').innerHTML = `<ol>${N.map(([k, l, s]) => `<li class="${c[k] ? 'on' : ''}"><span class="node ${c[k] ? 'on' : ''}" aria-label="${l}: ${c[k]}"><b aria-hidden="true">${c[k]}</b><span class="l" aria-hidden="true">${l}</span><span class="s" aria-hidden="true">${s}</span></span></li>`).join('')}</ol>`;
  const n = c.ready;
  $('#summary').textContent = `${n} site${n === 1 ? ' is' : 's are'} ready to pitch${c.pitched ? `, ${c.pitched} pitched` : '. Nothing has been sent yet'}.`;
}

// ---------- list ----------
function renderList() {
  const rows = D.sites.map((s) => {
    const st = statusOf(s); const sel = s.slug === S.sel;
    const q = s.quality != null ? ` · <span class="nw">Quality ${s.quality}</span>` : '';
    return `<div class="row" role="option" id="opt-${s.slug}" data-slug="${s.slug}" aria-selected="${sel}" tabindex="${sel ? 0 : -1}">${disc(s.ran_by)}<div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="sm"><i class="${st.dot}" aria-hidden="true"></i>${esc(st.label)}${q}</div></div>${S.status[s.slug].kind === 'ready' ? `<span class="age ${s.days >= 14 ? 'old' : ''}" title="Ready since ${day(s.since)}">${ageText(s)}</span>` : '<span></span>'}<span class="sr">, ran by ${esc(opName(s.ran_by))}</span></div>`;
  }).join('');
  const w = D.waiting.map((g) => `<a class="wrow" href="${DASH}#${g.view || 'decisions'}"><span class="ic">${I.tweak}</span><span><b>${esc(g.name)}</b><span>${g.kind === 'approve or reject' ? 'Approve or reject them in Decisions' : esc(g.kind)}</span></span><span class="go">${I.arrow}</span></a>`).join('');
  const hs = S.handoffs.map((h) => { const s = site(h.slug); return `<div class="hrow">${disc(h.to)}<div><b>To ${esc(opName(h.to))} · ${esc(s ? s.name : h.slug)}</b><p>${esc(h.task)}</p><button type="button" class="btn-o" data-copyprompt="${esc(h.id)}">${I.copy}Copy prompt</button></div></div>`; }).join('');
  const nH = S.handoffs.length;
  $('#list').innerHTML = `<div class="lh"><h2 id="lb-h">Sites to pitch</h2><span class="count">${D.sites.length}</span></div>`
    + (D.sites.length ? `<div role="listbox" id="lb" aria-labelledby="lb-h" aria-activedescendant="opt-${S.sel}">${rows}</div>` : `<p class="empty">No site is ready to pitch yet.</p>`)
    + `<div class="sec"><div class="lh"><h3>Waiting on you</h3><span class="count ${D.waiting.length ? '' : 'zero'}">${D.waiting.length}</span></div>${w || '<p class="empty">Nothing else is waiting on you.</p>'}</div>`
    + `<div class="sec"><div class="lh"><h3>Handoffs</h3><span class="count ${nH ? '' : 'zero'}">${nH}</span></div>${hs || `<p class="empty">Nothing handed off. Select a site and use Hand off to ask ${esc(opName(other))} for something.</p>`}</div>`;
  // rows: chevron for phone
  document.querySelectorAll('.row').forEach((r) => r.insertAdjacentHTML('beforeend', `<span class="chev">${I.chev}</span>`));
}

// ---------- detail ----------
const DRAFTS = [['email', 'Suggested email', I.mail], ['whatsapp', 'Suggested WhatsApp', I.chat], ['inperson', 'Suggested in-person script', I.person]];
function renderDetail() {
  const s = site(S.sel);
  const box = $('#detail');
  if (!s) { box.innerHTML = '<p class="empty" style="padding:24px">Pick a site on the left.</p>'; return; }
  const st = statusOf(s);
  const notLive = !s.proposal_live;
  const pitch = notLive
    ? `<span class="off" role="link" aria-disabled="true" tabindex="0" aria-describedby="pd-${s.slug}" title="The pitch page for ${esc(s.name)} is written but not online yet.">${I.clock}<span>Pitch<small id="pd-${s.slug}">not online yet</small></span></span>`
    : `<a class="lnk" href="${esc(s.proposal_url)}" target="_blank" rel="noopener">Pitch${I.ext}</a>`;
  const drafts = DRAFTS.filter(([k]) => s.drafts[k]).map(([k, l, ic]) => `<button type="button" class="btn-o" data-draft="${k}">${ic}${l}</button>`).join('');
  const isReady = S.status[s.slug].kind === 'ready';
  box.innerHTML = `<button type="button" class="back" id="back">${I.back}All sites</button><div class="in">
    <div class="dh"><div><h2 id="d-name" tabindex="-1">${esc(s.name)}</h2><p class="meta">${esc(s.type)} · <span title="Run ${esc(s.run_id)}">${esc(s.run)}</span></p></div><span class="pill ${st.cls}">${esc(st.label)}</span></div>
    <div class="facts"><span class="f">${disc(s.ran_by)}Ran by <b>${esc(opName(s.ran_by))}</b></span>${isReady ? `<span class="f">${I.clock}Ready to send <b>${waitText(s)}</b></span>` : ''}${s.quality != null ? `<span class="f">Quality <b>${s.quality}/100</b></span>` : ''}${notLive ? `<span class="f warn">${I.clock}Pitch page not online yet</span>` : ''}</div>
    <div class="acts">
      <span class="lb">Look first</span><div class="ac"><a class="lnk" href="${esc(s.preview_url)}" target="_blank" rel="noopener">Preview website${I.ext}</a>${pitch}</div>
      <span class="lb">${isReady ? 'Send it yourself' : 'The messages'}</span><div class="ac pills">${drafts || '<span class="empty" style="padding:0">No message written for this site.</span>'}</div>
      <span class="lb rec">Then record it</span><div class="ac last"><button type="button" class="btn-p" data-act="status">Update status</button><button type="button" class="btn-g" data-act="handoff">${I.handoff}Hand off</button></div>
    </div>
    <a class="thumb big" href="${esc(s.preview_url)}" target="_blank" rel="noopener" aria-label="Preview website: ${esc(s.name)} (opens in a new tab)"><img src="../../mockups/soft-cards/dist/img/${s.slug}.jpg" alt="" width="672" height="420"><span class="badge" aria-hidden="true">Preview website${I.ext}</span></a></div>
    <div class="sheetbar"><button type="button" class="btn-p" data-act="status">Update status</button></div>`;
  const img = box.querySelector('.thumb img');
  img.addEventListener('error', () => { img.remove(); box.querySelector('.thumb').insertAdjacentHTML('afterbegin', `<span class="ph">${esc(s.name)}</span>`); });
}

function select(slug, focusRow) {
  S.sel = slug; renderList(); renderDetail();
  if (focusRow) $(`#opt-${slug}`)?.focus();
}
function render() { renderTeam(); renderChain(); renderList(); renderDetail(); }

// ---------- phone sheet ----------
let sheetOpener = null;
function openSheet() { if (!mqPhone.matches) return; sheetOpener = document.activeElement; const d = $('#detail'); d.classList.add('open'); d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); document.body.style.overflow = 'hidden'; setTimeout(() => $('#back')?.focus(), 30); }
function closeSheet() { const d = $('#detail'); if (!d.classList.contains('open')) return; d.classList.remove('open'); d.removeAttribute('role'); d.removeAttribute('aria-modal'); document.body.style.overflow = ''; (sheetOpener && document.contains(sheetOpener) ? sheetOpener : $(`#opt-${S.sel}`))?.focus(); }

// ---------- popup ----------
const dlg = $('#dlg'); let opener = null;
function openPop(title, sub, body, from) {
  opener = from || document.activeElement;
  $('#dlg-t').textContent = title;
  const p = $('#dlg-s'); p.hidden = !sub; p.textContent = sub || '';
  const b = $('#dlg-b'); b.innerHTML = ''; b.scrollTop = 0;
  if (typeof body === 'string') b.innerHTML = body; else b.append(body);
  $('#toast').classList.remove('on');
  if (!dlg.open) dlg.showModal();
  const f = b.querySelector('[data-autofocus]') || $('#dlg-x'); f.focus();
}
function closePop() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { const o = opener; opener = null; if (o && document.contains(o)) o.focus(); else $(`#opt-${S.sel}`)?.focus(); });
$('#dlg-x').addEventListener('click', closePop);
dlg.addEventListener('mousedown', (e) => { if (e.target !== dlg) return; const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closePop(); });
dlg.addEventListener('click', (e) => { if (e.target === dlg) { const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closePop(); } });

async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; (btn.closest('dialog') || document.body).append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const was = btn.innerHTML; btn.innerHTML = I.check + 'Copied'; btn.classList.add('done');
  setTimeout(() => { btn.innerHTML = was; btn.classList.remove('done'); }, 1600);
  live('copied');
}
const copyBtn = (key, aria) => `<button type="button" class="cp" data-copy="${key}" aria-label="${aria}" title="Copy">${I.copy}</button>`;

function draftPop(s, k, from) {
  const d = s.drafts[k]; const label = DRAFTS.find((x) => x[0] === k)[1];
  const COPY = {};
  let html = '';
  if (d.to) html += `<p class="to">To: <b>${esc(d.to)}</b></p>`;
  if (d.subject) { COPY.subj = d.subject; html += `<div class="box subj"><span>Subject</span><b>${esc(d.subject)}</b>${copyBtn('subj', 'Copy the subject')}</div>`; }
  COPY.msg = d.text;
  const body = k === 'inperson' ? `<div class="msg script">${d.html}</div>` : `<div class="msg">${esc(d.text).replace(/(https:\/\/[^\s<]+[^\s<.,;:])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')}</div>`;
  html += `<div class="box"><div class="box-h"><span>${k === 'inperson' ? 'What to say' : k === 'email' ? 'Email' : 'Message'}</span>${copyBtn('msg', k === 'inperson' ? 'Copy the script' : 'Copy the message')}</div>${body}</div>`;
  const notes = d.notes?.length ? `<details class="notes${d.notes_open ? ' first' : ''}" ${d.notes_open ? 'open' : ''}><summary>${I.chev}Before you send</summary><ul>${d.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></details>` : '';
  if (d.notes_open) html = notes + html;
  else html += notes;
  html += `<p class="pf">${k === 'inperson' ? 'Been there?' : 'Sent it?'} <button type="button" class="linkish" data-swap="status">Update status</button> to record it.</p>`;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  wrap.addEventListener('click', (e) => {
    const c = e.target.closest('[data-copy]'); if (c) copyText(COPY[c.dataset.copy], c);
    if (e.target.closest('[data-swap]')) statusPop(s, opener);
  });
  openPop(`${label} — ${s.name}`, null, wrap, from);
}

function chips(name, opts, checked) { return `<div class="chips" role="radiogroup">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${v === checked ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`; }
function statusPop(s, from) {
  const st = S.status[s.slug];
  const ready = st.kind === 'ready';
  const f = document.createElement('form'); f.noValidate = true;
  f.innerHTML = ready
    ? `<fieldset><legend class="q">Did you send the pitch? How?</legend>${chips('how', [['whatsapp', 'WhatsApp'], ['email', 'Email'], ['inperson', 'In person'], ['phone', 'Phone']])}</fieldset>
       <label class="flabel" for="f-when">When</label><input class="field" type="date" id="f-when" value="${todayIso()}" max="${todayIso()}">
       <label class="flabel" for="f-note">Note <small>(optional)</small></label><textarea class="field" id="f-note" placeholder="Who you spoke to"></textarea>
       <p class="err" id="f-err" hidden></p>
       <div class="pfoot"><button type="button" class="btn-g" data-cancel>Cancel</button><button type="submit" class="btn-p">Save as pitched</button></div>`
    : `<p class="to">Now: <b>${esc(statusOf(s).label)}</b></p><fieldset><legend class="q">What did the owner do?</legend>${chips('out', [['reply', 'Replied'], ['meeting', 'Booked a meeting'], ['sale', 'Bought'], ['none', 'No answer']], ['reply', 'meeting', 'sale', 'none'].includes(st.kind) ? st.kind : null)}</fieldset>
       <label class="flabel" for="f-note">Note <small>(optional)</small></label><textarea class="field" id="f-note" placeholder="What they said"></textarea>
       <p class="err" id="f-err" hidden></p>
       <div class="pfoot"><button type="button" class="btn-g" data-cancel>Cancel</button><button type="submit" class="btn-p">Save</button></div>`;
  f.querySelector('input[type=radio]').setAttribute('data-autofocus', '');
  f.querySelector('[data-cancel]').onclick = closePop;
  f.addEventListener('submit', (e) => {
    e.preventDefault(); // a mockup: nothing is posted anywhere
    const err = f.querySelector('#f-err');
    if (ready) {
      const how = f.querySelector('input[name=how]:checked')?.value;
      if (!how) { err.hidden = false; err.textContent = 'Choose how you sent it.'; f.querySelector('input[name=how]').focus(); return; }
      const when = f.querySelector('#f-when').value || todayIso();
      S.status[s.slug] = { kind: 'pitched', date: when, how };
    } else {
      const out = f.querySelector('input[name=out]:checked')?.value;
      if (!out) { err.hidden = false; err.textContent = 'Choose what the owner did.'; f.querySelector('input[name=out]').focus(); return; }
      S.status[s.slug] = { ...st, kind: out, prev: st.kind === 'pitched' ? st : st.prev };
    }
    closePop(); render();
    toast(`Recorded: ${s.name} is now “${statusOf(s).label}”. Nothing was sent.`);
    live(`${s.name}: ${statusOf(s).label}`);
  });
  openPop(`Update status — ${s.name}`, 'Record what happened. Nothing is sent from here.', f, from);
}

function handoffPrompt(s, to, task, id) {
  const from = opName(D.viewer);
  return [`Oneshot handoff from ${from} to ${opName(to)} (${todayIso()}).`,
    `Business: ${s.name} (${s.slug}) · run ${s.run_id} · state: ${s.state}`,
    [s.preview_url && `Preview: ${s.preview_url}`, s.proposal_url && s.proposal_live && `Pitch: ${s.proposal_url}`].filter(Boolean).join(' · '),
    `Request: ${task || '<write the request>'}`,
    `Start: pull main, read CLAUDE.md, PLAN.md and notes/${s.slug}.md, then run \`node tools/team.mjs status ${s.slug}\`.` + (id ? ` This is assignment ${id}: close it with \`node tools/team.mjs done ${id} "<what you did>"\` when finished.` : ''),
  ].filter(Boolean).join('\n');
}
function handoffPop(s, from) {
  const ops = Object.keys(D.operators);
  const f = document.createElement('form'); f.noValidate = true;
  const order = [other, ...ops.filter((o) => o !== other)];
  f.innerHTML = `<fieldset><legend class="flabel" style="margin-top:0">To</legend>${chips('to', order.map((o) => [o, `${opName(o)}${o === D.viewer ? ' (you)' : ''}`]), other)}</fieldset>
    <label class="flabel" for="h-task" id="h-q">What should ${esc(opName(other))} do?</label><textarea class="field" id="h-task" placeholder="Write the request in plain words"></textarea>
    <p class="err" id="h-err" hidden></p>
    <div class="pfoot"><button type="button" class="btn-g" data-cancel>Cancel</button><button type="submit" class="btn-p">Hand off</button></div>`;
  f.querySelector('#h-task').setAttribute('data-autofocus', '');
  f.querySelector('[data-cancel]').onclick = closePop;
  f.addEventListener('change', (e) => { if (e.target.name === 'to') f.querySelector('#h-q').textContent = `What should ${e.target.value === D.viewer ? 'you' : opName(e.target.value)} do?`; });
  f.addEventListener('submit', (e) => {
    e.preventDefault(); // a mockup: nothing is posted anywhere
    const to = f.querySelector('input[name=to]:checked').value;
    const task = f.querySelector('#h-task').value.trim();
    const err = f.querySelector('#h-err');
    if (task.length < 3) { err.hidden = false; err.textContent = `Write what ${to === D.viewer ? 'you' : opName(to)} should do first.`; f.querySelector('#h-task').focus(); return; }
    const h = { id: 'h' + Date.now(), slug: s.slug, task, to, by: D.viewer, ts: new Date().toISOString() };
    S.handoffs.push(h); render();
    const prompt = handoffPrompt(s, to, task);
    const done = document.createElement('div');
    const him = to === D.viewer ? 'yourself' : (to === 'alon' ? 'him' : 'them');
    done.innerHTML = `<p class="ok"><i>${I.check}</i>Saved as ${esc(opName(to))}'s task. Now send ${him} this:</p>
      <div class="box"><div class="box-h"><span>Prompt for ${esc(opName(to))}'s Claude</span>${copyBtn('p', 'Copy the prompt')}</div><div class="msg prompt">${esc(prompt)}</div></div>
      <div class="pfoot"><button type="button" class="btn-g" data-cancel>Done</button><button type="button" class="btn-p" data-copyp data-autofocus>${I.copy}Copy prompt</button></div>`;
    done.querySelector('[data-cancel]').onclick = closePop;
    done.addEventListener('click', (ev) => { const c = ev.target.closest('[data-copy],[data-copyp]'); if (c) copyText(prompt, c); });
    const b = $('#dlg-b'); b.innerHTML = ''; b.append(done); done.querySelector('[data-autofocus]').focus();
    live(`Saved as ${opName(to)}'s task`);
  });
  openPop(`Hand off — ${s.name}`, null, f, from);
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (row) { select(row.dataset.slug, true); openSheet(); return; }
  const s = site(S.sel);
  const dr = e.target.closest('[data-draft]'); if (dr) return draftPop(s, dr.dataset.draft, dr);
  const a = e.target.closest('[data-act]');
  if (a) return a.dataset.act === 'status' ? statusPop(s, a) : handoffPop(s, a);
  if (e.target.closest('#back')) return closeSheet();
  const cp = e.target.closest('[data-copyprompt]');
  if (cp) { const h = S.handoffs.find((x) => x.id === cp.dataset.copyprompt); const hs = h && site(h.slug); if (hs) copyText(handoffPrompt(hs, h.to, h.task), cp); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#detail').classList.contains('open') && !dlg.open) { closeSheet(); return; }
  const row = e.target.closest?.('.row'); if (!row) return;
  const i = D.sites.findIndex((s) => s.slug === row.dataset.slug);
  let j = null;
  if (e.key === 'ArrowDown') j = Math.min(i + 1, D.sites.length - 1);
  else if (e.key === 'ArrowUp') j = Math.max(i - 1, 0);
  else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = D.sites.length - 1;
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (mqPhone.matches) openSheet(); else $('#d-name')?.focus(); return; }
  if (j != null) { e.preventDefault(); select(D.sites[j].slug, true); }
});
$('#menu-b').addEventListener('click', () => $('#menu').showModal());
$('#menu-x').addEventListener('click', () => $('#menu').close());
$('#menu').addEventListener('click', (e) => { if (e.target.id === 'menu' || e.target.closest('a')) $('#menu').close(); });
mqPhone.addEventListener('change', () => { if (!mqPhone.matches) closeSheet(); });

renderNav(); renderMoney(); render();
})();
</script>
</body>
</html>
