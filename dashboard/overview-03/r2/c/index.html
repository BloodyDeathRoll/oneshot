:root{
  --ink:#1A1D29;--ink2:#4B5263;--ink3:#6B7280;
  --rule:#E6E8EE;--ctl:#D5D9E2;--hover:#F7F8FA;--soft:#F7F8FA;
  --acc:#6A2FE0;--acc-h:#5B24CC;--tint:#F3EEFD;--t4:#E1D5F9;--t3:#C3ACF3;
  --blue:#1F4BFF;--green:#1A7F37;--green-bg:#EDF7F0;--red:#C0182B;--grey-bg:#EEF0F3;
  --g:32px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:500 14px/20px "Manrope",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
button,input,textarea{font:inherit;color:inherit;font-feature-settings:"tnum" 1}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-48px;z-index:50;background:#fff;border:1px solid var(--ctl);border-radius:8px;padding:8px 12px;font-weight:600}
.skip:focus{top:8px}
svg{display:block}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;padding:24px 16px 20px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 12px 28px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:7px;background:var(--acc);position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:3px;background:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;height:40px;padding:0 12px;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--tint);color:var(--acc)}
.nav svg{width:20px;height:20px;flex:none}
.nav .n{margin-left:auto;color:var(--ink3);font-weight:600}
.nav .badge{margin-left:auto;background:var(--acc);color:#fff;font-weight:700;min-width:24px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-size:14px}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule);color:var(--ink3);display:grid;gap:2px}
.side-foot b{color:var(--ink2);font-weight:600}
.topbar{display:none}

/* ---------- page ---------- */
main{min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:28px var(--g) 24px;border-bottom:1px solid var(--rule)}
h1{margin:0;font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.015em}
.fact{margin:4px 0 0;font-size:16px;line-height:24px;color:var(--ink2)}
.fact b{color:var(--ink);font-weight:600}
.mode{display:inline-flex;align-items:center;gap:8px;color:var(--ink2);white-space:nowrap;margin-top:8px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}

/* band: money | counts */
.band{display:grid;grid-template-columns:minmax(0,2fr) 1px minmax(0,3fr);column-gap:40px;padding:28px var(--g) 28px;border-bottom:1px solid var(--rule)}
.vr{background:var(--rule)}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;row-gap:12px;align-content:start}
.mlabel,.clabel{color:var(--ink2);font-weight:500;display:block}
.mval{display:block;font-size:36px;line-height:44px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.mval small{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-left:6px}
.msub{display:block;color:var(--ink2);margin-top:2px}
.msub b{color:var(--ink);font-weight:600}
.mhint{grid-column:1/-1;margin:0;color:var(--ink3)}
.mhint q{quotes:"\201C" "\201D";color:var(--ink2);font-weight:600}
.counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;align-content:start}
.count{position:relative;padding-right:12px;min-width:0}
.count a,.count span.v{display:block;font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.01em;margin-top:4px;text-decoration:none;width:max-content}
.count a{color:var(--ink)}
.count a:hover{color:var(--acc)}
.count .v.zero{color:var(--ink3)}
.count .clabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;height:10px;margin-top:14px}
.stage .dot{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--t3);z-index:1}
.stage .dot.on{background:var(--acc);box-shadow:none}
.stage .seg{position:absolute;left:10px;right:-0px;top:4px;height:2px;background:var(--rule)}
.stage .seg.on{background:var(--acc)}
.count:last-child .seg{display:none}

/* queue */
.queue{padding:28px var(--g) 48px}
.qhead{display:flex;align-items:center;gap:10px;margin:0 0 16px}
h2{margin:0;font-size:18px;line-height:28px;font-weight:700}
.cbadge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 8px;border-radius:6px;background:var(--tint);color:var(--acc);font-weight:700}
.qnote{margin-left:auto;color:var(--ink3)}
.group+.group{margin-top:20px}
.gh{display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;background:var(--soft);border-radius:6px;font-size:14px;line-height:20px;font-weight:700;color:var(--ink2);margin:0}
.gh span{color:var(--ink3);font-weight:600}
.gh .gsub{margin-left:auto;font-weight:500}
.rows{list-style:none;margin:0;padding:0}
/* below 1520 (and the base): two tiers, actions under the name, right-aligned */
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"t n s" ". a a";column-gap:14px;row-gap:10px;align-items:center;min-height:60px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.row.tw,.row.hd{grid-template-areas:"t n a"}
.row.hd{grid-template-columns:64px minmax(0,1fr) auto auto;grid-template-areas:"t n s a"}
.thumb{grid-area:t;display:block;width:64px;height:40px;border-radius:6px;overflow:hidden;border:1px solid var(--rule);background:var(--soft);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb.icon{display:flex;align-items:center;justify-content:center;color:var(--ink2);border-color:transparent}
.thumb.icon svg{width:20px;height:20px}
.nm{grid-area:n;min-width:0}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.l1 b{font-size:15px;line-height:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{color:var(--ink3);white-space:nowrap}
.l2{display:flex;align-items:center;flex-wrap:wrap;column-gap:8px;margin-top:2px;color:var(--ink3)}
.l2.txt{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk{display:inline-flex;align-items:center;gap:3px;color:var(--blue);font-weight:600;text-decoration:none;border-radius:4px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:12px;height:12px}
.lnk.off{color:var(--ink3);cursor:default;gap:5px;position:relative}
.lnk.off:hover{text-decoration:none}
.lnk.off svg{width:14px;height:14px}
.tip{position:absolute;left:0;bottom:calc(100% + 8px);width:max-content;max-width:260px;background:var(--ink);color:#fff;font-weight:500;padding:8px 10px;border-radius:6px;line-height:18px;opacity:0;visibility:hidden;transition:opacity .12s;z-index:5;pointer-events:none;white-space:normal}
.lnk.off:hover .tip,.lnk.off:focus .tip{opacity:1;visibility:visible}
.st{grid-area:s;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.badge.ready{background:var(--tint);color:var(--acc)}
.badge.pitched{background:var(--grey-bg);color:var(--ink2)}
.badge.reply,.badge.sale{background:var(--green-bg);color:var(--green)}
.badge svg{width:14px;height:14px}
.age{color:var(--ink3);white-space:nowrap}
.age.old{color:var(--red);font-weight:600}
.acts{grid-area:a;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:nowrap}
.drafts{display:flex;gap:8px;margin-right:4px}
.rec{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--ink);font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:0 1px 1px rgba(16,24,40,.04);text-decoration:none}
.btn:hover{background:var(--hover);border-color:#C5CBD6}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;padding:0 16px;box-shadow:none}
.btn-p:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn-g{border-color:transparent;background:transparent;color:var(--ink2);box-shadow:none;padding:0 8px}
.btn-g:hover{background:var(--hover);border-color:transparent;color:var(--ink)}
.btn.done{color:var(--green)}
.empty{padding:14px 16px;color:var(--ink3);border-bottom:1px solid var(--rule)}
.row.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--tint)}to{background:transparent}}

/* placeholder for other views */
.other{padding:28px var(--g)}
.other p{color:var(--ink2);font-size:16px;line-height:24px;max-width:56ch}

/* ---------- popup ---------- */
dialog.pop{padding:0;border:1px solid var(--rule);border-radius:12px;width:min(560px,calc(100vw - 32px));max-height:min(86vh,760px);box-shadow:0 12px 32px rgba(17,24,39,.12);color:var(--ink);background:#fff;overflow:hidden}
dialog.pop[open]{display:flex;flex-direction:column}
dialog.pop::backdrop{background:rgba(255,255,255,.8)}
.ph{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--rule)}
.ph h3{margin:0;font-size:18px;line-height:26px;font-weight:700}
.ph p{margin:2px 0 0;color:var(--ink2)}
.ph .x{margin-left:auto;flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:-3px;margin-right:-6px}
.ph .x:hover{background:var(--hover);color:var(--ink)}
.ph .x svg{width:18px;height:18px}
.pb{padding:20px 24px 24px;overflow:auto;flex:1 1 auto}
.pf{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--rule);flex:none}
.pf .left{margin-right:auto;color:var(--ink2);display:flex;align-items:center;gap:6px}
.linkish{border:0;background:none;padding:0;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;border-radius:4px}
.lead{margin:0 0 16px;color:var(--ink2)}
.to{margin:0 0 12px;color:var(--ink2)}
.to b{color:var(--ink);font-weight:600}
.box{position:relative;background:var(--soft);border-radius:8px;padding:16px 52px 16px 16px;font-size:15px;line-height:24px;white-space:pre-wrap;word-break:break-word}
.box+.box{margin-top:10px}
.box .lab{display:block;font-size:14px;line-height:20px;color:var(--ink3);font-weight:600;white-space:normal;margin-bottom:4px}
.box a{color:var(--blue)}
.box.script{white-space:normal}
.box.script h4{margin:16px 0 4px;font-size:15px;font-weight:700}
.box.script h4:first-child{margin-top:0}
.box.script p{margin:0 0 8px}
.box.script ol,.box.script ul{margin:0 0 8px;padding-left:20px}
.box.script li{margin:2px 0}
.cp{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--ctl);background:#fff;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.cp:hover{color:var(--ink);background:var(--hover)}
.cp svg{width:16px;height:16px}
.cp.done{color:var(--green);width:auto;padding:0 10px;gap:4px;font-weight:600;font-size:14px}
details.notes{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
details.notes.first{margin:0 0 16px;border:1px solid #F1D9A6;background:#FFF8E8;border-radius:8px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;display:flex;align-items:center;gap:6px;border-radius:4px}
details summary::-webkit-details-marker{display:none}
details summary svg{width:16px;height:16px;transition:transform .15s;color:var(--ink2)}
details[open] summary svg{transform:rotate(90deg)}
details ul{margin:8px 0 0;padding-left:22px;color:var(--ink2)}
details li{margin:4px 0}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend,.flabel{display:block;font-weight:600;margin:0 0 8px;padding:0}
.flabel small{color:var(--ink3);font-weight:500;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 8px;border:1px solid var(--ctl);border-radius:8px;font-weight:600;line-height:18px;cursor:pointer}
.chips input:hover+span{background:var(--hover)}
.chips input:checked+span{border:2px solid var(--acc);color:var(--acc);padding:3px 7px;background:#fff}
.chips input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.field{display:block;width:100%;border:1px solid var(--ctl);border-radius:8px;padding:9px 12px;background:#fff;margin:0 0 16px;line-height:20px}
textarea.field{min-height:96px;resize:vertical}
.field:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.err{color:var(--red);font-weight:600;margin:-6px 0 12px}
.ok{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:16px;font-weight:700}
.ok i{width:24px;height:24px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center}
.ok i svg{width:14px;height:14px}
dl.kv{margin:0 0 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
dl.kv dt{color:var(--ink2);font-weight:600}
dl.kv dd{margin:0;font-size:15px;line-height:22px}
.prompt{margin-top:10px;background:var(--soft);border-radius:8px;padding:14px 16px;font-size:14px;line-height:22px;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.tw p{margin:0 0 12px}
.tw h4{margin:0 0 4px;font-size:14px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;font-weight:600;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ---------- 1520 and up: one tier, one shared grid per group so columns line up (measured: the KA row needs 1201 px of content, so a 1505 px window) ---------- */
@media (min-width:1520px){
  .rows{display:grid;grid-template-columns:80px minmax(296px,1.3fr) minmax(128px,1fr) auto;column-gap:12px}
  /* subgrid ignores the row's side padding, so the 16 px inset lives in the first track and on the actions */
  .row{grid-column:1/-1;grid-template-columns:subgrid;grid-template-areas:none;padding:10px 0;row-gap:0}
  .row>.thumb{justify-self:end}
  .row>.acts{padding-right:16px}
  .row>.thumb{grid-column:1;grid-row:1}.row>.nm{grid-column:2;grid-row:1}.row>.st{grid-column:3;grid-row:1}.row>.acts{grid-column:4;grid-row:1}
  .row.tw>.nm{grid-column:2/4}
  .st{align-items:flex-start;text-align:left}
  .st .badge{white-space:normal;height:auto;min-height:24px;padding:2px 8px}
}
/* ---------- 1280 and below: labelled rail (as the live page) ---------- */
@media (max-width:1280px){
  body{grid-template-columns:84px minmax(0,1fr)}
  :root{--g:24px}
  .side{padding:16px 4px}
  .logo{justify-content:center;padding:4px 0 20px}
  .logo span{display:none}
  .nav button{flex-direction:column;gap:4px;height:auto;padding:8px 0;font-size:14px;line-height:17px;letter-spacing:-.01em;text-align:center;position:relative}
  .nav .n{display:none}
  .nav .badge{position:absolute;top:2px;right:6px;margin:0;min-width:22px;height:20px;font-size:14px;padding:0 6px}
  .side-foot{display:none}
  .band{grid-template-columns:minmax(0,1fr);row-gap:24px}
  .vr{display:none}
  .money{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ---------- phone ---------- */
@media (max-width:640px){
  body{display:block}
  :root{--g:16px}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;height:56px;align-items:center;gap:10px;padding:0 8px 0 16px;background:#fff;border-bottom:1px solid var(--rule)}
  .topbar .logo{padding:0}
  .topbar .where{font-weight:700;font-size:16px}
  .topbar .menu{margin-left:auto;width:44px;height:44px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
  .topbar .menu svg{width:22px;height:22px}
  .topbar .menu .badge{position:absolute;top:4px;right:2px;height:20px;min-width:20px;padding:0 5px;background:var(--acc);color:#fff;border-radius:999px;font-size:14px}
  .head{flex-direction:column;gap:8px;padding:20px var(--g)}
  .mode{margin-top:0}
  .band{padding:20px var(--g)}
  .money{column-gap:16px}
  .mval{font-size:28px;line-height:36px}
  .counts{grid-template-columns:minmax(0,1fr)}
  .count{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 0 0 24px;border-bottom:1px solid var(--rule)}
  .count:last-child{border-bottom:0}
  .count a,.count span.v{font-size:18px;line-height:24px;margin:0}
  .stage{position:absolute;left:0;top:0;bottom:0;height:auto;margin:0;width:10px}
  .stage .dot{top:15px}
  .stage .seg{left:4px;top:20px;width:2px;height:40px;right:auto}
  .queue{padding:20px var(--g) 40px}
  .gh{padding:0 12px}
  .row{grid-template-columns:72px minmax(0,1fr);grid-template-areas:"t n" "t s" "a a";column-gap:12px;row-gap:6px;padding:16px 0}
  .row.tw{grid-template-columns:72px minmax(0,1fr) auto;grid-template-areas:"t n a"}
  .row.hd{grid-template-columns:72px minmax(0,1fr);grid-template-areas:"t n" "t s" "a a"}
  .row.tw .acts{margin:0;align-self:start}
  .row.tw .l2.txt{white-space:normal}
  .thumb{width:72px;height:45px;align-self:start}
  .st{flex-direction:row;align-items:center;gap:8px;text-align:left;flex-wrap:wrap}
  .l1{flex-wrap:wrap;row-gap:0}
  .l1 b{white-space:normal}
  .acts{flex-direction:column;align-items:stretch;gap:8px;margin-top:8px}
  .drafts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
  .drafts .btn{white-space:normal;line-height:18px;text-align:center;padding:0 8px}
  .acts .btn{height:44px;width:100%}
  .rec .btn-p{flex:1}
  .rec .btn-g{width:auto;flex:none}
  .row.tw .acts .btn{height:36px;width:auto}
  .box{padding-right:16px}
  .box .cp{position:static;float:right;margin:-6px -6px 8px 12px}
  dialog.pop{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:90vh;border-bottom:0}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pf{flex-wrap:wrap}
  .pf .left{flex-basis:100%;margin:0 0 4px}
  .pf .btn{flex:1}
  .gh .gsub{display:none}
  .qnote{display:none}
}
/* the phone menu sheet */
#menu-sheet .nav button{height:48px;font-size:15px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#queue">Skip to what is waiting on you</a>
<div class="sr" aria-live="polite" id="live"></div>

<aside class="side" aria-label="Views">
  <div class="logo"><i aria-hidden="true"></i><span>OneShot</span></div>
  <nav class="nav" aria-label="Main" id="nav"></nav>
  <div class="side-foot" id="side-foot"></div>
</aside>

<main id="main">
  <div class="topbar">
    <div class="logo"><i aria-hidden="true"></i></div>
    <span class="where">OneShot</span>
    <button type="button" class="menu" id="menu-btn" aria-label="Open the views menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="badge" id="menu-badge" aria-hidden="true"></span></button>
  </div>

  <div id="view-overview">
    <header class="head">
      <div>
        <h1>Overview</h1>
        <p class="fact" id="fact"></p>
      </div>
      <span class="mode" id="mode"><i aria-hidden="true"></i><span></span></span>
    </header>

    <section class="band" aria-label="Money and where every site stands">
      <div class="money">
        <div><span class="mlabel">Revenues</span><span class="mval" id="m-rev"></span><span class="msub" id="m-rev-m"></span></div>
        <div><span class="mlabel">Expenses</span><span class="mval" id="m-exp"></span><span class="msub" id="m-exp-m"></span></div>
        <p class="mhint" id="m-hint"></p>
      </div>
      <div class="vr" aria-hidden="true"></div>
      <div class="counts" id="counts" role="list" aria-label="Sites at each stage, across all runs"></div>
    </section>

    <section class="queue" id="queue" tabindex="-1" aria-labelledby="q-h">
      <div class="qhead"><h2 id="q-h">Waiting on you</h2><span class="cbadge" id="q-n"></span><span class="qnote">Oldest first</span></div>
      <div id="groups"></div>
    </section>
  </div>

  <div id="view-other" class="other" hidden>
    <h1 id="other-h"></h1>
    <p>This mockup shows the Overview only. This view stays as it is on the dashboard.</p>
    <button type="button" class="btn" id="back-ov">Back to Overview</button>
  </div>
</main>

<dialog class="pop" id="dlg" aria-labelledby="dlg-t">
  <div class="ph"><div><h3 id="dlg-t"></h3><p id="dlg-s"></p></div><button type="button" class="x" id="dlg-x" aria-label="Close"></button></div>
  <div class="pb" id="dlg-b"></div>
  <div class="pf" id="dlg-f"></div>
</dialog>

<script>
const D = {"generated_at":"2026-10-05T20:51:09.539Z","viewer":"shahar","operators":{"shahar":"Shahar","alon":"Alon"},"money":{"revenues":{"total":0,"entries":0,"monthly":{}},"expenses":{"total":0,"entries":0,"monthly":{}}},"building":0,"sites":[{"slug":"global-surf-adventures","name":"Global Surf Lodge Kabalana","run_id":"2026-09-globalsurf-02","state":"packaged","ran_by":"shahar","days":0,"preview_url":"https://global-surf-lodge-kabalana.os1.workers.dev","proposal_url":"https://global-surf-lodge-kabalana-proposal.os1.workers.dev","proposal_live":false,"status":{"kind":"ready"},"drafts":{"email":{"kind":"email","to":null,"subject":"A site of its own for Global Surf Lodge Kabalana – preview","text":"Hello,\n\nGuests rate Global Surf Lodge Kabalana 8.6 on Booking.com, from 80 reviews. On globalsurf.com the lodge shares a site with four other destinations, and none of the 30 pages we checked shows a price. The booking buttons on the lodge page and the level pages open the booking engine at its front page, and the package the guest was reading about is lost.\n\nWe built the lodge a site of its own, from your pages, photos, videos and booking engine. You can open it now:\nhttps://global-surf-lodge-kabalana.os1.workers.dev/\n\nWhat's in it:\n- Your videos and photos, and an opening screen that is all about the lodge.\n- The price on every level: from $1,466 per person for 7 nights, as your engine showed it on 28 September 2026.\n- A four-step booking page (level, room, dates and guests, summary) that hands the guest over to your Bookinglayer with the package, start date, number of guests and 7 nights already filled in.\n- WhatsApp on a large button, with a message already written for the guest with what they chose.\n- Your Booking.com rating and nine guest reviews, word for word.\n\nAll the details, before and after, are on the proposal page: [LINK TO THE PROPOSAL PAGE]\n\nIt can run in two ways, your choice. The one we recommend: we host the site and keep it running (hosting, updates and backups are on us), and you pay a monthly fee and update the texts, photos, prices and contact details yourselves. The second option: we install the same site and the same editor on a server of your own for a one-time fee. It is entirely yours; you pay the server company roughly $6–12 a month, and updates and backups are on you. We'll agree the prices together.\n\nThe preview is hidden from search engines, and nothing goes live until you decide.\n\nWant to hear more? Just reply to this email.","notes":["The link to the pitch page is still a placeholder in the text (\"[LINK TO THE PROPOSAL PAGE]\"), because the pitch page is not online yet. Replace it before you send."],"notes_open":true},"whatsapp":{"kind":"whatsapp","to":null,"subject":null,"text":"Hi! Guests rate Global Surf Lodge Kabalana 8.6 on Booking.com (80 reviews). On globalsurf.com the lodge shares a site with four other destinations, shows no price, and the booking button drops the package the guest picked.\nWe built the lodge its own site, as a preview:\nhttps://global-surf-lodge-kabalana.os1.workers.dev/\nYour videos and photos, prices on every level, and booking that hands over to your Bookinglayer with package, date and guests filled in.\nWe can host it for a monthly fee while you edit the content, or install it on your own server. Interested? Just reply here.","notes":[],"notes_open":false},"inperson":null}},{"slug":"ka-surf-hostel-and-restaurant","name":"KA Surf Hostel","run_id":"2026-09-ahangama-02","state":"packaged","ran_by":"shahar","days":10,"preview_url":"https://ka-surf-hostel.os1.workers.dev","proposal_url":"https://ka-surf-hostel-proposal.os1.workers.dev","proposal_live":true,"status":{"kind":"ready"},"drafts":{"email":null,"whatsapp":{"kind":"whatsapp","to":"+94 77 374 6053","subject":null,"text":"Hello KA Surf Hostel family! We made a preview website just for your hostel, from your own Hostelworld words, your photos and your guest ratings. Please open it on your phone:\n hostel.os1.workers.dev/ (it's a preview address, and search engines are told not to list it).\n\nOpening line\n\n\"Your guests give you 9.8 on Hostelworld, but you don't have a website of your own. So we made you one. Can I show you on my phone?\"\n\nPoints (scroll as you talk)\n\n1. It's yours, in your words. The welcome comes from your own Hostelworld text. The photos are yours, from Booking.com and Instagram. Your three ratings are there with where and when we read them, and five guest reviews word for word. (Stop on the family quotes.)\n2. Booking works the way it already does. Tap \"Check dates\": it opens your Hostelworld, Booking.com or Agoda page. \"Call\" rings +94 77 374 6053. Nothing new for you to answer.\n3. It's quick on a slow phone. The first screen is 241 KB and the text shows in about 0.4 seconds, measured on a slowed-down connection.\n4. You change it yourself. You get your own login. Text, photos, rooms, check-in times, amenities, phone and booking links. In our test a change was live in about 20 seconds. Reviews can be removed but not rewritten.\n5. We left out what we couldn't check. No prices, WhatsApp, email, restaurant or parking yet. Ask them:\n    • Does +94 77 374 6053 take WhatsApp?\n    • Is the restaurant still open?\n    • Check-in: 13:00–23:00, or 24 hours?\n    • Is there parking for guests?\n    • AI assistants such as ChatGPT can read and quote the site. Keep that, or block them?\n\nThe offer\n\n\"There are two ways to keep it. The usual one: we host it, keep it online and do the updates and backups, and you just edit. That's a monthly fee. Or we put it on a server you rent yourself and hand it over completely. That's a one-time fee, then roughly 6 to 12 dollars a month to your hosting company, and the updates and backups are yours.\"\n\nIf they own a domain name already: \"We connect it.\" Don't offer to buy one.\n\nThe ask\n\n\"Have a look at it tonight. If you like it, tell me, or reply to our WhatsApp message, and we'll sit down and go through what you want changed.\"\n\nIf they ask \"How much?\"\n\nDon't give a number, because none has been set. Say:\n\n\"It depends on which way you choose, hosted by us or on your own server, and on what you want added, like WhatsApp or the restaurant. We'll agree the price with you, and nothing starts until you're happy with it. First tell me: do you like it?\"\n\nDon't\n\n• Don't criticise the listings or the Instagram. The ratings are great, so say that.\n• Don't promise more bookings, a domain, or a Google ranking.\n• Don't name other hostels.\n• Don't rush them. There is no deadline.","notes":[]}}},{"slug":"layday-surf-ahangama","name":"Layday Surf Ahangama","run_id":"2026-09-ahangama-02","state":"packaged","ran_by":"shahar","days":10,"preview_url":"https://layday-surf.os1.workers.dev","proposal_url":"https://layday-surf-proposal.os1.workers.dev","proposal_live":true,"status":{"kind":"ready"},"drafts":{"email":null,"whatsapp":{"kind":"whatsapp","to":null,"subject":null,"text":"Hello! Your guests rate Layday Surf Ahangama 10/10 on Hostelworld, 10/10 on Booking.com and 5.0 on Google, but Layday has no website of its own. So we built one from your listings, as a preview:\nhttps://layday-surf.os1.workers.dev/\nIt shows guests the way in through the black gate, your photos and their reviews. You can change the text, photos and details yourself, no code needed. We can host it for a monthly fee, or set it up on your own server. Can we show you? Just reply here.","notes":[],"notes_open":false},"inperson":{"kind":"inperson","html":"\u003cp>Open \u003ca href=\"https://layday-surf.os1.workers.dev/\" target=\"_blank\" rel=\"noopener\">https://layday-surf.os1.workers.dev/\u003c/a> on the phone before you walk in. Show it; don't read it out.\u003c/p>\n\u003cp>\u003cstrong>Opening line.\u003c/strong> \"Your guests love this place: 10 on Hostelworld, 10 on Booking.com, 5 stars on Google. But when someone searches for Layday, there is no website of its own. So we built one from your listings. Can I show you on my phone?\"\u003c/p>\n\u003cp>\u003cstrong>Points (scroll as you talk)\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>The first screen.\u003c/strong> \"A two-minute walk from Kabalana\", your headline from Hostelworld, your rating, and one button, \"Check dates\", that opens your Hostelworld, Booking.com and Agoda pages. \"Call\" rings +94 77 855 3343.\u003c/li>\u003cli>\u003cstrong>Finding the door.\u003c/strong> One guest wrote it was \"a little bit difficult to find\". The page walks guests through the black gate to the door, with a map link. Point at it.\u003c/li>\u003cli>\u003cstrong>Your guests' own words.\u003c/strong> Five reviews, copied word for word, and all three ratings with the date we read them. Nothing on the page is made up: 84 facts, every one from your listings or reviews.\u003c/li>\u003cli>\u003cstrong>Fast on a bad connection.\u003c/strong> On a slowed-down phone test it opens with 184 KB and shows in 0.39 seconds. No pop-ups, no trackers.\u003c/li>\u003cli>\u003cstrong>You change it yourself.\u003c/strong> Your own login. Text, photos, the room, times, amenities, phone and booking links. Save, and the page updates by itself; on this site it took about 17 seconds. The design stays fixed, so nothing you type can break it.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>The offer.\u003c/strong> Two ways. Managed, which we recommend: we host it and keep it running (hosting, updates and backups are our job) and you pay a monthly fee. Or self-hosted: we install it on a server of your own, it is fully yours for a one-time fee, you pay roughly $6–12 a month to the server company, and you look after updates and backups.\u003c/p>\n\u003cp>\u003cstrong>The ask.\u003c/strong> \"Would you like to keep it? You can also just tell us what to change: the number of beds, your prices, a WhatsApp number.\"\u003c/p>\n\u003cp>\u003cstrong>If they ask \"How much?\"\u003c/strong> Don't give a number, there isn't one yet. \"We agree that with you. It depends on which of the two ways you choose and what you want on the page. Tell us what matters to you and we'll come back with a figure.\" Then go back to the page.\u003c/p>\n\u003cp>\u003cstrong>Keep in mind\u003c/strong>\u003c/p>\n\u003cul>\u003cli>It is a preview: Google is told not to list it until they decide. Don't say it is on Google.\u003c/li>\u003cli>No website address of their own is promised; the link is the preview link.\u003c/li>\u003cli>Prices, WhatsApp and the surf season are not on the page (they were never published). Showing them needs a change to the design, which we make.\u003c/li>\u003cli>A guest review names \"Rukshan and his family\" as the hosts. It is not confirmed by the business: ask for the owner, don't open with the name.\u003c/li>\u003cli>Nothing about their Booking.com, Hostelworld or Agoda listings changes; the site links to them.\u003c/li>\u003c/ul>","text":"Open https://layday-surf.os1.workers.dev/ on the phone before you walk in. Show it; don't read it out.\n\nOpening line. \"Your guests love this place: 10 on Hostelworld, 10 on Booking.com, 5 stars on Google. But when someone searches for Layday, there is no website of its own. So we built one from your listings. Can I show you on my phone?\"\n\nPoints (scroll as you talk)\n\n1. The first screen. \"A two-minute walk from Kabalana\", your headline from Hostelworld, your rating, and one button, \"Check dates\", that opens your Hostelworld, Booking.com and Agoda pages. \"Call\" rings +94 77 855 3343.\n2. Finding the door. One guest wrote it was \"a little bit difficult to find\". The page walks guests through the black gate to the door, with a map link. Point at it.\n3. Your guests' own words. Five reviews, copied word for word, and all three ratings with the date we read them. Nothing on the page is made up: 84 facts, every one from your listings or reviews.\n4. Fast on a bad connection. On a slowed-down phone test it opens with 184 KB and shows in 0.39 seconds. No pop-ups, no trackers.\n5. You change it yourself. Your own login. Text, photos, the room, times, amenities, phone and booking links. Save, and the page updates by itself; on this site it took about 17 seconds. The design stays fixed, so nothing you type can break it.\n\nThe offer. Two ways. Managed, which we recommend: we host it and keep it running (hosting, updates and backups are our job) and you pay a monthly fee. Or self-hosted: we install it on a server of your own, it is fully yours for a one-time fee, you pay roughly $6–12 a month to the server company, and you look after updates and backups.\n\nThe ask. \"Would you like to keep it? You can also just tell us what to change: the number of beds, your prices, a WhatsApp number.\"\n\nIf they ask \"How much?\" Don't give a number, there isn't one yet. \"We agree that with you. It depends on which of the two ways you choose and what you want on the page. Tell us what matters to you and we'll come back with a figure.\" Then go back to the page.\n\nKeep in mind\n\n• It is a preview: Google is told not to list it until they decide. Don't say it is on Google.\n• No website address of their own is promised; the link is the preview link.\n• Prices, WhatsApp and the surf season are not on the page (they were never published). Showing them needs a change to the design, which we make.\n• A guest review names \"Rukshan and his family\" as the hosts. It is not confirmed by the business: ask for the owner, don't open with the name.\n• Nothing about their Booking.com, Hostelworld or Agoda listings changes; the site links to them.","notes":[]}}},{"slug":"the-lavish-haven","name":"The Lavish Haven","run_id":"2026-09-ahangama-02","state":"packaged","ran_by":"shahar","days":7,"preview_url":"https://the-lavish-haven.os1.workers.dev","proposal_url":"https://the-lavish-haven-proposal.os1.workers.dev","proposal_live":true,"status":{"kind":"ready"},"drafts":{"email":null,"whatsapp":{"kind":"whatsapp","to":"+94 76 483 2988","subject":null,"text":"Hello! We built a website for The Lavish Haven, using only your public listings. Have a look:\nhttps://the-lavish-haven.os1.workers.dev/\n\nIt shows your twelve room types, your photos, your Booking.com and Google ratings and guests' own words, with a \"Check dates\" button on every screen that goes to your Booking.com page. You can change the text, photos, rooms and contact details yourself with a simple login.\n\nIt is a private preview, not on Google. If you like it, we can keep it running for you. Reply here with any questions.","notes":["This is the phone number on the Google listing. No WhatsApp number is published, so check that it has WhatsApp before you send.","Send it as plain text; WhatsApp turns the link into a preview card."],"notes_open":false},"inperson":{"kind":"inperson","html":"\u003cp>For showing the preview on a phone, face to face at the front desk. Open \u003ca href=\"https://the-lavish-haven.os1.workers.dev/\" target=\"_blank\" rel=\"noopener\">https://the-lavish-haven.os1.workers.dev/\u003c/a> before you walk in, and make sure you have mobile data: the forecast and photos load as you scroll.\u003c/p>\n\u003cp>Guests name the owner as Amal in Booking.com reviews (unconfirmed). Ask for the owner or manager; don't assume the name.\u003c/p>\n\u003ch4>Opening line\u003c/h4>\n\u003cp>\"Hello. The Lavish Haven doesn't have a website yet, so we built one from your Booking.com and Google listings. Can I show you on my phone? It takes two minutes.\"\u003c/p>\n\u003ch4>Points (scroll as you go)\u003c/h4>\n\u003col>\u003cli>\u003cstrong>First screen.\u003c/strong> \"Your name, 'a new hotel, two minutes from Kabalana', and both ratings: 9.3 on Booking.com, 5.0 on Google, with the date we read them. The yellow 'Check dates' button stays on screen and goes straight to your Booking.com page.\" (Booking.com showed 9.3 on 25 September; say we will update it.)\u003c/li>\u003cli>\u003cstrong>Rooms and photos.\u003c/strong> Scroll to \"Twelve kinds of room\" and the photo strip. \"All twelve room types from your listing, your photos, and your guests' own words, copied exactly.\"\u003c/li>\u003cli>\u003cstrong>Fast on a phone.\u003c/strong> \"On a slow mobile connection the first screen shows in under half a second in our test.\" No other number needed.\u003c/li>\u003cli>\u003cstrong>What they could add.\u003c/strong> \"We only used what's public. We couldn't find a price list, an email or a WhatsApp number. If you have a WhatsApp number, we can add a 'message us' button for you.\"\u003c/li>\u003cli>\u003cstrong>They edit it.\u003c/strong> \"You get your own login. Rooms, photos, text, hours, prices, contact: you change them yourself, and in our test a change was live about 17 seconds later. The design can't break.\"\u003c/li>\u003c/ol>\n\u003ch4>The offer (say it plainly)\u003c/h4>\n\u003cp>\"Two ways. Managed: we host it and keep it running, updates and backups are ours, for a monthly fee we agree with you. Or self-hosted: we set it up on your own server for a one-time fee we agree with you, it's fully yours, you pay your server company roughly 6 to 12 dollars a month, and you look after updates and backups.\"\u003c/p>\n\u003cp>Recommend managed. Don't mention a static-only version unless they say they never want to edit.\u003c/p>\n\u003ch4>If they ask \"How much?\"\u003c/h4>\n\u003cp>\"That's something we agree with you, not a fixed list price. Managed is a monthly fee; self-hosted is a one-time fee plus your own server bill. First tell us whether you like the site and what you'd change, and then we agree the figure together.\"\u003c/p>\n\u003cp>Do not give a number. No fee amounts exist yet.\u003c/p>\n\u003ch4>The ask\u003c/h4>\n\u003cp>\"Would you like to keep it? You can look at it again on your own: I'll send you the link on WhatsApp. Reply there, or tell us when we come by.\"\u003c/p>\n\u003ch4>Questions to settle while you're there\u003c/h4>\n\u003cul>\u003cli>House number: Google says No166/1 Walhengoda Road, Booking.com says 166/2 Welhengoda Road. Which is right?\u003c/li>\u003cli>Name: \"The Lavish Haven\" (Booking.com) or \"The Lavish Haven Hotel And Resort\" (Google)?\u003c/li>\u003cli>Does +94 76 483 2988 have WhatsApp? Should that be the booking number?\u003c/li>\u003cli>Once the site is public, should AI assistants be allowed to read it? (default: yes)\u003c/li>\u003c/ul>\n\u003ch4>Don't\u003c/h4>\n\u003cul>\u003cli>Don't promise more bookings, a domain, or a place on Google. The preview is hidden from search for now.\u003c/li>\u003cli>Don't criticise the listings or name other hotels.\u003c/li>\u003cli>Don't press. The preview stays private until they decide.\u003c/li>\u003c/ul>","text":"For showing the preview on a phone, face to face at the front desk. Open https://the-lavish-haven.os1.workers.dev/ before you walk in, and make sure you have mobile data: the forecast and photos load as you scroll.\n\nGuests name the owner as Amal in Booking.com reviews (unconfirmed). Ask for the owner or manager; don't assume the name.\n\nOpening line\n\n\"Hello. The Lavish Haven doesn't have a website yet, so we built one from your Booking.com and Google listings. Can I show you on my phone? It takes two minutes.\"\n\nPoints (scroll as you go)\n\n1. First screen. \"Your name, 'a new hotel, two minutes from Kabalana', and both ratings: 9.3 on Booking.com, 5.0 on Google, with the date we read them. The yellow 'Check dates' button stays on screen and goes straight to your Booking.com page.\" (Booking.com showed 9.3 on 25 September; say we will update it.)\n2. Rooms and photos. Scroll to \"Twelve kinds of room\" and the photo strip. \"All twelve room types from your listing, your photos, and your guests' own words, copied exactly.\"\n3. Fast on a phone. \"On a slow mobile connection the first screen shows in under half a second in our test.\" No other number needed.\n4. What they could add. \"We only used what's public. We couldn't find a price list, an email or a WhatsApp number. If you have a WhatsApp number, we can add a 'message us' button for you.\"\n5. They edit it. \"You get your own login. Rooms, photos, text, hours, prices, contact: you change them yourself, and in our test a change was live about 17 seconds later. The design can't break.\"\n\nThe offer (say it plainly)\n\n\"Two ways. Managed: we host it and keep it running, updates and backups are ours, for a monthly fee we agree with you. Or self-hosted: we set it up on your own server for a one-time fee we agree with you, it's fully yours, you pay your server company roughly 6 to 12 dollars a month, and you look after updates and backups.\"\n\nRecommend managed. Don't mention a static-only version unless they say they never want to edit.\n\nIf they ask \"How much?\"\n\n\"That's something we agree with you, not a fixed list price. Managed is a monthly fee; self-hosted is a one-time fee plus your own server bill. First tell us whether you like the site and what you'd change, and then we agree the figure together.\"\n\nDo not give a number. No fee amounts exist yet.\n\nThe ask\n\n\"Would you like to keep it? You can look at it again on your own: I'll send you the link on WhatsApp. Reply there, or tell us when we come by.\"\n\nQuestions to settle while you're there\n\n• House number: Google says No166/1 Walhengoda Road, Booking.com says 166/2 Welhengoda Road. Which is right?\n• Name: \"The Lavish Haven\" (Booking.com) or \"The Lavish Haven Hotel And Resort\" (Google)?\n• Does +94 76 483 2988 have WhatsApp? Should that be the booking number?\n• Once the site is public, should AI assistants be allowed to read it? (default: yes)\n\nDon't\n\n• Don't promise more bookings, a domain, or a place on Google. The preview is hidden from search for now.\n• Don't criticise the listings or name other hotels.\n• Don't press. The preview stays private until they decide.","notes":[]}}}],"tweaks":[{"id":"004-designer-look-loop-flaws","title":"Designer must fix the flaws it spots before handing mockups to you","agent":"Designer","what":"When the designer notices a problem in its own mockup (text hidden behind a button, a broken bar, overlapping parts), it either fixes it or tells you about it as a blocker before you pick. It may no longer note it as \"known, not fixed\" and hand the mockup over anyway.","why":"On Layday and KA the designer wrote down three visible flaws and passed the mockups on regardless. The critic caught them later, and your Layday pick had to carry one of them as a condition.","custom_md":false},{"id":"005-copyeditor-missed-claims","title":"Copyeditor must check every sentence against the facts, one by one","agent":"Copyeditor","what":"The copyeditor checks each sentence of the site copy against the business's facts individually, instead of giving one overall count. Words like \"highest\", \"more than anything else\" or \"when the swell is up\" count as claims that need their own source. Dropping a qualifier (\"for advanced surfers\") counts as an error.","why":"On KA the copyeditor passed three invented or wrong claims. They cost an extra copy round, a failed critique and a rebuild.","custom_md":false},{"id":"002-custom-md-designer-from-gate-feedback","title":"Rewrite your designer taste notes to match your Global Surf feedback","agent":"Designer (your custom.md)","what":"Replaces the text of your own designer notes with your Sep 29 feedback: lead with the business's own video and photos, readable text plus one script font for titles, no decorative lines or borders, soft rounded cards are fine, booking inside the site.","why":"Your current notes still say \"thin black lines\", \"geometric sans only\" and \"minimal, extreme\". That pushed the designer toward the near-empty pages you rejected. Until this is pasted, the agents are told your gate feedback wins wherever the notes disagree.","custom_md":true}],"gates":[],"nav":{"ledger":36,"pipeline":36,"sites":4,"agents":16,"decisions":41},"handoffs":[]};

const dlg = $('#dlg'); let opener = null;

function openPop(title, sub, body, foot, from) {

  const p = $('#dlg-s'); p.hidden = !sub; p.textContent = sub || '';

  f.querySelectorAll('[data-close]').forEach((x) => (x.onclick = closePop));

  (dlg.querySelector('[data-autofocus]') || $('#dlg-x')).focus();

function closePop() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { const o = opener; opener = null; if (o && document.contains(o)) o.focus(); });
$('#dlg-x').addEventListener('click', closePop);

function toastOff() { $('#toast').classList.remove('on'); }

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; (btn.closest('dialog') || document.body).append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const was = btn.innerHTML; btn.innerHTML = I.check + 'Copied'; btn.classList.add('done');
  setTimeout(() => { btn.innerHTML = was; btn.classList.remove('done'); }, 1600);
  live('Copied');
}
const cpBtn = (key, aria) => `<button type="button" class="cp" data-copy="${key}" aria-label="${aria}" title="Copy">${I.copy}</button>`;
const linkify = (t) => esc(t).replace(/(https:\/\/[^\s<]+[^\s<.,;:])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

function draftPop(s, k, from) {
  const d = s.drafts[k]; const label = DRAFTS.find((x) => x[0] === k)[1];
  const COPY = {}; let html = '';

  if (d.notes_open) html += notes;
  if (d.to) html += `<p class="to">To: <b>${esc(d.to)}</b></p>`;
  if (d.subject) { COPY.subj = d.subject; html += `<div class="box">${cpBtn('subj', 'Copy the subject')}<span class="lab">Subject</span>${esc(d.subject)}</div>`; }
  COPY.msg = d.text;
  html += k === 'inperson'
    ? `<div class="box script">${cpBtn('msg', 'Copy the script')}${d.html}</div>`
    : `<div class="box">${cpBtn('msg', 'Copy the message')}${d.subject ? '<span class="lab">Message</span>' : ''}${linkify(d.text)}</div>`;
  if (!d.notes_open) html += notes;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  wrap.addEventListener('click', (e) => { const c = e.target.closest('[data-copy]'); if (c) copyText(COPY[c.dataset.copy], c); });
  const foot = document.createElement('div'); foot.style.display = 'contents';

  return `<div class="chips">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}"${v === checked ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
}
function statusPop(s, from) {
  const st = S.status[s.slug]; const ready = st.kind === 'ready';
  const f = document.createElement('form'); f.id = 'f-status'; f.noValidate = true;
  f.innerHTML = `<p class="lead">Record what happened. Nothing is sent from here.</p>` + (ready
    ? `<fieldset><legend>Did you send the pitch? How?</legend>${chips('how', [['whatsapp', 'WhatsApp'], ['email', 'Email'], ['inperson', 'In person'], ['phone', 'Phone']])}</fieldset>
       <label class="flabel" for="f-when">When</label><input class="field" type="date" id="f-when" value="${todayIso()}" max="${todayIso()}">
       <label class="flabel" for="f-note">Note <small>(optional)</small></label><textarea class="field" id="f-note" placeholder="Who you spoke to"></textarea>`
    : `<p class="to">Now: <b>${esc(statusOf(s).label)}</b></p>
       <fieldset><legend>What did the owner do?</legend>${chips('out', [['reply', 'Reply'], ['meeting', 'Booked a meeting'], ['sale', 'Sale'], ['none', 'No answer']], ['reply', 'meeting', 'sale', 'none'].includes(st.kind) ? st.kind : null)}</fieldset>
       <label class="flabel" for="f-note">Note <small>(optional)</small></label><textarea class="field" id="f-note" placeholder="What they said"></textarea>`)
    + `<p class="err" id="f-err" hidden></p>`;
  f.querySelector('input[type=radio]').setAttribute('data-autofocus', '');
  f.addEventListener('submit', (e) => {
    e.preventDefault(); // a mockup: nothing is posted anywhere
    const err = f.querySelector('#f-err');
    if (ready) {
      const how = f.querySelector('input[name=how]:checked')?.value;
      if (!how) { err.hidden = false; err.textContent = 'Choose how you sent it.'; f.querySelector('input[name=how]').focus(); return; }
      S.status[s.slug] = { kind: 'pitched', date: f.querySelector('#f-when').value || todayIso(), how };
    } else {
      const out = f.querySelector('input[name=out]:checked')?.value;
      if (!out) { err.hidden = false; err.textContent = 'Choose what the owner did.'; f.querySelector('input[name=out]').focus(); return; }
      S.status[s.slug] = { ...st, kind: out };
    }
    S.flash = s.slug;
    closePop(); render();
    const lbl = statusOf(s).label;
    toast(`Saved: ${s.name} is now “${lbl}”. Nothing was sent.`);
    live(`${s.name}: ${lbl}`);
    const row = document.querySelector(`.row[data-slug="${s.slug}"] [data-act=status]`); if (row) row.focus();
  });
  const foot = `<button type="button" class="btn" data-close>Cancel</button><button type="submit" form="f-status" class="btn btn-p">${ready ? 'Save as pitched' : 'Save'}</button>`;
  openPop('Update status', s.name, f, foot, from);
}

function handoffPrompt(s, to, task, id) {
  return [`Oneshot handoff from ${opName(D.viewer)} to ${opName(to)} (${todayIso()}).`,
    `Business: ${s.name} (${s.slug}) · run ${s.run_id} · state: ${s.state}`,
    [s.preview_url && `Preview: ${s.preview_url}`, s.proposal_url && s.proposal_live && `Pitch: ${s.proposal_url}`].filter(Boolean).join(' · '),
    `Request: ${task}`,
    `Start: pull main, read CLAUDE.md, PLAN.md and notes/${s.slug}.md, then run \`node tools/team.mjs status ${s.slug}\`.` + (id ? ` This is assignment ${id}: close it with \`node tools/team.mjs done ${id} "<what you did>"\` when finished.` : ''),
  ].filter(Boolean).join('\n');
}
function handoffPop(s, from) {
  const them = opName(OTHER);
  const f = document.createElement('form'); f.id = 'f-hand'; f.noValidate = true;
  f.innerHTML = `<p class="lead">Ask ${esc(them)} to do something on this site. Nothing is sent from here: you get a prompt to paste to ${esc(them)}.</p>
    <dl class="kv"><dt>To</dt><dd>${esc(them)}</dd></dl>
    <label class="flabel" for="h-task">What should ${esc(them)} do?</label>
    <textarea class="field" id="h-task" rows="4" placeholder="For example: take the in-person script to the owner on Thursday" data-autofocus></textarea>
    <p class="err" id="h-err" hidden></p>`;
  f.addEventListener('submit', (e) => {
    e.preventDefault(); // a mockup: nothing is posted anywhere
    const task = f.querySelector('#h-task').value.trim();
    const err = f.querySelector('#h-err');
    if (task.length < 3) { err.hidden = false; err.textContent = `Write what ${them} should do first.`; f.querySelector('#h-task').focus(); return; }
    const h = { id: 'h' + Date.now(), slug: s.slug, task, to: OTHER, by: D.viewer, ts: new Date().toISOString() };
    S.handoffs.push(h); render();
    const prompt = handoffPrompt(s, OTHER, task);
    const done = document.createElement('div');
    done.innerHTML = `<p class="ok"><i>${I.check}</i>Handed off to ${esc(them)}.</p>
      <dl class="kv"><dt>Request</dt><dd id="h-req"></dd><dt>Site</dt><dd>${esc(s.name)}</dd></dl>
      <p class="lead" style="margin-bottom:12px">Send it to ${esc(them)}: copy the prompt and paste it to him.</p>
      <button type="button" class="btn" data-copyp>${I.copy}Copy prompt</button>
      <details class="notes"><summary>${I.chev}Show the full prompt</summary><div class="prompt"></div></details>`;
    done.querySelector('#h-req').textContent = task;
    done.querySelector('.prompt').textContent = prompt.replace(/`/g, '');
    done.querySelector('[data-copyp]').onclick = (ev) => copyText(prompt, ev.currentTarget);
    openPop('Hand off', s.name, done, `<button type="button" class="btn btn-p" data-close data-autofocus>Done</button>`);
    live(`Handed off to ${them}`);
  });
  const foot = `<button type="button" class="btn" data-close>Cancel</button><button type="submit" form="f-hand" class="btn btn-p">Hand off</button>`;
  openPop('Hand off', s.name, f, foot, from);
}

function tweakPop(w, from) {
  const body = `<div class="tw">${w.what ? `<h4>What would change</h4><p>${esc(w.what)}</p>` : ''}${w.why ? `<h4>Why</h4><p>${esc(w.why)}</p>` : ''}<p class="lead" style="margin:0">You approve or reject it in Decisions, where you can read the whole suggestion.</p></div>`;
  const foot = document.createElement('div'); foot.style.display = 'contents';
  foot.innerHTML = `<button type="button" class="btn" data-close>Close</button><button type="button" class="btn btn-p" data-autofocus data-go>Open Decisions</button>`;
  foot.querySelector('[data-go]').onclick = () => { closePop(); go('decisions'); };
  openPop(w.title, w.custom_md ? 'A change to your own notes for the designer' : `Suggested change for the ${w.agent}`, body, foot, from);
}

// ---------- views (other views are placeholders in this mockup) ----------
function go(v) {
  S.view = v;
  const ov = v === 'overview';
  $('#view-overview').hidden = !ov; $('#view-other').hidden = ov;
  const label = NAV.find((n) => n[0] === v)[1];
  $('#other-h').textContent = label;
  renderNav(); window.scrollTo(0, 0);
  if (!ov) $('#back-ov').focus();
}
$('#back-ov').onclick = () => { go('overview'); $('#nav [data-view=overview]')?.focus(); };
$('#menu-btn').onclick = (e) => {
  const nav = document.createElement('nav'); nav.className = 'nav'; nav.id = 'menu-sheet'; nav.setAttribute('aria-label', 'Main');
  nav.innerHTML = $('#nav').innerHTML;
  nav.querySelector('[aria-current]')?.setAttribute('data-autofocus', '');
  nav.addEventListener('click', (ev) => { const b = ev.target.closest('[data-view]'); if (b) { closePop(); go(b.dataset.view); } });
  openPop('Views', null, nav, `<button type="button" class="btn" data-close>Close</button>`, e.currentTarget);
};

// ---------- events ----------
document.addEventListener('click', (e) => {
  const nv = e.target.closest('.side [data-view], .acts [data-view]'); if (nv) return go(nv.dataset.view);
  const dr = e.target.closest('[data-draft]'); if (dr) return draftPop(site(dr.dataset.slug), dr.dataset.draft, dr);
  const a = e.target.closest('[data-act]');
  if (a) return a.dataset.act === 'status' ? statusPop(site(a.dataset.slug), a) : handoffPop(site(a.dataset.slug), a);
  const tw = e.target.closest('[data-tw]'); if (tw) return tweakPop(D.tweaks.find((w) => w.id === tw.dataset.tw), tw);
  const cp = e.target.closest('[data-copyprompt]');
  if (cp) { const h = S.handoffs.find((x) => x.id === cp.dataset.copyprompt); const hs = h && site(h.slug); if (hs) copyText(handoffPrompt(hs, h.to, h.task, h.id), cp); return; }
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); const g = $(`#g-${j.dataset.jump}`); if (g) { g.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); g.focus({ preventScroll: true }); } }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.lnk.off')) e.preventDefault();
});

render();
</script>
</body>
</html>
