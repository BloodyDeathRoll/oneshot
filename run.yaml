run_id: 2026-10-midigama-01
mode: test                       # test | live
# test: we are not on the ground and cannot contact anyone. A business qualifies only if
#       its PUBLIC material alone is enough to build a complete site. Anything that would
#       need the owner (prices they never published, photos they never posted, copy in
#       their own voice) disqualifies the business — it does not become a question.
# live: we are on site. Owner contact, our own photography and a briefing call are all
#       available, so a thin public presence is a pitch opening rather than a blocker.
area:
  mode: town                     # town | stretch | business
  # town:     one anchor (a town or beach) + shore_buffer_m along its coast
  # stretch:  two anchors + shore_buffer_m along the coastline between them
  # business: one anchor (a named business) + radius_m circle around it
  anchors:
    - "Midigama, Sri Lanka"      # chosen by Alon 2026-10-02
  radius_m: 0                    # business mode
  shore_buffer_m: 100            # town / stretch modes
types: [surf_school, board_rental, surf_shop, surf_camp, beach_lodging, shaper]
presence_threshold: 2            # shortlist businesses scoring <= this (0–5)
max_sites: 3
languages: [en]                  # English only for now; audience languages (de, es, pt, ru…) may come later
budget:
  tokens_per_business: 2_000_000
  wallclock_min_per_business: 90
hosting:
  default_mode: managed          # managed | self_hosted_docker | static_only
  modes: {}                      # slug → mode, when the client chooses something other than the default
agents:                          # pinned versions for reproducibility
  scout: 0.3.0
  harvester: 0.4.0
  auditor: 0.1.2
  designer: 0.4.2
  copywriter: 0.3.3
  humanizer: 0.2.0
  copyeditor: 0.3.1
  creative-director: 0.3.0
  seo: 0.2.0
  aiseo: 0.2.0
  critic: 0.4.1
  visual-critic: 0.1.1
  experience-critic: 0.1.0
  deployer: 0.3.0
  writer: 0.2.1
  orchestrator: 0.3.2
