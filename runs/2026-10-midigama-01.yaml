run_id: 2026-10-midigama-01
operator: alon                   # who runs it (team.json); a session runs only its operator's runs
status: active                   # active | closed
mode: test                       # test | live — public material only, no owner contact
market: lk
vertical: surf
engagement: outbound
# Town-mode scout of Midigama (Alon, 2026-10-02, first drafted as PR #6 against the old run.yaml;
# moved to its own run file 2026-10-26 now that runs are parallel). Weak or no web presence only.
area:
  mode: town                     # town | stretch | business
  anchors:
    - "Midigama, Sri Lanka"      # chosen by Alon 2026-10-02
  radius_m: 0                    # business mode only
  shore_buffer_m: 200            # many Midigama guesthouses sit across the A2 coast road or up the hill
types: [surf_school, board_rental, surf_shop, surf_camp, beach_lodging, shaper]
presence_threshold: 2            # shortlist businesses scoring <= this (0–5), as in ahangama-02
max_sites: 3
languages: [en]
budget:
  tokens_per_business: 2_000_000
  wallclock_min_per_business: 90
hosting:
  default_mode: managed          # managed | self_hosted_docker | static_only
  modes: {}
