run_id: 2026-11-ahangama-01
operator: alon                   # who runs it (team.json); a session runs only its operator's runs
status: active                   # active | closed
mode: test                       # test | live — public material only, no owner contact
market: lk
vertical: surf
engagement: outbound
# Alon, 2026-11-06: "the next site in Ahangama, a hotel with relatively high prices". Business mode:
# one named hotel, not a town search. The Sandhya has a working site, so this is a funnel and design
# rebuild, not a first website; presence_threshold is 5 for that reason, as in 2026-09-globalsurf-02.
# 2026-10-midigama-01 is also active for alon: sessions on either run set ONESHOT_RUN=<run_id>.
area:
  mode: business                 # town | stretch | business
  anchors:
    - "The Sandhya, Kabalana Beach, Ahangama, Sri Lanka (thesandhya.com)"   # chosen by Alon 2026-11-06
  radius_m: 0                    # business mode; 0 = the anchor business only
  shore_buffer_m: 100            # town / stretch modes
types: [surf_school, board_rental, surf_shop, surf_camp, beach_lodging, shaper]
presence_threshold: 5            # shortlist businesses scoring <= this (0–5); 5: a business with a real site, chosen for the funnel audit
max_sites: 1
languages: [en]
budget:
  tokens_per_business: 12_000_000   # 2026-11-09: was 10_000_000 (2026-11-06: was 2_000_000); raised by Alon at 8.79M, before the 4g critique, to cover critique, preview and pitch
  wallclock_min_per_business: 850   # 2026-11-09: was 600 (2026-11-06: was 90); raised by Alon at 512 agent-minutes
hosting:
  default_mode: managed          # managed | self_hosted_docker | static_only
  modes: {}
agents:                          # pinned versions for reproducibility
  orchestrator: 0.5.3
  analyst: 0.1.0
  scout: 0.4.0
