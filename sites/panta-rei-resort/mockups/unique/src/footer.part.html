<footer class="foot">
  <div class="wrap foot-grid">
    <div class="foot-brand"><img src="img/logo.webp" width="96" height="96" alt="{{NAME}} logo"><p>{{TAGLINE}}</p></div>
    <div class="foot-contact">
      <p class="addr">{{I_PIN}}<span>{{ADDRESS}}</span></p>
      <div class="btn-row">
        <a class="btn book" href="{{ENGINE}}">Book direct</a>
        <a class="btn soft" href="{{WA}}">{{I_WA}}WhatsApp</a>
        <a class="btn soft" href="tel:{{TEL}}">{{I_TEL}}{{TEL_SHOW}}</a>
        <a class="btn soft" href="mailto:{{EMAIL}}">{{I_MAIL}}{{EMAIL}}</a>
      </div>
      <div class="social">
        <a href="{{IG}}" aria-label="Instagram" target="_blank" rel="noopener">{{I_IG}}</a>
        <a href="{{FB}}" aria-label="Facebook" target="_blank" rel="noopener">{{I_FB}}</a>
        <a href="{{YT}}" aria-label="YouTube" target="_blank" rel="noopener">{{I_YT}}</a>
      </div>
    </div>
  </div>
  <p class="wrap legal">© {{NAME}} · Kabalana, Ahangama</p>
</footer>
