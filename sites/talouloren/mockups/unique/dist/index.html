:root{
  --bg:#060606; --raise:#0e0e0e; --raise2:#151515; --stage:#2f2f2f;
  --ink:#fff; --ink2:#a6a6a6; --ink3:#6f6f6f;
  --gold:#f3b614; --gold-ink:#0f0f0f;
  --metal:linear-gradient(100deg,#b27c32 0%,#deb050 28%,#fdfab6 50%,#cfaa59 72%,#b27c32 100%);
  --frost:#3d4760;
  --disp:Bellefair,'Times New Roman',serif;
  --body:Plex,'Segoe UI',Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1); --ease-io:cubic-bezier(.76,0,.24,1);
  --gut:clamp(20px,5vw,72px); --maxw:1320px;
  --hh:76px;
}
*{box-sizing:border-box}
html{overflow-x:clip;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;scroll-padding-top:var(--hh)}
body{margin:0;font:400 17px/1.65 var(--body);background:var(--bg);text-align:start;-webkit-tap-highlight-color:transparent;overflow-x:clip}
html[dir=rtl] body{text-align:right}
html[dir=ltr] body{text-align:left}
img,video{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
[tabindex="-1"]:focus{outline:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:0}
.metal{background:var(--metal);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tbd{background:rgba(243,182,20,.12);color:#f6d778;border-radius:4px;padding:0 .3em;font-family:ui-monospace,Menlo,monospace;font-size:.86em;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.skip{position:fixed;top:-60px;inset-inline-start:16px;z-index:100;background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:500}
.skip:focus{top:12px}

/* ---------- buttons ---------- */
.btn{--h:52px;display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:var(--h);padding:0 1.6em;border-radius:999px;border:0;text-decoration:none;font:500 16px/1 var(--body);cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:transform .25s var(--ease),background-color .25s var(--ease),color .25s var(--ease),box-shadow .3s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 0 rgba(243,182,20,0)}
.btn-gold::before{content:"";position:absolute;inset:0;background:var(--metal);background-size:220% 100%;background-position:100% 0;opacity:.85;z-index:-1;transition:background-position .9s var(--ease)}
.btn-gold:hover::before{background-position:0 0}
.btn-gold:hover{box-shadow:0 8px 40px -8px rgba(243,182,20,.55)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.btn-ghost:hover{background:#fff;color:#060606;box-shadow:inset 0 0 0 1px #fff}
.btn-sm{--h:42px;padding:0 1.15em;font-size:15px}
.btn .arr{display:inline-block;transition:transform .3s var(--ease)}
.btn:hover .arr{transform:translateX(-4px)}
html[dir=ltr] .btn .arr{transform:scaleX(-1)}
html[dir=ltr] .btn:hover .arr{transform:scaleX(-1) translateX(-4px)}
.wa{width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:background-color .25s,transform .25s var(--ease);text-decoration:none;color:#fff}
.wa:hover{background:#fff;color:#060606;transform:translateY(-2px)}
.wa svg{width:24px;height:24px}
.btn-wa svg{width:20px;height:20px}

/* ---------- header ---------- */
.hdr{position:fixed;inset-block-start:0;inset-inline:0;z-index:40;height:var(--hh);display:flex;align-items:center;gap:28px;padding-inline:var(--gut);transition:background-color .4s var(--ease),backdrop-filter .4s;background:linear-gradient(to bottom,rgba(6,6,6,.75),rgba(6,6,6,0))}
.hdr.solid{background:rgba(6,6,6,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{display:block;flex:0 0 auto;line-height:0}
.logo img{height:30px;width:auto}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-size:15px;color:#d9d9d9;transition:color .2s,background-color .2s}
.nav a:hover,.nav a[aria-current=page]{color:#fff;background:rgba(255,255,255,.08)}
.hdr-end{display:flex;align-items:center;gap:10px}
.lang{background:none;border:0;cursor:pointer;padding:10px 12px;border-radius:999px;font-size:15px;color:#d9d9d9;min-height:44px}
.lang:hover{background:rgba(255,255,255,.08);color:#fff}
.menu-btn{display:none;background:rgba(255,255,255,.07);border:0;width:46px;height:46px;border-radius:50%;cursor:pointer;place-items:center}
.menu-btn span{display:block;width:18px;height:1.5px;background:#fff;margin:4px auto;transition:transform .3s var(--ease)}
@media (max-width:1180px){.nav{display:none}.menu-btn{display:grid}.hdr-end{margin-inline-start:auto}}
@media (max-width:760px){.hdr .btn-gold{display:none}.logo img{height:24px}:root{--hh:64px}}
.menu{position:fixed;inset:0;z-index:60;background:rgba(6,6,6,.97);display:flex;flex-direction:column;padding:96px var(--gut) 40px;gap:4px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.menu.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
.menu a{font-family:var(--disp);font-size:clamp(34px,8vw,56px);line-height:1.2;text-decoration:none;color:#cfcfcf;transform:translateY(12px);opacity:0;transition:transform .5s var(--ease),opacity .5s var(--ease),color .2s}
.menu.open a{transform:none;opacity:1}
.menu a:hover{color:#fff}
.menu .close{position:absolute;top:14px;inset-inline-end:var(--gut);background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:12px 18px;cursor:pointer}

/* ---------- phone bar + desktop WhatsApp chip ---------- */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:45;display:none;gap:10px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(6,6,6,.96) 55%,rgba(6,6,6,0))}
.bar .btn-gold{flex:1}
@media (max-width:760px){.bar{display:flex}body{padding-bottom:76px}}
.chip{position:fixed;bottom:24px;inset-inline-end:24px;z-index:45;display:flex;align-items:center;gap:10px;padding:0 18px 0 8px;height:52px;border-radius:999px;background:rgba(20,20,20,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);text-decoration:none;font-size:15px;transition:transform .3s var(--ease),background-color .3s}
.chip:hover{transform:translateY(-3px);background:#fff;color:#060606}
.chip i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}

.chip svg{width:20px;height:20px}
@media (max-width:760px){.chip{display:none}}

/* ---------- THE FLIP set-piece ---------- */
.flip{position:relative;height:560vh;background:var(--bg)}
@media (max-width:760px){.flip{height:470vh}}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--bg)}
.flip::after{content:"";position:absolute;inset:auto 0 0 0;height:30vh;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:2}
.stage .layer{position:absolute;inset:0}
.m-profile,.m-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-profile{object-position:72% 40%;opacity:.4;-webkit-mask:radial-gradient(ellipse 60% 55% at var(--px,62%) var(--py,64%),#000 0,rgba(0,0,0,.55) 45%,transparent 75%);mask:radial-gradient(ellipse 60% 55% at var(--px,62%) var(--py,64%),#000 0,rgba(0,0,0,.55) 45%,transparent 75%)}
.m-video{opacity:0;object-position:56% 50%;-webkit-mask:radial-gradient(ellipse var(--vw,80%) var(--vh,90%) at 56% 58%,#000 30%,transparent 78%);mask:radial-gradient(ellipse var(--vw,80%) var(--vh,90%) at 56% 58%,#000 30%,transparent 78%)}
#beam{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}
.beam-css{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;display:none}
.beam-css::before,.beam-css::after,.beam-css i{content:"";position:absolute;inset:0}
.beam-css::before{opacity:var(--glare,1);background:radial-gradient(ellipse 30% 9% at 70% 10%,rgba(255,250,230,.75),transparent 70%),radial-gradient(ellipse 60% 40% at 70% 8%,rgba(253,246,214,.28),transparent 70%),radial-gradient(ellipse 90% 5% at 70% 10%,rgba(255,255,255,.22),transparent 75%)}
.beam-css::after{opacity:var(--turn,0);background:radial-gradient(ellipse 30% 9% at 44% 76%,rgba(253,250,182,.28),transparent 72%),conic-gradient(from 203deg at 86% -8%,transparent 0deg,rgba(222,176,80,.10) 5deg,rgba(253,250,182,.20) 10deg,rgba(255,255,255,.24) 13deg,rgba(253,250,182,.18) 17deg,rgba(61,71,96,.10) 22deg,transparent 25deg)}
html[dir=ltr] .beam-css{transform:scaleX(-1)}
.nogl .beam-css{display:block}.nogl #beam{display:none}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 50%,transparent 45%,rgba(6,6,6,.75) 100%)}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--hh) + 12px) var(--gut) 96px;opacity:0;visibility:hidden;pointer-events:none}
.ph.on{visibility:visible;pointer-events:auto}
.ph-hero{opacity:1;visibility:visible;pointer-events:auto;text-align:center}
.ph-hero .inner{position:relative;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:22px}
.eyebrow{font-family:var(--disp);font-size:clamp(17px,1.6vw,22px);letter-spacing:.06em}
h1.hero-t{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(34px,4.6vw,66px);line-height:1.12;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.7)}
.seg{display:inline-flex;padding:5px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg a{min-width:132px;min-height:48px;display:grid;place-items:center;padding:0 26px;border-radius:999px;text-decoration:none;font-size:17px;transition:background-color .3s var(--ease),color .3s}
.seg a:hover{background:#fff;color:#060606}
.film-btn{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;font-size:15px;color:#e5e5e5;padding:8px 14px;border-radius:999px;min-height:44px}
.film-btn i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);transition:transform .3s var(--ease),background-color .3s}
.film-btn:hover i{transform:scale(1.1);background:#fff;color:#060606}
.film-btn svg{width:12px;height:12px}
@media (max-width:760px){.film-btn{bottom:calc(84px + env(safe-area-inset-bottom))}}
.scroll-cue{position:absolute;bottom:34px;inset-inline-end:var(--gut);font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.scroll-cue b{display:block;width:1px;height:38px;background:linear-gradient(#fff,transparent);animation:cue 2.2s var(--ease) infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media (max-width:760px){.scroll-cue{display:none}}

.ph-pains .inner{max-width:980px;width:100%}
.ph h2,.sec-t{font-family:var(--disp);font-weight:400;font-size:clamp(30px,3.6vw,52px);line-height:1.15;margin:0 0 .6em}
.k{font-size:14px;color:var(--ink2);letter-spacing:.04em;display:block;margin-bottom:14px}
.pains{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pains li{font-family:var(--disp);font-size:clamp(23px,2.7vw,40px);line-height:1.25;color:#fff;opacity:.12;transition:opacity .5s var(--ease),text-shadow .6s var(--ease),filter .6s}
.pains li.lit{opacity:1;text-shadow:0 0 22px rgba(255,255,255,.55)}
.pains li.done{opacity:.55;text-shadow:none}
.pains li .n{font-family:var(--body);font-size:13px;color:var(--ink3);margin-inline-end:16px;vertical-align:middle}

.ph-flip{place-items:center start}
.ph-flip .inner{max-width:560px}
.ph-flip p{color:#dcdcdc;max-width:42ch;margin:0 0 28px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ladder li{overflow:hidden;line-height:1.08;padding-bottom:.06em}
.ladder span{display:inline-block;font-family:var(--disp);font-size:clamp(34px,4.4vw,64px);transform:translateY(105%);will-change:transform}
.ladder li:last-child span{background:var(--metal);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:760px){.ph-flip{place-items:end start;padding-bottom:104px}.ladder span{font-size:31px}.ph-flip h2{font-size:28px}.ph-flip p{font-size:15px;margin-bottom:14px}.ph-flip .inner{width:calc(100% + 2 * var(--gut));max-width:none;background:linear-gradient(to top,rgba(6,6,6,.92) 55%,transparent);margin-inline:calc(-1 * var(--gut));padding:70px var(--gut) 0}.ph-flip .inner::before{display:none}}

.ph-partners .inner{width:100%;max-width:980px;text-align:center}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,4vw,64px);margin-top:10px}
.frame{position:relative;aspect-ratio:4/5;max-height:52vh;margin-inline:auto;width:100%;background:#0b0b0b;overflow:hidden;border-radius:4px}
.frame img{width:100%;height:100%;object-fit:cover}
.frame.coming{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#1c1c1c,#090909 70%)}
.frame.coming::before{content:"";position:absolute;inset:14%;box-shadow:inset 0 0 0 1px rgba(243,182,20,.75)}
.frame.coming .lbl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:#e8d29a;text-align:center;padding:0 16px}
.frame.coming .ini{font-family:var(--disp);font-size:clamp(40px,5vw,72px);color:#fff;line-height:1}
.who{margin-top:14px}
.who b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(22px,2.2vw,30px)}
.who span{color:var(--ink2);font-size:15px}
.ph-partners .frame{max-height:46vh;width:auto;height:46vh;max-width:100%}
@media (max-width:760px){.ph-partners .frame{height:auto;width:100%;max-height:none}.ph-partners h2{font-size:26px}}

.ph-check .inner{text-align:center;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:18px}
.ph-check .meta{color:#d6d6d6}

.counter{position:absolute;top:calc(var(--hh) + 10px);inset-inline-end:var(--gut);font-size:13px;color:var(--ink2);letter-spacing:.08em;font-variant-numeric:tabular-nums;direction:ltr}
.counter b{color:#fff;font-weight:500}

/* static: reduced motion, Save-Data, weak phones. The set-piece becomes stacked sections. */
.static .flip{height:auto}
.static .stage{position:relative;height:auto;overflow:visible}
.static .stage>.layer,.static .counter,.static .scroll-cue{display:none}
.static .ph{position:relative;inset:auto;opacity:1!important;visibility:visible;pointer-events:auto;padding-block:clamp(70px,10vw,140px);transform:none!important}
.static .ph-hero{min-height:100svh;background:linear-gradient(rgba(6,6,6,.35),rgba(6,6,6,.85)),var(--hero-still) 62% 40%/cover no-repeat}
.static .ph-hero::before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:conic-gradient(from 199deg at 86% -8%,transparent 0deg,rgba(253,250,182,.14) 9deg,rgba(255,255,255,.16) 13deg,rgba(253,250,182,.12) 17deg,transparent 24deg)}
html[dir=ltr].static .ph-hero::before{transform:scaleX(-1)}
.static .pains li{opacity:1}
.static .ladder span{transform:none}
.static .ph-flip{display:block}
.static .ph-flip .inner{width:auto;max-width:none;background:none;margin:0;padding:0}
.static-only{display:none}
.static .static-only{display:block}
.static .ph-flip .static-only{width:100%;aspect-ratio:16/9;object-fit:cover;margin-top:32px;border-radius:4px}
.static .ph-partners .frame{height:auto;max-height:none}

/* ---------- sections below the set-piece ---------- */
section{position:relative}
.sec{padding-block:clamp(80px,11vw,160px)}
.lead{font-size:clamp(19px,1.6vw,22px);line-height:1.6;color:#e3e3e3;max-width:56ch}
.muted{color:var(--ink2)}

/* doors: the giant list */
.doors{border-top:0}
.door{position:relative}
.door-btn{position:relative;display:flex;align-items:baseline;gap:24px;width:100%;background:none;border:0;cursor:pointer;padding:0;text-align:inherit;color:#5c5c5c;transition:color .5s var(--ease)}
.door-btn .w{font-family:var(--disp);font-size:clamp(88px,15vw,232px);line-height:.98}
.door-btn .s{font-size:18px;color:var(--ink2);max-width:30ch;opacity:.75;transform:none;transition:opacity .4s,transform .4s var(--ease)}
.door-btn:hover,.door-btn:focus-visible,.door.open .door-btn{color:#fff}
.door-btn:hover .s,.door.open .door-btn .s{opacity:1;transform:none}
.door::before{content:"";position:absolute;top:-30%;inset-inline-start:-6%;width:60%;height:150%;pointer-events:none;opacity:0;transition:opacity .6s var(--ease);background:conic-gradient(from 160deg at 70% 0%,transparent 0deg,rgba(253,250,182,.10) 10deg,rgba(255,255,255,.13) 16deg,rgba(253,250,182,.08) 22deg,transparent 30deg);mix-blend-mode:screen}
.door:hover::before,.door.open::before{opacity:1}
.door-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.door.open .door-panel{grid-template-rows:1fr}
.door-panel>div{overflow:hidden}
.door-panel .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);padding:12px 0 56px}
.door-panel img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px}
.facts{list-style:none;padding:0;margin:18px 0 26px;display:grid;gap:8px;color:#d0d0d0}
.facts li{display:flex;gap:10px;flex-wrap:wrap}
.facts b{font-weight:500;color:#fff;min-width:5.5em}
@media (max-width:760px){.door-panel .in{grid-template-columns:1fr}.door-btn{flex-direction:column;gap:8px}.door-btn .s{opacity:1;transform:none}.door-btn{color:#bdbdbd}}

/* how: contact sheet */
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,22px);margin-top:48px}
.cell{position:relative;aspect-ratio:3/2;background:#101010;border-radius:3px;padding:clamp(18px,2vw,30px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:background-color .5s var(--ease)}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 70% 0%,rgba(253,250,182,.08),transparent 70%);opacity:0;transition:opacity .5s}
.cell:hover{background:#151515}.cell:hover::after{opacity:1}
.cell .fn{position:absolute;top:18px;inset-inline-start:22px;font-size:12px;color:var(--ink3);letter-spacing:.12em;direction:ltr}
.cell h3{font-family:var(--disp);font-weight:400;font-size:clamp(24px,2.4vw,34px);margin:0 0 6px}
.cell p{margin:0;color:#cfcfcf;font-size:16px}
@media (max-width:860px){.sheet{grid-template-columns:1fr}.cell{aspect-ratio:auto;min-height:190px}}

/* proof */
.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-top:30px}
.stat{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:clamp(18px,3vw,48px);padding-block:clamp(6px,1vw,14px)}
.stat .v{font-family:var(--disp);font-size:clamp(72px,13vw,200px);line-height:1;direction:ltr;unicode-bidi:isolate}
.stat .l{font-size:clamp(16px,1.4vw,20px);color:#d3d3d3;max-width:22ch}
@media (max-width:640px){.stat{grid-template-columns:1fr;gap:4px;padding-block:14px}}
.names{margin-top:clamp(60px,8vw,110px);display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.names p{margin:0;font-family:var(--disp);font-size:clamp(24px,2.7vw,40px);line-height:1.45;color:#9a9a9a;text-wrap:pretty}
.names p span{transition:color .3s;white-space:nowrap}
.names p span:hover{color:#fff}
.names .dot{color:#3f3f3f;margin-inline:.35em}
.names .small{font-family:var(--body);font-size:16px;color:var(--ink2)}

/* cases slideshow */
.cases{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;margin-top:44px}
.slides{position:relative;aspect-ratio:16/10;background:#0c0c0c;border-radius:4px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);visibility:hidden}
.slide.on{opacity:1;visibility:visible}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 6s linear}
.slide.on img{transform:scale(1)}
.slide .play{position:absolute;inset:auto auto 22px 22px;inset-inline-start:22px;inset-inline-end:auto;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;transition:transform .3s var(--ease),background-color .3s}
.slide .play:hover{transform:scale(1.08);background:#fff;color:#060606}
.slide .play svg{width:18px;height:18px}
.case-t .cl{font-family:var(--disp);font-size:clamp(40px,5vw,76px);line-height:1;margin:0 0 16px}
.case-t .o{font-size:clamp(18px,1.5vw,21px);color:#e3e3e3;margin:0 0 14px}
.case-t .ph-line{margin:0 0 26px;color:var(--ink2);font-size:15px}
.case-t{display:grid}.case-t .item{grid-area:1/1;visibility:hidden;opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s .5s}.case-t .item.on{visibility:visible;opacity:1;transform:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}.case-t .dots{grid-row:2}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;margin-top:30px}
.dots button{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.dots button i{display:block;width:8px;height:8px;border-radius:50%;background:#555;transition:width .35s var(--ease),background-color .35s}
.dots button[aria-current=true] i{width:28px;border-radius:4px;background:#fff}
@media (max-width:860px){.cases{grid-template-columns:1fr}.slides{aspect-ratio:4/5}}

/* partners bios */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,90px);margin-top:48px}
.pair .frame{max-height:none}
.bio h3{font-family:var(--disp);font-weight:400;font-size:clamp(30px,3vw,44px);margin:26px 0 2px}
.bio .role{color:var(--ink2);margin:0 0 16px}
.bio p{color:#d6d6d6;margin:0 0 14px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.strip img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;filter:saturate(.85);transition:filter .4s,transform .4s var(--ease)}
.strip img:hover{filter:none;transform:translateY(-3px)}
.strip-n{font-size:14px;color:var(--ink2);margin-top:12px}
.link-out{display:inline-flex;align-items:center;gap:8px;margin-top:10px}
@media (max-width:760px){.pair{grid-template-columns:1fr}}

/* partnership band */
.band{position:relative;min-height:78svh;display:grid;align-items:end;overflow:hidden}
.band .bg{position:absolute;inset:-4rem 0;background-size:cover;background-position:50% 50%;will-change:transform}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,6,.92) 8%,rgba(6,6,6,.35) 55%,rgba(6,6,6,.5))}
.band .wrap{position:relative;z-index:1;padding-bottom:clamp(60px,9vw,120px);width:100%}
.band h2{font-family:var(--disp);font-weight:400;font-size:clamp(60px,9vw,140px);line-height:1;margin:0 0 18px}
.band .breath{font-family:var(--disp);font-size:clamp(26px,2.6vw,38px);margin:18px 0 30px}

/* FAQ */
.faq{max-width:900px}
.qa{border-radius:6px;transition:background-color .3s}
.qa+.qa{margin-top:6px}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;background:none;border:0;cursor:pointer;padding:22px 20px;text-align:inherit;font-family:var(--disp);font-size:clamp(21px,2vw,27px);line-height:1.3;color:#cfcfcf;border-radius:6px;transition:color .3s,background-color .3s}
.qa button:hover{background:rgba(255,255,255,.04);color:#fff}
.qa.open{background:rgba(255,255,255,.04)}
.qa.open button{color:#fff}
.qa .pl{flex:0 0 auto;width:28px;height:28px;position:relative;transition:transform .35s var(--ease)}
.qa .pl::before,.qa .pl::after{content:"";position:absolute;top:50%;left:50%;width:16px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}
.qa .pl::after{transform:translate(-50%,-50%) rotate(90deg)}
.qa.open .pl{transform:rotate(45deg)}
.qa .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.qa.open .a{grid-template-rows:1fr}
.qa .a>div{overflow:hidden}
.qa .a p{margin:0;padding:0 20px 24px;color:#d4d4d4;max-width:62ch}

/* final call: marquee */
.final{padding-block:clamp(80px,10vw,140px) clamp(90px,10vw,150px);overflow:hidden;text-align:center}
.mq{display:flex;width:max-content;animation:mq 38s linear infinite}
html[dir=rtl] .mq{animation-name:mqr}
.mq span{font-family:var(--disp);font-size:clamp(70px,11vw,170px);line-height:1.1;padding-inline:.4em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.55);white-space:nowrap}
.mq span:nth-child(odd){-webkit-text-stroke:0;color:#fff}
.final:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}
.final .acts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:44px}

/* footer */
.ftr{background:#0b0b0b;padding:clamp(60px,8vw,100px) 0 40px}
.ftr .g{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:48px}
.ftr .sig{height:44px;width:auto}
.ftr h4{font-weight:500;font-size:15px;margin:0 0 14px;color:#fff}
.ftr .links{display:grid;gap:4px}
.ftr .links a{text-decoration:none;color:#bdbdbd;padding:6px 0;transition:color .2s}
.ftr .links a:hover{color:#fff}
.soc{display:flex;gap:10px;margin-top:22px}
.soc a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:background-color .25s,color .25s,transform .25s var(--ease)}
.soc a:hover{background:#fff;color:#060606;transform:translateY(-2px)}
.soc svg{width:19px;height:19px}
.nl{margin-top:22px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.nl .fld{flex:1 1 220px}
.legal{display:flex;flex-wrap:wrap;gap:18px 26px;margin-top:56px;font-size:14px;color:#8a8a8a}
.legal a{text-decoration:none;color:#9a9a9a}.legal a:hover{color:#fff}
@media (max-width:860px){.ftr .g{grid-template-columns:1fr}}

/* fields: floating labels */
.fld{position:relative;display:block}

// ---------- the set-piece: beam shader + scroll timeline ----------
const FRAG = `precision highp float;
uniform vec2 uRes;uniform float uTime,uGlare,uTurn,uWidth,uSide,uPow;uniform vec2 uPool;uniform vec4 uText;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;float a=uRes.x/uRes.y;vec2 p=vec2(uv.x*a,uv.y);
 float sx=uSide>0.?.9:.1;vec2 src=vec2(sx*a,1.1);vec2 tgt=vec2(uPool.x*a,uPool.y);
 vec2 gc=vec2(mix(.5,sx,.55)*a,a<1.?.97:.9);vec2 dg=(p-gc)/vec2(1.25,1.);float d2=dot(dg,dg);
 float glare=exp(-d2*2.2)*.42+exp(-d2*9.)*.38+exp(-d2*60.)*.35+exp(-abs(p.y-gc.y)*26.)*exp(-abs(p.x-gc.x)*1.1)*.28;
 glare*=uGlare*(.92+.08*sin(uTime*.7));
 vec2 ax=normalize(tgt-src);vec2 v=p-src;float Lv=length(v);float ang=acos(clamp(dot(v/Lv,ax),-1.,1.));
 float cone=smoothstep(uWidth,uWidth*.3,ang);float along=dot(v,ax)/length(tgt-src);
 cone*=smoothstep(0.,.2,along)*(1.-smoothstep(1.,1.5,along))*(1.-.35*along);
 float fringe=max(smoothstep(uWidth*1.35,uWidth*.95,ang)-smoothstep(uWidth*.95,uWidth*.55,ang),0.);
 vec2 q=(p-tgt)/vec2(.34*uPow,.08*uPow);float pool=exp(-dot(q,q));
 mat2 R=mat2(.8,-.6,.6,.8);float sp=n(R*p*84.+vec2(uTime*.35,-uTime*.7));float sp2=n(R*R*p*47.-vec2(uTime*.2,uTime*.45));
 float dust=smoothstep(.78,.97,sp)*.9+smoothstep(.8,.98,sp2)*.6+n(p*5.+vec2(0.,-uTime*.06))*.35;
 float beam=(cone*(.22+.55*dust)+pool*.42)*uTurn;
 vec2 tc=clamp(uv,uText.xy,uText.zw);float td=length((uv-tc)*vec2(a,1.));float tf=mix(.55,1.,smoothstep(0.,.32,td));
 vec3 gold=mix(vec3(.87,.69,.31),vec3(.99,.97,.69),clamp(cone*1.3+pool*.6,0.,1.));
 vec3 col=(gold*beam+vec3(1.,.96,.86)*glare)*tf+vec3(.24,.28,.38)*fringe*.12*uTurn;
 col+=(h(uv*uRes+fract(uTime))-.5)*.018;
 gl_FragColor=vec4(max(col,0.),1.);}`;
let flipState = null;
function initFlip() {

  const prof = document.getElementById('mProfile'), vid = document.getElementById('mVideo'), ctr = document.getElementById('ctr');
  if (STATIC) { root.classList.add('nogl'); return; }
  let gl = null, U_ = {};
  try { gl = cv.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'low-power' }); } catch (e) {}
  if (gl) {
    const sh = (ty, s) => { const o = gl.createShader(ty); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
    try {

      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(pr); gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ['uRes', 'uTime', 'uGlare', 'uTurn', 'uWidth', 'uSide', 'uPow', 'uPool', 'uText'].forEach(k => U_[k] = gl.getUniformLocation(pr, k));
    } catch (e) { console.warn('beam shader', e); gl = null; }
  }
  if (!gl) root.classList.add('nogl'); else root.classList.remove('nogl');
  // a lost context (driver reset, headless software GL) falls back to the CSS beam, never a blank canvas
  cv.addEventListener('webglcontextlost', e => { e.preventDefault(); gl = null; root.classList.add('nogl'); });
  const scale = phone() ? .45 : .42;
  const size = () => { cv.width = Math.max(2, Math.round(stage.clientWidth * scale)); cv.height = Math.max(2, Math.round(stage.clientHeight * scale)); gl && gl.viewport(0, 0, cv.width, cv.height); };
  size(); addEventListener('resize', size);
  const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ramp = (p, a, b) => cl((p - a) / (b - a));

  let videoOn = false;
  const loadVideo = () => { if (videoOn) return; videoOn = true; const m = phone() ? 'm' : 'd';
    vid.poster = `img/stage-${m}.webp`;
    vid.innerHTML = `<source src="video/stage-${m}.webm" type="video/webm"><source src="video/stage-${m}.mp4" type="video/mp4">`; vid.load(); vid.play().catch(() => {}); };
  let p = 0, txt = [0, 0, 0, 0], inView = true, t0 = performance.now(), last = 0;
  const io = new IntersectionObserver(es => { inView = es[0].isIntersecting; if (inView) loop(); }, { rootMargin: '100px' }); io.observe(flip);

    const r = flip.getBoundingClientRect(); p = cl(-r.top / (flip.offsetHeight - innerHeight));
    let act = 0;
    phs.forEach((el, i) => { const [a, b, c, d] = W[i]; const o = i === 0 ? 1 - ramp(p, c, d) : band(p, a, b, c, d);
      el.style.opacity = o.toFixed(3); el.classList.toggle('on', o > .02); el.style.transform = `translateY(${((1 - o) * (i === 0 ? -16 : 16)).toFixed(1)}px)`; if (o > .5) act = i; });
    ctr.textContent = '0' + (act + 1);
    const step = (p - .14) / .04;
    pains.forEach((li, i) => { li.classList.toggle('lit', step >= i && step < i + 1.6); li.classList.toggle('done', step >= i + 1.6); });
    words.forEach((w, i) => { const q = ease(ramp(p, .42 + i * .02, .45 + i * .022)); w.style.transform = `translateY(${((1 - q) * 105).toFixed(1)}%)`; });
    const turn = ease(ramp(p, .22, .44));
    prof.style.opacity = (((phone() ? .58 : .4) + (phone() ? .42 : .6) * turn) * (1 - ramp(p, .38, .47))).toFixed(3);
    if (p > .2) loadVideo();
    stage.style.setProperty('--glare', (1 - ease(ramp(p, .24, .42))).toFixed(3)); stage.style.setProperty('--turn', turn.toFixed(3));
    stage.style.setProperty('--part', band(p, .62, .68, .82, .86).toFixed(3)); stage.style.setProperty('--chk', ramp(p, .84, .9).toFixed(3));
    vid.style.opacity = (ramp(p, .38, .47) * (1 - .78 * ramp(p, .62, .68)) * (1 - .6 * ramp(p, .82, .88))).toFixed(3);
    const box = phs[act].querySelector('.inner');
    if (box) { const b = box.getBoundingClientRect(), sw = stage.clientWidth, sh2 = stage.clientHeight;
      txt = [b.left / sw, 1 - b.bottom / sh2, b.right / sw, 1 - b.top / sh2]; }
  }
  function draw(now) {
    if (!gl) return; const tm = (now - t0) / 1000;
    const turn = ease(ramp(p, .22, .44)), part = band(p, .62, .68, .82, .86), chk = ramp(p, .84, .9);
    const rtl = root.dir === 'rtl';
    let px = .56, py = .3, w = .17, pw = 1;
    if (phone()) { px = .5; py = .32; }
    px = px + (.5 - px) * part; py = py + (.3 - py) * part; w = w + (.3 - w) * part; pw = 1 + .9 * part;
    py = py + (.36 - py) * chk; px = px + (.5 - px) * chk; w = w + (.07 - w) * chk; pw = pw + (.5 - pw) * chk;

    gl.uniform1f(U_.uWidth, w); gl.uniform1f(U_.uSide, rtl ? 1 : 0); gl.uniform1f(U_.uPow, pw);

    raf = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => loop());
  flipState = { stop: () => { cancelAnimationFrame(raf); io.disconnect(); } };
  update(); draw(performance.now()); loop();
}

// ---------- shared interactions ----------
function wire() {
  document.querySelectorAll('[data-door]').forEach(d => { const b = d.querySelector('.door-btn');
    b.onclick = () => { const o = !d.classList.contains('open'); d.classList.toggle('open', o); b.setAttribute('aria-expanded', o); }; });
  document.querySelectorAll('.qa button').forEach(b => b.onclick = () => { const q = b.parentElement, o = !q.classList.contains('open');
    q.classList.toggle('open', o); b.setAttribute('aria-expanded', o); });
  document.querySelectorAll('[data-slider]').forEach(s => {
    const sl = [...s.querySelectorAll('.slide')], it = [...s.querySelectorAll('.item')], dots = [...s.querySelectorAll('.dots button')];
    let i = 0, tm; const go = n => { i = (n + sl.length) % sl.length; sl.forEach((e, k) => e.classList.toggle('on', k === i)); it.forEach((e, k) => e.classList.toggle('on', k === i)); dots.forEach((e, k) => e.setAttribute('aria-current', k === i)); };
    dots.forEach(d => d.onclick = () => { go(+d.dataset.go); clearInterval(tm); });
    let x0 = null; const sw = s.querySelector('.slides');
    sw.addEventListener('pointerdown', e => x0 = e.clientX); sw.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) { go(i + ((dx < 0) === (root.dir === 'rtl') ? -1 : 1)); clearInterval(tm); } });
    if (!STATIC) tm = setInterval(() => go(i + 1), 6500);
  });
  const par = document.querySelector('[data-par]');
  if (par && !STATIC) { const f = () => { if (!document.contains(par)) return removeEventListener('scroll', f); if (phone()) { par.style.transform = ''; return; }
      const r = par.parentElement.getBoundingClientRect(), k = cl01((innerHeight - r.top) / (innerHeight + r.height)); par.style.transform = `translateY(${(32 - 64 * k).toFixed(1)}px)`; };
    addEventListener('scroll', f, { passive: true }); f(); }
  document.querySelectorAll('[data-vid]').forEach(b => b.addEventListener('click', () => openVid(b.dataset.vid, b.dataset.vert)));
}
const cl01 = x => Math.min(1, Math.max(0, x));
function openVid(id, vert) {
  const v = VIDS[id]; if (!v) return; const lb = document.getElementById('lb'), opener = document.activeElement;
  lb.classList.toggle('vert', !!vert);
  lb.innerHTML = `<button class="x" type="button">${esc(X.nav.close)}</button><div class="box"><iframe src="https://www.youtube-nocookie.com/embed/${v.yt}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><p class="cap">${esc(v.title)}</p>`;
  lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
  const close = () => { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); setTimeout(() => { lb.innerHTML = ''; }, 320); opener && opener.focus(); };
  lb.querySelector('.x').onclick = close; lb.querySelector('.x').focus();
  lb.onclick = e => { if (e.target === lb) close(); };
  lb.onkeydown = e => { if (e.key === 'Escape') close(); if (e.key === 'Tab') trap(e, lb); };

function checkPage(step) {
  const C = X.pages.check, Q = C.questions, ans = ss.get();
  const n = step === 'contact' ? 11 : +step || 0;
  const prog = `<div class="prog" aria-hidden="true"><i style="width:${Math.min(100, (Math.min(n, 10) / 10) * 100)}%"></i></div>`;
  if (!n) return `<div class="sit"><div class="card qin" style="text-align:center"><span class="eyebrow metal" lang="en" dir="ltr">Success is Beautiful</span>
    <h1 style="margin-top:14px">${t(C.intro.title)}</h1><p class="lead" style="margin:0 auto 14px">${t(svc('spotlight-check').body)}</p><p class="muted">${t(C.intro.meta)}</p>
    <div style="margin-top:28px"><a class="btn btn-gold" href="#/check/1">${t(C.intro.start)} ${arr}</a></div></div></div>${prog}`;
  if (n === 11) return `<div class="sit"><span class="fc"><b>✓</b></span><form class="card qin" novalidate data-contact><h1>${t(C.contact.title)}</h1>
    <div class="fields">${[['name', X.form.name, 'text', 'name'], ['mail', X.form.email, 'email', 'email'], ['tel', X.form.phone, 'tel', 'tel']].map(([id, l, ty, ac]) => `<label class="fld"><input id="c-${id}" type="${ty}" autocomplete="${ac}" placeholder=" " required value="${esc(ans['c-' + id] || '')}"><label for="c-${id}">${t(l)}</label><span class="err" aria-live="polite"></span></label>`).join('')}
    <label class="cbox"><input type="checkbox" id="c-ok" required ${ans['c-ok'] ? 'checked' : ''}><span>${t(C.contact.consent)}</span></label><span class="err" id="c-ok-err" aria-live="polite" style="color:#ffb4a6;font-size:13px"></span></div>
    <div class="navrow"><a class="btn btn-ghost" href="#/check/10">${t(X.cta.back)}</a><button class="btn btn-gold" type="submit">${t(C.contact.submit)} ${arr}</button></div></form></div>${prog}`;
  const q = Q[n - 1], v = ans['q' + n];
  let field = '';
  if (q.input === 'text' || q.input === 'textarea') {
    const tag = q.input === 'text' ? `<input id="qf" type="text" placeholder=" " value="${esc(v || '')}">` : `<textarea id="qf" placeholder=" ">${esc(v || '')}</textarea>`;
    field = `<label class="fld">${tag}<label for="qf">${t(q.q)}</label></label>${q.none ? `<label class="cbox" style="margin-top:14px"><input type="checkbox" id="qnone" ${ans['q' + n + 'none'] ? 'checked' : ''}><span>${t(q.none)}</span></label>` : ''}`;
  } else if (q.input === 'single' || q.input === 'multi') {
    const multi = q.input === 'multi', sel = multi ? (v || []) : v;
    field = `<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-label="${esc(q.q)}">${q.options.map(o => `<button type="button" class="opt" ${multi ? `aria-pressed="${sel.includes(o)}"` : `role="radio" aria-checked="${sel === o}"`} data-o="${esc(o)}"><span class="ck" aria-hidden="true"></span><span>${t(o)}</span></button>`).join('')}</div>`;
  } else if (q.input === 'budget_when') {
    field = `<p class="k">${t(q.budget)}</p><div class="opts" role="radiogroup" aria-label="${esc(q.q)}">${q.when.map(o => `<button type="button" class="opt" role="radio" aria-checked="${v === o}" data-o="${esc(o)}"><span class="ck" aria-hidden="true"></span><span>${t(o)}</span></button>`).join('')}</div>`;
  }
  return `<div class="sit"><span class="fc" aria-hidden="true"><b>${String(n).padStart(2, '0')}</b> / 10</span>
    <div class="card qin" data-q="${n}"><p class="sr">${t(C.progress.replace('{n}', n))}</p><h1 id="qh">${t(q.q)}</h1>${q.hint ? `<p class="hint">${t(q.hint)}</p>` : ''}${field}
    <div class="navrow"><a class="btn btn-ghost" href="#/check/${n - 1}">${t(X.cta.back)}</a><span class="need" id="need" aria-live="polite"></span><a class="btn btn-gold" id="next" href="#/check/${n === 10 ? 'contact' : n + 1}">${t(X.cta.next)} ${arr}</a></div></div></div>${prog}`;
}
function wireCheck() {
  const card = document.querySelector('[data-q]'), ans = ss.get();
  if (card) {
    const n = +card.dataset.q, q = X.pages.check.questions[n - 1], next = document.getElementById('next'), need = document.getElementById('need');
    const ok = () => { const v = ans['q' + n]; return q.optional || (Array.isArray(v) ? v.length : (v && String(v).trim())) || ans['q' + n + 'none']; };
    const sync = () => { const good = !!ok(); next.toggleAttribute('aria-disabled', !good); next.style.opacity = good ? 1 : .35; need.textContent = good ? '' : X.pages.check.answer_to_continue; ss.set(ans); };
    const f = document.getElementById('qf'); if (f) { f.oninput = () => { ans['q' + n] = f.value; sync(); }; }
    const none = document.getElementById('qnone'); if (none) none.onchange = () => { ans['q' + n + 'none'] = none.checked; sync(); };
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (b.hasAttribute('aria-pressed')) { const a = new Set(ans['q' + n] || []); a.has(b.dataset.o) ? a.delete(b.dataset.o) : a.add(b.dataset.o); ans['q' + n] = [...a]; b.setAttribute('aria-pressed', a.has(b.dataset.o)); }
      else { ans['q' + n] = b.dataset.o; card.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-checked', x === b)); }
      sync(); });
    next.onclick = e => { if (!ok()) { e.preventDefault(); need.textContent = X.pages.check.answer_to_continue; } };
    sync(); (f || card.querySelector('.opt') || next).focus({ preventScroll: true });
  }
  const form = document.querySelector('[data-contact]');
  if (form) form.onsubmit = e => { e.preventDefault(); let good = true;
    form.querySelectorAll('input:not([type=checkbox])').forEach(i => { ans[i.id] = i.value; const er = i.parentElement.querySelector('.err');
      let m = !i.value.trim() ? X.form.required : (i.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value)) ? X.form.invalid_email : (i.type === 'tel' && i.value.replace(/\D/g, '').length < 9) ? X.form.invalid_phone : '';
      er.textContent = m; if (m) good = false; });
    const c = document.getElementById('c-ok'); ans['c-ok'] = c.checked; document.getElementById('c-ok-err').textContent = c.checked ? '' : X.form.required; if (!c.checked) good = false;
    ss.set(ans); if (good) location.hash = '#/thanks'; else form.querySelector('.err:not(:empty)')?.previousElementSibling?.previousElementSibling?.focus(); };
  document.querySelectorAll('[data-form]').forEach(f => f.onsubmit = e => { e.preventDefault(); let good = true;
    f.querySelectorAll('input,textarea').forEach(i => { const er = i.parentElement.querySelector('.err'); const m = !i.value.trim() ? X.form.required : (i.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value)) ? X.form.invalid_email : ''; if (er) er.textContent = m; if (m) good = false; });
    f.querySelector('.ok').textContent = good ? X.form.success : ''; });
}

    <h2>${t(P.scores_title)} <span class="k" style="display:inline;font-family:var(--body);font-size:14px">${t(P.scale)}</span></h2>
    <div class="scores">${P.dimensions.map((d, i) => `<div class="score"><span class="nm">${t(d.name)}</span><span class="strips" role="img" aria-label="${esc(d.name)} ${demo[i]} / 5">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= demo[i] ? 'on' : ''}" style="transition-delay:${i * 120 + k * 60}ms"></i>`).join('')}</span><span class="val">${demo[i]}</span><span class="q">${t(d.q)}</span></div>`).join('')}</div>
    <h2>${t(P.noticed_title)}</h2><div class="obs">${[1, 2, 3].map(i => `<div><span class="tbd">{observation_${i}}</span></div>`).join('')}</div>
    <h2>${t(P.first_move_title)}</h2><p style="margin:0 0 50px"><span class="tbd">{first_move}</span></p>
    <h2>${t(P.path_title)}</h2><div class="pathcard"><b>${t(P.paths.story)}</b><span style="color:#bbb">${t(svc('story').format)}</span></div>
    <div class="signed"><img src="img/sig-black.svg" alt="" onerror="this.remove()"><span>${t(P.signed)}</span></div>
    <p style="margin:0 0 18px;color:#333">${t(P.cta_line)}</p>${bookBtn()}
  </article></div>`;
}
function bookPage() {
  const P = X.pages.book, s = svc('clarity-session'), ph = X.placeholders;
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i + 1); return d; });
  const fmtD = d => new Intl.DateTimeFormat(L === 'he' ? 'he-IL' : 'en-GB', { weekday: 'short' }).format(d);
  const slots = ['09:30', '11:00', '13:00', '15:30', '17:00', '19:00'];
  const fld = (id, l, ty = 'text', ac = '', extra = '') => `<label class="fld"><input id="k-${id}" type="${ty}" placeholder=" " ${ac ? `autocomplete="${ac}"` : ''} ${extra} required><label for="k-${id}">${t(l)}</label><span class="err"></span></label>`;
  return rhero(P.title, s.summary, null, '', true) + `<section class="sec" style="padding-top:0"><div class="wrap"><form class="call" novalidate data-book>
    <div>
      <div class="blk"><h2><span class="n">01</span>${t(P.step_time)}</h2><div class="week" role="group">${days.map((d, i) => `<button type="button" class="day" aria-pressed="${i === 1}" data-d="${d.toISOString().slice(0, 10)}">${esc(fmtD(d))}<b>${d.getDate()}</b></button>`).join('')}</div>
        <div class="slots" role="group">${slots.map((x, i) => `<button type="button" class="slot" aria-pressed="${i === 1}">${x}</button>`).join('')}</div><p class="note">${esc(U.exslots)}</p></div>
      <div class="blk"><h2><span class="n">02</span>${t(P.step_details)}</h2><div class="fields">${fld('name', X.form.name, 'text', 'name')}<div class="fields two">${fld('mail', X.form.email, 'email', 'email')}${fld('tel', X.form.phone, 'tel', 'tel')}</div></div></div>
      <div class="blk"><h2><span class="n">03</span>${t(P.step_pay)}</h2><span class="mockpay">${esc(U.expay)}</span>
        <div class="fields">${fld('card', U.card, 'text', 'off', 'inputmode="numeric"')}<div class="fields two">${fld('exp', U.exp, 'text', 'off')}${fld('cvc', U.cvc, 'text', 'off', 'inputmode="numeric"')}</div></div></div>
    </div>
    <aside class="blk summary"><h2>${t(s.title)}</h2><dl><dt>${esc(U.len)}</dt><dd>${t(ph.session_length)}</dd><dt>${esc(U.price)}</dt><dd>${t(ph.price_session)}</dd><dt>${esc(U.when)}</dt><dd id="when">—</dd><dt>${esc(U.credit)}</dt><dd>${t(s.body)}</dd></dl>
      <button class="btn btn-gold" type="submit">${t(P.pay_button)} ${arr}</button><p class="note">${esc(U.mock)}</p>
      <p style="margin-top:18px">${waBtn(s.ctaText)}</p></aside></form></div></section>`;
}
function wireBook() {
  const f = document.querySelector('[data-book]'); if (!f) return;
  const when = () => { const d = f.querySelector('.day[aria-pressed=true]'), s = f.querySelector('.slot[aria-pressed=true]');
    const dt = new Date(d.dataset.d); const txt = `${new Intl.DateTimeFormat(L === 'he' ? 'he-IL' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).format(dt)} · ${s.textContent}`;
    document.getElementById('when').textContent = txt; return [new Intl.DateTimeFormat(L === 'he' ? 'he-IL' : 'en-GB', { day: 'numeric', month: 'long' }).format(dt), s.textContent]; };
  f.querySelectorAll('.day,.slot').forEach(b => b.onclick = () => { f.querySelectorAll('.' + b.className.split(' ')[0]).forEach(x => x.setAttribute('aria-pressed', x === b)); when(); });
  when();
  f.onsubmit = e => { e.preventDefault(); let good = true;
    f.querySelectorAll('input').forEach(i => { const er = i.parentElement.querySelector('.err'); const m = !i.value.trim() ? X.form.required : (i.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value)) ? X.form.invalid_email : ''; er.textContent = m; if (m) good = false; });
    if (good) { const [d, tm] = when(); try { sessionStorage.setItem('tl-booked', JSON.stringify({ d, tm })); } catch (x) {} location.hash = '#/booked'; }
    else f.querySelector('.err:not(:empty)').previousElementSibling.previousElementSibling.focus(); };
}
function bookedPage() {
  let b = {}; try { b = JSON.parse(sessionStorage.getItem('tl-booked') || '{}'); } catch (e) {}
  const P = X.pages.booked; let body = P.body; if (b.d) body = body.replace('{date}', b.d).replace('{time}', b.tm);
  return `<div class="sit"><div class="card" style="text-align:center"><h1 class="develop">${t(P.title)}</h1><p class="lead" style="margin:0 auto 34px">${t(body)}</p><a class="btn btn-ghost" href="#/">${t(X.cta.home)} ${arr}</a></div></div>`;
}
function legalPage(k) {
  const P = X.pages[k]; const body = k === 'accessibility' ? T.legal.accessibilityStatement + '\n\n' + T.legal.accessibilityContact : P.body;
  return rhero(P.title, '', null, '', true) + `<section class="sec" style="padding-top:0"><div class="wrap" style="max-width:780px">${paras(body, 'lead')}</div></section>`;
}
function notFound() {
  const P = X.pages.not_found;
  return `<div class="sit"><div class="card" style="text-align:center"><h1>${t(P.title)}</h1><p class="lead" style="margin:0 auto 30px">${t(P.body)}</p><a class="btn btn-gold" href="#/">${t(X.cta.home)} ${arr}</a></div></div>`;
}

// ---------- router ----------
function route() {
  flipState && flipState.stop(); flipState = null;
  const h = location.hash.replace(/^#\/?/, ''), [r, sub] = h.split('/');
  const main = document.getElementById('main');
  const seo = X.seo[r || 'home'] || X.seo.home;
  const pages = { '': home, story: () => trackPage('story'), launch: () => trackPage('launch'), partnership: partnershipPage, work: () => workPage(sub), about: aboutPage,
    brands: brandsPage, watch: watchPage, course: coursePage, check: () => checkPage(sub), thanks: thanksPage, snapshot: snapshotPage, book: bookPage, booked: bookedPage,
    privacy: () => legalPage('privacy'), accessibility: () => legalPage('accessibility') };
  main.innerHTML = (pages[r] || notFound)();
  document.title = seo.title; document.querySelector('meta[name=description]').content = seo.description;
  document.querySelectorAll('.nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.r === r) || a.removeAttribute('aria-current'));
  document.querySelectorAll('.nav a').forEach(a => a.dataset.r === r ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.getElementById('chip').style.display = r === 'check' ? 'none' : '';
  window.scrollTo(0, 0);
  if (!r) initFlip();
  wire(); wireCheck(); wireBook(); wireTabs(); wireFilter();
  if (r && r !== 'check') main.querySelector('h1')?.setAttribute('tabindex', '-1');
  if (r && r !== 'check' && route.moved) main.querySelector('h1')?.focus({ preventScroll: true });
  route.moved = true;
  onScroll();
}
function wireTabs() {
  const tabs = [...document.querySelectorAll('.tabs [role=tab]')]; if (!tabs.length) return;
  const sel = b => { tabs.forEach(x => { const on = x === b; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; }); b.focus(); };
  tabs.forEach((b, i) => { b.onclick = () => sel(b); b.onkeydown = e => { const k = { ArrowDown: 1, ArrowUp: -1, ArrowLeft: root.dir === 'rtl' ? 1 : -1, ArrowRight: root.dir === 'rtl' ? -1 : 1 }[e.key]; if (k) { e.preventDefault(); sel(tabs[(i + k + tabs.length) % tabs.length]); } }; });
}
function wireFilter() {
  const bs = [...document.querySelectorAll('[data-f]')]; if (!bs.length) return;
  bs.forEach(b => b.onclick = () => { bs.forEach(x => x.setAttribute('aria-pressed', x === b));
    document.querySelectorAll('.print').forEach(p => p.classList.toggle('hide', b.dataset.f !== 'all' && p.dataset.s !== b.dataset.f)); });
}
function onScroll() { document.getElementById('hdr').classList.toggle('solid', scrollY > 40 && !(location.hash.replace(/^#\/?/, '') === '' && scrollY < (document.getElementById('flip')?.offsetHeight || 0) - innerHeight)); }
addEventListener('scroll', onScroll, { passive: true });
function boot() { T = COPY[L]; X = T.extras; U = UI[L]; A = ALT[L]; chrome(); route(); }
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.getElementById('menu'); if (m.classList.contains('open')) m.querySelector('.close').click(); } });
// fonts are inlined; wait for them (at most 700 ms) so the first layout is the final one (no shift)
Promise.race([Promise.all(['400 1em Bellefair', '400 1em Plex', '500 1em Plex'].map(f => document.fonts.load(f, 'אבג abc'))), new Promise(r => setTimeout(r, 700))]).then(boot, boot);
})();
</script>
