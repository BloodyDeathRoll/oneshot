- main:
  - region "The Lavish Haven":
    - paragraph: The outdoor pool is in the middle of the hotel and open all year.
    - figure:
      - img "The pool at night, lit from below, with two storeys of lit rooms and balconies behind it"
  - region "Among cafés and restaurants":
    - heading "Among cafés and restaurants" [level=2]
    - paragraph: Cafés and restaurants surround the hotel, and there is a fruit stand nearby. Guests score the location 9.6 out of 10 on Booking.com.
    - paragraph: Koggala Airport is about 5 km away.
    - figure:
      - img "The pool and the stone-paved garden seen from above, with palms behind the tiled roofs"
    - figure:
      - img "A covered balcony with wooden chairs and a low table, looking down through the railing to the pool"
  - region "Nine kinds of room":
    - heading "Nine kinds of room" [level=2]
    - paragraph: There are king rooms with a balcony or a garden view, superior kings, and a deluxe king on the ground floor with a private patio and a pool view. Family studios and suites sleep four, and the two-bedroom suite sleeps five.
    - paragraph: Each room has a work desk, soundproofing and free WiFi. The family rooms have air conditioning and private bathrooms.
    - paragraph: There is no published price list. Rates go by date, and the booking links show what is available.
