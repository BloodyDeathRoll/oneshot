  - region "New, and it shows":
    - heading "New, and it shows" [level=2]
    - paragraph: The hotel is new. On Booking.com one guest calls it “brand new”, another “a new facility”.
    - paragraph: Booking.com guests score it 9.7 out of 10 for cleanliness and the same for comfort, and 9.4 for staff, across 34 reviews. On Google it has 5.0 out of 5 from 21 reviews.
  - region "Staying longer":
    - heading "Staying longer" [level=2]
    - paragraph: One guest wrote that they moved around many hotels before finding this one, then stayed over a month. Another extended their stay rather than go on to a different hotel.
    - blockquote:
      - paragraph: “Everything was excellent! Best value for money there is! We moved around many hotels until we found the lavish and stayed over a month! Super...”
      - text: Mya, Sri Lanka, on Booking.com
    - blockquote:
      - paragraph: “It's a brand new hotel located in the best part of Ahangama, next to the Kabalana Beach.”
      - text: Dariusz, Poland, on Booking.com
    - blockquote:
      - paragraph: “The staff are calm, respectful and nice. The facilities are amazing, the swimming pool at the center creates a good vibe where people can meet up...”
      - text: António, Portugal, on Booking.com
    - blockquote:
      - paragraph: “Very kind staff, we loved the hotel so much that we extended our stay in it instead of going to another one, nice rooms and nice pool we will...”
      - text: Roie, Israel, on Booking.com
    - blockquote:
      - paragraph: “Hier war alles schön, und die Mitarbeiter so süss, lieb, nett und freundlich. Wir wollten gar nicht wieder weg.”
      - text: Benjamin, Switzerland, on Booking.com
  - region "Pool, restaurant, spa":
    - heading "Pool, restaurant, spa" [level=2]
    - paragraph: The outdoor pool is in the middle of the hotel and open all year. The restaurant serves breakfast with local specialities and fresh pastries, plus Chinese, Indian and Italian dishes. There’s a coffee house on site too, and a spa and wellness centre.
    - paragraph: For families there are the family rooms and an outdoor play area. Kids’ meals and babysitting cost extra.
