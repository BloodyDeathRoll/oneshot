  - region "The wave":
    - paragraph: "Kabalana: a sandy beach break for beginners and intermediates, with The Rock reef A-frame for advanced surfers."
    - text: The beach is two minutes from the hotel, on foot.
    - paragraph: 0.4–0.6 m
    - paragraph: Wednesday 23 September, 14:30 Swell 11.1 s from the south Wind 17.9 km/h from the west, cross-shore
    - paragraph:
      - link "Forecast for Kabalana by Rosa":
        - /url: https://rosa.surf/spot/kabalana
      - text: Updated 23 September, 13:56
    - iframe
  - region "Practicalities":
    - heading "Practicalities" [level=2]
    - paragraph: The front desk is staffed 24 hours, with private and express check-in. Parking is free and private, but you need to reserve it. There’s an airport shuttle as well.
    - paragraph: Housekeeping is daily. There is laundry, dry cleaning and ironing, bicycles to rent, non-smoking rooms, and facilities for guests with disabilities.
