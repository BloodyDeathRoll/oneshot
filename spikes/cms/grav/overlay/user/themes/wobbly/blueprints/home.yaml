title: Home page
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.kicker:
              type: text
              label: Small line above the headline
              ordering@: header.title
            header.headline:
              type: text
              label: Headline
              ordering@: header.kicker
            header.headline_accent:
              type: text
              label: Headline, highlighted word(s)
              ordering@: header.headline
            header.tagline:
              type: textarea
              rows: 2
              label: Tagline under the headline
              ordering@: header.headline_accent
            header.hero_image:
              type: pagemediaselect
              label: Big photo (upload it under Page Media below first)
              preview_images: true
              accept:
                - 'image/*'
              ordering@: header.tagline
            header.hero_alt:
              type: text
              label: Photo description (for screen readers and Google)
              ordering@: header.hero_image
